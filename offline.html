<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — KJSynthora</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap');
:root { --bg:#0a0a0f; --accent:#7c6af7; --accent2:#f76a8a; --text:#e8e8f0; --muted:#6b6b85; }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Syne',sans-serif;
  min-height:100vh; display:grid; place-items:center;
  text-align:center; padding:24px;
}
body::before {
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(124,106,247,0.15) 0%,transparent 60%);
  pointer-events:none;
}
.wrap { position:relative; max-width:480px; }
.icon { font-size:72px; margin-bottom:24px; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
h1 { font-size:2rem; font-weight:800; letter-spacing:-1px; margin-bottom:12px; }
h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
p { color:var(--muted); font-size:0.95rem; line-height:1.7; margin-bottom:28px; }
.btn {
  display:inline-block; padding:12px 32px;
  background:linear-gradient(135deg,var(--accent),#9b5cf0);
  border-radius:30px; color:white; text-decoration:none;
  font-weight:700; font-size:0.95rem;
  transition:all 0.3s; cursor:pointer; border:none;
  font-family:'Syne',sans-serif;
}
.btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(124,106,247,0.4); }
.cached-links { margin-top:32px; }
.cached-links p { font-size:0.8rem; color:var(--muted); margin-bottom:12px; }
.link-grid { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.link-chip {
  background:rgba(124,106,247,0.1); border:1px solid rgba(124,106,247,0.25);
  border-radius:20px; padding:6px 14px; font-size:0.8rem;
  color:var(--accent); text-decoration:none; transition:all 0.2s;
}
.link-chip:hover { background:rgba(124,106,247,0.2); }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">📡</div>
  <h1>You're <span>Offline</span></h1>
  <p>No internet connection detected. Check your network and try again — KJSynthora tools will be ready when you reconnect.</p>
  <button class="btn" onclick="window.location.reload()">↻ Try Again</button>
  <div class="cached-links">
    <p>Cached pages you can still visit:</p>
    <div class="link-grid">
      <a href="/" class="link-chip">🏠 Home</a>
      <a href="/tools/pdf/" class="link-chip">📄 PDF Tools</a>
      <a href="/tools/ai/" class="link-chip">🤖 AI Tools</a>
      <a href="/tools/image/" class="link-chip">🖼️ Image</a>
      <a href="/tools/finance/" class="link-chip">💰 Finance</a>
    </div>
  </div>
</div>
<script>
  window.addEventListener('online', () => window.location.reload());
</script>
</body>
</html>
