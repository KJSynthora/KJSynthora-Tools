<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PySpark Practice — Run Real Python in Your Browser | KJSynthora</title>
<meta name="description" content="15 scenario-based PySpark-style practice questions. Write and run real Python/pandas code in your browser, then compare against the equivalent PySpark syntax.">
<style>
  :root{
    --bg:#0a0e14;
    --panel:#10151d;
    --panel-alt:#151b25;
    --border:#232b38;
    --border-soft:#1a212c;
    --text:#dce3ea;
    --text-muted:#8391a3;
    --text-dim:#5b6779;
    --accent:#f5a623;
    --accent-ink:#241704;
    --good:#3fd67a;
    --good-dim:#173829;
    --bad:#ff6b6b;
    --bad-dim:#3a1e20;
    --blue:#5b9dff;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.55; min-height:100vh;}
  a{color:var(--blue); text-decoration:none;}
  a:hover{text-decoration:underline;}
  code, .mono{font-family:var(--mono);}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid var(--border); background:var(--panel); position:sticky; top:0; z-index:20;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; color:var(--text);}
  .brand .logo-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .topbar-right{display:flex; align-items:center; gap:18px; font-size:13.5px;}
  .topbar-right a{color:var(--text-muted);}
  .topbar-right a:hover{color:var(--text);}
  .progress-pill{display:flex; align-items:center; gap:8px; background:var(--panel-alt); border:1px solid var(--border); padding:5px 12px; border-radius:999px; font-size:12.5px; color:var(--text-muted);}
  .progress-pill b{color:var(--good); font-weight:600;}

  .layout{display:flex; max-width:1400px; margin:0 auto; min-height:calc(100vh - 57px);}
  .sidebar{width:300px; flex-shrink:0; border-right:1px solid var(--border); padding:18px 0 40px; background:var(--panel);}
  .sidebar-head{padding:0 18px 14px; border-bottom:1px solid var(--border-soft); margin-bottom:8px;}
  .sidebar-head h1{font-size:15px; margin:0 0 4px; font-weight:600;}
  .sidebar-head p{margin:0; font-size:12.5px; color:var(--text-muted);}
  .qlist{list-style:none; margin:0; padding:6px 10px;}
  .qlist li{margin-bottom:2px;}
  .qbtn{width:100%; text-align:left; background:none; border:none; cursor:pointer; color:var(--text-muted); padding:9px 10px; border-radius:var(--radius); display:flex; align-items:center; gap:9px; font-size:13.5px; font-family:var(--sans);}
  .qbtn:hover{background:var(--panel-alt); color:var(--text);}
  .qbtn.active{background:var(--panel-alt); color:var(--text); box-shadow: inset 2px 0 0 var(--accent);}
  .qnum{width:20px; height:20px; border-radius:5px; background:var(--border-soft); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-dim); flex-shrink:0; font-family:var(--mono);}
  .qbtn.done .qnum{background:var(--good-dim); color:var(--good);}
  .qtitle{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .qdiff{font-size:10px; padding:2px 6px; border-radius:4px; flex-shrink:0; font-family:var(--mono);}
  .diff-Easy{color:var(--good); background:var(--good-dim);}
  .diff-Medium{color:var(--accent); background:#3a2c10;}
  .diff-Hard{color:var(--bad); background:var(--bad-dim);}

  .main{flex:1; min-width:0; padding:28px 34px 60px;}
  .qhead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px;}
  .qhead h2{font-size:21px; margin:0; font-weight:600;}
  .qmeta{display:flex; gap:8px; align-items:center; flex-shrink:0;}
  .tag{font-size:11.5px; padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text-muted); font-family:var(--mono);}
  .scenario{color:var(--text-muted); font-size:14.5px; margin:10px 0 24px; max-width:78ch;}
  .scenario b{color:var(--text); font-weight:600;}
  .section-label{font-size:12px; color:var(--text-dim); margin:0 0 10px; font-weight:600;}

  .editor-wrap{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px;}
  .editor-bar{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border-soft); background:var(--panel-alt);}
  .editor-bar span{font-size:12px; color:var(--text-dim); font-family:var(--mono);}
  textarea.editor{width:100%; min-height:120px; resize:vertical; border:none; outline:none; background:var(--panel); color:#ffe0ad; font-family:var(--mono); font-size:13.5px; padding:14px; line-height:1.6; tab-size:4;}
  textarea.editor.setup{color:var(--text-dim); min-height:90px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  .btn{font-family:var(--sans); font-size:13.5px; font-weight:500; padding:9px 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--panel-alt); color:var(--text); cursor:pointer;}
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn.primary:hover{background:#ffbb47;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  .output{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; min-height:60px; margin-bottom:16px;}
  .output.empty{color:var(--text-dim); font-size:13.5px;}
  .verdict{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; margin-bottom:12px;}
  .verdict.good{color:var(--good);}
  .verdict.bad{color:var(--bad);}
  .err{color:var(--bad); font-family:var(--mono); font-size:12.5px; white-space:pre-wrap;}

  table.data{border-collapse:collapse; width:100%; font-size:12.5px;}
  table.data th{text-align:left; padding:6px 12px; color:var(--text-dim); font-weight:500; border-bottom:1px solid var(--border-soft); font-family:var(--mono); white-space:nowrap;}
  table.data td{padding:6px 12px; color:var(--text-muted); border-bottom:1px solid var(--border-soft); font-family:var(--mono); white-space:nowrap;}
  table.data tr:last-child td{border-bottom:none;}

  details.reveal{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px;}
  details.reveal summary{padding:12px 16px; cursor:pointer; font-size:13.5px; color:var(--text-muted); list-style:none; display:flex; align-items:center; gap:8px;}
  details.reveal summary::-webkit-details-marker{display:none;}
  details.reveal summary:before{content:'▸'; color:var(--text-dim); transition:transform .15s;}
  details.reveal[open] summary:before{transform:rotate(90deg);}
  details.reveal .reveal-body{padding:0 16px 16px; color:var(--text-muted); font-size:13.5px;}
  details.reveal pre{background:var(--bg); border:1px solid var(--border-soft); border-radius:5px; padding:12px; overflow-x:auto; font-family:var(--mono); font-size:13px; color:#ffe0ad;}
  details.reveal.pyspark pre{color:#c9e0ff;}
  .note{font-size:12px; color:var(--text-dim); margin:-4px 0 16px;}

  .nav-buttons{display:flex; justify-content:space-between; margin-top:30px; padding-top:20px; border-top:1px solid var(--border-soft);}

  .loading-banner{display:flex; align-items:center; gap:10px; background:var(--panel-alt); border:1px solid var(--border); padding:10px 16px; border-radius:var(--radius); font-size:13px; color:var(--text-muted); margin-bottom:18px;}
  .spinner{width:13px;height:13px;border-radius:50%;border:2px solid var(--border-soft); border-top-color:var(--accent); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width: 880px){
    .layout{flex-direction:column;}
    .sidebar{width:100%; border-right:none; border-bottom:1px solid var(--border); padding:12px 0;}
    .qlist{display:flex; overflow-x:auto; gap:6px; padding:0 12px;}
    .qlist li{margin:0; flex-shrink:0;}
    .qbtn{white-space:nowrap;}
    .main{padding:22px 16px 50px;}
  }
</style>
</head>

  {
    "id": 1,
    "title": "Channels Over 400 Sessions",
    "difficulty": "Easy",
    "topic": "Filtering & Aggregation",
    "scenario": "A marketing analyst wants to know which acquisition channels are pulling real traffic. Given a <b>sessions</b> DataFrame, group by channel, sum sessions, and keep only channels above 400 total sessions, busiest first.",
    "setup": "import pandas as pd\n\nsessions = pd.DataFrame({\n    \"channel\": [\"Organic\",\"Organic\",\"Organic\",\"Paid\",\"Paid\",\"Referral\",\"Referral\"],\n    \"sessions\": [300,250,180,900,150,60,40]\n})",
    "starter": "grouped = sessions.groupby(\"channel\", as_index=False)[\"sessions\"].sum()\nresult = grouped[grouped[\"sessions\"] > ___].sort_values(___, ascending=___).reset_index(drop=True)",
    "solution": "grouped = sessions.groupby(\"channel\", as_index=False)[\"sessions\"].sum()\nresult = grouped[grouped[\"sessions\"] > 400].sort_values(\"sessions\", ascending=False).reset_index(drop=True)",
    "pysparkRef": "df = spark.createDataFrame(sessions_data, [\"channel\", \"sessions\"])\nresult = (df.groupBy(\"channel\").sum(\"sessions\")\n            .withColumnRenamed(\"sum(sessions)\", \"sessions\")\n            .filter(F.col(\"sessions\") > 400)\n            .orderBy(F.col(\"sessions\").desc()))",
    "hint": "groupby(...).sum() gives you the totals; filter the result with a boolean mask, then sort_values with ascending=False.",
    "expected": [
      {
        "channel": "Paid",
        "sessions": 1050
      },
      {
        "channel": "Organic",
        "sessions": 730
      }
    ],
    "expectedCols": [
      "channel",
      "sessions"
    ]
  },
  {
    "id": 2,
    "title": "Player Tiers",
    "difficulty": "Easy",
    "topic": "Conditional Logic",
    "scenario": "A game studio buckets players into 'Rookie' (&lt;20 pts), 'Pro' (20\u201370 inclusive) or 'Elite' (&gt;70) using the <b>players</b> DataFrame. Add a tier column, then count players per tier, busiest tier first.",
    "setup": "import pandas as pd\nimport numpy as np\n\nplayers = pd.DataFrame({\n    \"player\": [\"Ari\",\"Bo\",\"Cleo\",\"Dax\",\"Emi\",\"Finn\",\"Gia\",\"Hugo\"],\n    \"points\": [12, 34, 88, 45, 5, 99, 67, 23]\n})",
    "starter": "conditions = [players[\"points\"] < ___, players[\"points\"].between(___, ___)]\nchoices = [\"Rookie\", \"Pro\"]\nplayers[\"tier\"] = np.select(conditions, choices, default=___)\nresult = players.groupby(\"tier\", as_index=False).size().rename(columns={\"size\": \"count\"}).sort_values(\"count\", ascending=False).reset_index(drop=True)",
    "solution": "conditions = [players[\"points\"] < 20, players[\"points\"].between(20, 70)]\nchoices = [\"Rookie\", \"Pro\"]\nplayers[\"tier\"] = np.select(conditions, choices, default=\"Elite\")\nresult = players.groupby(\"tier\", as_index=False).size().rename(columns={\"size\": \"count\"}).sort_values(\"count\", ascending=False).reset_index(drop=True)",
    "pysparkRef": "from pyspark.sql import functions as F\ndf = df.withColumn(\"tier\",\n    F.when(F.col(\"points\") < 20, \"Rookie\")\n     .when(F.col(\"points\").between(20, 70), \"Pro\")\n     .otherwise(\"Elite\"))\nresult = df.groupBy(\"tier\").count().orderBy(F.col(\"count\").desc())",
    "hint": "np.select takes a list of conditions and a matching list of choices, evaluated in order, with a default for anything left over.",
    "expected": [
      {
        "tier": "Pro",
        "count": 4
      },
      {
        "tier": "Elite",
        "count": 2
      },
      {
        "tier": "Rookie",
        "count": 2
      }
    ],
    "expectedCols": [
      "tier",
      "count"
    ]
  },
  {
    "id": 3,
    "title": "Warehouses With No Shipments",
    "difficulty": "Easy",
    "topic": "Joins",
    "scenario": "Ops wants to know which warehouses in <b>warehouses</b> have never appeared in <b>shipments</b>.",
    "setup": "import pandas as pd\n\nwarehouses = pd.DataFrame({\"warehouse_id\": [1,2,3,4], \"city\": [\"Pune\",\"Nagpur\",\"Indore\",\"Surat\"]})\nshipments = pd.DataFrame({\"shipment_id\": [1,2,3], \"warehouse_id\": [1,1,3]})",
    "starter": "result = warehouses[~warehouses[\"warehouse_id\"].isin(___)].reset_index(drop=True)",
    "solution": "result = warehouses[~warehouses[\"warehouse_id\"].isin(shipments[\"warehouse_id\"])].reset_index(drop=True)",
    "pysparkRef": "result = warehouses_df.join(shipments_df, \"warehouse_id\", \"left_anti\")",
    "hint": "The ~ negates a boolean Series; .isin(...) checks membership. Together they give you 'not in'.",
    "expected": [
      {
        "warehouse_id": 2,
        "city": "Nagpur"
      },
      {
        "warehouse_id": 4,

      }

      "city"

  {
    "id": 4,
    "title": "Top 3 Books by Revenue",
    "difficulty": "Medium",
    "topic": "Joins & Aggregation",
    "scenario": "Find the 3 highest-revenue titles by joining <b>sales</b> (copies \u00d7 unit_price) to <b>books</b>.",
    "setup": "import pandas as pd\n\nbooks = pd.DataFrame({\"book_id\": [1,2,3,4], \"title\": [\"Atlas\",\"Nimbus\",\"Cobalt\",\"Fable\"]})\nsales = pd.DataFrame({\n    \"sale_id\": [1,2,3,4,5,6],\n    \"book_id\": [1,1,2,3,4,3],\n    \"copies\": [10,5,50,4,3,2],\n    \"unit_price\": [5,5,1,60,25,60]\n})",
    "starter": "sales[\"revenue\"] = sales[\"copies\"] * sales[\"unit_price\"]\nmerged = sales.merge(books, on=___)\nresult = merged.groupby(\"title\", as_index=False)[\"revenue\"].sum().sort_values(\"revenue\", ascending=___).head(___).reset_index(drop=True)",
    "solution": "sales[\"revenue\"] = sales[\"copies\"] * sales[\"unit_price\"]\nmerged = sales.merge(books, on=\"book_id\")\nresult = merged.groupby(\"title\", as_index=False)[\"revenue\"].sum().sort_values(\"revenue\", ascending=False).head(3).reset_index(drop=True)",
    "pysparkRef": "df = sales_df.withColumn(\"revenue\", F.col(\"copies\") * F.col(\"unit_price\"))\nresult = (df.join(books_df, \"book_id\")\n            .groupBy(\"title\").sum(\"revenue\")\n            .withColumnRenamed(\"sum(revenue)\", \"revenue\")\n            .orderBy(F.col(\"revenue\").desc())\n            .limit(3))",
    "hint": "merge() is pandas' join; compute revenue per row before grouping, then sort and .head(3).",
    "expected": [
      {
        "title": "Cobalt",
        "revenue": 360
      },
      {
        "title": "Atlas",
        "revenue": 75
      },
      {
        "title": "Fable",
        "revenue": 75
      }
    ],
    "expectedCols": [
      "title",
      "revenue"
    ]
  },
  {
    "id": 5,
    "title": "Out-Earning the Boss",
    "difficulty": "Medium",
    "topic": "Self Joins",
    "scenario": "Using the self-referencing <b>emp</b> DataFrame (manager_id points at another emp_id), find every employee who out-earns their own manager.",
    "setup": "import pandas as pd\n\nemp = pd.DataFrame({\n    \"emp_id\": [1,2,3,4,5],\n    \"name\": [\"Rex\",\"Sam\",\"Tia\",\"Uma\",\"Vik\"],\n    \"salary\": [90000,95000,70000,120000,60000],\n    \"manager_id\": [None,1,1,2,3]\n})",
    "starter": "merged = emp.merge(emp, left_on=\"manager_id\", right_on=___, suffixes=(\"_emp\", \"_mgr\"))\nresult = merged[merged[\"salary_emp\"] > merged[___]][[\"name_emp\",\"salary_emp\",\"name_mgr\",\"salary_mgr\"]].reset_index(drop=True)",
    "solution": "merged = emp.merge(emp, left_on=\"manager_id\", right_on=\"emp_id\", suffixes=(\"_emp\",\"_mgr\"))\nresult = merged[merged[\"salary_emp\"] > merged[\"salary_mgr\"]][[\"name_emp\",\"salary_emp\",\"name_mgr\",\"salary_mgr\"]].reset_index(drop=True)",
    "pysparkRef": "e = df.alias(\"e\")\nm = df.alias(\"m\")\nresult = (e.join(m, F.col(\"e.manager_id\") == F.col(\"m.emp_id\"))\n           .filter(F.col(\"e.salary\") > F.col(\"m.salary\"))\n           .select(F.col(\"e.name\").alias(\"name_emp\"), F.col(\"e.salary\").alias(\"salary_emp\"),\n                   F.col(\"m.name\").alias(\"name_mgr\"), F.col(\"m.salary\").alias(\"salary_mgr\")))",
    "hint": "Merge the DataFrame with itself, matching manager_id on one side to emp_id on the other; suffixes keep the columns distinguishable.",
    "expected": [
      {
        "name_emp": "Sam",
        "salary_emp": 95000,
        "name_mgr": "Rex",
        "salary_mgr": 90000
      },
      {
        "name_emp": "Uma",
        "salary_emp": 120000,
        "name_mgr": "Sam",
        "salary_mgr": 95000
      }
    ],
    "expectedCols": [
      "name_emp",
      "salary_emp",
      "name_mgr",
      "salary_mgr"
    ]
  },
  {
    "id": 6,
    "title": "Class Rankings",
    "difficulty": "Medium",
    "topic": "Window Functions",
    "scenario": "Rank each student by score within their own class in <b>students</b>, with tied scores sharing a rank.",
    "setup": "import pandas as pd\n\nstudents = pd.DataFrame({\n    \"name\": [\"Amy\",\"Bo\",\"Cy\",\"Dee\",\"Eva\",\"Fin\"],\n    \"cls\": [\"A\",\"A\",\"A\",\"B\",\"B\",\"B\"],\n    \"score\": [88,95,95,70,82,82]\n})",
    "starter": "students[\"class_rank\"] = students.groupby(___)[\"score\"].rank(method=\"min\", ascending=___).astype(int)\nresult = students.sort_values([\"cls\", \"class_rank\"]).reset_index(drop=True)",
    "solution": "students[\"class_rank\"] = students.groupby(\"cls\")[\"score\"].rank(method=\"min\", ascending=False).astype(int)\nresult = students.sort_values([\"cls\",\"class_rank\"]).reset_index(drop=True)",
    "pysparkRef": "from pyspark.sql import Window\nw = Window.partitionBy(\"cls\").orderBy(F.col(\"score\").desc())\nresult = df.withColumn(\"class_rank\", F.rank().over(w)).orderBy(\"cls\", \"class_rank\")",
    "hint": "groupby(...)['score'].rank(method='min', ascending=False) mirrors SQL's RANK() \u2014 ties share the lower rank number.",

        "cls": "A",

        "name": "Cy",
        "cls": "A",

        "class_rank": 1
      },
      {
        "name": "Amy",
        "cls": "A",
        "score": 88,
        "class_rank": 3
      },
      {
        "name": "Eva",
        "cls": "B",
        "score": 82,
        "class_rank": 1
      },
      {
        "name": "Fin",
        "cls": "B",
        "score": 82,
        "class_rank": 1
      },
      {
        "name": "Dee",
        "cls": "B",
        "score": 70,
        "class_rank": 3
      }
    ],
    "expectedCols": [

      "cls",
      "score",
      "class_rank"
    ]
  },
  {
    "id": 7,
    "title": "One Row Per Email",
    "difficulty": "Medium",
    "topic": "Deduplication",
    "scenario": "The <b>users</b> DataFrame has duplicate signups per email. Keep only the most recent signup_date for each email.",
    "setup": "import pandas as pd\n\nusers = pd.DataFrame({\n    \"user_id\": [1,2,3,4,5],\n    \"email\": [\"a@x.com\",\"a@x.com\",\"b@x.com\",\"c@x.com\",\"c@x.com\"],\n    \"signup_date\": pd.to_datetime([\"2024-01-01\",\"2024-03-05\",\"2024-02-10\",\"2024-01-20\",\"2023-12-01\"])\n})",
    "starter": "result = users.sort_values(\"signup_date\").drop_duplicates(___, keep=___).sort_values(\"email\").reset_index(drop=True)",
    "solution": "result = users.sort_values(\"signup_date\").drop_duplicates(\"email\", keep=\"last\").sort_values(\"email\").reset_index(drop=True)",
    "pysparkRef": "from pyspark.sql import Window\nw = Window.partitionBy(\"email\").orderBy(F.col(\"signup_date\").desc())\nresult = (df.withColumn(\"rn\", F.row_number().over(w))\n            .filter(F.col(\"rn\") == 1).drop(\"rn\").orderBy(\"email\"))",
    "hint": "Sort so the latest date comes last per group, then drop_duplicates(..., keep='last') on the email column.",
    "expected": [
      {
        "user_id": 2,
        "email": "a@x.com",
        "signup_date": "2024-03-05"
      },
      {
        "user_id": 3,
        "email": "b@x.com",
        "signup_date": "2024-02-10"
      },
      {

<script>
const QUESTIONS = JSON.parse(document.getElementById('pyspark-questions-data').textContent);
const STORAGE_KEY = 'kjs_pyspark_practice_progress_v1';
let pyodide = null;
let currentId = null;

function getSolved(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e){ return {}; } }
function markSolved(id){ const solved = getSolved(); solved[id] = true; localStorage.setItem(STORAGE_KEY, JSON.stringify(solved)); renderSidebar(); }
function renderProgress(){ document.getElementById('progressCount').textContent = Object.keys(getSolved()).length; }

function renderSidebar(){
  const solved = getSolved();
  const list = document.getElementById('qlist');
  list.innerHTML = '';
  QUESTIONS.forEach(q => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'qbtn' + (q.id === currentId ? ' active' : '') + (solved[q.id] ? ' done' : '');
    btn.innerHTML = `<span class="qnum">${solved[q.id] ? '✓' : q.id}</span><span class="qtitle">${q.title}</span><span class="tag qdiff diff-${q.difficulty}">${q.difficulty}</span>`;
    btn.onclick = () => selectQuestion(q.id);
    li.appendChild(btn);
    list.appendChild(li);
  });
  renderProgress();
}

function cellsEqual(a, b){
  if(a === null || a === undefined) return b === null || b === undefined;
  if(b === null || b === undefined) return false;
  const na = Number(a), nb = Number(b);
  if(!isNaN(na) && !isNaN(nb) && a !== '' && b !== '') return Math.abs(na - nb) < 0.01;
  return String(a).trim() === String(b).trim();
}

function compareRecords(userRecords, expectedRecords, expectedCols){
  if(userRecords.length !== expectedRecords.length) return false;
  for(let i = 0; i < userRecords.length; i++){
    const ur = userRecords[i], er = expectedRecords[i];
    for(const col of expectedCols){
      const uv = (col in ur) ? ur[col] : Object.values(ur)[expectedCols.indexOf(col)];
      if(!cellsEqual(uv, er[col])) return false;
    }
  }
  return true;
}

function renderRecordsTable(records, cols){
  if(!records.length) return '<p style="color:var(--text-dim); font-size:13px;">Ran successfully but `result` has 0 rows.</p>';
  const columns = cols && cols.length ? cols : Object.keys(records[0]);
  const head = columns.map(c => `<th>${c}</th>`).join('');
  const rows = records.map(r => `<tr>${columns.map(c => `<td>${r[c] === null || r[c] === undefined ? '<i style="color:var(--text-dim)">null</i>' : r[c]}</td>`).join('')}</tr>`).join('');
  return `<table class="data"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

const CHECKER_PY = `
import json, pandas as pd, numpy as np
def __to_records(df):
    def conv(v):
        try:
            if pd.isna(v):
                return None
        except Exception:
            pass
        if isinstance(v, pd.Timestamp):
            return v.strftime('%Y-%m-%d')
        if isinstance(v, (np.integer,)):
            return int(v)
        if isinstance(v, (np.floating,)):
            return round(float(v), 4)
        return v
    return [{k: conv(v) for k, v in row.items()} for row in df.to_dict(orient='records')]
json.dumps(__to_records(result))
`;

async function runCode(q){
  const editor = document.getElementById('editor');
  const output = document.getElementById('output');
  output.className = 'output';
  output.innerHTML = '<span style="color:var(--text-dim); font-size:13px;">Running…</span>';
  const fullCode = q.setup + '\n\n' + editor.value + '\n\n' + CHECKER_PY;
  try{
    const jsonStr = await pyodide.runPythonAsync(fullCode);
    const records = JSON.parse(jsonStr);
    const isMatch = compareRecords(records, q.expected, q.expectedCols);
    const verdictHtml = isMatch
      ? `<div class="verdict good">✓ Correct — matches the expected result</div>`
      : `<div class="verdict bad">✗ Not quite — output doesn't match yet</div>`;
    output.innerHTML = verdictHtml + renderRecordsTable(records, q.expectedCols);
    if(isMatch) markSolved(q.id);
  } catch(e){
    output.innerHTML = `<div class="verdict bad">✗ Error</div><div class="err">${(e.message || String(e))}</div>`;
  }
}

function selectQuestion(id){
  currentId = id;
  const q = QUESTIONS.find(x => x.id === id);
  renderSidebar();

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="qhead">
      <h2>${q.id}. ${q.title}</h2>
      <div class="qmeta">
        <span class="tag">${q.topic}</span>
        <span class="tag qdiff diff-${q.difficulty}">${q.difficulty}</span>
      </div>
    </div>
    <p class="scenario">${q.scenario}</p>

    <p class="section-label">Setup (creates the DataFrame — read only)</p>
    <div class="editor-wrap">
      <div class="editor-bar"><span>setup.py</span><span>read-only</span></div>
      <textarea class="editor setup" readonly>${q.setup}</textarea>
    </div>

    <p class="section-label">Your code — assign the answer to <code>result</code></p>
    <div class="editor-wrap">
      <div class="editor-bar"><span>solution.py</span><span>Python 3 · pandas</span></div>
      <textarea class="editor" id="editor" spellcheck="false">${q.starter}</textarea>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="runBtn">▶ Run code</button>
      <button class="btn" id="resetBtn">Reset</button>
    </div>

    <p class="section-label">Output</p>
    <div class="output empty" id="output">Run your code to see results here.</div>

    <details class="reveal" id="hintBlock"><summary>Show hint</summary><div class="reveal-body">${q.hint}</div></details>
    <details class="reveal" id="solutionBlock"><summary>Show pandas solution</summary><div class="reveal-body"><pre>${q.solution}</pre></div></details>
    <details class="reveal pyspark" id="pysparkBlock"><summary>Show real PySpark equivalent</summary><div class="reveal-body">
      <p class="note">This runs on a real Spark cluster/notebook, not in the browser — it's here so you can map the pandas pattern above onto production PySpark syntax.</p>
      <pre>${q.pysparkRef}</pre>
    </div></details>

    <div class="nav-buttons">
      <button class="btn" id="prevBtn">← Previous</button>
      <button class="btn" id="nextBtn">Next →</button>
    </div>
  `;

  document.getElementById('runBtn').onclick = () => runCode(q);
  document.getElementById('resetBtn').onclick = () => { document.getElementById('editor').value = q.starter; const o=document.getElementById('output'); o.className='output empty'; o.innerHTML='Run your code to see results here.'; };
  document.getElementById('editor').addEventListener('keydown', e => {
    if(e.key === 'Tab'){ e.preventDefault(); const t=e.target; const s=t.selectionStart; t.value=t.value.slice(0,s)+'    '+t.value.slice(t.selectionEnd); t.selectionStart=t.selectionEnd=s+4; }
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ runCode(q); }
  });

  const idx = QUESTIONS.findIndex(x => x.id === id);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === QUESTIONS.length - 1;
  document.getElementById('prevBtn').onclick = () => idx > 0 && selectQuestion(QUESTIONS[idx-1].id);
  document.getElementById('nextBtn').onclick = () => idx < QUESTIONS.length-1 && selectQuestion(QUESTIONS[idx+1].id);
}

async function boot(){
  pyodide = await loadPyodide();
  document.getElementById('loadingText').textContent = 'Loading pandas + numpy…';
  await pyodide.loadPackage(['pandas', 'numpy']);
  document.getElementById('loadingBanner').remove();
  renderSidebar();
  selectQuestion(1);
}
boot().catch(err => {
  document.getElementById('loadingBanner').innerHTML = `<span style="color:var(--bad)">Couldn't load the Python runtime: ${err.message}. Check your connection and reload.</span>`;
});
</script>
