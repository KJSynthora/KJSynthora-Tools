const LESSONS = {

'm1::What is SQL?': {
  intro:"SQL (Structured Query Language) is the standard language used to talk to relational databases — to create, read, update and delete the data stored inside tables. It's declarative: you describe WHAT result you want, and the database engine figures out HOW to get it.",
  body:[
    {h:'A Language for Talking to Databases', p:"Every relational database — MySQL, PostgreSQL, SQL Server, Oracle, SQLite, Snowflake, Databricks SQL — understands SQL. Learn it once, and you can work with almost any data system on earth."},
    {h:'Declarative, Not Procedural', p:"In a language like Python you write step-by-step instructions (a loop, an if-check). In SQL you just describe the shape of the result you want using <span class='ic'>SELECT</span>, and the engine's query optimizer decides the fastest way to fetch it."},
    {h:'Try Your First Query', p:"Run the query below against a live in-browser database — this is a real SQLite engine running in your browser, not a fake output.",
     runner:{id:'wis1', tabs:[
       {label:'All Rows', sql:"SELECT * FROM employees;"},
       {label:'Specific Columns', sql:"SELECT name, department, salary FROM employees;"},
       {label:'Filtered', sql:"SELECT name, salary FROM employees WHERE department = 'Engineering';"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Good to Know', text:"SQL was originally called SEQUEL (Structured English Query Language) — that's still why many people pronounce it 'sequel' instead of spelling out S-Q-L."}
},

'm1::History of SQL': {
  intro:"SQL began as an academic idea in 1970 and became the global data standard in less than two decades — a rare feat in computer science.",
  body:[
    {h:"From a Research Paper to an Industry Standard", p:"In 1970, IBM researcher Dr. Edgar F. Codd published \"A Relational Model of Data for Large Shared Data Banks,\" introducing the idea of storing data in tables (relations) instead of rigid hierarchical structures."},
    {h:'SEQUEL Becomes SQL', p:"IBM engineers Donald Chamberlin and Raymond Boyce built a language called SEQUEL (Structured English Query Language) in the mid-1970s to test Codd's ideas inside IBM's System R prototype. A trademark conflict later shortened the name to SQL."},
    {h:'Key Milestones', p:"<ul><li><strong>1970</strong> — Codd's relational model paper published</li><li><strong>1974</strong> — SEQUEL developed at IBM for System R</li><li><strong>1979</strong> — Oracle ships the first commercial SQL database</li><li><strong>1986</strong> — ANSI standardizes SQL (SQL-86)</li><li><strong>1987</strong> — ISO adopts the same standard internationally</li><li><strong>Today</strong> — SQL:2016+ adds JSON support, window functions, and more, and every major database still speaks it</li></ul>"}
  ],
  tip:{type:'c-note', title:'Fun Fact', text:"IBM couldn't trademark 'SEQUEL' because a UK aircraft company already owned it — so the language was renamed SQL, and the pronunciation 'sequel' stuck around."}
},

'm1::SQL Architecture': {
  intro:"A SQL database isn't one single program — it's a layered system where your query passes through several stages before you ever see a result.",
  body:[
    {h:'The Three-Tier Model', p:"Most database systems follow a client-server model: (1) the <strong>Client</strong> — your app, a BI tool, or this browser page — sends a SQL statement; (2) the <strong>Database Engine</strong> parses, optimizes and executes it; (3) the <strong>Storage Layer</strong> reads or writes the actual data on disk or in memory."},
    {h:'Inside the Engine', p:"When a query arrives, it moves through four stages: the <strong>Parser</strong> checks syntax and builds a query tree, the <strong>Optimizer</strong> picks the fastest execution plan (which index to use, which join order), the <strong>Execution Engine</strong> carries out that plan, and the <strong>Storage Engine</strong> physically retrieves rows.",

  tip:{type:'c-tip', title:'Why This Matters', text:"Understanding that the optimizer — not you — chooses the execution path explains why two queries returning the same rows can have very different performance."}

     ]}}
  ],
  tip:{type:'c-note', title:'RDBMS vs NoSQL', text:"Not every DBMS is relational — MongoDB and Redis are non-relational (NoSQL) systems. SQL, as a language, is specifically for relational systems."}
},

'm1::Tables, Rows & Columns': {
  intro:"A table is the fundamental storage unit in a relational database — a grid of rows and columns, much like a spreadsheet, but with strict rules.",
  body:[
    {h:'Rows and Columns', p:"Each <strong>column</strong> represents an attribute (name, salary, department) and has a fixed data type. Each <strong>row</strong> (also called a record or tuple) represents one complete entity — one employee, one order, one product."},
    {h:'Inspect a Real Table', p:"The <span class='ic'>employees</span> table below has 6 rows and 7 columns. Try selecting a few rows to see the structure.",
     runner:{id:'trc1', tabs:[
       {label:'First 3 Rows', sql:"SELECT * FROM employees LIMIT 3;"},
       {label:'Column Info', sql:"PRAGMA table_info(employees);"},
       {label:'Row Count', sql:"SELECT COUNT(*) AS total_rows FROM employees;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Naming Convention', text:"Table names are usually plural (employees, orders) since a table holds many rows, while each row represents one singular entity (one employee)."}
},

'm1::SQL Syntax': {
  intro:"SQL statements follow a predictable structure. Learn the clause order once, and every query you write afterward becomes easier to reason about.",
  body:[
    {h:'Anatomy of a Statement', p:"Keywords like <span class='ic'>SELECT</span>, <span class='ic'>FROM</span> and <span class='ic'>WHERE</span> are conventionally written in UPPERCASE (SQL itself is case-insensitive to keywords), identifiers like table and column names follow your database's casing rules, and every statement ends with a semicolon <span class='ic'>;</span>"},
    {h:'Written Clause Order', p:"You write clauses in this order: <span class='ic'>SELECT</span> → <span class='ic'>FROM</span> → <span class='ic'>WHERE</span> → <span class='ic'>GROUP BY</span> → <span class='ic'>HAVING</span> → <span class='ic'>ORDER BY</span> → <span class='ic'>LIMIT</span>. (The database actually *executes* them in a different order — covered in the 'SQL Order of Execution' topic.)",
     runner:{id:'syn1', tabs:[
       {label:'Full Structure', sql:"SELECT department, AVG(salary) AS avg_salary FROM employees WHERE salary > 60000 GROUP BY department HAVING AVG(salary) > 70000 ORDER BY avg_salary DESC LIMIT 5;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Common Mistake', text:"Writing clauses out of order (e.g. WHERE after GROUP BY) causes a syntax error — the written order above is fixed and cannot be rearranged."}
},

'm1::SQL Statements': {
  intro:"Every SQL command belongs to one of five categories, based on what it does to your data or database structure.",
  body:[
    {h:'The Five Categories', p:"<ul><li><strong>DDL</strong> (Data Definition Language) — CREATE, ALTER, DROP: defines structure</li><li><strong>DML</strong> (Data Manipulation Language) — INSERT, UPDATE, DELETE: changes data</li><li><strong>DQL</strong> (Data Query Language) — SELECT: reads data</li><li><strong>DCL</strong> (Data Control Language) — GRANT, REVOKE: manages permissions</li><li><strong>TCL</strong> (Transaction Control Language) — COMMIT, ROLLBACK: manages transactions</li></ul>"},
    {h:'DDL + DML Together', p:"This example creates a temporary table (DDL), inserts a row (DML), and queries it (DQL) — all in one runnable block, without touching the main employees table.",
     runner:{id:'stmt1', tabs:[
       {label:'DDL + DML + DQL', sql:"CREATE TEMP TABLE demo (id INTEGER, note TEXT); INSERT INTO demo VALUES (1, 'Created with DDL, filled with DML'); SELECT * FROM demo; DROP TABLE demo;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Interview Tip', text:"A common interview question is the difference between DELETE, TRUNCATE and DROP — DELETE removes rows (DML, can be rolled back), TRUNCATE empties a table fast (DDL in most databases), and DROP removes the whole table structure."}
},

'm1::SQL Comments': {
  intro:"Comments let you leave notes in your SQL code that the database engine completely ignores — essential for documenting complex queries.",
  body:[
    {h:'Single-Line and Multi-Line', p:"Use two dashes <span class='ic'>--</span> for a comment that runs to the end of the line, or <span class='ic'>/* ... */</span> to comment out a block spanning multiple lines.",
     runner:{id:'com1', tabs:[
       {label:'Single-Line', sql:"-- Get every engineer's name and salary\nSELECT name, salary\nFROM employees\nWHERE department = 'Engineering'; -- filters by department"},
       {label:'Multi-Line', sql:"/* This query finds all\n   employees earning above 90,000 */\nSELECT name, salary\nFROM employees\nWHERE salary > 90000;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Best Practice', text:"Comment the 'why', not the 'what' — SQL is usually readable enough to explain itself, but the business reason behind a filter or threshold often isn't obvious."}
},

'm1::SQL Keywords': {
  intro:"Keywords are reserved words that have a special meaning to SQL — SELECT, FROM, WHERE, JOIN and hundreds more — and can't normally be used as table or column names.",
  body:[
    {h:'Keywords Are Case-Insensitive', p:"<span class='ic'>SELECT</span> and <span class='ic'>select</span> behave identically to the database engine. Writing keywords in UPPERCASE is just a convention that makes queries easier for humans to scan.",
     runner:{id:'kw1', tabs:[
       {label:'Uppercase', sql:"SELECT name, department FROM employees WHERE department = 'HR';"},
       {label:'Lowercase (same result)', sql:"select name, department from employees where department = 'HR';"}
     ]}},
    {h:'Common Keyword Categories', p:"<ul><li><strong>Query</strong> — SELECT, FROM, WHERE, ORDER BY, GROUP BY</li><li><strong>Join</strong> — JOIN, ON, INNER, LEFT, RIGHT</li><li><strong>Data change</strong> — INSERT, UPDATE, DELETE, SET</li><li><strong>Structure</strong> — CREATE, ALTER, DROP, TABLE</li><li><strong>Logic</strong> — AND, OR, NOT, IN, BETWEEN, LIKE, IS NULL</li></ul>"}
  ],
  tip:{type:'c-warn', title:'Reserved Word Trap', text:"If you must name a column 'order' or 'group' (both reserved keywords), you'll need to wrap it in quotes or brackets — e.g. \"order\" or [order] — depending on your database."}
},

'm1::SQL Data Types': {
  intro:"Every column has a data type that determines what kind of value it can hold — numbers, text, dates and more — and how the database stores and compares it.",
  body:[
    {h:'The Major Categories', p:"<ul><li><strong>Numeric</strong> — INT, BIGINT, DECIMAL, FLOAT</li><li><strong>String</strong> — CHAR, VARCHAR, TEXT</li><li><strong>Date/Time</strong> — DATE, TIME, DATETIME, TIMESTAMP</li><li><strong>Boolean</strong> — BOOLEAN (true/false, or 0/1 in some databases)</li><li><strong>Binary</strong> — BLOB, BINARY for raw bytes like files or images</li></ul>"},
    {h:'Checking Real Column Types', p:"This in-browser engine runs SQLite, which uses flexible ('dynamic') typing. Production databases like PostgreSQL, MySQL and SQL Server enforce a fixed type per column — the concepts are the same either way.",
     runner:{id:'dt1', tabs:[
       {label:'Declared Types', sql:"PRAGMA table_info(employees);"},
       {label:'Actual Value Types', sql:"SELECT typeof(name) AS name_type, typeof(salary) AS salary_type, typeof(manager_id) AS manager_id_type FROM employees LIMIT 1;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Choose Types Deliberately', text:"Using DECIMAL instead of FLOAT for money avoids rounding errors, and VARCHAR(n) instead of TEXT can help enforce sane length limits at the database level."}
},

'm1::NULL Values': {
  intro:"NULL represents missing or unknown data — it's not zero, not an empty string, and it behaves differently from every other value in SQL.",
  body:[
    {h:'NULL Is Not a Value', p:"Because NULL means 'unknown', comparing it with <span class='ic'>=</span> never returns true — not even <span class='ic'>NULL = NULL</span>. You must use <span class='ic'>IS NULL</span> or <span class='ic'>IS NOT NULL</span> instead."},
    {h:'See the Trap', p:"Sarah and Alice have no manager, so their <span class='ic'>manager_id</span> is NULL. Compare what happens with <span class='ic'>=</span> versus <span class='ic'>IS NULL</span>.",
     runner:{id:'null1', tabs:[
       {label:'IS NULL (correct)', sql:"SELECT name, manager_id FROM employees WHERE manager_id IS NULL;"},
       {label:'= NULL (always empty!)', sql:"SELECT name, manager_id FROM employees WHERE manager_id = NULL;"},
       {label:'COALESCE Default', sql:"SELECT name, COALESCE(manager_id, 0) AS manager_id_or_zero FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Three-Valued Logic', text:"SQL conditions don't just evaluate to TRUE or FALSE — a comparison involving NULL evaluates to UNKNOWN, which is treated as FALSE and excludes the row from your result."}
},

'm1::SQL Order of Execution': {
  intro:"SQL doesn't run in the order you type it. The database processes clauses in a fixed logical sequence, and understanding it explains a lot of 'why doesn't this work?' moments.",
  body:[
    {h:'The Real Execution Order', p:"<span class='ic'>FROM</span> → <span class='ic'>JOIN</span> → <span class='ic'>WHERE</span> → <span class='ic'>GROUP BY</span> → <span class='ic'>HAVING</span> → <span class='ic'>SELECT</span> → <span class='ic'>DISTINCT</span> → <span class='ic'>ORDER BY</span> → <span class='ic'>LIMIT</span>. Notice that SELECT — the clause you write first — actually runs almost last."},
    {h:'Why Aliases Fail in WHERE', p:"Because WHERE executes before SELECT, a column alias defined in SELECT doesn't exist yet when WHERE runs. Try all three queries below.",
     runner:{id:'oe1', tabs:[
       {label:'✅ Works (real column)', sql:"SELECT salary AS s FROM employees WHERE salary > 80000;"},
       {label:'❌ Fails (alias in WHERE)', sql:"SELECT salary AS s FROM employees WHERE s > 80000;"},
       {label:'✅ Alias in ORDER BY works', sql:"SELECT salary AS s FROM employees ORDER BY s DESC;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Why ORDER BY Can Use Aliases', text:"ORDER BY runs after SELECT in the logical order, so by the time it executes, the alias already exists — that's why the third example above works while WHERE fails."}
},

'm1::SQL Best Practices': {
  intro:"Writing SQL that runs is easy. Writing SQL that's fast, safe and readable six months from now takes a few disciplined habits.",
  body:[
    {h:'Formatting & Readability', p:"<ul><li>Write keywords in UPPERCASE, identifiers in lowercase or snake_case</li><li>Put each major clause (SELECT, FROM, WHERE...) on its own line</li><li>Use meaningful table aliases (e.g. <span class='ic'>e</span> for employees, not <span class='ic'>x</span>)</li><li>Comment the business reason behind non-obvious filters</li></ul>"},
    {h:'Performance & Safety', p:"<ul><li>Select only the columns you need — avoid <span class='ic'>SELECT *</span> in production code</li><li>Filter early with WHERE before grouping or joining large tables</li><li>Always use parameterized queries in application code to prevent SQL injection</li><li>Index columns you frequently filter or join on</li></ul>"},
    {h:'Before and After', p:"Compare a quick-and-dirty query against a cleaner, safer version of the same request.",
     runner:{id:'bp1', tabs:[
       {label:'❌ Avoid', sql:"select * from employees;"},
       {label:'✅ Better', sql:"SELECT name, department, salary FROM employees WHERE department = 'Engineering' ORDER BY salary DESC;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Rule of Thumb', text:"If you can't read your own query out loud and explain what it does in one sentence, it probably needs to be simplified or split into a CTE."}
},

'm2::SELECT': {
  intro:"SELECT is the foundation of all SQL. Every query starts here — it lets you retrieve exactly the columns you need from a table.",
  body:[
    {h:'Your First Query', p:"The asterisk <span class='ic'>*</span> means 'all columns'. Always end statements with a semicolon.",
     runner:{id:'sel1', tabs:[
       {label:'SELECT *', sql:"SELECT * FROM employees;"},
       {label:'Specific Cols', sql:"SELECT name, department, salary FROM employees;"},
       {label:'With Alias', sql:"SELECT name AS employee_name, salary AS annual_salary FROM employees;"}
     ]}},
  ],
  tip:{type:'c-tip', title:'Best Practice', text:"Always name specific columns in production queries instead of SELECT * — it's faster, safer, and more readable."}
},
'm2::DISTINCT': {
  intro:"DISTINCT removes duplicate rows from your result set, keeping only unique values.",
  body:[{h:'Removing Duplicates', p:"Without DISTINCT you'll see repeated values; with it, only unique rows remain.",
    runner:{id:'dist1', tabs:[
      {label:'Without DISTINCT', sql:"SELECT department FROM employees;"},
      {label:'With DISTINCT', sql:"SELECT DISTINCT department FROM employees;"},
      {label:'Count Unique', sql:"SELECT COUNT(DISTINCT department) AS unique_depts FROM employees;"}
    ]}}],
  tip:{type:'c-note', title:'Note', text:"DISTINCT applies to the entire row combination, not just one column, when multiple columns are selected."}
},

'm2::Aliases': {
  intro:"An alias is a temporary name given to a column or a table for the duration of a query — it makes results more readable and joins much easier to write.",
  body:[
    {h:'Column Aliases', p:"Use <span class='ic'>AS</span> to rename an output column. The alias only exists in the result set, not in the actual table.",
     runner:{id:'al1', tabs:[
       {label:'With AS', sql:"SELECT name AS employee_name, salary AS annual_pay FROM employees;"},
       {label:'AS is Optional', sql:"SELECT name employee_name, salary annual_pay FROM employees;"}
     ]}},
    {h:'Table Aliases', p:"Table aliases shorten long table names — essential once you start writing JOINs across multiple tables.",
     runner:{id:'al2', tabs:[
       {label:'Table Alias', sql:"SELECT e.name, e.salary FROM employees e WHERE e.department = 'Engineering';"}
     ]}}
  ],
  tip:{type:'c-note', title:'Style Tip', text:"Writing AS explicitly for column aliases (but often omitting it for table aliases) is the most common convention across real-world codebases."}
},

'm2::TOP': {
  intro:"TOP limits the number of rows a query returns — but it's a SQL Server / MS Access specific keyword, not part of the ANSI SQL standard.",
  body:[
    {h:'SQL Server Syntax', p:"In SQL Server you'd write <span class='ic'>SELECT TOP 3 * FROM employees ORDER BY salary DESC;</span> — or <span class='ic'>TOP 50 PERCENT</span> for a percentage of rows. This in-browser engine runs SQLite, which doesn't support TOP, so the runner below uses SQLite's equivalent, <span class='ic'>LIMIT</span>, to demonstrate the same result.",
     runner:{id:'top1', tabs:[
       {label:'SQLite Equivalent (LIMIT)', sql:"SELECT * FROM employees ORDER BY salary DESC LIMIT 3;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Vendor Differences', text:"Row-limiting syntax varies a lot: SQL Server/Access use TOP, MySQL/PostgreSQL/SQLite use LIMIT, and Oracle/DB2/standard SQL use FETCH FIRST or ROWNUM."}
},

'm2::LIMIT': {
  intro:"LIMIT restricts how many rows a query returns — used in MySQL, PostgreSQL, SQLite and many other databases.",
  body:[
    {h:'Capping Your Results', p:"LIMIT is placed at the very end of the query, after ORDER BY.",
     runner:{id:'lim1', tabs:[
       {label:'Basic LIMIT', sql:"SELECT * FROM employees LIMIT 3;"},
       {label:'LIMIT + ORDER BY', sql:"SELECT name, salary FROM employees ORDER BY salary DESC LIMIT 3;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Always Pair with ORDER BY', text:"Without ORDER BY, a database is free to return rows in any physical order it likes — so LIMIT alone can give inconsistent results between runs."}
},

'm2::OFFSET': {
  intro:"OFFSET skips a specified number of rows before the result set starts — combined with LIMIT, it's the standard way to build pagination.",
  body:[
    {h:'Paging Through Results', p:"Each 'page' skips the rows already shown on previous pages.",
     runner:{id:'off1', tabs:[
       {label:'Page 1', sql:"SELECT name, salary FROM employees ORDER BY salary DESC LIMIT 2 OFFSET 0;"},
       {label:'Page 2', sql:"SELECT name, salary FROM employees ORDER BY salary DESC LIMIT 2 OFFSET 2;"},
       {label:'Page 3', sql:"SELECT name, salary FROM employees ORDER BY salary DESC LIMIT 2 OFFSET 4;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Pagination Formula', text:"OFFSET = (page_number − 1) × page_size. For page 3 with 2 rows per page, that's (3−1)×2 = 4, matching the example above."}
},

'm2::FETCH FIRST': {
  intro:"FETCH FIRST is the ANSI SQL standard clause for limiting rows — supported by PostgreSQL, Oracle, DB2 and SQL Server 2012+.",
  body:[
    {h:'Standard Syntax', p:"The full standard form is <span class='ic'>OFFSET n ROWS FETCH FIRST n ROWS ONLY</span>. SQLite (used in this in-browser runner) doesn't implement FETCH FIRST, so the example below shows the equivalent using LIMIT/OFFSET.",
     runner:{id:'ff1', tabs:[
       {label:'SQLite Equivalent', sql:"SELECT name, salary FROM employees ORDER BY salary DESC LIMIT 3 OFFSET 1;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Standard vs Vendor Syntax', text:"On PostgreSQL/Oracle/SQL Server the same query above would be written: SELECT name, salary FROM employees ORDER BY salary DESC OFFSET 1 ROWS FETCH FIRST 3 ROWS ONLY;"}
},

'm2::Expressions': {
  intro:"A SQL expression combines columns, literal values, operators and functions to compute a new value directly inside a query.",
  body:[
    {h:'Arithmetic & String Expressions', p:"Expressions can do math, combine text, or produce boolean-like results — all without changing the underlying table.",
     runner:{id:'expr1', tabs:[
       {label:'Arithmetic', sql:"SELECT name, salary, salary * 12 AS estimated_annual_cost FROM employees;"},
       {label:'String Concatenation', sql:"SELECT name || ' - ' || department AS employee_summary FROM employees;"},
       {label:'Boolean Expression', sql:"SELECT name, salary, salary > 85000 AS is_high_earner FROM employees;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Concatenation Differs by Database', text:"SQLite, PostgreSQL and Oracle use || to join strings; SQL Server uses +; MySQL uses the CONCAT() function instead."}
},

'm2::Calculated Columns': {
  intro:"A calculated (or computed) column doesn't exist in the raw table — it's derived at query time from other columns using an expression.",
  body:[
    {h:'Deriving New Values', p:"Calculated columns are recomputed every time the query runs, so they always reflect the latest underlying data.",
     runner:{id:'cc1', tabs:[
       {label:'Bonus Calculation', sql:"SELECT name, salary, ROUND(salary * 0.10, 2) AS bonus_10pct FROM employees;"},
       {label:'Combine Columns', sql:"SELECT name, salary, salary + ROUND(salary * 0.10, 2) AS total_comp FROM employees;"},
       {label:'CASE-Based Column', sql:"SELECT name, salary, CASE WHEN salary > 90000 THEN 'Senior' ELSE 'Standard' END AS pay_band FROM employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Want It Permanent?', text:"If you need a calculated value stored rather than recomputed each time, look into GENERATED / computed columns — supported natively by PostgreSQL, MySQL and SQL Server."}
},

'm3::WHERE': {
  intro:"WHERE filters rows based on a condition — it's the most used clause after SELECT.",
  body:[{h:'Filtering Rows', p:"Combine WHERE with comparison operators to narrow down results.",
    runner:{id:'wh1', tabs:[
      {label:'Equal', sql:"SELECT * FROM employees WHERE department = 'Engineering';"},
      {label:'Greater Than', sql:"SELECT * FROM employees WHERE salary > 80000;"},
      {label:'BETWEEN', sql:"SELECT * FROM employees WHERE salary BETWEEN 70000 AND 90000;"},
      {label:'LIKE', sql:"SELECT * FROM employees WHERE name LIKE 'A%';"}
    ]}}],
  tip:{type:'c-warn', title:'Performance Warning', text:"LIKE with a leading wildcard ('%text') cannot use an index and forces a full table scan."}
},

'm3::Comparison Operators': {
  intro:"Comparison operators test a relationship between two values — equal, not equal, greater than, less than — and are the building blocks of every WHERE condition.",
  body:[
    {h:'The Six Operators', p:"<span class='ic'>=</span> equal, <span class='ic'>&lt;&gt;</span> or <span class='ic'>!=</span> not equal, <span class='ic'>&gt;</span> greater than, <span class='ic'>&lt;</span> less than, <span class='ic'>&gt;=</span> greater or equal, <span class='ic'>&lt;=</span> less or equal.",
     runner:{id:'cmp1', tabs:[
       {label:'Equal', sql:"SELECT name, salary FROM employees WHERE salary = 95000;"},
       {label:'Not Equal', sql:"SELECT name, department FROM employees WHERE department <> 'Engineering';"},
       {label:'Greater / Less', sql:"SELECT name, salary FROM employees WHERE salary >= 70000 AND salary <= 95000;"}
     ]}}
  ],
  tip:{type:'c-note', title:'<> vs !=', text:"<> is the ANSI SQL standard 'not equal' operator and works everywhere. != is a widely supported alias, but stick to <> for maximum portability."}
},

'm3::AND': {
  intro:"AND combines multiple conditions in a WHERE clause — a row is only included if EVERY condition is true.",
  body:[
    {h:'All Conditions Must Match', p:"You can chain as many AND conditions as you like; the more you add, the narrower your result gets.",
     runner:{id:'and1', tabs:[
       {label:'Two Conditions', sql:"SELECT name, department, salary FROM employees WHERE department = 'Engineering' AND salary > 90000;"},
       {label:'Three Conditions', sql:"SELECT * FROM employees WHERE department = 'Engineering' AND salary > 85000 AND city = 'Bangalore';"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Tip', text:"If a row fails even one AND condition, it's excluded — AND is always more restrictive than OR."}
},

'm3::OR': {
  intro:"OR combines multiple conditions in a WHERE clause — a row is included if AT LEAST ONE condition is true.",
  body:[
    {h:'Any Condition Can Match', p:"OR widens your result set compared to AND, since only one condition needs to pass.",
     runner:{id:'or1', tabs:[
       {label:'Either Department', sql:"SELECT name, department FROM employees WHERE department = 'HR' OR department = 'Marketing';"},
       {label:'Mixing AND + OR', sql:"SELECT name, department, salary FROM employees WHERE department = 'Engineering' AND (salary > 92000 OR city = 'Mumbai');"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Always Use Parentheses', text:"AND has higher precedence than OR. Without parentheses, WHERE dept='HR' OR dept='Eng' AND salary>90000 evaluates the AND first — often not what you intended. Group conditions explicitly."}
},

'm3::NOT': {
  intro:"NOT reverses the result of a condition — what was true becomes false, and what was false becomes true.",
  body:[
    {h:'Negating a Condition', p:"NOT is often combined with other operators like IN, BETWEEN, or LIKE to express 'everything except this'.",
     runner:{id:'not1', tabs:[
       {label:'Simple NOT', sql:"SELECT name, department FROM employees WHERE NOT department = 'Engineering';"},
       {label:'NOT with Parentheses', sql:"SELECT name, salary FROM employees WHERE NOT (salary > 80000);"}
     ]}}
  ],
  tip:{type:'c-note', title:'Readability Tip', text:"'WHERE NOT department = X' and 'WHERE department <> X' return identical results — many teams prefer <> for simple negations and reserve NOT for compound conditions."}
},

'm3::IN': {
  intro:"IN checks whether a value matches any value in a given list — a clean shortcut instead of chaining several OR conditions.",
  body:[
    {h:'Matching Against a List', p:"<span class='ic'>WHERE department IN ('HR','Marketing')</span> is equivalent to <span class='ic'>WHERE department = 'HR' OR department = 'Marketing'</span>, but far easier to read with longer lists.",
     runner:{id:'in1', tabs:[
       {label:'IN with List', sql:"SELECT name, department FROM employees WHERE department IN ('HR', 'Marketing');"},
       {label:'IN with Subquery', sql:"SELECT name FROM employees WHERE dept_id IN (SELECT id FROM departments WHERE location = 'Mumbai');"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Tip', text:"IN can take either a literal list of values or a subquery that returns a list — both work exactly the same way."}
},

'm3::NOT IN': {
  intro:"NOT IN excludes rows whose value matches anything in a given list — but it hides a dangerous trap when the list contains NULL.",
  body:[
    {h:'Excluding a List', p:"Straightforward when the list has no NULLs.",
     runner:{id:'notin1', tabs:[
       {label:'NOT IN with List', sql:"SELECT name, department FROM employees WHERE department NOT IN ('HR', 'Marketing');"}
     ]}},
    {h:'The NULL Trap', p:"If the subquery list itself can contain NULL, NOT IN silently returns ZERO rows — because comparing anything to NULL is UNKNOWN, not TRUE. Two employees have a NULL manager_id, so this 'find employees who are not managers' query below unexpectedly returns nothing.",
     runner:{id:'notin2', tabs:[
       {label:'❌ Broken by NULL', sql:"SELECT name FROM employees WHERE id NOT IN (SELECT manager_id FROM employees);"},
       {label:'✅ Safe Fix', sql:"SELECT name FROM employees WHERE id NOT IN (SELECT manager_id FROM employees WHERE manager_id IS NOT NULL);"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Classic Interview Trap', text:"Always filter out NULLs from a NOT IN subquery list, or use NOT EXISTS instead — NOT EXISTS never has this problem."}
},

'm3::BETWEEN': {
  intro:"BETWEEN checks whether a value falls within an inclusive range — a cleaner alternative to writing two comparison operators.",
  body:[
    {h:'Inclusive on Both Ends', p:"<span class='ic'>salary BETWEEN 70000 AND 90000</span> includes rows where salary is exactly 70000 or exactly 90000, not just values strictly in between.",
     runner:{id:'bet1', tabs:[
       {label:'BETWEEN', sql:"SELECT name, salary FROM employees WHERE salary BETWEEN 70000 AND 90000;"},
       {label:'NOT BETWEEN', sql:"SELECT name, salary FROM employees WHERE salary NOT BETWEEN 70000 AND 90000;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Works on Dates Too', text:"BETWEEN isn't limited to numbers — it's just as common for filtering date ranges, e.g. order_date BETWEEN '2026-01-01' AND '2026-01-31'."}
},

'm3::LIKE': {
  intro:"LIKE performs pattern matching on text — used with wildcard characters to find values that partially match instead of exactly match.",
  body:[
    {h:'Pattern Matching Basics', p:"Combine LIKE with the <span class='ic'>%</span> and <span class='ic'>_</span> wildcards (covered in the next topic) to match flexible text patterns.",
     runner:{id:'like1', tabs:[
       {label:'Starts With', sql:"SELECT name FROM employees WHERE name LIKE 'A%';"},
       {label:'Contains', sql:"SELECT name FROM employees WHERE name LIKE '%a%';"},
       {label:'Ends With', sql:"SELECT name FROM employees WHERE name LIKE '%e';"}
     ]}}
  ],
  tip:{type:'c-note', title:'Case Sensitivity Varies', text:"SQLite's LIKE is case-insensitive for ASCII letters by default. MySQL is case-insensitive by default too, but PostgreSQL's LIKE is case-sensitive (use ILIKE there instead)."}
},

'm3::Wildcards': {
  intro:"Wildcards are special characters used inside a LIKE pattern to represent 'any character' — % for any sequence, _ for exactly one character.",
  body:[
    {h:'Percent and Underscore', p:"<span class='ic'>%</span> matches zero or more characters of any kind. <span class='ic'>_</span> matches exactly one character.",
     runner:{id:'wc1', tabs:[
       {label:'% Any Sequence', sql:"SELECT name FROM employees WHERE name LIKE '%o%';"},
       {label:'_ Single Character', sql:"SELECT name FROM employees WHERE name LIKE '_ob';"},
       {label:'Combine Both', sql:"SELECT name FROM employees WHERE name LIKE 'C_r%';"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Matching a Literal % or _', text:"If you need to search for an actual percent sign or underscore, escape it: LIKE '50\\%%' ESCAPE '\\' matches values starting with '50%'."}
},

'm3::EXISTS': {
  intro:"EXISTS checks whether a subquery returns ANY rows at all — it doesn't care about the actual values, just whether at least one match exists.",
  body:[
    {h:'Finding Related Rows', p:"EXISTS is often faster than IN for correlated subqueries because the database can stop as soon as it finds one matching row.",
     runner:{id:'ex1', tabs:[
       {label:'Departments With Staff', sql:"SELECT dept_name FROM departments d WHERE EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id);"}
     ]}}
  ],
  tip:{type:'c-tip', title:'What to SELECT Inside EXISTS', text:"It's conventional to write SELECT 1 inside an EXISTS subquery — the actual selected value is discarded, since EXISTS only checks row presence."}
},

'm3::NOT EXISTS': {
  intro:"NOT EXISTS is the mirror image of EXISTS — it returns rows where the subquery finds NO match at all, and it never suffers from the NULL trap that affects NOT IN.",
  body:[
    {h:'Finding the Unmatched', p:"The Finance department (id 40) has zero employees assigned to it — NOT EXISTS finds it reliably.",
     runner:{id:'nex1', tabs:[
       {label:'Departments With No Staff', sql:"SELECT dept_name FROM departments d WHERE NOT EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id);"}
     ]}}
  ],
  tip:{type:'c-note', title:'Prefer This Over NOT IN', text:"Unlike NOT IN, NOT EXISTS handles NULLs correctly in every case — when in doubt, use NOT EXISTS for 'find rows with no match' queries."}
},

'm3::ANY': {
  intro:"ANY compares a value against every value returned by a subquery, and is true if the comparison succeeds against AT LEAST ONE of them.",
  body:[
    {h:'Not Supported in SQLite', p:"Standard SQL allows <span class='ic'>salary &gt; ANY (subquery)</span>, but SQLite (the engine powering this in-browser runner) doesn't implement ANY/SOME. PostgreSQL, SQL Server and Oracle all support it directly. In SQLite, the same logic can be written using MIN() — 'greater than ANY value' is the same as 'greater than the smallest value'.",
     runner:{id:'any1', tabs:[
       {label:'SQLite Equivalent (MIN)', sql:"SELECT name, salary FROM employees WHERE salary > (SELECT MIN(salary) FROM employees WHERE department = 'HR');"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL/SQL Server/Oracle: SELECT name, salary FROM employees WHERE salary > ANY (SELECT salary FROM employees WHERE department = 'HR');"}
},

'm3::ALL': {
  intro:"ALL compares a value against every value returned by a subquery, and is true only if the comparison succeeds against EVERY one of them.",
  body:[
    {h:'Not Supported in SQLite', p:"Like ANY, the ALL keyword isn't implemented in SQLite. 'Greater than ALL values' is equivalent to 'greater than the largest value', so MAX() gives the same result here.",
     runner:{id:'all1', tabs:[
       {label:'SQLite Equivalent (MAX)', sql:"SELECT name, salary FROM employees WHERE salary > (SELECT MAX(salary) FROM employees WHERE department = 'HR');"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL/SQL Server/Oracle: SELECT name, salary FROM employees WHERE salary > ALL (SELECT salary FROM employees WHERE department = 'HR');"}
},

'm3::IS NULL': {
  intro:"IS NULL is the only correct way to test for a missing value — since NULL represents 'unknown', the ordinary = operator can never match it.",
  body:[
    {h:'Finding Missing Values', p:"Sarah and Alice have no manager assigned, so their manager_id column is NULL.",
     runner:{id:'isn1', tabs:[
       {label:'IS NULL', sql:"SELECT name, manager_id FROM employees WHERE manager_id IS NULL;"}
     ]}}
  ],
  tip:{type:'c-note', title:'See Also', text:"For a deeper look at why NULL behaves this way, check the 'NULL Values' topic in the SQL Fundamentals module."}
},

'm3::IS NOT NULL': {
  intro:"IS NOT NULL filters out missing values, keeping only rows where a column actually has a real, known value.",
  body:[
    {h:'Filtering Out the Unknown', p:"This finds every employee who does have a manager assigned.",
     runner:{id:'isnn1', tabs:[
       {label:'IS NOT NULL', sql:"SELECT name, manager_id FROM employees WHERE manager_id IS NOT NULL;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Common Pattern', text:"IS NOT NULL is frequently combined with COUNT to measure data completeness, e.g. SELECT COUNT(*) FROM employees WHERE manager_id IS NOT NULL — often called a 'fill rate' check."}
},

'm4::ORDER BY': {
  intro:"ORDER BY sorts your result set by one or more columns — ascending by default, or descending when you ask for it. It's the clause that turns raw rows into something readable.",
  body:[
    {h:'ASC and DESC', p:"<span class='ic'>ASC</span> (ascending, the default) sorts smallest-to-largest or A-to-Z. <span class='ic'>DESC</span> (descending) sorts largest-to-smallest or Z-to-A. You don't need to write ASC explicitly since it's the default behavior.",
     runner:{id:'ob1', tabs:[
       {label:'Ascending (default)', sql:"SELECT name, salary FROM employees ORDER BY salary;"},
       {label:'Descending', sql:"SELECT name, salary FROM employees ORDER BY salary DESC;"}
     ]}},
    {h:'Sorting by Multiple Columns', p:"When two rows tie on the first column, ORDER BY moves to the next column listed to break the tie. Order matters — the first column listed is the primary sort key.",
     runner:{id:'ob2', tabs:[
       {label:'Multi-Column Sort', sql:"SELECT name, department, salary FROM employees ORDER BY department ASC, salary DESC;"},
       {label:'Sort by Column Position', sql:"SELECT name, department, salary FROM employees ORDER BY 2, 3 DESC;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'NULLs Sort First (in SQLite)', text:"How NULL values are ordered varies by database: SQLite and MySQL sort NULLs first in ASC order; PostgreSQL and Oracle sort them last by default. Use NULLS FIRST / NULLS LAST (where supported) to control this explicitly."}
},

'm4::COUNT': {
  intro:"COUNT is an aggregate function that returns the number of rows matching your query — one of the most frequently used functions in all of SQL.",
  body:[
    {h:'COUNT(*) vs COUNT(column)', p:"<span class='ic'>COUNT(*)</span> counts every row, including rows with NULLs anywhere in them. <span class='ic'>COUNT(column)</span> counts only the rows where that specific column is NOT NULL — the two can return different numbers.",
     runner:{id:'cnt1', tabs:[
       {label:'COUNT(*)', sql:"SELECT COUNT(*) AS total_employees FROM employees;"},
       {label:'COUNT(column)', sql:"SELECT COUNT(manager_id) AS employees_with_manager FROM employees;"},
       {label:'COUNT(DISTINCT column)', sql:"SELECT COUNT(DISTINCT department) AS unique_departments FROM employees;"}
     ]}},
    {h:'COUNT with GROUP BY', p:"COUNT becomes far more useful combined with GROUP BY, giving you a count per category instead of one grand total.",
     runner:{id:'cnt2', tabs:[
       {label:'Count per Department', sql:"SELECT department, COUNT(*) AS num_employees FROM employees GROUP BY department;"}
     ]}}
  ],
  tip:{type:'c-note', title:'The 2-Row Gap Above', text:"Sarah and Alice both have a NULL manager_id, which is why COUNT(manager_id) returns fewer rows than COUNT(*) — NULLs are always excluded from a column-specific COUNT."}
},

'm4::SUM': {
  intro:"SUM adds up all the numeric values in a column, returning a single total — NULL values are automatically ignored, not treated as zero.",
  body:[
    {h:'Totaling a Column', p:"SUM only works on numeric columns and skips any NULLs it encounters without needing special handling.",
     runner:{id:'sum1', tabs:[
       {label:'Total Payroll', sql:"SELECT SUM(salary) AS total_payroll FROM employees;"},
       {label:'SUM per Department', sql:"SELECT department, SUM(salary) AS dept_payroll FROM employees GROUP BY department;"}
     ]}},
    {h:'SUM with a Condition', p:"Combining SUM with WHERE lets you total only a filtered subset — here, just the Engineering department.",
     runner:{id:'sum2', tabs:[
       {label:'Filtered SUM', sql:"SELECT SUM(salary) AS engineering_payroll FROM employees WHERE department = 'Engineering';"}
     ]}}
  ],
  tip:{type:'c-tip', title:'SUM of Nothing', text:"If every value SUM would add is NULL, or there are no matching rows at all, SUM returns NULL — not 0. Wrap it in COALESCE(SUM(col), 0) if you always want a number."}
},

'm4::AVG': {
  intro:"AVG calculates the arithmetic mean of a numeric column — the sum divided by the count of non-NULL values.",
  body:[
    {h:'Calculating an Average', p:"AVG automatically ignores NULLs both in the sum and in the count it divides by, so it never gets skewed by missing data the way a manual calculation might.",
     runner:{id:'avg1', tabs:[
       {label:'Average Salary', sql:"SELECT ROUND(AVG(salary), 2) AS avg_salary FROM employees;"},
       {label:'AVG per Department', sql:"SELECT department, ROUND(AVG(salary), 2) AS avg_salary FROM employees GROUP BY department;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'AVG Ignores NULLs, Not Zeros', text:"AVG(column) divides by the count of non-NULL rows, not the total row count. A NULL is excluded entirely, but a 0 still counts and pulls the average down — the two are not the same thing."}
},

'm4::MIN': {
  intro:"MIN returns the smallest value in a column — works on numbers, text (alphabetically), and dates (chronologically) alike.",
  body:[
    {h:'Finding the Smallest Value', p:"MIN isn't limited to numeric columns — for text it returns the alphabetically first value, and for dates the earliest one.",
     runner:{id:'min1', tabs:[
       {label:'Lowest Salary', sql:"SELECT MIN(salary) AS lowest_salary FROM employees;"},
       {label:'MIN per Department', sql:"SELECT department, MIN(salary) AS lowest_salary FROM employees GROUP BY department;"},
       {label:'MIN on Text', sql:"SELECT MIN(name) AS first_alphabetically FROM employees;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Finding the Full Row', text:"MIN(salary) alone only gives you the number — to get the whole row of the lowest earner, pair it with ORDER BY and LIMIT 1, or use it inside a WHERE subquery."}
},

'm4::MAX': {
  intro:"MAX returns the largest value in a column — the mirror image of MIN, and just as flexible across numbers, text, and dates.",
  body:[
    {h:'Finding the Largest Value', p:"Like MIN, MAX ignores NULLs automatically and works across data types.",
     runner:{id:'max1', tabs:[
       {label:'Highest Salary', sql:"SELECT MAX(salary) AS highest_salary FROM employees;"},
       {label:'MAX per Department', sql:"SELECT department, MAX(salary) AS highest_salary FROM employees GROUP BY department;"},
       {label:'Full Row of the Max', sql:"SELECT name, salary FROM employees WHERE salary = (SELECT MAX(salary) FROM employees);"}
     ]}}
  ],
  tip:{type:'c-note', title:'MIN/MAX vs ORDER BY + LIMIT', text:"SELECT MAX(salary) returns just the number and is faster for that purpose. SELECT * FROM employees ORDER BY salary DESC LIMIT 1 returns the whole row — use whichever matches what you actually need."}
},

'm4::GROUP BY': {
  intro:"GROUP BY collapses rows into grouped statistics — the foundation of all reporting SQL.",
  body:[{h:'Grouping & Aggregating', p:"Combine GROUP BY with COUNT, AVG, SUM, MAX, MIN for department-level or category-level stats.",
    runner:{id:'gb1', tabs:[
      {label:'Dept Stats', sql:"SELECT department, COUNT(*) AS num_employees, AVG(salary) AS avg_salary FROM employees GROUP BY department;"},
      {label:'HAVING Filter', sql:"SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department HAVING AVG(salary) > 80000;"}
    ]}}],
  tip:{type:'c-note', title:'WHERE vs HAVING', text:"WHERE filters rows BEFORE grouping and cannot use aggregates. HAVING filters groups AFTER grouping and can use aggregates."}
},

'm4::HAVING': {
  intro:"HAVING filters grouped results after aggregation has already happened — it's the WHERE clause for groups, and the only place you can filter directly on an aggregate function.",
  body:[
    {h:"Why WHERE Can't Do This", p:"WHERE runs before GROUP BY in the logical order of execution, so at that point aggregates like AVG(salary) don't exist yet. HAVING runs after grouping, so it can filter on them.",
     runner:{id:'hv1', tabs:[
       {label:'❌ Fails: aggregate in WHERE', sql:"SELECT department, AVG(salary) AS avg_sal FROM employees WHERE AVG(salary) > 80000 GROUP BY department;"},
       {label:'✅ Works: aggregate in HAVING', sql:"SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department HAVING AVG(salary) > 80000;"}
     ]}},
    {h:'Combining WHERE and HAVING', p:"You can use both in the same query — WHERE narrows the rows first, then HAVING filters the resulting groups.",
     runner:{id:'hv2', tabs:[
       {label:'WHERE + GROUP BY + HAVING', sql:"SELECT department, COUNT(*) AS staff_count FROM employees WHERE salary > 60000 GROUP BY department HAVING COUNT(*) >= 2;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Interview One-Liner', text:"WHERE filters individual rows before grouping; HAVING filters entire groups after grouping — and only HAVING can reference an aggregate function like COUNT(), SUM(), or AVG()."}
},

'm4::GROUPING SETS': {
  intro:"GROUPING SETS lets a single query produce multiple levels of grouped subtotals in one result set — instead of running several separate GROUP BY queries and combining them by hand.",
  body:[
    {h:'Not Supported in SQLite', p:"Standard SQL syntax looks like <span class='ic'>GROUP BY GROUPING SETS ((department), (city), ())</span>, producing subtotals by department, by city, and a grand total — all in one pass. SQLite (this in-browser engine) doesn't implement GROUPING SETS. PostgreSQL, SQL Server, Oracle, MySQL 8+, Snowflake and Databricks SQL all support it. The same result can always be built manually with UNION ALL.",
     runner:{id:'gs1', tabs:[
       {label:'SQLite Equivalent (UNION ALL)', sql:"SELECT department AS grp, NULL AS city, COUNT(*) AS n, SUM(salary) AS total FROM employees GROUP BY department\nUNION ALL\nSELECT NULL, city, COUNT(*), SUM(salary) FROM employees GROUP BY city\nUNION ALL\nSELECT NULL, NULL, COUNT(*), SUM(salary) FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL/SQL Server/Snowflake: SELECT department, city, COUNT(*), SUM(salary) FROM employees GROUP BY GROUPING SETS ((department), (city), ());"}
},

'm4::ROLLUP': {
  intro:"ROLLUP produces a hierarchy of subtotals plus a grand total — perfect for reports like 'sales by year, then by year+quarter, then a company-wide total'.",
  body:[
    {h:'Not Supported in SQLite', p:"<span class='ic'>GROUP BY ROLLUP (department, city)</span> would normally generate: subtotals per (department, city) pair, subtotals per department alone, and one grand total — three levels from one clause. SQLite doesn't support ROLLUP; MySQL 8+, PostgreSQL, SQL Server, Oracle and most cloud warehouses do. Here's the same result built manually.",
     runner:{id:'ru1', tabs:[
       {label:'SQLite Equivalent (UNION ALL)', sql:"SELECT department, city, COUNT(*) AS n, SUM(salary) AS total FROM employees GROUP BY department, city\nUNION ALL\nSELECT department, NULL, COUNT(*), SUM(salary) FROM employees GROUP BY department\nUNION ALL\nSELECT NULL, NULL, COUNT(*), SUM(salary) FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On MySQL/PostgreSQL/SQL Server: SELECT department, city, COUNT(*), SUM(salary) FROM employees GROUP BY ROLLUP (department, city);"}
},

'm4::CUBE': {
  intro:"CUBE generates subtotals for EVERY possible combination of the grouping columns — a superset of what ROLLUP produces, useful for full cross-tab style reports.",
  body:[
    {h:'Not Supported in SQLite', p:"<span class='ic'>GROUP BY CUBE (department, city)</span> would normally produce: totals per (department, city), totals per department alone, totals per city alone, AND a grand total — every combination, unlike ROLLUP's strict hierarchy. SQLite doesn't support CUBE; PostgreSQL, SQL Server, Oracle and Snowflake do. Here's the manual equivalent.",
     runner:{id:'cube1', tabs:[
       {label:'SQLite Equivalent (UNION ALL)', sql:"SELECT department, city, COUNT(*) AS n, SUM(salary) AS total FROM employees GROUP BY department, city\nUNION ALL\nSELECT department, NULL, COUNT(*), SUM(salary) FROM employees GROUP BY department\nUNION ALL\nSELECT NULL, city, COUNT(*), SUM(salary) FROM employees GROUP BY city\nUNION ALL\nSELECT NULL, NULL, COUNT(*), SUM(salary) FROM employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'ROLLUP vs CUBE', text:"ROLLUP builds one hierarchical path of subtotals (department → department+city collapses upward). CUBE builds every combination independently — CUBE(a,b) always produces at least as many subtotal rows as ROLLUP(a,b)."}
},

'm5::String Functions': {
  intro:"String functions manipulate text data — combining, trimming, changing case, extracting pieces, and measuring length. They're some of the most frequently used functions in everyday SQL.",
  body:[
    {h:'Changing Case', p:"<span class='ic'>UPPER()</span> converts text to all caps, <span class='ic'>LOWER()</span> converts to all lowercase — useful for case-insensitive comparisons and consistent display formatting.",
     runner:{id:'sf1', tabs:[
       {label:'UPPER / LOWER', sql:"SELECT name, UPPER(name) AS upper_name, LOWER(department) AS lower_dept FROM employees;"}
     ]}},
    {h:'Length and Substrings', p:"<span class='ic'>LENGTH()</span> counts characters. <span class='ic'>SUBSTR(string, start, length)</span> extracts a piece of text — note that SQL string positions start at 1, not 0.",
     runner:{id:'sf2', tabs:[
       {label:'LENGTH', sql:"SELECT name, LENGTH(name) AS name_length FROM employees;"},
       {label:'SUBSTR', sql:"SELECT name, SUBSTR(name, 1, 3) AS first_three_chars FROM employees;"}
     ]}},
    {h:'Trimming and Replacing', p:"<span class='ic'>TRIM()</span> removes leading/trailing whitespace, and <span class='ic'>REPLACE(string, old, new)</span> swaps every occurrence of one substring for another.",
     runner:{id:'sf3', tabs:[
       {label:'TRIM', sql:"SELECT TRIM('   Bangalore   ') AS trimmed_city;"},
       {label:'REPLACE', sql:"SELECT name, REPLACE(department, 'Engineering', 'Tech') AS renamed_dept FROM employees;"}
     ]}},
    {h:'Concatenation', p:"Joining strings together to build a combined value, like a full display label.",
     runner:{id:'sf4', tabs:[
       {label:'Concatenate with ||', sql:"SELECT name || ' works in ' || department AS summary FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Function Names Vary by Database', text:"SUBSTR/SUBSTRING, || vs CONCAT(), and LENGTH/LEN all differ slightly across MySQL, PostgreSQL, SQL Server and Oracle — always check your target database's exact function names."}
},

'm5::Numeric Functions': {
  intro:"Numeric functions perform mathematical operations on numbers — rounding, absolute values, powers, roots, and remainders.",
  body:[
    {h:'Rounding Values', p:"<span class='ic'>ROUND(number, decimals)</span> rounds to a given number of decimal places. <span class='ic'>CEIL()</span> always rounds up, <span class='ic'>FLOOR()</span> always rounds down.",
     runner:{id:'nf1', tabs:[
       {label:'ROUND', sql:"SELECT salary, ROUND(salary / 12.0, 2) AS monthly_salary FROM employees;"},
       {label:'CEIL / FLOOR', sql:"SELECT 87.2 AS val, CEIL(87.2) AS ceiling_val, FLOOR(87.2) AS floor_val;"}
     ]}},
    {h:'Absolute Value, Power, and Modulo', p:"<span class='ic'>ABS()</span> strips a negative sign. <span class='ic'>POWER(base, exp)</span> raises to a power. The <span class='ic'>%</span> operator (or MOD function on some databases) returns the remainder of division.",
     runner:{id:'nf2', tabs:[
       {label:'ABS', sql:"SELECT ABS(-42) AS absolute_value;"},
       {label:'POWER', sql:"SELECT POWER(2, 10) AS two_to_the_ten;"},
       {label:'Modulo', sql:"SELECT id, salary, salary % 2 AS is_odd_remainder FROM employees;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'ROUND for Display, Not Storage', text:"Round values only when displaying them to users — keep the full-precision number in calculations and storage to avoid compounding rounding errors across multiple queries."}
},

'm5::Date Functions': {
  intro:"Date functions extract, format, and calculate differences between dates and times — essential for reporting on trends, ages, durations, and deadlines.",
  body:[
    {h:'Getting the Current Date', p:"SQLite uses <span class='ic'>DATE('now')</span> and <span class='ic'>DATETIME('now')</span>. Other databases use different names: <span class='ic'>CURRENT_DATE</span>, <span class='ic'>GETDATE()</span> (SQL Server), or <span class='ic'>NOW()</span> (MySQL/PostgreSQL).",
     runner:{id:'df1', tabs:[
       {label:"Today's Date", sql:"SELECT DATE('now') AS today;"},
       {label:'Current Timestamp', sql:"SELECT DATETIME('now') AS current_timestamp_value;"}
     ]}},
    {h:'Extracting Date Parts', p:"SQLite's <span class='ic'>strftime()</span> formats or extracts a part of a date, similar to EXTRACT() or DATEPART() in other databases.",
     runner:{id:'df2', tabs:[
       {label:'Extract Year', sql:"SELECT strftime('%Y', 'now') AS current_year;"},
       {label:'Custom Format', sql:"SELECT strftime('%d-%m-%Y', 'now') AS formatted_date;"}
     ]}},
    {h:'Date Arithmetic', p:"Add or subtract time using date modifiers — very useful for deadlines, expirations, and cohort windows.",
     runner:{id:'df3', tabs:[
       {label:'Add Days', sql:"SELECT DATE('now', '+30 days') AS thirty_days_from_now;"},
       {label:'Subtract Months', sql:"SELECT DATE('now', '-3 months') AS three_months_ago;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Every Database Speaks Dates Differently', text:"Date function names and syntax vary more between databases than almost any other SQL feature — always check your specific database's documentation rather than assuming syntax carries over."}
},

'm5::Aggregate Functions': {
  intro:"Aggregate functions take many rows and collapse them into a single summary value — COUNT, SUM, AVG, MIN and MAX are the five you'll use constantly, alongside GROUP_CONCAT for combining text.",
  body:[
    {h:'The Core Five', p:"COUNT, SUM, AVG, MIN and MAX each have their own dedicated topic in the Sorting & Aggregation module with full explanations and examples — this topic focuses on a less common but handy one: combining grouped values into a single string.",
     runner:{id:'agf1', tabs:[
       {label:'GROUP_CONCAT', sql:"SELECT department, GROUP_CONCAT(name, ', ') AS employee_names FROM employees GROUP BY department;"}
     ]}}
  ],
  tip:{type:'c-note', title:'See Also', text:"For deep dives into COUNT, SUM, AVG, MIN and MAX individually — including NULL handling and interview traps — see the Sorting & Aggregation module."}
},

'm5::Conversion Functions': {
  intro:"Conversion functions change a value from one data type to another — turning text into a number, a number into text, or a string into a date.",
  body:[
    {h:'Why Conversion Matters', p:"Data doesn't always arrive in the type you need — a CSV import might load numbers as text, or you might need to display a number as a formatted string. Conversion functions bridge that gap explicitly instead of relying on the database to guess.",
     runner:{id:'cvf1', tabs:[
       {label:'Text to Number', sql:"SELECT CAST('12345' AS INTEGER) AS as_number;"},
       {label:'Number to Text', sql:"SELECT CAST(salary AS TEXT) || ' INR' AS salary_label FROM employees LIMIT 3;"}
     ]}}
  ],
  tip:{type:'c-note', title:'See Also', text:"CAST is the ANSI-standard conversion function and has its own dedicated topic below with more detail; CONVERT is the SQL Server-specific equivalent covered in its own topic."}
},

'm5::CASE WHEN': {
  intro:"CASE WHEN is SQL's if/else logic — it evaluates conditions in order and returns a different value depending on which one matches, right inside a SELECT, WHERE, or ORDER BY clause.",
  body:[
    {h:'Searched CASE', p:"The most flexible form checks a series of conditions from top to bottom and stops at the first match. <span class='ic'>ELSE</span> is the fallback if nothing matches (and is optional — without it, unmatched rows get NULL).",
     runner:{id:'cw1', tabs:[
       {label:'Salary Bands', sql:"SELECT name, salary, CASE WHEN salary >= 90000 THEN 'Senior' WHEN salary >= 75000 THEN 'Mid' ELSE 'Junior' END AS pay_band FROM employees;"}
     ]}},
    {h:'Simple CASE', p:"When you're just comparing one column against several exact values, the simple form is more compact.",
     runner:{id:'cw2', tabs:[
       {label:'Simple CASE', sql:"SELECT name, department, CASE department WHEN 'Engineering' THEN 'Tech' WHEN 'HR' THEN 'People' ELSE 'Other' END AS category FROM employees;"}
     ]}},
    {h:'CASE Inside Aggregates', p:"A very common pattern: use CASE inside SUM or COUNT to build conditional totals — effectively a pivot without needing PIVOT syntax.",
     runner:{id:'cw3', tabs:[
       {label:'Conditional COUNT', sql:"SELECT department, COUNT(CASE WHEN salary > 80000 THEN 1 END) AS high_earners FROM employees GROUP BY department;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Interview Favorite', text:"CASE WHEN inside SUM()/COUNT() to build a pivot-style report (e.g. counting orders per status as separate columns) is one of the most frequently asked SQL interview patterns."}
},

'm5::CAST': {
  intro:"CAST is the ANSI SQL standard way to explicitly convert a value from one data type to another — supported identically across virtually every database.",
  body:[
    {h:'CAST Syntax', p:"<span class='ic'>CAST(expression AS target_type)</span>. Common targets include INTEGER, TEXT, REAL (or DECIMAL/FLOAT), and DATE.",
     runner:{id:'cast1', tabs:[
       {label:'Text to Integer', sql:"SELECT CAST('42' AS INTEGER) + 8 AS result;"},
       {label:'Integer to Text', sql:"SELECT CAST(salary AS TEXT) AS salary_text, typeof(CAST(salary AS TEXT)) AS resulting_type FROM employees LIMIT 1;"},
       {label:'To Decimal', sql:"SELECT CAST(salary AS REAL) / 12 AS monthly_estimate FROM employees LIMIT 3;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Invalid Conversions', text:"Casting text that isn't numeric (like CAST('abc' AS INTEGER)) doesn't always throw an error — SQLite quietly returns 0, while PostgreSQL and SQL Server raise an error. Always validate data before casting in production code."}
},

'm5::CONVERT': {
  intro:"CONVERT is SQL Server's (and MySQL's) function for changing data types — functionally similar to CAST, but with extra formatting options, particularly for dates.",
  body:[
    {h:'Not Available in SQLite', p:"SQL Server syntax is <span class='ic'>CONVERT(target_type, expression, style)</span> — the optional numeric style code controls date formatting (e.g. style 103 gives DD/MM/YYYY). SQLite doesn't implement CONVERT at all; use CAST instead, shown below with the same underlying goal.",
     runner:{id:'conv1', tabs:[
       {label:'SQLite Equivalent (CAST)', sql:"SELECT CAST(salary AS TEXT) AS salary_as_text FROM employees LIMIT 3;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On SQL Server: SELECT CONVERT(VARCHAR, GETDATE(), 103) AS uk_date_format; — CAST is portable across databases, CONVERT is not, so prefer CAST unless you specifically need CONVERT's formatting styles."}
},

'm5::COALESCE': {
  intro:"COALESCE returns the first non-NULL value from a list of arguments — the cleanest, most portable way to supply a default value when data might be missing.",
  body:[
    {h:'Supplying Defaults', p:"COALESCE checks each argument left to right and returns as soon as it finds one that isn't NULL. If every argument is NULL, it returns NULL.",
     runner:{id:'coa1', tabs:[
       {label:'Default for Missing Manager', sql:"SELECT name, manager_id, COALESCE(manager_id, 0) AS manager_id_safe FROM employees;"},
       {label:'Multiple Fallbacks', sql:"SELECT name, COALESCE(manager_id, dept_id, -1) AS first_available_id FROM employees;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Why Not Just Use IFNULL?', text:"IFNULL/ISNULL only accept two arguments and aren't standard across every database. COALESCE accepts any number of arguments and is ANSI SQL standard — it works identically on PostgreSQL, SQL Server, Oracle, MySQL, and SQLite."}
},

'm5::NULLIF': {
  intro:"NULLIF compares two expressions and returns NULL if they're equal, or the first expression if they're different — the logical opposite of COALESCE, used to turn a specific value INTO a NULL.",
  body:[
    {h:'Turning a Sentinel Value into NULL', p:"A common use case: some systems store missing data as 0 or an empty string instead of a real NULL. NULLIF converts that placeholder back into a true NULL so aggregate functions handle it correctly.",
     runner:{id:'nlf1', tabs:[
       {label:'Basic NULLIF', sql:"SELECT NULLIF(5, 5) AS equal_case, NULLIF(5, 8) AS different_case;"},
       {label:'Avoiding Division by Zero', sql:"SELECT salary, dept_id, salary / NULLIF(dept_id, 0) AS ratio FROM employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Classic Use Case', text:"NULLIF(denominator, 0) inside a division is the standard SQL trick to avoid a 'division by zero' error — it converts the zero to NULL first, and dividing by NULL just yields NULL instead of crashing the query."}
},

'm6::INNER JOIN': {
  intro:"INNER JOIN returns only rows that have matching values in both tables — the most common join type.",
  body:[{h:'Matching Rows Only', p:"Rows without a match in either table are excluded from the result.",
    runner:{id:'ij1', tabs:[
      {label:'INNER JOIN', sql:"SELECT e.name, e.salary, d.dept_name FROM employees e INNER JOIN departments d ON e.dept_id = d.id;"}
    ]}}],
  tip:{type:'c-tip', title:'Tip', text:"INNER JOIN is the default JOIN — writing just 'JOIN' means INNER JOIN in every major database."}
},
'm6::LEFT JOIN': {
  intro:"LEFT JOIN returns ALL rows from the left table, plus matching rows from the right table (NULL if no match).",
  body:[{h:'Keep Everything on the Left', p:"Useful for finding unmatched records too — the 'anti-join' pattern.",
    runner:{id:'lj1', tabs:[
      {label:'LEFT JOIN', sql:"SELECT e.name, d.dept_name FROM employees e LEFT JOIN departments d ON e.dept_id = d.id;"},
      {label:'Anti-Join (unmatched)', sql:"SELECT e.name FROM employees e LEFT JOIN departments d ON e.dept_id = d.id WHERE d.id IS NULL;"}
    ]}}],
  tip:{type:'c-note', title:'Interview Pattern', text:"LEFT JOIN + WHERE right.id IS NULL is the classic way to find 'customers with no orders' style questions."}
},

'm6::RIGHT JOIN': {
  intro:"RIGHT JOIN returns ALL rows from the right table, plus matching rows from the left table — the mirror image of LEFT JOIN.",
  body:[
    {h:'Keep Everything on the Right', p:"Here, every department appears at least once, even the Finance department which has no employees — its employee columns simply show NULL.",
     runner:{id:'rj1', tabs:[
       {label:'RIGHT JOIN', sql:"SELECT e.name, d.dept_name FROM employees e RIGHT JOIN departments d ON e.dept_id = d.id;"},
       {label:'Anti-Join (unmatched)', sql:"SELECT d.dept_name FROM employees e RIGHT JOIN departments d ON e.dept_id = d.id WHERE e.id IS NULL;"}
     ]}}
  ],
  tip:{type:'c-note', title:'RIGHT JOIN is Just LEFT JOIN, Flipped', text:"A RIGHT JOIN between A and B always produces the exact same result as a LEFT JOIN between B and A — most developers just swap the table order and use LEFT JOIN everywhere for consistency, since some older databases (like older SQLite versions) didn't support RIGHT JOIN at all."}
},

'm6::FULL OUTER JOIN': {
  intro:"FULL OUTER JOIN returns every row from both tables — matched rows combined, and unmatched rows from either side padded with NULL for the missing side's columns.",
  body:[
    {h:'Keep Everything from Both Sides', p:"This returns every employee (even ones with no department) AND every department (even Finance, which has no employees) — nothing from either table is dropped.",
     runner:{id:'foj1', tabs:[
       {label:'FULL OUTER JOIN', sql:"SELECT e.name, d.dept_name FROM employees e FULL OUTER JOIN departments d ON e.dept_id = d.id;"},
       {label:'Unmatched on Either Side', sql:"SELECT e.name, d.dept_name FROM employees e FULL OUTER JOIN departments d ON e.dept_id = d.id WHERE e.id IS NULL OR d.id IS NULL;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Not Always Supported', text:"MySQL has no native FULL OUTER JOIN — it's typically emulated with a LEFT JOIN UNION a RIGHT JOIN. PostgreSQL, SQL Server, Oracle, and modern SQLite (3.39+) all support it directly."}
},

'm6::CROSS JOIN': {
  intro:"CROSS JOIN produces the Cartesian product of two tables — every row from the first table paired with every row from the second, with no matching condition at all.",
  body:[
    {h:'Every Combination', p:"With 6 employees and 4 departments, a CROSS JOIN produces 6 × 4 = 24 rows — every possible pairing, whether it makes real-world sense or not.",
     runner:{id:'cj1', tabs:[
       {label:'CROSS JOIN', sql:"SELECT e.name, d.dept_name FROM employees e CROSS JOIN departments d;"},
       {label:'Row Count Check', sql:"SELECT COUNT(*) AS total_combinations FROM employees CROSS JOIN departments;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Use With Caution', text:"CROSS JOIN grows multiplicatively — joining two 10,000-row tables produces 100 million rows. It's mostly useful for generating combinations deliberately (e.g. every product × every size), not for everyday querying."}
},

'm6::SELF JOIN': {
  intro:"A SELF JOIN joins a table to itself — useful whenever rows in a table relate to other rows in that same table, like an employee and their manager both being 'employees'.",
  body:[
    {h:'Employees and Their Managers', p:"The employees table has a manager_id column that points to another row's id in the same table. A SELF JOIN with two aliases (e for employee, m for manager) links them together.",
     runner:{id:'selfj1', tabs:[
       {label:'Employee + Manager Name', sql:"SELECT e.name AS employee, m.name AS manager FROM employees e LEFT JOIN employees m ON e.manager_id = m.id;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Aliases Are Required', text:"Since both sides of a self join reference the same physical table, you must give each side a different alias (like e and m above) — otherwise the database can't tell which 'employees' you mean in each part of the query."}
},

'm6::NATURAL JOIN': {
  intro:"NATURAL JOIN automatically joins two tables on every column that shares the same name in both — no explicit ON clause needed.",
  body:[
    {h:'Automatic Column Matching', p:"If both tables have a column with an identical name, NATURAL JOIN uses it automatically. In our schema, employees.dept_id and departments.id have different names, so this example renames departments.id to dept_id inside a subquery first — then NATURAL JOIN matches on that shared name with no ON clause at all.",
     runner:{id:'natj1', tabs:[
       {label:'NATURAL JOIN Demo', sql:"SELECT e.name, dd.dept_name FROM employees e NATURAL JOIN (SELECT id AS dept_id, dept_name FROM departments) dd;"},
       {label:'Simpler Equivalent (explicit ON)', sql:"SELECT e.name, d.dept_name FROM employees e JOIN departments d ON e.dept_id = d.id;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Generally Avoided in Production', text:"NATURAL JOIN is risky: if a new column with a matching name is added to either table later, the join silently changes behavior. Almost all real-world SQL style guides recommend explicit ON conditions instead."}
},

'm6::Multiple Table JOIN': {
  intro:"Real queries often need data spread across three, four, or more tables — you can chain as many JOINs together as needed in a single query.",
  body:[
    {h:'Chaining JOINs', p:"Each additional JOIN clause adds one more table to the query. The database processes them left to right (logically), building up the combined row set step by step.",
     runner:{id:'mtj1', tabs:[
       {label:'Two-Table JOIN', sql:"SELECT e.name, d.dept_name, d.location FROM employees e JOIN departments d ON e.dept_id = d.id;"},
       {label:'Adding a Third Reference (Self Join)', sql:"SELECT e.name AS employee, d.dept_name, m.name AS manager FROM employees e JOIN departments d ON e.dept_id = d.id LEFT JOIN employees m ON e.manager_id = m.id;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Keep Aliases Consistent', text:"With 3+ tables in a query, short consistent aliases (e, d, m) become essential for readability — always alias every table once you go past a single JOIN."}
},

'm6::JOIN Performance': {
  intro:"Not every JOIN costs the same — how the database matches rows between tables can make the difference between a query that runs in milliseconds and one that takes minutes.",
  body:[
    {h:'Indexes on Join Columns', p:"The single biggest performance factor is whether the columns used in the ON clause are indexed. Without an index, the database must scan the entire second table for every row in the first.",
     runner:{id:'jp1', tabs:[
       {label:'Check the Plan', sql:"EXPLAIN QUERY PLAN SELECT e.name, d.dept_name FROM employees e JOIN departments d ON e.dept_id = d.id;"}
     ]}},
    {h:'Practical Guidelines', p:"<ul><li>Always index foreign key columns used in JOIN conditions</li><li>Filter with WHERE as early as possible so less data flows into the JOIN</li><li>Join on matching data types — implicit type conversion during a JOIN can silently disable index usage</li><li>Avoid joining more tables than necessary; unused JOINs still cost the optimizer work</li><li>Prefer INNER JOIN over OUTER JOIN when you don't actually need unmatched rows — it gives the optimizer more freedom</li></ul>"}
  ],
  tip:{type:'c-warn', title:'The Silent Killer: Type Mismatches', text:"Joining an INTEGER column to a TEXT column (even if the values 'look' the same) often forces the database to convert every value before comparing, which can prevent index usage entirely and turn a fast join into a full scan."}
},

'm7::UNION': {
  intro:"UNION stacks the results of two or more SELECT statements into a single result set, automatically removing any duplicate rows that appear in both — like merging two lists and keeping only the unique entries.",
  body:[
    {h:'The Rules', p:"Every SELECT combined with UNION must return the <strong>same number of columns</strong>, in a <strong>compatible order and data type</strong>. The final column names in the result come from the very first SELECT statement — later SELECTs can name their columns anything, it doesn't matter."},
    {h:'Combining Two Column Sets', p:"There's no single table with a 'location' column here, so this example builds one by combining the cities employees live in with the cities departments are based in — UNION removes any city that appears in both lists.",
     runner:{id:'un1', tabs:[
       {label:'UNION (deduped)', sql:"SELECT city AS location FROM employees\nUNION\nSELECT location FROM departments;"},
       {label:'Row Count', sql:"SELECT COUNT(*) AS unique_locations FROM (SELECT city AS location FROM employees UNION SELECT location FROM departments);"}
     ]}}
  ],
  tip:{type:'c-warn', title:'UNION Always Sorts Out Duplicates', text:"Because UNION has to compare every row against every other row to remove duplicates, it does real extra work behind the scenes — if you already know there are no duplicates (or don't care), UNION ALL is faster."}
},

'm7::UNION ALL': {
  intro:"UNION ALL combines the result sets of two or more SELECT statements WITHOUT removing duplicates — every row from every query is kept, making it faster than UNION since there's no deduplication step.",
  body:[
    {h:'Keeping Every Row', p:"Run the same city-combining query from the UNION topic, but with ALL added — notice how any city shared by both employees and departments (like Mumbai or Delhi) now shows up more than once.",
     runner:{id:'una1', tabs:[
       {label:'UNION ALL (keeps dupes)', sql:"SELECT city AS location FROM employees\nUNION ALL\nSELECT location FROM departments;"},
       {label:'Compare the Counts', sql:"SELECT (SELECT COUNT(*) FROM (SELECT city FROM employees UNION ALL SELECT location FROM departments)) AS union_all_count, (SELECT COUNT(*) FROM (SELECT city FROM employees UNION SELECT location FROM departments)) AS union_count;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Default to UNION ALL', text:"If you know your two result sets can't overlap, or duplicates are actually meaningful (like combining sales from two regions), always reach for UNION ALL first — it skips the expensive sort/dedupe step that plain UNION requires."}
},

'm7::INTERSECT': {
  intro:"INTERSECT returns only the rows that appear in BOTH result sets — the set-theory equivalent of finding common ground between two queries.",
  body:[
    {h:'Finding What Overlaps', p:"This finds every city that is both a city where an employee lives AND a city where a department is located — the intersection of the two lists.",
     runner:{id:'int1', tabs:[
       {label:'INTERSECT', sql:"SELECT city FROM employees\nINTERSECT\nSELECT location FROM departments;"}
     ]}},
    {h:'Same Column Rules Apply', p:"Just like UNION, both SELECT statements must return the same number of columns with compatible types — INTERSECT then keeps only rows found in every one of the combined queries.",
     runner:{id:'int2', tabs:[
       {label:'Confirm With a JOIN-based Check', sql:"SELECT DISTINCT e.city FROM employees e JOIN departments d ON e.city = d.location;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Support Varies Slightly', text:"INTERSECT is supported by SQLite, PostgreSQL, SQL Server and Oracle. MySQL only added native INTERSECT support in version 8.0.31 — earlier MySQL versions need an INNER JOIN or WHERE ... IN workaround instead."}
},

'm7::EXCEPT': {
  intro:"EXCEPT returns rows from the FIRST query that do NOT appear in the second query — also known as a 'set difference'. It answers questions shaped like 'what's in A but not in B'.",
  body:[
    {h:'Subtracting One Set from Another', p:"This finds employee cities that have no matching department location at all — cities where staff live, but the company has no office presence.",
     runner:{id:'exc1', tabs:[
       {label:'EXCEPT', sql:"SELECT city FROM employees\nEXCEPT\nSELECT location FROM departments;"}
     ]}},
    {h:'Order Matters', p:"EXCEPT is not symmetric — flipping the two queries around gives a completely different answer, since it always keeps rows from the LEFT query only.",
     runner:{id:'exc2', tabs:[
       {label:'Flipped: Depts With No Staff City Match', sql:"SELECT location FROM departments\nEXCEPT\nSELECT city FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Not in MySQL (Pre-8.0.31)', text:"EXCEPT is supported by SQLite, PostgreSQL, SQL Server and Oracle (as MINUS — see next topic). Older MySQL versions have neither EXCEPT nor MINUS and need a LEFT JOIN ... WHERE right.id IS NULL pattern instead."}
},

'm7::MINUS': {
  intro:"MINUS is Oracle's name for exactly the same set-difference operation as EXCEPT — rows in the first query that don't appear in the second. If you already know EXCEPT, you already know MINUS.",
  body:[
    {h:'Not Supported in SQLite', p:"Oracle syntax is identical in shape to EXCEPT, just with a different keyword: <span class='ic'>SELECT city FROM employees MINUS SELECT location FROM departments;</span>. SQLite (this in-browser engine) doesn't implement the MINUS keyword at all — it only supports the ANSI-standard EXCEPT, which does exactly the same job.",
     runner:{id:'min1', tabs:[
       {label:'SQLite Equivalent (EXCEPT)', sql:"SELECT city FROM employees\nEXCEPT\nSELECT location FROM departments;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'EXCEPT vs MINUS — Just a Naming Difference', text:"Oracle uses MINUS; PostgreSQL, SQL Server, SQLite and standard ANSI SQL use EXCEPT. They compute the identical result — pick whichever keyword your specific database understands."}
},

'm8::Scalar Subquery': {
  intro:"A scalar subquery is a subquery that returns exactly one column and one row — a single value — which means it can be used almost anywhere a normal literal value could go: in SELECT, WHERE, or even inside an expression.",
  body:[
    {h:'Using a Single Value Inline', p:"Because a scalar subquery collapses down to one number (or one piece of text), the database treats it just like a constant once it's evaluated.",
     runner:{id:'sc1', tabs:[
       {label:'Scalar in WHERE', sql:"SELECT name, salary FROM employees WHERE salary = (SELECT MAX(salary) FROM employees);"},
       {label:'Scalar in SELECT', sql:"SELECT name, salary, (SELECT AVG(salary) FROM employees) AS company_avg FROM employees;"}
     ]}},
    {h:'Comparing Each Row to a Single Benchmark', p:"A very common pattern: compute one company-wide number once, then compare every row against it — here, showing how far above or below average each employee's salary is.",
     runner:{id:'sc2', tabs:[
       {label:'Difference from Average', sql:"SELECT name, salary, salary - (SELECT AVG(salary) FROM employees) AS diff_from_avg FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Must Return Exactly One Value', text:"If a scalar subquery accidentally returns more than one row, most databases throw a runtime error ('subquery returned more than 1 row') — always make sure the subquery is aggregated or filtered down to a single result."}
},

'm8::Nested Subquery': {
  intro:"A nested subquery is simply a query placed inside another query's WHERE, FROM, or SELECT clause — one query nested one or more levels deep inside a parent (outer) query.",
  body:[
    {h:'Subquery in WHERE', p:"The inner query runs first and completely independently of the outer query — it doesn't reference anything from the outer row, so it only needs to execute once, not once per row.",
     runner:{id:'nes1', tabs:[
       {label:'IN with Subquery', sql:"SELECT name, dept_id FROM employees WHERE dept_id IN (SELECT id FROM departments WHERE location = 'Mumbai');"}
     ]}},
    {h:'Subquery in FROM (a Derived Table)', p:"A subquery used in FROM acts like a temporary, on-the-fly table — often called a derived table — that the outer query can then filter, join, or aggregate further.",
     runner:{id:'nes2', tabs:[
       {label:'Derived Table', sql:"SELECT department, avg_sal FROM (SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department) dept_stats WHERE avg_sal > 80000;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Nested vs Correlated', text:"A nested subquery (this topic) runs independently of the outer query and only once. A correlated subquery (next topic) references the outer query's current row and re-runs for every single row — an important distinction for both correctness and performance."}
},

'm8::Correlated Subquery': {
  intro:"A correlated subquery references a column from the OUTER query inside its own WHERE clause — which means the database must re-run it once for every row the outer query considers, rather than just once.",
  body:[
