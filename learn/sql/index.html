    {h:'Simulating the Logic Manually', p:"What a stored procedure would wrap into a single reusable call, SQLite requires as a plain sequence of statements each time — this mirrors what a 'give_raise' procedure might do internally.",
     runner:{id:'sp1', tabs:[
       {label:'Manual Equivalent', sql:"CREATE TEMP TABLE demo_staff (id INTEGER, name TEXT, salary INTEGER);\nINSERT INTO demo_staff VALUES (1, 'Zara', 70000);\n\n-- What CALL give_raise(1, 0.10) would do internally:\nUPDATE demo_staff SET salary = salary * 1.10 WHERE id = 1;\n\nSELECT * FROM demo_staff;\nDROP TABLE demo_staff;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On SQL Server: CREATE PROCEDURE give_raise @emp_id INT, @pct DECIMAL AS BEGIN UPDATE employees SET salary = salary * (1 + @pct) WHERE id = @emp_id; END; — then simply EXEC give_raise 1, 0.10; to run it."}
},

'm17::User Defined Functions': {
  intro:"A User Defined Function (UDF) lets you package a custom calculation into a reusable, named function — called inside a query just like a built-in function such as UPPER() or ROUND().",
  body:[
    {h:'No CREATE FUNCTION in Plain SQL', p:"SQLite doesn't support defining new functions purely through SQL statements — custom functions can only be registered programmatically through its C, Python, or JavaScript API (the host application registers a function before running any SQL), not via a CREATE FUNCTION statement you can type into this runner."},
    {h:"SQLite's Rich Built-in Function Library", p:"While custom UDFs aren't creatable via plain SQL here, SQLite ships with a large set of built-in scalar and aggregate functions already covered throughout this course — UPPER, ROUND, COALESCE, strftime, and many more.",
     runner:{id:'udf1', tabs:[
       {label:'Using a Built-in Function', sql:"SELECT name, UPPER(name) AS shout_name, ROUND(salary / 12.0, 2) AS monthly FROM employees LIMIT 3;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL: CREATE FUNCTION annual_bonus(salary NUMERIC) RETURNS NUMERIC AS $$ SELECT salary * 0.10 $$ LANGUAGE SQL; — then SELECT annual_bonus(salary) FROM employees; uses it exactly like a built-in function."}
},

'm17::Triggers': {
  intro:"A trigger is a piece of logic that fires automatically whenever a specific event — INSERT, UPDATE, or DELETE — happens on a table, without the application needing to explicitly call it. Unlike most other objects in this module, SQLite fully supports triggers.",
  body:[
    {h:'An AFTER UPDATE Trigger', p:"Every time a row's salary is updated in the demo table, this trigger automatically writes an entry into a separate audit log — no application code needs to remember to do this manually.",
     runner:{id:'trg1', tabs:[
       {label:'Auto-Logging Trigger', sql:"CREATE TEMP TABLE demo_staff (id INTEGER, name TEXT, salary INTEGER);\nCREATE TEMP TABLE salary_audit (staff_id INTEGER, old_salary INTEGER, new_salary INTEGER);\nINSERT INTO demo_staff VALUES (1, 'Zara', 70000);\n\nCREATE TRIGGER log_salary_change AFTER UPDATE ON demo_staff\nBEGIN\n  INSERT INTO salary_audit VALUES (OLD.id, OLD.salary, NEW.salary);\nEND;\n\nUPDATE demo_staff SET salary = 76000 WHERE id = 1;\n\nSELECT * FROM salary_audit;\nDROP TRIGGER log_salary_change;\nDROP TABLE demo_staff;\nDROP TABLE salary_audit;"}
     ]}},
    {h:'BEFORE vs AFTER Triggers', p:"A BEFORE trigger runs prior to the triggering statement actually taking effect (useful for validation), while an AFTER trigger runs once the change has already happened (useful for logging, as shown above, or cascading updates)."}
  ],
  tip:{type:'c-tip', title:'OLD and NEW Row References', text:"Inside a trigger, OLD refers to the row's values before the change and NEW refers to its values after — OLD is unavailable in an INSERT trigger (nothing existed before), and NEW is unavailable in a DELETE trigger (nothing exists after)."}
},

'm17::Sequences': {
  intro:"A sequence is a standalone object that generates a series of unique numbers on demand — unlike an auto-incrementing primary key, a sequence isn't tied to any single table, and several tables can share the same sequence.",
  body:[
    {h:'Not Supported in SQLite', p:"PostgreSQL, Oracle, and SQL Server (2012+) all support <span class='ic'>CREATE SEQUENCE</span> as an independent object. SQLite has no such statement — the closest built-in mechanism is an AUTOINCREMENT column tied to one specific table, covered in the Constraints module."},
    {h:'Simulating a Standalone Sequence', p:"A simple counter table with RETURNING (SQLite 3.35+) can approximate a real sequence's 'give me the next number' behavior, independent of any specific data table.",
     runner:{id:'seq1', tabs:[
       {label:'Manual Sequence Counter', sql:"CREATE TEMP TABLE order_seq (next_val INTEGER);\nINSERT INTO order_seq VALUES (1000);\n\nUPDATE order_seq SET next_val = next_val + 1 RETURNING next_val - 1 AS issued_number;\n\nDROP TABLE order_seq;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL: CREATE SEQUENCE order_number_seq START WITH 1000 INCREMENT BY 1; then SELECT nextval('order_number_seq'); each time a fresh number is needed — usable across multiple tables that all need unique numbering from the same source."}
},

'm17::Synonyms': {
  intro:"A synonym is an alternate name for an existing database object — a table, view, or procedure — letting you reference it under a shorter, clearer, or schema/server-independent name.",
  body:[
    {h:'Not Supported in SQLite', p:"Oracle and SQL Server both support <span class='ic'>CREATE SYNONYM</span> as a dedicated statement, often used to shield application code from schema or server changes behind the scenes. SQLite has no CREATE SYNONYM syntax at all — the closest equivalent is a simple pass-through VIEW that just mirrors the original table."},
    {h:'A View as a Synonym Substitute', p:"This view acts exactly like a synonym would — a second name that transparently points back to the original table.",
     runner:{id:'syn1', tabs:[
       {label:'View as a Synonym', sql:"CREATE TEMP VIEW staff AS SELECT * FROM employees;\nSELECT name, department FROM staff LIMIT 3;\nDROP VIEW staff;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On Oracle/SQL Server: CREATE SYNONYM staff FOR hr_schema.employees; — afterward, SELECT * FROM staff; works identically to querying hr_schema.employees directly, without callers needing to know the real schema name."}
},

'm17::Cursors': {
  intro:"A cursor lets procedural code step through a query's result set one row at a time — fetching a row, doing some logic with it, then moving to the next — instead of processing the whole result set as a single unit the way ordinary SQL does.",
  body:[
    {h:'Not a SQL-Level Concept in SQLite', p:"SQLite has no CURSOR DECLARE/FETCH statements you can write in plain SQL — that's a feature of procedural extensions like PL/pgSQL (PostgreSQL), T-SQL (SQL Server), or PL/SQL (Oracle), used inside stored procedures. In SQLite, 'stepping through rows one at a time' happens naturally in whatever host language (Python, JavaScript, C) is calling the database API — each call to step() or fetchone() plays the same role a cursor's FETCH would."},
    {h:'Why SQL Usually Avoids This', p:"Ordinary SQL is set-based by design — a single UPDATE or SELECT already operates across every matching row at once, which is typically far faster than looping row-by-row. Cursors are reached for only when per-row procedural logic genuinely can't be expressed as a single set-based statement."}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On SQL Server: DECLARE emp_cursor CURSOR FOR SELECT id, salary FROM employees; OPEN emp_cursor; FETCH NEXT FROM emp_cursor INTO @id, @salary; ... WHILE @@FETCH_STATUS = 0 BEGIN ... FETCH NEXT FROM emp_cursor INTO @id, @salary; END; CLOSE emp_cursor; DEALLOCATE emp_cursor;"}
},

'm18::Pivot': {
  intro:"PIVOT rotates row values into columns — turning long, narrow data into a wide, cross-tab style summary that's often much easier for humans to scan, like a spreadsheet-style report.",
  body:[
    {h:'Not a Keyword in SQLite', p:"SQL Server and Oracle both offer a dedicated PIVOT operator. SQLite has no PIVOT keyword at all — but the exact same result is achievable everywhere using CASE WHEN inside aggregate functions, one column per pivoted value.",
     runner:{id:'piv1', tabs:[
       {label:'Simulated PIVOT with CASE', sql:"SELECT department,\n  SUM(CASE WHEN city = 'Bangalore' THEN salary ELSE 0 END) AS bangalore_total,\n  SUM(CASE WHEN city = 'Delhi' THEN salary ELSE 0 END) AS delhi_total,\n  SUM(CASE WHEN city = 'Mumbai' THEN salary ELSE 0 END) AS mumbai_total\nFROM employees\nGROUP BY department;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On SQL Server: SELECT department, [Bangalore], [Delhi], [Mumbai] FROM (SELECT department, city, salary FROM employees) src PIVOT (SUM(salary) FOR city IN ([Bangalore], [Delhi], [Mumbai])) AS pvt; — the CASE WHEN version above works identically everywhere, including databases with no PIVOT keyword."}
},

'm18::Unpivot': {
  intro:"UNPIVOT does the opposite of PIVOT — it takes wide data spread across several columns and stacks it back into long, narrow rows, one row per original column value.",
  body:[
    {h:'Not a Keyword in SQLite', p:"SQL Server and Oracle both offer a dedicated UNPIVOT operator. SQLite has no UNPIVOT keyword either — the standard workaround everywhere is to stack the columns back into rows using UNION ALL.",
     runner:{id:'unp1', tabs:[
       {label:'Simulated UNPIVOT with UNION ALL', sql:"CREATE TEMP TABLE quarterly_sales (department TEXT, q1 INTEGER, q2 INTEGER, q3 INTEGER, q4 INTEGER);\nINSERT INTO quarterly_sales VALUES ('Engineering', 120000, 135000, 128000, 142000), ('Marketing', 60000, 58000, 65000, 70000);\n\nSELECT department, 'Q1' AS quarter, q1 AS amount FROM quarterly_sales\nUNION ALL SELECT department, 'Q2', q2 FROM quarterly_sales\nUNION ALL SELECT department, 'Q3', q3 FROM quarterly_sales\nUNION ALL SELECT department, 'Q4', q4 FROM quarterly_sales\nORDER BY department, quarter;\n\nDROP TABLE quarterly_sales;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On SQL Server: SELECT department, quarter, amount FROM quarterly_sales UNPIVOT (amount FOR quarter IN (q1, q2, q3, q4)) AS unpvt; — the UNION ALL version above produces the identical long-format result on any database."}
},

'm18::Dynamic SQL': {
  intro:"Dynamic SQL means building a SQL statement as a text string at runtime — with table names, column names, or conditions decided programmatically — and then executing that string, rather than running a statement that was hard-coded in advance.",
  body:[
    {h:'A Runtime Technique, Not a Static Statement', p:"Because dynamic SQL is about constructing and running a string, it isn't something you write as one fixed SQL statement — it's typically built inside application code, or inside a procedural block using EXECUTE IMMEDIATE (Oracle/PostgreSQL) or sp_executesql / EXEC (SQL Server)."},
    {h:'Why It Exists', p:"A common use case: building a report where the table or column to query isn't known until the user picks it from a dropdown — dynamic SQL lets that choice get safely substituted into a query template at runtime."}
  ],
  tip:{type:'c-warn', title:'The SQL Injection Risk', text:"Dynamic SQL built by directly concatenating raw user input into a query string is the classic root cause of SQL injection vulnerabilities (covered in the SQL Security module). Always use parameterized queries or your database's proper escaping functions instead of naive string concatenation."}
},

'm18::Temporary Tables': {
  intro:"A temporary table behaves exactly like a normal table, except it automatically disappears once its session or connection ends — perfect for scratch work and multi-step calculations that don't need to outlive the current task. You've actually been using these throughout this entire course already.",
  body:[
    {h:'Creating and Using One', p:"Every 'safe' example in the DML, DDL, and Constraints modules used exactly this pattern — a temp table that's created, used, and dropped, all without ever touching real persistent data.",
     runner:{id:'tt1', tabs:[
       {label:'Basic Temp Table', sql:"CREATE TEMP TABLE scratch_calc (id INTEGER, result INTEGER);\nINSERT INTO scratch_calc VALUES (1, 42), (2, 99);\nSELECT * FROM scratch_calc;\nDROP TABLE scratch_calc;"}
     ]}},
    {h:'Local vs Global Temp Tables', p:"SQL Server distinguishes between a local temp table (<span class='ic'>#table_name</span>, visible only to the current session) and a global temp table (<span class='ic'>##table_name</span>, visible to all sessions until every session referencing it disconnects). SQLite's TEMP tables behave like local temp tables — scoped to the current connection only."}
  ],
  tip:{type:'c-tip', title:'Why This Course Uses Them Everywhere', text:"Wrapping every DDL/DML demo in CREATE TEMP TABLE ... DROP TABLE is exactly why running the same lesson twice never causes an error — the scratch table is always fresh and always cleaned up, with zero risk to the real employees data used elsewhere in this course."}
},

'm18::Recursive Queries': {
  intro:"A recursive query walks through hierarchical or graph-shaped data — like an org chart or a category tree — by repeatedly referencing its own previous results. The Recursive CTE topic in the CTE module covers the modern, portable way to do this; this topic looks at the different mechanisms databases use.",
  body:[
    {h:'WITH RECURSIVE — The Standard Approach', p:"SQLite, PostgreSQL, SQL Server and MySQL 8+ all support the ANSI-standard recursive CTE syntax covered earlier in this course.",
     runner:{id:'rq1', tabs:[
       {label:'Recursive CTE Recap', sql:"WITH RECURSIVE org_chart AS (\n  SELECT id, name, manager_id, 0 AS depth FROM employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.id, e.name, e.manager_id, oc.depth + 1 FROM employees e JOIN org_chart oc ON e.manager_id = oc.id\n)\nSELECT * FROM org_chart ORDER BY depth;"}
     ]}},
    {h:"Oracle's Alternative: CONNECT BY", p:"Oracle offers a completely different, older mechanism for the exact same kind of hierarchical query — no WITH RECURSIVE needed, just a special CONNECT BY clause built specifically for tree traversal."}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On Oracle: SELECT id, name, LEVEL AS depth FROM employees START WITH manager_id IS NULL CONNECT BY PRIOR id = manager_id; — CONNECT BY is Oracle-specific and predates the ANSI recursive CTE standard, but accomplishes the same hierarchical traversal."}
},

'm18::JSON Functions': {
  intro:"Modern SQL databases can store and query JSON data directly inside a text or dedicated JSON column — SQLite ships with a full set of built-in json_ functions for extracting, building, and iterating over JSON values.",
  body:[
    {h:'Extracting a Value with json_extract', p:"<span class='ic'>json_extract(json, path)</span> pulls a specific value out of a JSON string using a $ path expression, similar to how you'd navigate a JavaScript object.",
     runner:{id:'json1', tabs:[
       {label:'Extract a Field', sql:"SELECT json_extract('{\"name\":\"Zara\",\"age\":30,\"city\":\"Mumbai\"}', '$.name') AS extracted_name;"},
       {label:'Extract From a Table Column', sql:"CREATE TEMP TABLE demo_profiles (id INTEGER, data TEXT);\nINSERT INTO demo_profiles VALUES (1, '{\"city\":\"Mumbai\",\"role\":\"Engineer\"}');\nSELECT id, json_extract(data, '$.city') AS city, json_extract(data, '$.role') AS role FROM demo_profiles;\nDROP TABLE demo_profiles;"}
     ]}},
    {h:'Iterating a JSON Array with json_each', p:"<span class='ic'>json_each()</span> turns a JSON array into a set of rows — one row per array element — which can then be queried, joined, or aggregated like normal table data.",
     runner:{id:'json2', tabs:[
       {label:'Expand a JSON Array', sql:"SELECT value AS skill FROM json_each('[\"SQL\", \"Python\", \"Go\"]');"}
     ]}}
  ],
  tip:{type:'c-note', title:'Widely Supported, Slightly Different Syntax', text:"PostgreSQL uses the -> and ->> operators plus jsonb_* functions, MySQL uses JSON_EXTRACT() and the ->> shorthand, and SQL Server uses JSON_VALUE() and OPENJSON() — the underlying idea of querying inside a JSON blob is now nearly universal, even though the exact function names differ."}
},

'm18::XML Functions': {
  intro:"Some databases support a native XML data type and dedicated functions for querying and constructing XML documents directly inside SQL — useful for systems that exchange data in XML rather than JSON.",
  body:[
    {h:'Not Supported in SQLite', p:"SQL Server has a dedicated <span class='ic'>xml</span> data type plus <span class='ic'>FOR XML</span> (to produce XML) and <span class='ic'>.value()/.nodes()</span> (to query it). PostgreSQL offers an <span class='ic'>xml</span> type with <span class='ic'>xpath()</span> queries. SQLite has no XML data type and no XML functions at all — XML data would need to be handled entirely in application code, or stored and manipulated as plain text."}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On SQL Server: SELECT name, department FROM employees FOR XML PATH('employee'), ROOT('employees'); converts rows to XML. On PostgreSQL: SELECT xpath('/root/name/text()', xml_column) FROM some_table; extracts values from stored XML."}
},

'm18::Regular Expressions': {
  intro:"Regular expressions (regex) allow far more powerful pattern matching than LIKE's simple % and _ wildcards — matching character classes, repetition counts, alternatives, and anchors all in one compact pattern.",
  body:[
    {h:'Not Enabled by Default in This Runner', p:"SQLite recognizes a REGEXP operator in its SQL grammar, but doesn't implement the matching logic itself — a host application must register a REGEXP function before it will work. This particular in-browser engine (sql.js) doesn't register one, so REGEXP queries here will raise a function-not-found error.",
     runner:{id:'rgx1', tabs:[
       {label:'❌ REGEXP Not Registered Here', sql:"SELECT name FROM employees WHERE name REGEXP '^[AC]';"},
       {label:'✅ LIKE-Based Alternative', sql:"SELECT name FROM employees WHERE name LIKE 'A%' OR name LIKE 'C%';"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (varies by database)', text:"PostgreSQL supports regex natively with the ~ operator: WHERE name ~ '^[AC]'; MySQL supports REGEXP/RLIKE out of the box: WHERE name REGEXP '^[AC]'; SQL Server has no built-in regex support at all and typically needs a CLR function or LIKE-based workarounds instead."}
},
};

// ═══════════════════════════════════════════════════════
// SQL.JS ENGINE SETUP
// ═══════════════════════════════════════════════════════
let sqlDB = null, sqlReady = false;
async function initSQL() {
  try {
    const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
    sqlDB = new SQL.Database();
    sqlDB.run(`
      CREATE TABLE employees (id INTEGER PRIMARY KEY, name TEXT, department TEXT, salary INTEGER, city TEXT, dept_id INTEGER, manager_id INTEGER);
      INSERT INTO employees VALUES
        (1,'Alice','Engineering',95000,'Mumbai',10,NULL),
        (2,'Bob','Marketing',72000,'Delhi',20,5),
        (3,'Carol','Engineering',88000,'Bangalore',10,1),
        (4,'David','HR',65000,'Mumbai',30,5),
        (5,'Sarah','Management',110000,'Delhi',NULL,NULL),
        (6,'Mike','Engineering',91000,'Bangalore',10,1);
      CREATE TABLE departments (id INTEGER PRIMARY KEY, dept_name TEXT, location TEXT);
      INSERT INTO departments VALUES (10,'Engineering','Bangalore'),(20,'Marketing','Delhi'),(30,'HR','Mumbai'),(40,'Finance','Mumbai');
    `);
    sqlReady = true;
  } catch(e){ console.error(e); }
}
initSQL();

function runSQL(editorId, runnerId) {
  const editor = document.getElementById(editorId);
  if (!editor) return;
  const sql = editor.value.trim();
  if (!sql) return;
  const resultDiv = document.getElementById(runnerId+'-result');
  const statusDiv = document.getElementById(runnerId+'-status');
  if (!sqlReady) { resultDiv.className='result-wrap show'; resultDiv.innerHTML='<div class="result-error">⚠️ SQL engine loading, try again in a moment.</div>'; return; }
  const t0 = performance.now();
  resultDiv.className = 'result-wrap show';
  try {
    const stmts = sql.split(';').map(s=>s.trim()).filter(Boolean);
    let lastResult = null, rowsAffected = 0;
    for (const stmt of stmts) {
      const up = stmt.toUpperCase();
      if (up.startsWith('SELECT')||up.startsWith('WITH')||up.startsWith('EXPLAIN')||up.startsWith('PRAGMA')) lastResult = sqlDB.exec(stmt);
      else { sqlDB.run(stmt); rowsAffected++; }
    }
    const elapsed = (performance.now()-t0).toFixed(1);
    if (lastResult && lastResult.length) {
      const res = lastResult[0];
      let html = `<div class="result-head"><span>✅ ${res.values.length} rows</span><span>${elapsed}ms</span></div><div class="result-scroll"><table class="result-table"><thead><tr>`;
      res.columns.forEach(c=>html+=`<th>${c}</th>`);
      html += '</tr></thead><tbody>';
      res.values.forEach(row=>{ html+='<tr>'; row.forEach(v=>{ const isNull=v===null; const isNum=typeof v==='number'; html+=`<td class="${isNull?'td-null':isNum?'td-num':''}">${isNull?'NULL':v}</td>`; }); html+='</tr>'; });
      html += '</tbody></table></div>';
      resultDiv.innerHTML = html;
      if(statusDiv) statusDiv.innerHTML = `<span>✅ ${res.values.length} rows</span><span>${elapsed}ms</span>`;
    } else {
      resultDiv.innerHTML = `<div class="result-msg">✅ ${rowsAffected} statement(s) executed.</div>`;
    }
  } catch(e) {
    resultDiv.innerHTML = `<div class="result-error">❌ ${e.message}</div>`;
  }
}
function loadSnippet(editorId, sql, runnerId, tabEl) {
  const editor = document.getElementById(editorId);
  if (editor) editor.value = sql;
  const r = document.getElementById(runnerId+'-result');
  if (r) r.className = 'result-wrap';
  if (tabEl) { const p = tabEl.closest('.runner-tabs'); if(p) p.querySelectorAll('.rtab').forEach(t=>t.classList.remove('active')); tabEl.classList.add('active'); }
}

// ═══════════════════════════════════════════════════════
// RENDER: SIDEBAR (fully dynamic from MODULES)
// ═══════════════════════════════════════════════════════
function totalTopics(){ return MODULES.reduce((a,m)=>a+m.topics.length,0); }
function builtCount(){ return Object.keys(LESSONS).length; }

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const total = totalTopics(), built = builtCount();
  let html = `<div class="sb-prog-wrap"><div class="sb-prog-title"><span>COURSE PROGRESS</span><span>${built} / ${total} topics live</span></div><div class="sb-prog-bar"><div class="sb-prog-fi" style="width:${(built/total*100).toFixed(1)}%"></div></div></div>`;
  MODULES.forEach((m,i)=>{
    html += `<div class="sb-mod" data-mod="${m.id}">
      <div class="sb-mod-head" onclick="toggleMod('${m.id}')">
        <span class="sb-mod-num">${m.icon}</span>
        <span class="sb-mod-title">${m.title}</span>
        <span class="sb-mod-count">${m.topics.length}</span>
        <span class="sb-mod-arrow">▶</span>
      </div>
      <div class="sb-topics" id="topics-${m.id}">`;
    m.topics.forEach(t=>{
      const key = m.id+'::'+t;
      const isBuilt = !!LESSONS[key];
      html += `<div class="sb-topic ${isBuilt?'built':''}" onclick="openTopic('${m.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`;
    });
    html += `</div></div>`;
  });
  sb.innerHTML = html;
  document.getElementById('progPill').textContent = `${built} / ${total} topics built`;

  const msel = document.getElementById('mobileSel');
  msel.innerHTML = MODULES.map(m=>`<optgroup label="${m.icon} ${m.title}">${m.topics.map(t=>`<option value="${m.id}::${t}">${t}</option>`).join('')}</optgroup>`).join('');
}

function toggleMod(id) {
  const head = document.querySelector(`.sb-mod[data-mod="${id}"] .sb-mod-head`);
  const topics = document.getElementById('topics-'+id);
  const wasOpen = topics.classList.contains('open');
  document.querySelectorAll('.sb-topics.open').forEach(t=>t.classList.remove('open'));
  document.querySelectorAll('.sb-mod-head.open').forEach(h=>h.classList.remove('open'));
  if (!wasOpen) { topics.classList.add('open'); head.classList.add('open'); }
}

function onMobileSelect(val) {
  const [modId, topic] = val.split('::');
  openTopic(modId, topic);
}

// ═══════════════════════════════════════════════════════
// RENDER: CONTENT AREA
// ═══════════════════════════════════════════════════════
function openTopic(modId, topic) {
  const mod = MODULES.find(m=>m.id===modId);
  const key = modId+'::'+topic;
  const lesson = LESSONS[key];
  const content = document.getElementById('content');

  document.querySelectorAll('.sb-topic').forEach(el=>el.classList.remove('active'));
  const idx = mod.topics.indexOf(topic);

  // open the right sidebar section & highlight
  const topicsDiv = document.getElementById('topics-'+modId);
  if (topicsDiv && !topicsDiv.classList.contains('open')) toggleMod(modId);
  const items = topicsDiv ? topicsDiv.querySelectorAll('.sb-topic') : [];
  if (items[idx]) items[idx].classList.add('active');

  let html = `<div class="lesson-wrap">`;
  html += `<div class="l-tag">${mod.icon} ${mod.title} · Topic ${idx+1} of ${mod.topics.length}</div>`;
  html += `<h1 class="l-h1">${topic}</h1>`;

  if (lesson) {
    html += `<p class="l-intro">${lesson.intro}</p>`;
    lesson.body.forEach(sec=>{
      html += `<h2>${sec.h}</h2><p>${sec.p}</p>`;
      if (sec.runner) html += buildRunnerHTML(sec.runner);
    });
    if (lesson.tip) html += `<div class="callout ${lesson.tip.type}"><div class="callout-body"><strong>${lesson.tip.title}</strong>${lesson.tip.text}</div></div>`;
  } else {
    html += `<p class="l-intro">This topic is part of the <strong>${mod.title}</strong> module in the master course index.</p>`;
    html += `<div class="coming-soon-box">
      <div class="cs-title">🚧 Full lesson content coming next</div>
      <div class="cs-sub">This topic is already reserved in the course structure — nothing from the 27-module index is ever dropped. Ask for "<strong>${topic}</strong>" (or the whole ${mod.title} module) in your next message and it'll be built with explanation, examples, and a live SQL runner.</div>
    </div>`;
  }

  // module topic overview grid
  html += `<h2 style="margin-top:2rem">More in ${mod.title}</h2><div class="topic-grid">`;
  mod.topics.forEach(t=>{
    const b = !!LESSONS[modId+'::'+t];
    html += `<div class="topic-card ${b?'built':''}" onclick="openTopic('${modId}','${t.replace(/'/g,"\\'")}')">
      <span class="tc-dot ${b?'built':'pending'}">${b?'●':'○'}</span>
      <span class="tc-title">${t}</span>
      <span class="tc-badge ${b?'ready':'soon'}">${b?'Ready':'Soon'}</span>
    </div>`;
  });
  html += `</div>`;

  // prev/next nav
  const prevTopic = idx>0 ? mod.topics[idx-1] : null;
  const nextTopic = idx<mod.topics.length-1 ? mod.topics[idx+1] : null;
  html += `<div class="l-nav">`;
  html += prevTopic ? `<button class="lnbtn" onclick="openTopic('${modId}','${prevTopic.replace(/'/g,"\\'")}')">← ${prevTopic}</button>` : `<span></span>`;
  html += nextTopic ? `<button class="lnbtn primary" onclick="openTopic('${modId}','${nextTopic.replace(/'/g,"\\'")}')">${nextTopic} →</button>` : `<span></span>`;
  html += `</div></div>`;

  content.innerHTML = html;
  content.scrollTo(0,0);
  document.getElementById('mobileSel').value = key;
}

function buildRunnerHTML(runner) {
  const rid = 'r-'+runner.id, eid = 'e-'+runner.id;
  let tabsHtml = runner.tabs.map((t,i)=>`<button class="rtab ${i===0?'active':''}" onclick="loadSnippet('${eid}', \`${t.sql.replace(/`/g,'\\`')}\`, '${rid}', this)">${t.label}</button>`).join('');
  return `<div class="runner" id="${rid}">
    <div class="runner-head"><div class="runner-title"><span class="runner-dot"></span> Live SQL Runner</div>
      <div class="runner-actions"><button class="r-btn run" onclick="runSQL('${eid}','${rid}')">▶ Run SQL</button></div></div>
    <div class="runner-tabs">${tabsHtml}</div>
    <div class="editor-wrap"><textarea id="${eid}" spellcheck="false">${runner.tabs[0].sql}</textarea></div>
    <div class="runner-status" id="${rid}-status"><span>Press ▶ Run SQL</span><span></span></div>
    <div class="result-wrap" id="${rid}-result"></div>
  </div>`;
}

// overview / home page
function renderHome() {
  const content = document.getElementById('content');
  const total = totalTopics(), built = builtCount();
  let html = `<div class="lesson-wrap">
    <div class="l-tag">🏠 Course Overview</div>
    <h1 class="l-h1">SQL Academy — <span class="g">0 to 20+ Years, One Course</span></h1>
    <p class="l-intro">27 modules, ${total}+ topics, live in-browser SQL runner, and 300+ interview questions — structured so nothing from the index is ever missing. Green dots (●) are fully built with explanations and runnable examples; hollow dots (○) are reserved topics ready to be filled next.</p>
    <h2>Modules</h2>
    <div class="topic-grid">`;
  MODULES.forEach(m=>{
    const builtInMod = m.topics.filter(t=>LESSONS[m.id+'::'+t]).length;
    html += `<div class="topic-card" onclick="toggleMod('${m.id}'); document.getElementById('sidebar').scrollIntoView()">
      <span class="tc-dot ${builtInMod>0?'built':'pending'}">${m.icon}</span>
      <span class="tc-title">${m.title}</span>
      <span class="tc-badge ${builtInMod===m.topics.length?'ready':'soon'}">${builtInMod}/${m.topics.length}</span>
    </div>`;
  });
  html += `</div>
    <div class="coming-soon-box">
      <div class="cs-title">📌 How this course grows</div>
      <div class="cs-sub">Tell me which module or topic to build next (e.g. "JOINs module" or "explain RECURSIVE CTE") and it gets added right into this same structure with a live SQL runner — the sidebar and progress bar update automatically.</div>
    </div>
  </div>`;
  content.innerHTML = html;
}

function searchTopics(q) {
  q = q.trim().toLowerCase();
  if (!q) { renderSidebar(); return; }
  const sb = document.getElementById('sidebar');
  let html = '';
  MODULES.forEach(m=>{
    const matches = m.topics.filter(t=>t.toLowerCase().includes(q));
    if (matches.length) {
      html += `<div class="sb-mod"><div class="sb-mod-head open"><span class="sb-mod-num">${m.icon}</span><span class="sb-mod-title">${m.title}</span></div><div class="sb-topics open">`;
      matches.forEach(t=>{
        const isBuilt = !!LESSONS[m.id+'::'+t];
        html += `<div class="sb-topic ${isBuilt?'built':''}" onclick="openTopic('${m.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`;
      });
      html += `</div></div>`;
    }
  });
  sb.innerHTML = html || `<div style="padding:1rem;color:var(--txt3);font-size:.8rem">No topics found</div>`;
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
renderSidebar();
renderHome();
</script>
</body>
</html>
