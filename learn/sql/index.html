.editor-wrap textarea{width:100%;background:transparent;border:none;padding:1rem;font-family:var(--mono);font-size:.8rem;color:#cdd6f4;line-height:1.75;resize:vertical;min-height:110px;outline:none}
.runner-status{display:flex;justify-content:space-between;padding:.35rem .85rem;border-top:1px solid var(--bdr);background:rgba(0,0,0,.15);font-size:.63rem;font-family:var(--mono);color:var(--txt3)}

.result-wrap.show{display:block}
.result-head{padding:.42rem .85rem;background:rgba(16,185,129,.04);border-bottom:1px solid var(--bdr);font-size:.65rem;font-family:var(--mono);color:var(--ac3);display:flex;justify-content:space-between}
.result-scroll{overflow-x:auto;max-height:260px}
.result-table{width:100%;border-collapse:collapse;font-size:.76rem;font-family:var(--mono)}
.result-table th{background:rgba(99,102,241,.08);color:var(--pur);padding:.42rem .75rem;text-align:left;border-bottom:1px solid var(--bdr2);font-size:.65rem;white-space:nowrap}
.result-table td{padding:.38rem .75rem;border-bottom:1px solid rgba(255,255,255,.04);color:var(--txt2);white-space:nowrap}
.td-num{color:var(--ora)}.td-null{color:var(--txt3);font-style:italic}
.result-error{padding:.85rem;font-size:.76rem;color:var(--red);font-family:var(--mono)}

.callout{border-radius:var(--r);padding:.85rem 1rem;margin:.85rem 0;font-size:.82rem;line-height:1.78;display:flex;gap:.65rem}
.callout-body strong{display:block;font-size:.72rem;text-transform:uppercase;margin-bottom:.22rem;font-weight:800}
.c-tip{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.18)}.c-tip strong{color:var(--ac3)}
.c-warn{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.18)}.c-warn strong{color:var(--ac4)}
.c-note{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.18)}.c-note strong{color:var(--pur)}

/* module overview / coming soon */
.mod-hero{margin-bottom:1.5rem}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem;margin:1rem 0}
.topic-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:.85rem 1rem;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:.6rem}
.topic-card:hover{border-color:var(--bdr3);transform:translateY(-1px)}
.topic-card.built{border-color:rgba(16,185,129,.3)}
.tc-dot{font-size:.7rem;flex-shrink:0}
.tc-dot.built{color:var(--ac3)}
.tc-dot.pending{color:var(--txt3)}
.tc-title{font-size:.8rem;font-weight:600}
.tc-badge{margin-left:auto;font-size:.58rem;font-family:var(--mono);padding:.1rem .4rem;border-radius:4px}
.tc-badge.ready{background:rgba(16,185,129,.12);color:var(--ac3)}
.tc-badge.soon{background:rgba(255,255,255,.05);color:var(--txt3)}

.coming-soon-box{background:linear-gradient(135deg,rgba(99,102,241,.06),rgba(79,172,254,.04));border:1px solid rgba(99,102,241,.2);border-radius:var(--r3);padding:1.3rem;margin-top:1rem}
.cs-title{font-size:.92rem;font-weight:800;margin-bottom:.4rem;color:var(--pur)}
.cs-sub{font-size:.8rem;color:var(--txt2);line-height:1.75;margin-bottom:.7rem}
.cs-cta{display:inline-block;font-size:.75rem;font-weight:700;color:var(--ac2);background:rgba(79,172,254,.1);border:1px solid rgba(79,172,254,.25);padding:.45rem .9rem;border-radius:8px}

.l-nav{display:flex;align-items:center;justify-content:space-between;margin-top:2.2rem;padding-top:1.1rem;border-top:1px solid var(--bdr);gap:.5rem;flex-wrap:wrap}
.lnbtn{padding:.6rem 1.1rem;border-radius:8px;border:1px solid var(--bdr);background:rgba(255,255,255,.03);color:var(--txt2);font-size:.8rem;font-weight:700;cursor:pointer;font-family:var(--fn)}
.lnbtn.primary{background:linear-gradient(135deg,var(--ac3),var(--ac2));border:none;color:#fff}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:400;background:rgba(10,13,24,.98);border-top:1px solid var(--bdr);padding:.55rem 1rem}
@media(max-width:960px){.mobile-nav{display:block}}
.mobile-sel{width:100%;background:var(--bg3);border:1px solid var(--bdr);color:var(--txt);font-family:var(--fn);font-size:.8rem;padding:.5rem .75rem;border-radius:8px}
@media(max-width:960px){body{padding-bottom:70px}}
</style>

<script>
// ═══════════════════════════════════════════════════════
// MASTER DATA STRUCTURE — Single Source of Truth
// Every module + every topic from the official index lives here.
// "built:true" topics have full lesson content in LESSONS{}.
// Everything else renders as a structured "coming soon" card
// so NOTHING from the index is ever lost.
// ═══════════════════════════════════════════════════════
const MODULES = [
{id:'m1',icon:'📗',title:'SQL Fundamentals',topics:['What is SQL?','History of SQL','SQL Architecture','Database Concepts','Tables, Rows & Columns','SQL Syntax','SQL Statements','SQL Comments','SQL Keywords','SQL Data Types','NULL Values','SQL Order of Execution','SQL Best Practices']},
{id:'m2',icon:'📘',title:'SELECT Queries',topics:['SELECT','DISTINCT','Aliases','TOP','LIMIT','OFFSET','FETCH FIRST','Expressions','Calculated Columns']},
{id:'m3',icon:'📙',title:'Filtering Data',topics:['WHERE','Comparison Operators','AND','OR','NOT','IN','NOT IN','BETWEEN','LIKE','Wildcards','EXISTS','NOT EXISTS','ANY','ALL','IS NULL','IS NOT NULL']},
{id:'m4',icon:'📕',title:'Sorting & Aggregation',topics:['ORDER BY','COUNT','SUM','AVG','MIN','MAX','GROUP BY','HAVING','GROUPING SETS','ROLLUP','CUBE']},
{id:'m5',icon:'📒',title:'SQL Functions',topics:['String Functions','Numeric Functions','Date Functions','Aggregate Functions','Conversion Functions','CASE WHEN','CAST','CONVERT','COALESCE','NULLIF']},
{id:'m6',icon:'📔',title:'JOINs',topics:['INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL OUTER JOIN','CROSS JOIN','SELF JOIN','NATURAL JOIN','Multiple Table JOIN','JOIN Performance']},
{id:'m7',icon:'📓',title:'Set Operators',topics:['UNION','UNION ALL','INTERSECT','EXCEPT','MINUS']},
{id:'m8',icon:'📚',title:'Subqueries',topics:['Scalar Subquery','Nested Subquery','Correlated Subquery','EXISTS','NOT EXISTS','ANY','ALL']},
{id:'m9',icon:'📖',title:'CTE',topics:['Common Table Expressions','Multiple CTE','Recursive CTE']},
{id:'m10',icon:'📗',title:'Window Functions',topics:['OVER','PARTITION BY','ROW_NUMBER','RANK','DENSE_RANK','NTILE','LEAD','LAG','FIRST_VALUE','LAST_VALUE','Running Totals','Moving Average']},
{id:'m11',icon:'📘',title:'DML',topics:['INSERT','UPDATE','DELETE','MERGE','UPSERT']},
{id:'m12',icon:'📙',title:'DDL',topics:['CREATE DATABASE','CREATE TABLE','ALTER TABLE','DROP TABLE','TRUNCATE TABLE','RENAME TABLE']},
{id:'m13',icon:'📕',title:'Constraints',topics:['PRIMARY KEY','FOREIGN KEY','UNIQUE','CHECK','DEFAULT','IDENTITY','AUTO_INCREMENT']},
{id:'m14',icon:'📒',title:'Views',topics:['Views','Materialized Views','Indexed Views']},
{id:'m15',icon:'📔',title:'Indexes',topics:['Clustered Index','Non Clustered Index','Composite Index','Covering Index','Bitmap Index','Hash Index','Execution Plans','Index Optimization']},
{id:'m16',icon:'📓',title:'Transactions',topics:['ACID','BEGIN TRANSACTION','COMMIT','ROLLBACK','SAVEPOINT','Isolation Levels','Locks','Deadlocks']},
{id:'m17',icon:'📚',title:'Database Objects',topics:['Stored Procedures','User Defined Functions','Triggers','Sequences','Synonyms','Cursors']},
{id:'m18',icon:'📖',title:'Advanced SQL',topics:['Pivot','Unpivot','Dynamic SQL','Temporary Tables','Recursive Queries','JSON Functions','XML Functions','Regular Expressions']},
{id:'m19',icon:'📗',title:'Performance Tuning',topics:['Query Optimization','Explain Plan','Statistics','Partitioning','Parallel Processing','Query Hints','Query Caching','Connection Pooling','Performance Best Practices']},
{id:'m20',icon:'📘',title:'SQL Security',topics:['SQL Injection','Prepared Statements','GRANT','REVOKE','Roles','Permissions']},
{id:'m21',icon:'📙',title:'Data Warehouse SQL',topics:['OLTP vs OLAP','Star Schema','Snowflake Schema','Fact Tables','Dimension Tables','SCD Type 1','SCD Type 2','SCD Type 3','CDC','Incremental Load','Full Load']},
{id:'m22',icon:'📕',title:'Databricks SQL',topics:['Databricks SQL','SQL Warehouses','Unity Catalog','Delta Tables','Delta Live Tables','MERGE INTO','COPY INTO','OPTIMIZE','VACUUM','ZORDER','Liquid Clustering','Time Travel','Photon']},
{id:'m23',icon:'📒',title:'SQL Projects',topics:['HR Database','Banking','Healthcare','Retail','Sales','Inventory','Finance','CRM','Telecom','Airline']},
{id:'m24',icon:'📔',title:'SQL Practice',topics:['500 Practice Questions','Easy','Medium','Hard','Expert']},
{id:'m25',icon:'📓',title:'Interview Preparation',topics:['300 Interview Questions','300 Detailed Answers','100 Real Scenarios','Company Wise','Experience Wise','Data Engineer Interview','SQL Cheat Sheet']},
{id:'m26',icon:'📚',title:'SQL Challenges',topics:['Daily Challenges','Weekly Challenges','SQL Puzzles','Hackathon Questions']},
{id:'m27',icon:'📖',title:'SQL Reference',topics:['SQL Keywords','Functions','Operators','Reserved Words','Error Messages','Best Practices']},
{id:'res',icon:'📰',title:'Resources',topics:['SQL Blogs','FAQ','Release Notes',"What's New",'Community']},
];

// ═══════════════════════════════════════════════════════
// BUILT LESSONS — full content with live SQL runners.
// Key format: "moduleId::topicName"
// Add more entries here over time to progressively fill the course.
// ═══════════════════════════════════════════════════════
const LESSONS = {
'm2::SELECT': {
  intro:"SELECT is the foundation of all SQL. Every query starts here — it lets you retrieve exactly the columns you need from a table.",
  body:[
    {h:'Your First Query', p:"The asterisk <span class='ic'>*</span> means 'all columns'. Always end statements with a semicolon.",
     runner:{id:'sel1', tabs:[
       {label:'SELECT *', sql:"SELECT * FROM employees;"},
       {label:'Specific Cols', sql:"SELECT name, department, salary FROM employees;"},
       {label:'With Alias', sql:"SELECT name AS employee_name, salary AS annual_salary FROM employees;"}
     ]}},
  ],
  tip:{type:'c-tip', title:'Best Practice', text:"Always name specific columns in production queries instead of SELECT * — it's faster, safer, and more readable."}
},
'm2::DISTINCT': {
  intro:"DISTINCT removes duplicate rows from your result set, keeping only unique values.",
  body:[{h:'Removing Duplicates', p:"Without DISTINCT you'll see repeated values; with it, only unique rows remain.",
    runner:{id:'dist1', tabs:[
      {label:'Without DISTINCT', sql:"SELECT department FROM employees;"},
      {label:'With DISTINCT', sql:"SELECT DISTINCT department FROM employees;"},
      {label:'Count Unique', sql:"SELECT COUNT(DISTINCT department) AS unique_depts FROM employees;"}
    ]}}],
  tip:{type:'c-note', title:'Note', text:"DISTINCT applies to the entire row combination, not just one column, when multiple columns are selected."}
},
'm3::WHERE': {
  intro:"WHERE filters rows based on a condition — it's the most used clause after SELECT.",
  body:[{h:'Filtering Rows', p:"Combine WHERE with comparison operators to narrow down results.",
    runner:{id:'wh1', tabs:[
      {label:'Equal', sql:"SELECT * FROM employees WHERE department = 'Engineering';"},
      {label:'Greater Than', sql:"SELECT * FROM employees WHERE salary > 80000;"},
      {label:'BETWEEN', sql:"SELECT * FROM employees WHERE salary BETWEEN 70000 AND 90000;"},
      {label:'LIKE', sql:"SELECT * FROM employees WHERE name LIKE 'A%';"}
    ]}}],
  tip:{type:'c-warn', title:'Performance Warning', text:"LIKE with a leading wildcard ('%text') cannot use an index and forces a full table scan."}
},
'm4::GROUP BY': {
  intro:"GROUP BY collapses rows into grouped statistics — the foundation of all reporting SQL.",
  body:[{h:'Grouping & Aggregating', p:"Combine GROUP BY with COUNT, AVG, SUM, MAX, MIN for department-level or category-level stats.",
    runner:{id:'gb1', tabs:[
      {label:'Dept Stats', sql:"SELECT department, COUNT(*) AS num_employees, AVG(salary) AS avg_salary FROM employees GROUP BY department;"},
      {label:'HAVING Filter', sql:"SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department HAVING AVG(salary) > 80000;"}
    ]}}],
  tip:{type:'c-note', title:'WHERE vs HAVING', text:"WHERE filters rows BEFORE grouping and cannot use aggregates. HAVING filters groups AFTER grouping and can use aggregates."}
},
'm6::INNER JOIN': {
  intro:"INNER JOIN returns only rows that have matching values in both tables — the most common join type.",
  body:[{h:'Matching Rows Only', p:"Rows without a match in either table are excluded from the result.",
    runner:{id:'ij1', tabs:[
      {label:'INNER JOIN', sql:"SELECT e.name, e.salary, d.dept_name FROM employees e INNER JOIN departments d ON e.dept_id = d.id;"}
    ]}}],
  tip:{type:'c-tip', title:'Tip', text:"INNER JOIN is the default JOIN — writing just 'JOIN' means INNER JOIN in every major database."}
},
'm6::LEFT JOIN': {
  intro:"LEFT JOIN returns ALL rows from the left table, plus matching rows from the right table (NULL if no match).",
  body:[{h:'Keep Everything on the Left', p:"Useful for finding unmatched records too — the 'anti-join' pattern.",
    runner:{id:'lj1', tabs:[
      {label:'LEFT JOIN', sql:"SELECT e.name, d.dept_name FROM employees e LEFT JOIN departments d ON e.dept_id = d.id;"},
      {label:'Anti-Join (unmatched)', sql:"SELECT e.name FROM employees e LEFT JOIN departments d ON e.dept_id = d.id WHERE d.id IS NULL;"}
    ]}}],
  tip:{type:'c-note', title:'Interview Pattern', text:"LEFT JOIN + WHERE right.id IS NULL is the classic way to find 'customers with no orders' style questions."}
},
'm10::ROW_NUMBER': {
  intro:"Window functions calculate across rows without collapsing them like GROUP BY does. ROW_NUMBER assigns a unique sequential number to each row.",
  body:[{h:'Ranking Rows', p:"Compare ROW_NUMBER, RANK, and DENSE_RANK to see how they handle ties differently.",
    runner:{id:'rn1', tabs:[
      {label:'ROW_NUMBER', sql:"SELECT name, salary, ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn FROM employees;"},
      {label:'PARTITION BY', sql:"SELECT name, department, salary, DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS dept_rank FROM employees;"}
    ]}}],
  tip:{type:'c-warn', title:'Interview Trap', text:"For 'Nth highest salary' questions, use DENSE_RANK not RANK — RANK leaves gaps when there are ties."}
},
};

// ═══════════════════════════════════════════════════════
// SQL.JS ENGINE SETUP
// ═══════════════════════════════════════════════════════
let sqlDB = null, sqlReady = false;
async function initSQL() {
  try {
    const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
    sqlDB = new SQL.Database();
    sqlDB.run(`
      CREATE TABLE employees (id INTEGER PRIMARY KEY, name TEXT, department TEXT, salary INTEGER, city TEXT, dept_id INTEGER, manager_id INTEGER);
      INSERT INTO employees VALUES
        (1,'Alice','Engineering',95000,'Mumbai',10,NULL),
        (2,'Bob','Marketing',72000,'Delhi',20,5),
        (3,'Carol','Engineering',88000,'Bangalore',10,1),
        (4,'David','HR',65000,'Mumbai',30,5),
        (5,'Sarah','Management',110000,'Delhi',NULL,NULL),
        (6,'Mike','Engineering',91000,'Bangalore',10,1);
      CREATE TABLE departments (id INTEGER PRIMARY KEY, dept_name TEXT, location TEXT);
      INSERT INTO departments VALUES (10,'Engineering','Bangalore'),(20,'Marketing','Delhi'),(30,'HR','Mumbai'),(40,'Finance','Mumbai');
    `);
    sqlReady = true;
  } catch(e){ console.error(e); }
}
initSQL();

function runSQL(editorId, runnerId) {
  const editor = document.getElementById(editorId);
  if (!editor) return;
  const sql = editor.value.trim();
  if (!sql) return;
  const resultDiv = document.getElementById(runnerId+'-result');
  const statusDiv = document.getElementById(runnerId+'-status');
  if (!sqlReady) { resultDiv.className='result-wrap show'; resultDiv.innerHTML='<div class="result-error">⚠️ SQL engine loading, try again in a moment.</div>'; return; }
  const t0 = performance.now();
  resultDiv.className = 'result-wrap show';
  try {
    const stmts = sql.split(';').map(s=>s.trim()).filter(Boolean);
    let lastResult = null, rowsAffected = 0;
    for (const stmt of stmts) {
      const up = stmt.toUpperCase();
      if (up.startsWith('SELECT')||up.startsWith('WITH')||up.startsWith('EXPLAIN')||up.startsWith('PRAGMA')) lastResult = sqlDB.exec(stmt);
      else { sqlDB.run(stmt); rowsAffected++; }
    }
    const elapsed = (performance.now()-t0).toFixed(1);
    if (lastResult && lastResult.length) {
      const res = lastResult[0];
      let html = `<div class="result-head"><span>✅ ${res.values.length} rows</span><span>${elapsed}ms</span></div><div class="result-scroll"><table class="result-table"><thead><tr>`;
      res.columns.forEach(c=>html+=`<th>${c}</th>`);
      html += '</tr></thead><tbody>';
      res.values.forEach(row=>{ html+='<tr>'; row.forEach(v=>{ const isNull=v===null; const isNum=typeof v==='number'; html+=`<td class="${isNull?'td-null':isNum?'td-num':''}">${isNull?'NULL':v}</td>`; }); html+='</tr>'; });
      html += '</tbody></table></div>';
      resultDiv.innerHTML = html;
      if(statusDiv) statusDiv.innerHTML = `<span>✅ ${res.values.length} rows</span><span>${elapsed}ms</span>`;
    } else {
      resultDiv.innerHTML = `<div class="result-msg">✅ ${rowsAffected} statement(s) executed.</div>`;
    }
  } catch(e) {
    resultDiv.innerHTML = `<div class="result-error">❌ ${e.message}</div>`;
  }
}
function loadSnippet(editorId, sql, runnerId, tabEl) {
  const editor = document.getElementById(editorId);
  if (editor) editor.value = sql;
  const r = document.getElementById(runnerId+'-result');
  if (r) r.className = 'result-wrap';
  if (tabEl) { const p = tabEl.closest('.runner-tabs'); if(p) p.querySelectorAll('.rtab').forEach(t=>t.classList.remove('active')); tabEl.classList.add('active'); }
}

// ═══════════════════════════════════════════════════════
// RENDER: SIDEBAR (fully dynamic from MODULES)
// ═══════════════════════════════════════════════════════
function totalTopics(){ return MODULES.reduce((a,m)=>a+m.topics.length,0); }
function builtCount(){ return Object.keys(LESSONS).length; }

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const total = totalTopics(), built = builtCount();
  let html = `<div class="sb-prog-wrap"><div class="sb-prog-title"><span>COURSE PROGRESS</span><span>${built} / ${total} topics live</span></div><div class="sb-prog-bar"><div class="sb-prog-fi" style="width:${(built/total*100).toFixed(1)}%"></div></div></div>`;
  MODULES.forEach((m,i)=>{
    html += `<div class="sb-mod" data-mod="${m.id}">
      <div class="sb-mod-head" onclick="toggleMod('${m.id}')">
        <span class="sb-mod-num">${m.icon}</span>
        <span class="sb-mod-title">${m.title}</span>
        <span class="sb-mod-count">${m.topics.length}</span>
        <span class="sb-mod-arrow">▶</span>
      </div>
      <div class="sb-topics" id="topics-${m.id}">`;
    m.topics.forEach(t=>{
      const key = m.id+'::'+t;
      const isBuilt = !!LESSONS[key];
      html += `<div class="sb-topic ${isBuilt?'built':''}" onclick="openTopic('${m.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`;
    });
    html += `</div></div>`;
  });
  sb.innerHTML = html;
  document.getElementById('progPill').textContent = `${built} / ${total} topics built`;

  const msel = document.getElementById('mobileSel');
  msel.innerHTML = MODULES.map(m=>`<optgroup label="${m.icon} ${m.title}">${m.topics.map(t=>`<option value="${m.id}::${t}">${t}</option>`).join('')}</optgroup>`).join('');
}

function toggleMod(id) {
  const head = document.querySelector(`.sb-mod[data-mod="${id}"] .sb-mod-head`);
  const topics = document.getElementById('topics-'+id);
  const wasOpen = topics.classList.contains('open');
  document.querySelectorAll('.sb-topics.open').forEach(t=>t.classList.remove('open'));
  document.querySelectorAll('.sb-mod-head.open').forEach(h=>h.classList.remove('open'));
  if (!wasOpen) { topics.classList.add('open'); head.classList.add('open'); }
}

function onMobileSelect(val) {
  const [modId, topic] = val.split('::');
  openTopic(modId, topic);
}

// ═══════════════════════════════════════════════════════
// RENDER: CONTENT AREA
// ═══════════════════════════════════════════════════════
function openTopic(modId, topic) {
  const mod = MODULES.find(m=>m.id===modId);
  const key = modId+'::'+topic;
  const lesson = LESSONS[key];
  const content = document.getElementById('content');

  document.querySelectorAll('.sb-topic').forEach(el=>el.classList.remove('active'));
  const idx = mod.topics.indexOf(topic);

  // open the right sidebar section & highlight
  const topicsDiv = document.getElementById('topics-'+modId);
  if (topicsDiv && !topicsDiv.classList.contains('open')) toggleMod(modId);
  const items = topicsDiv ? topicsDiv.querySelectorAll('.sb-topic') : [];
  if (items[idx]) items[idx].classList.add('active');

  let html = `<div class="lesson-wrap">`;
  html += `<div class="l-tag">${mod.icon} ${mod.title} · Topic ${idx+1} of ${mod.topics.length}</div>`;
  html += `<h1 class="l-h1">${topic}</h1>`;

  if (lesson) {
    html += `<p class="l-intro">${lesson.intro}</p>`;
    lesson.body.forEach(sec=>{
      html += `<h2>${sec.h}</h2><p>${sec.p}</p>`;
      if (sec.runner) html += buildRunnerHTML(sec.runner);
    });
    if (lesson.tip) html += `<div class="callout ${lesson.tip.type}"><div class="callout-body"><strong>${lesson.tip.title}</strong>${lesson.tip.text}</div></div>`;
  } else {
    html += `<p class="l-intro">This topic is part of the <strong>${mod.title}</strong> module in the master course index.</p>`;
    html += `<div class="coming-soon-box">
      <div class="cs-title">🚧 Full lesson content coming next</div>
      <div class="cs-sub">This topic is already reserved in the course structure — nothing from the 27-module index is ever dropped. Ask for "<strong>${topic}</strong>" (or the whole ${mod.title} module) in your next message and it'll be built with explanation, examples, and a live SQL runner.</div>
    </div>`;
  }

  // module topic overview grid
  html += `<h2 style="margin-top:2rem">More in ${mod.title}</h2><div class="topic-grid">`;
  mod.topics.forEach(t=>{
    const b = !!LESSONS[modId+'::'+t];
    html += `<div class="topic-card ${b?'built':''}" onclick="openTopic('${modId}','${t.replace(/'/g,"\\'")}')">
      <span class="tc-dot ${b?'built':'pending'}">${b?'●':'○'}</span>
      <span class="tc-title">${t}</span>
      <span class="tc-badge ${b?'ready':'soon'}">${b?'Ready':'Soon'}</span>
    </div>`;
  });
  html += `</div>`;

  // prev/next nav
  const prevTopic = idx>0 ? mod.topics[idx-1] : null;
  const nextTopic = idx<mod.topics.length-1 ? mod.topics[idx+1] : null;
  html += `<div class="l-nav">`;
  html += prevTopic ? `<button class="lnbtn" onclick="openTopic('${modId}','${prevTopic.replace(/'/g,"\\'")}')">← ${prevTopic}</button>` : `<span></span>`;
  html += nextTopic ? `<button class="lnbtn primary" onclick="openTopic('${modId}','${nextTopic.replace(/'/g,"\\'")}')">${nextTopic} →</button>` : `<span></span>`;
  html += `</div></div>`;

  content.innerHTML = html;
  content.scrollTo(0,0);
  document.getElementById('mobileSel').value = key;
}

function buildRunnerHTML(runner) {
  const rid = 'r-'+runner.id, eid = 'e-'+runner.id;
  let tabsHtml = runner.tabs.map((t,i)=>`<button class="rtab ${i===0?'active':''}" onclick="loadSnippet('${eid}', \`${t.sql.replace(/`/g,'\\`')}\`, '${rid}', this)">${t.label}</button>`).join('');
  return `<div class="runner" id="${rid}">
    <div class="runner-head"><div class="runner-title"><span class="runner-dot"></span> Live SQL Runner</div>
      <div class="runner-actions"><button class="r-btn run" onclick="runSQL('${eid}','${rid}')">▶ Run SQL</button></div></div>
    <div class="runner-tabs">${tabsHtml}</div>
    <div class="editor-wrap"><textarea id="${eid}" spellcheck="false">${runner.tabs[0].sql}</textarea></div>
    <div class="runner-status" id="${rid}-status"><span>Press ▶ Run SQL</span><span></span></div>
    <div class="result-wrap" id="${rid}-result"></div>
  </div>`;
}

// overview / home page
function renderHome() {
  const content = document.getElementById('content');
  const total = totalTopics(), built = builtCount();
  let html = `<div class="lesson-wrap">
    <div class="l-tag">🏠 Course Overview</div>
    <h1 class="l-h1">SQL Academy — <span class="g">0 to 20+ Years, One Course</span></h1>
    <p class="l-intro">27 modules, ${total}+ topics, live in-browser SQL runner, and 300+ interview questions — structured so nothing from the index is ever missing. Green dots (●) are fully built with explanations and runnable examples; hollow dots (○) are reserved topics ready to be filled next.</p>
    <h2>Modules</h2>
    <div class="topic-grid">`;
  MODULES.forEach(m=>{
    const builtInMod = m.topics.filter(t=>LESSONS[m.id+'::'+t]).length;
    html += `<div class="topic-card" onclick="toggleMod('${m.id}'); document.getElementById('sidebar').scrollIntoView()">
      <span class="tc-dot ${builtInMod>0?'built':'pending'}">${m.icon}</span>
      <span class="tc-title">${m.title}</span>
      <span class="tc-badge ${builtInMod===m.topics.length?'ready':'soon'}">${builtInMod}/${m.topics.length}</span>
    </div>`;
  });
  html += `</div>
    <div class="coming-soon-box">
      <div class="cs-title">📌 How this course grows</div>
      <div class="cs-sub">Tell me which module or topic to build next (e.g. "JOINs module" or "explain RECURSIVE CTE") and it gets added right into this same structure with a live SQL runner — the sidebar and progress bar update automatically.</div>
    </div>
  </div>`;
  content.innerHTML = html;
}

function searchTopics(q) {
  q = q.trim().toLowerCase();
  if (!q) { renderSidebar(); return; }
  const sb = document.getElementById('sidebar');
  let html = '';
  MODULES.forEach(m=>{
    const matches = m.topics.filter(t=>t.toLowerCase().includes(q));
    if (matches.length) {
      html += `<div class="sb-mod"><div class="sb-mod-head open"><span class="sb-mod-num">${m.icon}</span><span class="sb-mod-title">${m.title}</span></div><div class="sb-topics open">`;
      matches.forEach(t=>{
        const isBuilt = !!LESSONS[m.id+'::'+t];
        html += `<div class="sb-topic ${isBuilt?'built':''}" onclick="openTopic('${m.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`;
      });
      html += `</div></div>`;
    }
  });
  sb.innerHTML = html || `<div style="padding:1rem;color:var(--txt3);font-size:.8rem">No topics found</div>`;
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
renderSidebar();
renderHome();
</script>
