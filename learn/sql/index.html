    {h:'Referencing the Outer Row', p:"Notice <span class='ic'>e.dept_id</span> inside the subquery — that's the correlation. For each employee row, the subquery recalculates the average salary of just that employee's own department.",
     runner:{id:'cor1', tabs:[
       {label:'Correlated Subquery', sql:"SELECT e.name, e.salary, e.dept_id FROM employees e WHERE e.salary > (SELECT AVG(salary) FROM employees WHERE dept_id = e.dept_id);"}
     ]}},
    {h:'Correlated Subquery in SELECT', p:"Correlated subqueries can also sit in the SELECT list itself, computing a per-row value that depends on that row's own data.",
     runner:{id:'cor2', tabs:[
       {label:'Per-Row Rank Count', sql:"SELECT e.name, e.salary, (SELECT COUNT(*) FROM employees e2 WHERE e2.dept_id = e.dept_id AND e2.salary > e.salary) AS higher_paid_in_dept FROM employees e;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Performance Cost', text:"Because a correlated subquery logically re-executes for every outer row, it can be much slower than an equivalent JOIN or window function on large tables — for the 'higher_paid_in_dept' example above, RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) would scale far better."}
},

'm8::EXISTS': {
  intro:"Inside a subquery, EXISTS checks only whether the inner query returns at least one row for the current outer row — it's almost always written as a correlated subquery, and it's usually the fastest way to answer 'does a related row exist?'.",
  body:[
    {h:'A Correlated Existence Check', p:"The subquery here is correlated to <span class='ic'>d.id</span> from the outer query — for every department, it asks 'is there at least one employee row matching this department id?'.",
     runner:{id:'sqex1', tabs:[
       {label:'Departments With Staff', sql:"SELECT d.dept_name FROM departments d WHERE EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id);"}
     ]}},
    {h:'EXISTS vs IN', p:"EXISTS and IN often solve the same problem, but EXISTS can short-circuit as soon as one match is found, while IN typically needs the full inner result set first — for large, correlated lookups, EXISTS is usually preferred.",
     runner:{id:'sqex2', tabs:[
       {label:'Equivalent with IN', sql:"SELECT d.dept_name FROM departments d WHERE d.id IN (SELECT dept_id FROM employees WHERE dept_id IS NOT NULL);"}
     ]}}
  ],
  tip:{type:'c-tip', title:"The Value Selected Doesn't Matter", text:"Writing SELECT 1 (or SELECT * ) inside the EXISTS subquery is just convention — EXISTS never looks at the actual selected value, only whether a row was returned at all."}
},

'm8::NOT EXISTS': {
  intro:"NOT EXISTS is the negation of EXISTS inside a subquery context — it keeps outer rows where the correlated inner query finds NO matching row whatsoever, and unlike NOT IN, it's completely immune to NULL-related surprises.",
  body:[
    {h:'Finding Rows With No Match', p:"The Finance department has zero employees, so it's the only department where the correlated subquery below finds nothing — making NOT EXISTS true for that row alone.",
     runner:{id:'sqnex1', tabs:[
       {label:'Departments With No Staff', sql:"SELECT d.dept_name FROM departments d WHERE NOT EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id);"}
     ]}},
    {h:'A Classic Interview Pattern', p:"'Find employees who are not managers' is a frequent interview question, and NOT EXISTS handles the NULL manager_id values safely — no special filtering needed, unlike the NOT IN version of this same query.",
     runner:{id:'sqnex2', tabs:[
       {label:'Employees Who Are Not Managers', sql:"SELECT e.name FROM employees e WHERE NOT EXISTS (SELECT 1 FROM employees m WHERE m.manager_id = e.id);"}
     ]}}
  ],
  tip:{type:'c-note', title:'Always Safe with NULLs', text:"NOT EXISTS never falls into the 'NOT IN silently returns zero rows' trap that a NULL-containing subquery list creates — when in doubt about NULLs, reach for NOT EXISTS instead of NOT IN."}
},

'm8::ANY': {
  intro:"Used as a subquery comparison, ANY checks a value against every row a subquery returns and is true if the comparison succeeds against AT LEAST ONE of them — standard SQL syntax like value > ANY (subquery).",
  body:[
    {h:'Not Supported in SQLite', p:"Standard SQL would let you write <span class='ic'>WHERE salary &gt; ANY (SELECT salary FROM employees WHERE department = 'HR')</span> directly. SQLite (this in-browser engine) doesn't implement ANY/SOME as a subquery comparison operator — but 'greater than ANY value' logically means 'greater than the smallest value in the set', so MIN() reproduces the same result here.",
     runner:{id:'sqany1', tabs:[
       {label:'SQLite Equivalent (MIN)', sql:"SELECT name, salary FROM employees WHERE salary > (SELECT MIN(salary) FROM employees WHERE department = 'HR');"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL/SQL Server/Oracle: SELECT name, salary FROM employees WHERE salary > ANY (SELECT salary FROM employees WHERE department = 'HR'); — supported natively without needing the MIN() rewrite."}
},

'm8::ALL': {
  intro:"Used as a subquery comparison, ALL checks a value against every row a subquery returns and is true only if the comparison succeeds against EVERY one of them — standard SQL syntax like value > ALL (subquery).",
  body:[
    {h:'Not Supported in SQLite', p:"Standard SQL syntax is <span class='ic'>WHERE salary &gt; ALL (SELECT salary FROM employees WHERE department = 'HR')</span>. SQLite doesn't implement ALL as a subquery comparison operator either — since 'greater than ALL values' means 'greater than the largest value in the set', MAX() gives the identical result.",
     runner:{id:'sqall1', tabs:[
       {label:'SQLite Equivalent (MAX)', sql:"SELECT name, salary FROM employees WHERE salary > (SELECT MAX(salary) FROM employees WHERE department = 'HR');"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL/SQL Server/Oracle: SELECT name, salary FROM employees WHERE salary > ALL (SELECT salary FROM employees WHERE department = 'HR'); — this is the direct, portable form on databases that support ANY/ALL."}
},

'm9::Common Table Expressions': {
  intro:"A Common Table Expression (CTE) is a named, temporary result set defined with the WITH keyword — it exists only for the duration of the query that follows it, and makes complex SQL far easier to read than deeply nested subqueries.",
  body:[
    {h:'Basic WITH Syntax', p:"Write <span class='ic'>WITH cte_name AS (SELECT ...)</span>, then reference <span class='ic'>cte_name</span> just like a regular table in the main query underneath it.",
     runner:{id:'cte1', tabs:[
       {label:'Simple CTE', sql:"WITH high_earners AS (\n  SELECT name, department, salary FROM employees WHERE salary > 85000\n)\nSELECT * FROM high_earners ORDER BY salary DESC;"}
     ]}},
    {h:'CTE vs Subquery — Same Result, More Readable', p:"Anything a CTE can do, a nested subquery can technically do too — but naming the intermediate step makes multi-stage logic much easier to follow at a glance.",
     runner:{id:'cte2', tabs:[
       {label:'CTE Version', sql:"WITH dept_avg AS (\n  SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department\n)\nSELECT department, avg_sal FROM dept_avg WHERE avg_sal > 75000;"},
       {label:'Equivalent Subquery Version', sql:"SELECT department, avg_sal FROM (SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department) t WHERE avg_sal > 75000;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'CTEs Are Not Materialized by Default', text:"In most databases a CTE is just inline query logic given a name — the optimizer is free to inline or rewrite it, so a CTE alone doesn't automatically mean better performance, just better readability. (PostgreSQL is a partial exception with MATERIALIZED/NOT MATERIALIZED hints.)"}
},

'm9::Multiple CTE': {
  intro:"A single WITH clause can define several CTEs at once, separated by commas — and later CTEs are even allowed to reference earlier ones, letting you build up a multi-step calculation piece by piece.",
  body:[
    {h:'Defining Two CTEs Together', p:"Each CTE gets its own name and its own SELECT — separate them with a comma, not another WITH keyword.",
     runner:{id:'mcte1', tabs:[
       {label:'Two Independent CTEs', sql:"WITH dept_totals AS (\n  SELECT department, SUM(salary) AS total_pay FROM employees GROUP BY department\n),\ndept_counts AS (\n  SELECT department, COUNT(*) AS headcount FROM employees GROUP BY department\n)\nSELECT t.department, t.total_pay, c.headcount\nFROM dept_totals t JOIN dept_counts c ON t.department = c.department;"}
     ]}},
    {h:'A Later CTE Building on an Earlier One', p:"Here, dept_avg is computed first, and the second CTE, above_target, filters that result further — chaining logic step by step instead of nesting subqueries inside subqueries.",
     runner:{id:'mcte2', tabs:[
       {label:'Chained CTEs', sql:"WITH dept_avg AS (\n  SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department\n),\nabove_target AS (\n  SELECT * FROM dept_avg WHERE avg_sal > 75000\n)\nSELECT * FROM above_target ORDER BY avg_sal DESC;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Readability at Scale', text:"Reports that once required three or four levels of nested subqueries often become a short, linear chain of named CTEs — each one a clearly labeled step that's much easier to debug independently."}
},

'm9::Recursive CTE': {
  intro:"A recursive CTE repeatedly refers to itself to walk through hierarchical or graph-like data — the classic use case is an org chart, where each employee has a manager who is also an employee.",
  body:[
    {h:'Anatomy of WITH RECURSIVE', p:"A recursive CTE has two parts joined by UNION ALL: an <strong>anchor</strong> query (the starting point, with no self-reference) and a <strong>recursive</strong> query (which refers back to the CTE's own name and builds on the previous step)."},
    {h:'Walking the Management Chain', p:"This starts from Sarah (the top of the hierarchy, with no manager) and recursively finds everyone who reports to her, directly or indirectly, tracking how many levels deep each person is.",
     runner:{id:'rcte1', tabs:[
       {label:'Org Chart Recursion', sql:"WITH RECURSIVE org_chart AS (\n  SELECT id, name, manager_id, 0 AS depth\n  FROM employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.id, e.name, e.manager_id, oc.depth + 1\n  FROM employees e\n  JOIN org_chart oc ON e.manager_id = oc.id\n)\nSELECT * FROM org_chart ORDER BY depth, name;"}
     ]}},
    {h:'Building a Readable Path', p:"You can extend the recursive step to accumulate a text trail showing the full chain of command down to each employee.",
     runner:{id:'rcte2', tabs:[
       {label:'Management Path String', sql:"WITH RECURSIVE org_path AS (\n  SELECT id, name, manager_id, name AS path\n  FROM employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.id, e.name, e.manager_id, op.path || ' -> ' || e.name\n  FROM employees e\n  JOIN org_path op ON e.manager_id = op.id\n)\nSELECT name, path FROM org_path ORDER BY path;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Always Guard Against Infinite Loops', text:"A recursive CTE keeps running until the recursive query returns zero new rows — a data problem like a circular manager_id reference (A reports to B, B reports to A) would cause it to loop forever. Many databases let you cap this with a depth limit or a MAXRECURSION-style option (SQL Server) as a safety net."}
},

'm10::ROW_NUMBER': {
  intro:"Window functions calculate across rows without collapsing them like GROUP BY does. ROW_NUMBER assigns a unique sequential number to each row.",
  body:[{h:'Ranking Rows', p:"Compare ROW_NUMBER, RANK, and DENSE_RANK to see how they handle ties differently.",
    runner:{id:'rn1', tabs:[
      {label:'ROW_NUMBER', sql:"SELECT name, salary, ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn FROM employees;"},
      {label:'PARTITION BY', sql:"SELECT name, department, salary, DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS dept_rank FROM employees;"}
    ]}}],
  tip:{type:'c-warn', title:'Interview Trap', text:"For 'Nth highest salary' questions, use DENSE_RANK not RANK — RANK leaves gaps when there are ties."}
},

'm10::OVER': {
  intro:"OVER is what turns an ordinary function into a window function — it defines the 'window' of rows the function should look across for each row, without collapsing those rows into a single group like GROUP BY would.",
  body:[
    {h:'The Key Difference from GROUP BY', p:"A normal aggregate with GROUP BY replaces many rows with one summary row per group. The same function with OVER keeps every individual row, just adding an extra calculated column alongside it.",
     runner:{id:'over1', tabs:[
       {label:'GROUP BY (collapses rows)', sql:"SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department;"},
       {label:'OVER (keeps every row)', sql:"SELECT name, department, salary, AVG(salary) OVER (PARTITION BY department) AS dept_avg FROM employees;"}
     ]}},
    {h:'An Empty OVER() Sees the Whole Table', p:"Leaving the parentheses after OVER completely empty means the window is the entire result set — every row sees the same company-wide value.",
     runner:{id:'over2', tabs:[
       {label:'Whole-Table Window', sql:"SELECT name, salary, AVG(salary) OVER () AS company_avg, salary - AVG(salary) OVER () AS diff FROM employees;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Almost Any Aggregate Can Become a Window Function', text:"SUM, AVG, COUNT, MIN and MAX all work with OVER exactly like ROW_NUMBER, RANK and LEAD/LAG do — the OVER clause is what unlocks 'per-row' aggregation instead of 'per-group' aggregation."}
},

'm10::PARTITION BY': {
  intro:"PARTITION BY splits the rows inside a window function into independent groups — the function then resets and recalculates separately within each group, similar in spirit to GROUP BY but without collapsing any rows.",
  body:[
    {h:'Resetting the Calculation per Group', p:"Without PARTITION BY, ROW_NUMBER counts straight through the whole table. With PARTITION BY department, the numbering restarts at 1 for every new department.",
     runner:{id:'pb1', tabs:[
       {label:'No Partition', sql:"SELECT name, department, salary, ROW_NUMBER() OVER (ORDER BY salary DESC) AS overall_rank FROM employees;"},
       {label:'Partitioned by Department', sql:"SELECT name, department, salary, ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) AS dept_rank FROM employees;"}
     ]}},
    {h:'Multiple Partition Columns', p:"You can partition by more than one column at once — the window resets whenever ANY of the listed columns changes value.",
     runner:{id:'pb2', tabs:[
       {label:'Partition by Two Columns', sql:"SELECT name, department, city, salary, RANK() OVER (PARTITION BY department, city ORDER BY salary DESC) AS local_rank FROM employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'PARTITION BY vs GROUP BY', text:"GROUP BY reduces N rows down to however many groups exist. PARTITION BY (inside OVER) keeps all N rows — it only changes how the window function's calculation is scoped for each row."}
},

'm10::RANK': {
  intro:"RANK assigns a position to each row based on ORDER BY, giving tied rows the exact same rank — but it then skips ahead, leaving a gap in the numbering equal to the number of ties.",
  body:[
    {h:'Ties Cause Gaps', p:"Carol and Mike are tied for the same rank within Engineering here in some data variations — watch how RANK jumps straight from a tied rank to a rank several numbers higher, skipping the numbers in between.",
     runner:{id:'rk1', tabs:[
       {label:'RANK with Ties', sql:"SELECT name, department, salary, RANK() OVER (ORDER BY salary DESC) AS overall_rank FROM employees;"}
     ]}},
    {h:'RANK vs ROW_NUMBER Side by Side', p:"ROW_NUMBER never repeats a number and never skips one — even tied rows get distinct sequential numbers, decided arbitrarily by the database when values are otherwise equal.",
     runner:{id:'rk2', tabs:[
       {label:'Compare Both', sql:"SELECT name, salary, ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn, RANK() OVER (ORDER BY salary DESC) AS rk FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Gaps Can Break "Top N" Logic', text:"If you filter WHERE rk <= 3 expecting exactly 3 rows, ties can mean you get more or fewer than 3 depending on where the gaps fall — always check whether RANK's gap behavior is actually what your report needs."}
},

'm10::DENSE_RANK': {
  intro:"DENSE_RANK works just like RANK — tied rows share the same rank — but it never leaves gaps in the numbering; the very next distinct value always gets the next consecutive integer.",
  body:[
    {h:'No Gaps After Ties', p:"Compare this directly against RANK on the same data — DENSE_RANK's numbers stay consecutive (1, 2, 3...) even when earlier rows tied, while RANK would have skipped ahead.",
     runner:{id:'dr1', tabs:[
       {label:'DENSE_RANK vs RANK', sql:"SELECT name, salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS dense_rk, RANK() OVER (ORDER BY salary DESC) AS rk FROM employees;"}
     ]}},
    {h:"The 'Nth Highest Salary' Pattern", p:"DENSE_RANK is the standard, correct tool for 'find the 2nd highest distinct salary' style interview questions — filtering on RANK instead can silently give the wrong answer whenever there's a tie for 1st place.",
     runner:{id:'dr2', tabs:[
       {label:'2nd Highest Distinct Salary', sql:"SELECT name, salary FROM (SELECT name, salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS dr FROM employees) t WHERE dr = 2;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Rule of Thumb', text:"Use ROW_NUMBER when you need a strictly unique sequence, RANK when gaps after ties are meaningful to your report, and DENSE_RANK when you want a clean, gap-free 1st/2nd/3rd style ranking."}
},

'm10::NTILE': {
  intro:"NTILE(n) divides the rows in a window into n roughly equal-sized buckets, numbered 1 through n — useful for splitting data into quartiles, quintiles, or any custom number of even groups.",
  body:[
    {h:'Splitting into Buckets', p:"NTILE(3) here divides the 6 employees into 3 pay-tier groups of 2 each, ordered from highest to lowest salary.",
     runner:{id:'nt1', tabs:[
       {label:'3 Salary Tiers', sql:"SELECT name, salary, NTILE(3) OVER (ORDER BY salary DESC) AS pay_tier FROM employees;"}
     ]}},
    {h:'Uneven Groups', p:"When the row count doesn't divide evenly, NTILE distributes the extra rows to the earliest groups first — some buckets end up with one more row than others.",
     runner:{id:'nt2', tabs:[

  tip:{type:'c-note', title:'Common Use Case', text:"NTILE(4) is the standard way to compute quartiles directly in SQL (e.g. customer spending quartiles, performance review tiers) without needing a separate statistics tool."}

'm10::LEAD': {
  intro:"LEAD looks forward to a value from a LATER row in the window's ordering, letting you compare the current row directly against what comes next — without a self-join.",
  body:[
    {h:'Peeking at the Next Row', p:"For each employee ordered by salary, LEAD grabs the very next (lower) salary in the list — the last row has nothing after it, so LEAD returns NULL there.",
     runner:{id:'ld1', tabs:[
       {label:'Next Lower Salary', sql:"SELECT name, salary, LEAD(salary) OVER (ORDER BY salary DESC) AS next_lower_salary FROM employees;"}
     ]}},
    {h:'Supplying a Default Instead of NULL', p:"LEAD's optional second argument sets how many rows ahead to look (default 1), and the third argument supplies a default value to use instead of NULL when there's no next row.",
     runner:{id:'ld2', tabs:[
       {label:'LEAD with Default', sql:"SELECT name, salary, LEAD(salary, 1, 0) OVER (ORDER BY salary DESC) AS next_lower_salary FROM employees;"}

  ],
  tip:{type:'c-tip', title:'Great for Gap and Trend Analysis', text:"LEAD is the natural fit for questions like 'how much higher is this month's revenue than next month's' or 'find the gap between one employee's salary and the next person down' — all without a self-join."}
},

'm10::LAG': {
  intro:"LAG is the mirror image of LEAD — it looks backward to a value from an EARLIER row in the window's ordering, commonly used to compare each row against the one immediately before it.",
  body:[
    {h:'Peeking at the Previous Row', p:"Ordered by salary descending, LAG grabs the salary of the row just above the current one — the very first row has nothing before it, so LAG returns NULL there.",
     runner:{id:'lg1', tabs:[
       {label:'Previous Higher Salary', sql:"SELECT name, salary, LAG(salary) OVER (ORDER BY salary DESC) AS prev_higher_salary FROM employees;"}
     ]}},
    {h:'Calculating a Row-to-Row Difference', p:"Combining LAG with simple subtraction is the standard way to compute period-over-period or rank-over-rank differences directly in SQL.",
     runner:{id:'lg2', tabs:[
       {label:'Gap to Previous Row', sql:"SELECT name, salary, salary - LAG(salary) OVER (ORDER BY salary DESC) AS gap_from_prev FROM employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'LEAD and LAG Both Support PARTITION BY', text:"Just like every other window function, LEAD and LAG can be scoped per group: LAG(salary) OVER (PARTITION BY department ORDER BY salary DESC) compares each employee only to the previous-ranked employee within their own department."}
},

'm10::FIRST_VALUE': {
  intro:"FIRST_VALUE returns the value from the very first row of the current window frame — for example, the highest salary in a department, repeated alongside every row in that department.",
  body:[
    {h:'Tagging Every Row with the Top Value', p:"Unlike MAX() OVER (which would give the same answer here), FIRST_VALUE makes the intent explicit: 'take the value from whichever row is first once ordered'.",
     runner:{id:'fv1', tabs:[
       {label:'Highest Salary per Department', sql:"SELECT name, department, salary, FIRST_VALUE(name) OVER (PARTITION BY department ORDER BY salary DESC) AS top_earner_in_dept FROM employees;"}
     ]}},
    {h:'Comparing Each Row to the Top', p:"Combine FIRST_VALUE with basic arithmetic to show how far behind the top performer each person in their department is.",
     runner:{id:'fv2', tabs:[

     ]}}
  ],

},

'm10::LAST_VALUE': {
  intro:"LAST_VALUE returns the value from the last row of the current window frame — but it has a famous gotcha: with the default frame, 'last' usually means 'the current row', not the actual last row of the partition.",
  body:[
    {h:'The Default Frame Trap', p:"Without an explicit frame, most databases default to <span class='ic'>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</span> — so LAST_VALUE just returns the CURRENT row's own value, which is rarely what people expect.",
     runner:{id:'lv1', tabs:[
       {label:'❌ Surprising Default Behavior', sql:"SELECT name, department, salary, LAST_VALUE(name) OVER (PARTITION BY department ORDER BY salary DESC) AS last_value_result FROM employees;"}
     ]}},
    {h:'The Fix: an Explicit Frame', p:"Adding <span class='ic'>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING</span> tells the database to consider the ENTIRE partition when picking the last row — now it correctly returns the lowest earner per department.",
     runner:{id:'lv2', tabs:[
       {label:'✅ Correct with Explicit Frame', sql:"SELECT name, department, salary, LAST_VALUE(name) OVER (PARTITION BY department ORDER BY salary DESC ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS lowest_earner_in_dept FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Always Set the Frame Explicitly for LAST_VALUE', text:"This is one of the most common real-world SQL bugs — always pair LAST_VALUE with an explicit ROWS BETWEEN ... AND UNBOUNDED FOLLOWING frame, or it will silently just echo back the current row."}
},

  intro:"A running total (cumulative sum) adds up a value progressively, row by row, as you move through an ordered sequence — SUM() combined with OVER and ORDER BY is the standard SQL way to build one.",

     ]}},
    {h:'Running Total per Group', p:"Adding PARTITION BY resets the running total separately for each department, so each group accumulates independently.",

     ]}}
  ],
  tip:{type:'c-tip', title:'Why This Beats a Self-Join', text:"Before window functions existed, running totals required a self-join or a correlated subquery comparing every row to all previous rows — SUM() OVER (ORDER BY ...) computes the identical result in one clean pass, and scales far better."}
},

     runner:{id:'ma1', tabs:[

     ]}},

// ═══════════════════════════════════════════════════════
// SQL.JS ENGINE SETUP
// ═══════════════════════════════════════════════════════
let sqlDB = null, sqlReady = false;
async function initSQL() {
  try {
    const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
    sqlDB = new SQL.Database();
    sqlDB.run(`
      CREATE TABLE employees (id INTEGER PRIMARY KEY, name TEXT, department TEXT, salary INTEGER, city TEXT, dept_id INTEGER, manager_id INTEGER);
      INSERT INTO employees VALUES
        (1,'Alice','Engineering',95000,'Mumbai',10,NULL),
        (2,'Bob','Marketing',72000,'Delhi',20,5),
        (3,'Carol','Engineering',88000,'Bangalore',10,1),
        (4,'David','HR',65000,'Mumbai',30,5),
        (5,'Sarah','Management',110000,'Delhi',NULL,NULL),
        (6,'Mike','Engineering',91000,'Bangalore',10,1);
      CREATE TABLE departments (id INTEGER PRIMARY KEY, dept_name TEXT, location TEXT);
      INSERT INTO departments VALUES (10,'Engineering','Bangalore'),(20,'Marketing','Delhi'),(30,'HR','Mumbai'),(40,'Finance','Mumbai');
    `);
    sqlReady = true;
  } catch(e){ console.error(e); }
}
initSQL();

function runSQL(editorId, runnerId) {
  const editor = document.getElementById(editorId);
  if (!editor) return;
  const sql = editor.value.trim();
  if (!sql) return;
  const resultDiv = document.getElementById(runnerId+'-result');
  const statusDiv = document.getElementById(runnerId+'-status');
  if (!sqlReady) { resultDiv.className='result-wrap show'; resultDiv.innerHTML='<div class="result-error">⚠️ SQL engine loading, try again in a moment.</div>'; return; }
  const t0 = performance.now();
  resultDiv.className = 'result-wrap show';
  try {
    const stmts = sql.split(';').map(s=>s.trim()).filter(Boolean);
    let lastResult = null, rowsAffected = 0;
    for (const stmt of stmts) {
      const up = stmt.toUpperCase();
      if (up.startsWith('SELECT')||up.startsWith('WITH')||up.startsWith('EXPLAIN')||up.startsWith('PRAGMA')) lastResult = sqlDB.exec(stmt);
      else { sqlDB.run(stmt); rowsAffected++; }
    }
    const elapsed = (performance.now()-t0).toFixed(1);
    if (lastResult && lastResult.length) {
      const res = lastResult[0];
      let html = `<div class="result-head"><span>✅ ${res.values.length} rows</span><span>${elapsed}ms</span></div><div class="result-scroll"><table class="result-table"><thead><tr>`;
      res.columns.forEach(c=>html+=`<th>${c}</th>`);
      html += '</tr></thead><tbody>';
      res.values.forEach(row=>{ html+='<tr>'; row.forEach(v=>{ const isNull=v===null; const isNum=typeof v==='number'; html+=`<td class="${isNull?'td-null':isNum?'td-num':''}">${isNull?'NULL':v}</td>`; }); html+='</tr>'; });
      html += '</tbody></table></div>';
      resultDiv.innerHTML = html;
      if(statusDiv) statusDiv.innerHTML = `<span>✅ ${res.values.length} rows</span><span>${elapsed}ms</span>`;
    } else {
      resultDiv.innerHTML = `<div class="result-msg">✅ ${rowsAffected} statement(s) executed.</div>`;
    }
  } catch(e) {
    resultDiv.innerHTML = `<div class="result-error">❌ ${e.message}</div>`;
  }
}
function loadSnippet(editorId, sql, runnerId, tabEl) {
  const editor = document.getElementById(editorId);
  if (editor) editor.value = sql;
  const r = document.getElementById(runnerId+'-result');
  if (r) r.className = 'result-wrap';
  if (tabEl) { const p = tabEl.closest('.runner-tabs'); if(p) p.querySelectorAll('.rtab').forEach(t=>t.classList.remove('active')); tabEl.classList.add('active'); }
}

// ═══════════════════════════════════════════════════════
// RENDER: SIDEBAR (fully dynamic from MODULES)
// ═══════════════════════════════════════════════════════
function totalTopics(){ return MODULES.reduce((a,m)=>a+m.topics.length,0); }
function builtCount(){ return Object.keys(LESSONS).length; }

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const total = totalTopics(), built = builtCount();
  let html = `<div class="sb-prog-wrap"><div class="sb-prog-title"><span>COURSE PROGRESS</span><span>${built} / ${total} topics live</span></div><div class="sb-prog-bar"><div class="sb-prog-fi" style="width:${(built/total*100).toFixed(1)}%"></div></div></div>`;
  MODULES.forEach((m,i)=>{
    html += `<div class="sb-mod" data-mod="${m.id}">
      <div class="sb-mod-head" onclick="toggleMod('${m.id}')">
        <span class="sb-mod-num">${m.icon}</span>
        <span class="sb-mod-title">${m.title}</span>
        <span class="sb-mod-count">${m.topics.length}</span>
        <span class="sb-mod-arrow">▶</span>
      </div>
      <div class="sb-topics" id="topics-${m.id}">`;
    m.topics.forEach(t=>{
      const key = m.id+'::'+t;
      const isBuilt = !!LESSONS[key];
      html += `<div class="sb-topic ${isBuilt?'built':''}" onclick="openTopic('${m.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`;
    });
    html += `</div></div>`;
  });
  sb.innerHTML = html;
  document.getElementById('progPill').textContent = `${built} / ${total} topics built`;

  const msel = document.getElementById('mobileSel');
  msel.innerHTML = MODULES.map(m=>`<optgroup label="${m.icon} ${m.title}">${m.topics.map(t=>`<option value="${m.id}::${t}">${t}</option>`).join('')}</optgroup>`).join('');
}

function toggleMod(id) {
  const head = document.querySelector(`.sb-mod[data-mod="${id}"] .sb-mod-head`);
  const topics = document.getElementById('topics-'+id);
  const wasOpen = topics.classList.contains('open');
  document.querySelectorAll('.sb-topics.open').forEach(t=>t.classList.remove('open'));
  document.querySelectorAll('.sb-mod-head.open').forEach(h=>h.classList.remove('open'));
  if (!wasOpen) { topics.classList.add('open'); head.classList.add('open'); }
}

function onMobileSelect(val) {
  const [modId, topic] = val.split('::');
  openTopic(modId, topic);
}

// ═══════════════════════════════════════════════════════
// RENDER: CONTENT AREA
// ═══════════════════════════════════════════════════════
function openTopic(modId, topic) {
  const mod = MODULES.find(m=>m.id===modId);
  const key = modId+'::'+topic;
  const lesson = LESSONS[key];
  const content = document.getElementById('content');

  document.querySelectorAll('.sb-topic').forEach(el=>el.classList.remove('active'));
  const idx = mod.topics.indexOf(topic);

  // open the right sidebar section & highlight
  const topicsDiv = document.getElementById('topics-'+modId);
  if (topicsDiv && !topicsDiv.classList.contains('open')) toggleMod(modId);
  const items = topicsDiv ? topicsDiv.querySelectorAll('.sb-topic') : [];
  if (items[idx]) items[idx].classList.add('active');

  let html = `<div class="lesson-wrap">`;
  html += `<div class="l-tag">${mod.icon} ${mod.title} · Topic ${idx+1} of ${mod.topics.length}</div>`;
  html += `<h1 class="l-h1">${topic}</h1>`;

  if (lesson) {
    html += `<p class="l-intro">${lesson.intro}</p>`;
    lesson.body.forEach(sec=>{
      html += `<h2>${sec.h}</h2><p>${sec.p}</p>`;
      if (sec.runner) html += buildRunnerHTML(sec.runner);
    });
    if (lesson.tip) html += `<div class="callout ${lesson.tip.type}"><div class="callout-body"><strong>${lesson.tip.title}</strong>${lesson.tip.text}</div></div>`;
  } else {
    html += `<p class="l-intro">This topic is part of the <strong>${mod.title}</strong> module in the master course index.</p>`;
    html += `<div class="coming-soon-box">
      <div class="cs-title">🚧 Full lesson content coming next</div>
      <div class="cs-sub">This topic is already reserved in the course structure — nothing from the 27-module index is ever dropped. Ask for "<strong>${topic}</strong>" (or the whole ${mod.title} module) in your next message and it'll be built with explanation, examples, and a live SQL runner.</div>
    </div>`;
  }

  // module topic overview grid
  html += `<h2 style="margin-top:2rem">More in ${mod.title}</h2><div class="topic-grid">`;
  mod.topics.forEach(t=>{
    const b = !!LESSONS[modId+'::'+t];
    html += `<div class="topic-card ${b?'built':''}" onclick="openTopic('${modId}','${t.replace(/'/g,"\\'")}')">
      <span class="tc-dot ${b?'built':'pending'}">${b?'●':'○'}</span>
      <span class="tc-title">${t}</span>
      <span class="tc-badge ${b?'ready':'soon'}">${b?'Ready':'Soon'}</span>
    </div>`;
  });
  html += `</div>`;

  // prev/next nav
  const prevTopic = idx>0 ? mod.topics[idx-1] : null;
  const nextTopic = idx<mod.topics.length-1 ? mod.topics[idx+1] : null;
  html += `<div class="l-nav">`;
  html += prevTopic ? `<button class="lnbtn" onclick="openTopic('${modId}','${prevTopic.replace(/'/g,"\\'")}')">← ${prevTopic}</button>` : `<span></span>`;
  html += nextTopic ? `<button class="lnbtn primary" onclick="openTopic('${modId}','${nextTopic.replace(/'/g,"\\'")}')">${nextTopic} →</button>` : `<span></span>`;
  html += `</div></div>`;

  content.innerHTML = html;
  content.scrollTo(0,0);
  document.getElementById('mobileSel').value = key;
}

function buildRunnerHTML(runner) {
  const rid = 'r-'+runner.id, eid = 'e-'+runner.id;
  let tabsHtml = runner.tabs.map((t,i)=>`<button class="rtab ${i===0?'active':''}" onclick="loadSnippet('${eid}', \`${t.sql.replace(/`/g,'\\`')}\`, '${rid}', this)">${t.label}</button>`).join('');
  return `<div class="runner" id="${rid}">
    <div class="runner-head"><div class="runner-title"><span class="runner-dot"></span> Live SQL Runner</div>
      <div class="runner-actions"><button class="r-btn run" onclick="runSQL('${eid}','${rid}')">▶ Run SQL</button></div></div>
    <div class="runner-tabs">${tabsHtml}</div>
    <div class="editor-wrap"><textarea id="${eid}" spellcheck="false">${runner.tabs[0].sql}</textarea></div>
    <div class="runner-status" id="${rid}-status"><span>Press ▶ Run SQL</span><span></span></div>
    <div class="result-wrap" id="${rid}-result"></div>
  </div>`;
}

// overview / home page
function renderHome() {
  const content = document.getElementById('content');
  const total = totalTopics(), built = builtCount();
  let html = `<div class="lesson-wrap">
    <div class="l-tag">🏠 Course Overview</div>
    <h1 class="l-h1">SQL Academy — <span class="g">0 to 20+ Years, One Course</span></h1>
    <p class="l-intro">27 modules, ${total}+ topics, live in-browser SQL runner, and 300+ interview questions — structured so nothing from the index is ever missing. Green dots (●) are fully built with explanations and runnable examples; hollow dots (○) are reserved topics ready to be filled next.</p>
    <h2>Modules</h2>
    <div class="topic-grid">`;
  MODULES.forEach(m=>{
    const builtInMod = m.topics.filter(t=>LESSONS[m.id+'::'+t]).length;
    html += `<div class="topic-card" onclick="toggleMod('${m.id}'); document.getElementById('sidebar').scrollIntoView()">
      <span class="tc-dot ${builtInMod>0?'built':'pending'}">${m.icon}</span>
      <span class="tc-title">${m.title}</span>
      <span class="tc-badge ${builtInMod===m.topics.length?'ready':'soon'}">${builtInMod}/${m.topics.length}</span>
    </div>`;
  });
  html += `</div>
    <div class="coming-soon-box">
      <div class="cs-title">📌 How this course grows</div>
      <div class="cs-sub">Tell me which module or topic to build next (e.g. "JOINs module" or "explain RECURSIVE CTE") and it gets added right into this same structure with a live SQL runner — the sidebar and progress bar update automatically.</div>
    </div>
  </div>`;
  content.innerHTML = html;
}

function searchTopics(q) {
  q = q.trim().toLowerCase();
  if (!q) { renderSidebar(); return; }
  const sb = document.getElementById('sidebar');
  let html = '';
  MODULES.forEach(m=>{
    const matches = m.topics.filter(t=>t.toLowerCase().includes(q));
    if (matches.length) {
      html += `<div class="sb-mod"><div class="sb-mod-head open"><span class="sb-mod-num">${m.icon}</span><span class="sb-mod-title">${m.title}</span></div><div class="sb-topics open">`;
      matches.forEach(t=>{
        const isBuilt = !!LESSONS[m.id+'::'+t];
        html += `<div class="sb-topic ${isBuilt?'built':''}" onclick="openTopic('${m.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`;
      });
      html += `</div></div>`;
    }
  });
  sb.innerHTML = html || `<div style="padding:1rem;color:var(--txt3);font-size:.8rem">No topics found</div>`;
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
renderSidebar();
renderHome();
</script>
</body>
