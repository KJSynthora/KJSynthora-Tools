    {h:'Referencing the Outer Row', p:"Notice <span class='ic'>e.dept_id</span> inside the subquery — that's the correlation. For each employee row, the subquery recalculates the average salary of just that employee's own department.",
     runner:{id:'cor1', tabs:[
       {label:'Correlated Subquery', sql:"SELECT e.name, e.salary, e.dept_id FROM employees e WHERE e.salary > (SELECT AVG(salary) FROM employees WHERE dept_id = e.dept_id);"}
     ]}},
    {h:'Correlated Subquery in SELECT', p:"Correlated subqueries can also sit in the SELECT list itself, computing a per-row value that depends on that row's own data.",
     runner:{id:'cor2', tabs:[
       {label:'Per-Row Rank Count', sql:"SELECT e.name, e.salary, (SELECT COUNT(*) FROM employees e2 WHERE e2.dept_id = e.dept_id AND e2.salary > e.salary) AS higher_paid_in_dept FROM employees e;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Performance Cost', text:"Because a correlated subquery logically re-executes for every outer row, it can be much slower than an equivalent JOIN or window function on large tables — for the 'higher_paid_in_dept' example above, RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) would scale far better."}
},

'm8::EXISTS': {
  intro:"Inside a subquery, EXISTS checks only whether the inner query returns at least one row for the current outer row — it's almost always written as a correlated subquery, and it's usually the fastest way to answer 'does a related row exist?'.",
  body:[
    {h:'A Correlated Existence Check', p:"The subquery here is correlated to <span class='ic'>d.id</span> from the outer query — for every department, it asks 'is there at least one employee row matching this department id?'.",
     runner:{id:'sqex1', tabs:[
       {label:'Departments With Staff', sql:"SELECT d.dept_name FROM departments d WHERE EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id);"}
     ]}},
    {h:'EXISTS vs IN', p:"EXISTS and IN often solve the same problem, but EXISTS can short-circuit as soon as one match is found, while IN typically needs the full inner result set first — for large, correlated lookups, EXISTS is usually preferred.",
     runner:{id:'sqex2', tabs:[
       {label:'Equivalent with IN', sql:"SELECT d.dept_name FROM departments d WHERE d.id IN (SELECT dept_id FROM employees WHERE dept_id IS NOT NULL);"}
     ]}}
  ],
  tip:{type:'c-tip', title:"The Value Selected Doesn't Matter", text:"Writing SELECT 1 (or SELECT * ) inside the EXISTS subquery is just convention — EXISTS never looks at the actual selected value, only whether a row was returned at all."}
},

'm8::NOT EXISTS': {
  intro:"NOT EXISTS is the negation of EXISTS inside a subquery context — it keeps outer rows where the correlated inner query finds NO matching row whatsoever, and unlike NOT IN, it's completely immune to NULL-related surprises.",
  body:[
    {h:'Finding Rows With No Match', p:"The Finance department has zero employees, so it's the only department where the correlated subquery below finds nothing — making NOT EXISTS true for that row alone.",
     runner:{id:'sqnex1', tabs:[
       {label:'Departments With No Staff', sql:"SELECT d.dept_name FROM departments d WHERE NOT EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id);"}
     ]}},
    {h:'A Classic Interview Pattern', p:"'Find employees who are not managers' is a frequent interview question, and NOT EXISTS handles the NULL manager_id values safely — no special filtering needed, unlike the NOT IN version of this same query.",
     runner:{id:'sqnex2', tabs:[
       {label:'Employees Who Are Not Managers', sql:"SELECT e.name FROM employees e WHERE NOT EXISTS (SELECT 1 FROM employees m WHERE m.manager_id = e.id);"}
     ]}}
  ],
  tip:{type:'c-note', title:'Always Safe with NULLs', text:"NOT EXISTS never falls into the 'NOT IN silently returns zero rows' trap that a NULL-containing subquery list creates — when in doubt about NULLs, reach for NOT EXISTS instead of NOT IN."}
},

'm8::ANY': {
  intro:"Used as a subquery comparison, ANY checks a value against every row a subquery returns and is true if the comparison succeeds against AT LEAST ONE of them — standard SQL syntax like value > ANY (subquery).",
  body:[
    {h:'Not Supported in SQLite', p:"Standard SQL would let you write <span class='ic'>WHERE salary &gt; ANY (SELECT salary FROM employees WHERE department = 'HR')</span> directly. SQLite (this in-browser engine) doesn't implement ANY/SOME as a subquery comparison operator — but 'greater than ANY value' logically means 'greater than the smallest value in the set', so MIN() reproduces the same result here.",
     runner:{id:'sqany1', tabs:[
       {label:'SQLite Equivalent (MIN)', sql:"SELECT name, salary FROM employees WHERE salary > (SELECT MIN(salary) FROM employees WHERE department = 'HR');"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL/SQL Server/Oracle: SELECT name, salary FROM employees WHERE salary > ANY (SELECT salary FROM employees WHERE department = 'HR'); — supported natively without needing the MIN() rewrite."}
},

'm8::ALL': {
  intro:"Used as a subquery comparison, ALL checks a value against every row a subquery returns and is true only if the comparison succeeds against EVERY one of them — standard SQL syntax like value > ALL (subquery).",
  body:[
    {h:'Not Supported in SQLite', p:"Standard SQL syntax is <span class='ic'>WHERE salary &gt; ALL (SELECT salary FROM employees WHERE department = 'HR')</span>. SQLite doesn't implement ALL as a subquery comparison operator either — since 'greater than ALL values' means 'greater than the largest value in the set', MAX() gives the identical result.",
     runner:{id:'sqall1', tabs:[
       {label:'SQLite Equivalent (MAX)', sql:"SELECT name, salary FROM employees WHERE salary > (SELECT MAX(salary) FROM employees WHERE department = 'HR');"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL/SQL Server/Oracle: SELECT name, salary FROM employees WHERE salary > ALL (SELECT salary FROM employees WHERE department = 'HR'); — this is the direct, portable form on databases that support ANY/ALL."}
},

'm9::Common Table Expressions': {
  intro:"A Common Table Expression (CTE) is a named, temporary result set defined with the WITH keyword — it exists only for the duration of the query that follows it, and makes complex SQL far easier to read than deeply nested subqueries.",
  body:[
    {h:'Basic WITH Syntax', p:"Write <span class='ic'>WITH cte_name AS (SELECT ...)</span>, then reference <span class='ic'>cte_name</span> just like a regular table in the main query underneath it.",
     runner:{id:'cte1', tabs:[
       {label:'Simple CTE', sql:"WITH high_earners AS (\n  SELECT name, department, salary FROM employees WHERE salary > 85000\n)\nSELECT * FROM high_earners ORDER BY salary DESC;"}
     ]}},
    {h:'CTE vs Subquery — Same Result, More Readable', p:"Anything a CTE can do, a nested subquery can technically do too — but naming the intermediate step makes multi-stage logic much easier to follow at a glance.",
     runner:{id:'cte2', tabs:[
       {label:'CTE Version', sql:"WITH dept_avg AS (\n  SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department\n)\nSELECT department, avg_sal FROM dept_avg WHERE avg_sal > 75000;"},
       {label:'Equivalent Subquery Version', sql:"SELECT department, avg_sal FROM (SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department) t WHERE avg_sal > 75000;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'CTEs Are Not Materialized by Default', text:"In most databases a CTE is just inline query logic given a name — the optimizer is free to inline or rewrite it, so a CTE alone doesn't automatically mean better performance, just better readability. (PostgreSQL is a partial exception with MATERIALIZED/NOT MATERIALIZED hints.)"}
},

'm9::Multiple CTE': {
  intro:"A single WITH clause can define several CTEs at once, separated by commas — and later CTEs are even allowed to reference earlier ones, letting you build up a multi-step calculation piece by piece.",
  body:[
    {h:'Defining Two CTEs Together', p:"Each CTE gets its own name and its own SELECT — separate them with a comma, not another WITH keyword.",
     runner:{id:'mcte1', tabs:[
       {label:'Two Independent CTEs', sql:"WITH dept_totals AS (\n  SELECT department, SUM(salary) AS total_pay FROM employees GROUP BY department\n),\ndept_counts AS (\n  SELECT department, COUNT(*) AS headcount FROM employees GROUP BY department\n)\nSELECT t.department, t.total_pay, c.headcount\nFROM dept_totals t JOIN dept_counts c ON t.department = c.department;"}
     ]}},
    {h:'A Later CTE Building on an Earlier One', p:"Here, dept_avg is computed first, and the second CTE, above_target, filters that result further — chaining logic step by step instead of nesting subqueries inside subqueries.",
     runner:{id:'mcte2', tabs:[
       {label:'Chained CTEs', sql:"WITH dept_avg AS (\n  SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department\n),\nabove_target AS (\n  SELECT * FROM dept_avg WHERE avg_sal > 75000\n)\nSELECT * FROM above_target ORDER BY avg_sal DESC;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Readability at Scale', text:"Reports that once required three or four levels of nested subqueries often become a short, linear chain of named CTEs — each one a clearly labeled step that's much easier to debug independently."}
},

'm9::Recursive CTE': {
  intro:"A recursive CTE repeatedly refers to itself to walk through hierarchical or graph-like data — the classic use case is an org chart, where each employee has a manager who is also an employee.",
  body:[
    {h:'Anatomy of WITH RECURSIVE', p:"A recursive CTE has two parts joined by UNION ALL: an <strong>anchor</strong> query (the starting point, with no self-reference) and a <strong>recursive</strong> query (which refers back to the CTE's own name and builds on the previous step)."},
    {h:'Walking the Management Chain', p:"This starts from Sarah (the top of the hierarchy, with no manager) and recursively finds everyone who reports to her, directly or indirectly, tracking how many levels deep each person is.",
     runner:{id:'rcte1', tabs:[
       {label:'Org Chart Recursion', sql:"WITH RECURSIVE org_chart AS (\n  SELECT id, name, manager_id, 0 AS depth\n  FROM employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.id, e.name, e.manager_id, oc.depth + 1\n  FROM employees e\n  JOIN org_chart oc ON e.manager_id = oc.id\n)\nSELECT * FROM org_chart ORDER BY depth, name;"}
     ]}},
    {h:'Building a Readable Path', p:"You can extend the recursive step to accumulate a text trail showing the full chain of command down to each employee.",
     runner:{id:'rcte2', tabs:[
       {label:'Management Path String', sql:"WITH RECURSIVE org_path AS (\n  SELECT id, name, manager_id, name AS path\n  FROM employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.id, e.name, e.manager_id, op.path || ' -> ' || e.name\n  FROM employees e\n  JOIN org_path op ON e.manager_id = op.id\n)\nSELECT name, path FROM org_path ORDER BY path;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Always Guard Against Infinite Loops', text:"A recursive CTE keeps running until the recursive query returns zero new rows — a data problem like a circular manager_id reference (A reports to B, B reports to A) would cause it to loop forever. Many databases let you cap this with a depth limit or a MAXRECURSION-style option (SQL Server) as a safety net."}
},

'm10::ROW_NUMBER': {
  intro:"Window functions calculate across rows without collapsing them like GROUP BY does. ROW_NUMBER assigns a unique sequential number to each row.",
  body:[{h:'Ranking Rows', p:"Compare ROW_NUMBER, RANK, and DENSE_RANK to see how they handle ties differently.",
    runner:{id:'rn1', tabs:[
      {label:'ROW_NUMBER', sql:"SELECT name, salary, ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn FROM employees;"},
      {label:'PARTITION BY', sql:"SELECT name, department, salary, DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS dept_rank FROM employees;"}
    ]}}],
  tip:{type:'c-warn', title:'Interview Trap', text:"For 'Nth highest salary' questions, use DENSE_RANK not RANK — RANK leaves gaps when there are ties."}
},

'm10::OVER': {
  intro:"OVER is what turns an ordinary function into a window function — it defines the 'window' of rows the function should look across for each row, without collapsing those rows into a single group like GROUP BY would.",
  body:[
    {h:'The Key Difference from GROUP BY', p:"A normal aggregate with GROUP BY replaces many rows with one summary row per group. The same function with OVER keeps every individual row, just adding an extra calculated column alongside it.",
     runner:{id:'over1', tabs:[
       {label:'GROUP BY (collapses rows)', sql:"SELECT department, AVG(salary) AS avg_sal FROM employees GROUP BY department;"},
       {label:'OVER (keeps every row)', sql:"SELECT name, department, salary, AVG(salary) OVER (PARTITION BY department) AS dept_avg FROM employees;"}
     ]}},
    {h:'An Empty OVER() Sees the Whole Table', p:"Leaving the parentheses after OVER completely empty means the window is the entire result set — every row sees the same company-wide value.",
     runner:{id:'over2', tabs:[
       {label:'Whole-Table Window', sql:"SELECT name, salary, AVG(salary) OVER () AS company_avg, salary - AVG(salary) OVER () AS diff FROM employees;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Almost Any Aggregate Can Become a Window Function', text:"SUM, AVG, COUNT, MIN and MAX all work with OVER exactly like ROW_NUMBER, RANK and LEAD/LAG do — the OVER clause is what unlocks 'per-row' aggregation instead of 'per-group' aggregation."}
},

'm10::PARTITION BY': {
  intro:"PARTITION BY splits the rows inside a window function into independent groups — the function then resets and recalculates separately within each group, similar in spirit to GROUP BY but without collapsing any rows.",
  body:[
    {h:'Resetting the Calculation per Group', p:"Without PARTITION BY, ROW_NUMBER counts straight through the whole table. With PARTITION BY department, the numbering restarts at 1 for every new department.",
     runner:{id:'pb1', tabs:[
       {label:'No Partition', sql:"SELECT name, department, salary, ROW_NUMBER() OVER (ORDER BY salary DESC) AS overall_rank FROM employees;"},
       {label:'Partitioned by Department', sql:"SELECT name, department, salary, ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) AS dept_rank FROM employees;"}
     ]}},
    {h:'Multiple Partition Columns', p:"You can partition by more than one column at once — the window resets whenever ANY of the listed columns changes value.",
     runner:{id:'pb2', tabs:[
       {label:'Partition by Two Columns', sql:"SELECT name, department, city, salary, RANK() OVER (PARTITION BY department, city ORDER BY salary DESC) AS local_rank FROM employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'PARTITION BY vs GROUP BY', text:"GROUP BY reduces N rows down to however many groups exist. PARTITION BY (inside OVER) keeps all N rows — it only changes how the window function's calculation is scoped for each row."}
},

'm10::RANK': {
  intro:"RANK assigns a position to each row based on ORDER BY, giving tied rows the exact same rank — but it then skips ahead, leaving a gap in the numbering equal to the number of ties.",
  body:[
    {h:'Ties Cause Gaps', p:"Carol and Mike are tied for the same rank within Engineering here in some data variations — watch how RANK jumps straight from a tied rank to a rank several numbers higher, skipping the numbers in between.",
     runner:{id:'rk1', tabs:[
       {label:'RANK with Ties', sql:"SELECT name, department, salary, RANK() OVER (ORDER BY salary DESC) AS overall_rank FROM employees;"}
     ]}},
    {h:'RANK vs ROW_NUMBER Side by Side', p:"ROW_NUMBER never repeats a number and never skips one — even tied rows get distinct sequential numbers, decided arbitrarily by the database when values are otherwise equal.",
     runner:{id:'rk2', tabs:[
       {label:'Compare Both', sql:"SELECT name, salary, ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn, RANK() OVER (ORDER BY salary DESC) AS rk FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Gaps Can Break "Top N" Logic', text:"If you filter WHERE rk <= 3 expecting exactly 3 rows, ties can mean you get more or fewer than 3 depending on where the gaps fall — always check whether RANK's gap behavior is actually what your report needs."}
},

'm10::DENSE_RANK': {
  intro:"DENSE_RANK works just like RANK — tied rows share the same rank — but it never leaves gaps in the numbering; the very next distinct value always gets the next consecutive integer.",
  body:[
    {h:'No Gaps After Ties', p:"Compare this directly against RANK on the same data — DENSE_RANK's numbers stay consecutive (1, 2, 3...) even when earlier rows tied, while RANK would have skipped ahead.",
     runner:{id:'dr1', tabs:[
       {label:'DENSE_RANK vs RANK', sql:"SELECT name, salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS dense_rk, RANK() OVER (ORDER BY salary DESC) AS rk FROM employees;"}
     ]}},
    {h:"The 'Nth Highest Salary' Pattern", p:"DENSE_RANK is the standard, correct tool for 'find the 2nd highest distinct salary' style interview questions — filtering on RANK instead can silently give the wrong answer whenever there's a tie for 1st place.",
     runner:{id:'dr2', tabs:[
       {label:'2nd Highest Distinct Salary', sql:"SELECT name, salary FROM (SELECT name, salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS dr FROM employees) t WHERE dr = 2;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Rule of Thumb', text:"Use ROW_NUMBER when you need a strictly unique sequence, RANK when gaps after ties are meaningful to your report, and DENSE_RANK when you want a clean, gap-free 1st/2nd/3rd style ranking."}
},

'm10::NTILE': {
  intro:"NTILE(n) divides the rows in a window into n roughly equal-sized buckets, numbered 1 through n — useful for splitting data into quartiles, quintiles, or any custom number of even groups.",
  body:[
    {h:'Splitting into Buckets', p:"NTILE(3) here divides the 6 employees into 3 pay-tier groups of 2 each, ordered from highest to lowest salary.",
     runner:{id:'nt1', tabs:[
       {label:'3 Salary Tiers', sql:"SELECT name, salary, NTILE(3) OVER (ORDER BY salary DESC) AS pay_tier FROM employees;"}
     ]}},
    {h:'Uneven Groups', p:"When the row count doesn't divide evenly, NTILE distributes the extra rows to the earliest groups first — some buckets end up with one more row than others.",
     runner:{id:'nt2', tabs:[
       {label:'NTILE(4) on 6 Rows', sql:"SELECT name, salary, NTILE(4) OVER (ORDER BY salary DESC) AS quartile FROM employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Common Use Case', text:"NTILE(4) is the standard way to compute quartiles directly in SQL (e.g. customer spending quartiles, performance review tiers) without needing a separate statistics tool."}
},

'm10::LEAD': {
  intro:"LEAD looks forward to a value from a LATER row in the window's ordering, letting you compare the current row directly against what comes next — without a self-join.",
  body:[
    {h:'Peeking at the Next Row', p:"For each employee ordered by salary, LEAD grabs the very next (lower) salary in the list — the last row has nothing after it, so LEAD returns NULL there.",
     runner:{id:'ld1', tabs:[
       {label:'Next Lower Salary', sql:"SELECT name, salary, LEAD(salary) OVER (ORDER BY salary DESC) AS next_lower_salary FROM employees;"}
     ]}},
    {h:'Supplying a Default Instead of NULL', p:"LEAD's optional second argument sets how many rows ahead to look (default 1), and the third argument supplies a default value to use instead of NULL when there's no next row.",
     runner:{id:'ld2', tabs:[
       {label:'LEAD with Default', sql:"SELECT name, salary, LEAD(salary, 1, 0) OVER (ORDER BY salary DESC) AS next_lower_salary FROM employees;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Great for Gap and Trend Analysis', text:"LEAD is the natural fit for questions like 'how much higher is this month's revenue than next month's' or 'find the gap between one employee's salary and the next person down' — all without a self-join."}
},

'm10::LAG': {
  intro:"LAG is the mirror image of LEAD — it looks backward to a value from an EARLIER row in the window's ordering, commonly used to compare each row against the one immediately before it.",
  body:[
    {h:'Peeking at the Previous Row', p:"Ordered by salary descending, LAG grabs the salary of the row just above the current one — the very first row has nothing before it, so LAG returns NULL there.",
     runner:{id:'lg1', tabs:[
       {label:'Previous Higher Salary', sql:"SELECT name, salary, LAG(salary) OVER (ORDER BY salary DESC) AS prev_higher_salary FROM employees;"}
     ]}},
    {h:'Calculating a Row-to-Row Difference', p:"Combining LAG with simple subtraction is the standard way to compute period-over-period or rank-over-rank differences directly in SQL.",
     runner:{id:'lg2', tabs:[
       {label:'Gap to Previous Row', sql:"SELECT name, salary, salary - LAG(salary) OVER (ORDER BY salary DESC) AS gap_from_prev FROM employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'LEAD and LAG Both Support PARTITION BY', text:"Just like every other window function, LEAD and LAG can be scoped per group: LAG(salary) OVER (PARTITION BY department ORDER BY salary DESC) compares each employee only to the previous-ranked employee within their own department."}
},

'm10::FIRST_VALUE': {
  intro:"FIRST_VALUE returns the value from the very first row of the current window frame — for example, the highest salary in a department, repeated alongside every row in that department.",
  body:[
    {h:'Tagging Every Row with the Top Value', p:"Unlike MAX() OVER (which would give the same answer here), FIRST_VALUE makes the intent explicit: 'take the value from whichever row is first once ordered'.",
     runner:{id:'fv1', tabs:[
       {label:'Highest Salary per Department', sql:"SELECT name, department, salary, FIRST_VALUE(name) OVER (PARTITION BY department ORDER BY salary DESC) AS top_earner_in_dept FROM employees;"}
     ]}},
    {h:'Comparing Each Row to the Top', p:"Combine FIRST_VALUE with basic arithmetic to show how far behind the top performer each person in their department is.",
     runner:{id:'fv2', tabs:[
       {label:'Gap from the Top Earner', sql:"SELECT name, department, salary, FIRST_VALUE(salary) OVER (PARTITION BY department ORDER BY salary DESC) - salary AS gap_from_top FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Frame Matters', text:"FIRST_VALUE's result depends on the window frame just like LAST_VALUE does — the default frame (RANGE UNBOUNDED PRECEDING TO CURRENT ROW) is usually fine for FIRST_VALUE since the first row never changes, but it's worth understanding frames fully before relying on this in production (see LAST_VALUE)."}
},

'm10::LAST_VALUE': {
  intro:"LAST_VALUE returns the value from the last row of the current window frame — but it has a famous gotcha: with the default frame, 'last' usually means 'the current row', not the actual last row of the partition.",
  body:[
    {h:'The Default Frame Trap', p:"Without an explicit frame, most databases default to <span class='ic'>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</span> — so LAST_VALUE just returns the CURRENT row's own value, which is rarely what people expect.",
     runner:{id:'lv1', tabs:[
       {label:'❌ Surprising Default Behavior', sql:"SELECT name, department, salary, LAST_VALUE(name) OVER (PARTITION BY department ORDER BY salary DESC) AS last_value_result FROM employees;"}
     ]}},
    {h:'The Fix: an Explicit Frame', p:"Adding <span class='ic'>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING</span> tells the database to consider the ENTIRE partition when picking the last row — now it correctly returns the lowest earner per department.",
     runner:{id:'lv2', tabs:[
       {label:'✅ Correct with Explicit Frame', sql:"SELECT name, department, salary, LAST_VALUE(name) OVER (PARTITION BY department ORDER BY salary DESC ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS lowest_earner_in_dept FROM employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Always Set the Frame Explicitly for LAST_VALUE', text:"This is one of the most common real-world SQL bugs — always pair LAST_VALUE with an explicit ROWS BETWEEN ... AND UNBOUNDED FOLLOWING frame, or it will silently just echo back the current row."}
},

'm10::Running Totals': {
  intro:"A running total (cumulative sum) adds up a value progressively, row by row, as you move through an ordered sequence — SUM() combined with OVER and ORDER BY is the standard SQL way to build one.",
  body:[
    {h:'Cumulative SUM', p:"With ORDER BY inside OVER but no explicit frame, SUM defaults to accumulating from the start of the partition up through the current row — exactly what a running total needs.",
     runner:{id:'rt1', tabs:[
       {label:'Running Total of Salary', sql:"SELECT name, salary, SUM(salary) OVER (ORDER BY id) AS running_total FROM employees;"}
     ]}},
    {h:'Running Total per Group', p:"Adding PARTITION BY resets the running total separately for each department, so each group accumulates independently.",
     runner:{id:'rt2', tabs:[
       {label:'Running Total per Department', sql:"SELECT name, department, salary, SUM(salary) OVER (PARTITION BY department ORDER BY id) AS dept_running_total FROM employees;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Why This Beats a Self-Join', text:"Before window functions existed, running totals required a self-join or a correlated subquery comparing every row to all previous rows — SUM() OVER (ORDER BY ...) computes the identical result in one clean pass, and scales far better."}
},

'm10::Moving Average': {
  intro:"A moving average smooths out a value by averaging it together with a fixed number of neighboring rows — most commonly used to reveal trends in noisy, sequential data like daily sales or stock prices.",
  body:[
    {h:'Defining the Frame with ROWS BETWEEN', p:"<span class='ic'>ROWS BETWEEN 1 PRECEDING AND CURRENT ROW</span> tells AVG to look at the current row plus the one immediately before it — a simple 2-row moving average.",
     runner:{id:'ma1', tabs:[
       {label:'2-Row Moving Average', sql:"SELECT name, salary, AVG(salary) OVER (ORDER BY id ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS moving_avg_2 FROM employees;"}
     ]}},
    {h:'A Centered 3-Row Window', p:"Frames aren't limited to looking only backward — <span class='ic'>1 PRECEDING AND 1 FOLLOWING</span> centers the average on the current row, using one neighbor from each side.",
     runner:{id:'ma2', tabs:[
       {label:'Centered 3-Row Average', sql:"SELECT name, salary, AVG(salary) OVER (ORDER BY id ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING) AS centered_avg_3 FROM employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'ROWS vs RANGE Frames', text:"ROWS BETWEEN counts a fixed number of physical rows, regardless of their values — RANGE BETWEEN instead considers logical value ranges (e.g. 'all rows within 7 days of this one'). ROWS is simpler and far more commonly used for basic moving averages."}
},

'm11::INSERT': {
  intro:"INSERT adds new rows into a table. Every example on this page runs against a temporary scratch table, not the real employees table, so it's completely safe to run as many times as you like.",
  body:[
    {h:'Basic INSERT ... VALUES', p:"You can optionally list the target columns explicitly right after the table name — if you omit the list, values must be supplied in the table's exact column order.",
     runner:{id:'ins1', tabs:[
       {label:'Single Row', sql:"CREATE TEMP TABLE demo_employees (id INTEGER, name TEXT, salary INTEGER);\nINSERT INTO demo_employees (id, name, salary) VALUES (1, 'Zara', 72000);\nSELECT * FROM demo_employees;\nDROP TABLE demo_employees;"},
       {label:'Multiple Rows at Once', sql:"CREATE TEMP TABLE demo_employees (id INTEGER, name TEXT, salary INTEGER);\nINSERT INTO demo_employees VALUES\n  (1, 'Zara', 72000),\n  (2, 'Omar', 81000),\n  (3, 'Priya', 69000);\nSELECT * FROM demo_employees;\nDROP TABLE demo_employees;"}
     ]}},
    {h:'INSERT ... SELECT (Copying Data)', p:"Instead of literal VALUES, the rows to insert can come straight from another query — a common way to archive, backfill, or duplicate a filtered subset of data into a new table.",
     runner:{id:'ins2', tabs:[
       {label:'Copy Engineering Staff', sql:"CREATE TEMP TABLE eng_backup (id INTEGER, name TEXT, salary INTEGER);\nINSERT INTO eng_backup SELECT id, name, salary FROM employees WHERE department = 'Engineering';\nSELECT * FROM eng_backup;\nDROP TABLE eng_backup;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Always Name Your Columns', text:"Relying on positional VALUES without a column list breaks silently if the table's column order ever changes — explicitly listing columns is safer and self-documenting, especially in application code."}
},

'm11::UPDATE': {
  intro:"UPDATE modifies existing rows that match a WHERE condition. It's one of the few statements where a small mistake (a missing WHERE clause) can silently affect every row in the table.",
  body:[
    {h:'Updating Matching Rows', p:"The WHERE clause here scopes the change to exactly one row — everyone else in the scratch table is left untouched.",
     runner:{id:'upd1', tabs:[
       {label:'Update One Employee', sql:"CREATE TEMP TABLE demo_employees AS SELECT * FROM employees;\nUPDATE demo_employees SET salary = salary * 1.10 WHERE name = 'Bob';\nSELECT name, salary FROM demo_employees;\nDROP TABLE demo_employees;"}
     ]}},
    {h:'The Missing WHERE Trap', p:"Leave off WHERE entirely, and the SET applies to every single row in the table — this is one of the most common and most damaging mistakes in real-world SQL.",
     runner:{id:'upd2', tabs:[
       {label:'❌ Updates Every Row', sql:"CREATE TEMP TABLE demo_employees AS SELECT * FROM employees;\nUPDATE demo_employees SET salary = salary * 1.10;\nSELECT name, salary FROM demo_employees;\nDROP TABLE demo_employees;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Test with SELECT First', text:"Before running an UPDATE in production, run a SELECT using the exact same WHERE condition to confirm precisely which rows will be affected — this one habit prevents the majority of accidental mass-update incidents."}
},

'm11::DELETE': {
  intro:"DELETE removes rows that match a WHERE condition. Like UPDATE, omitting WHERE deletes every row in the table — the table itself still exists, just empty.",
  body:[
    {h:'Deleting Matching Rows', p:"Only rows satisfying the condition are removed; everything else in the table stays exactly as it was.",
     runner:{id:'del1', tabs:[
       {label:'Delete One Department', sql:"CREATE TEMP TABLE demo_employees AS SELECT * FROM employees;\nDELETE FROM demo_employees WHERE department = 'HR';\nSELECT * FROM demo_employees;\nDROP TABLE demo_employees;"}
     ]}},
    {h:'The Missing WHERE Trap', p:"Just like UPDATE, a DELETE with no WHERE clause removes every row — the table structure remains, but it's now completely empty.",
     runner:{id:'del2', tabs:[
       {label:'❌ Deletes Every Row', sql:"CREATE TEMP TABLE demo_employees AS SELECT * FROM employees;\nDELETE FROM demo_employees;\nSELECT COUNT(*) AS remaining_rows FROM demo_employees;\nDROP TABLE demo_employees;"}
     ]}}
  ],
  tip:{type:'c-note', title:'DELETE vs TRUNCATE vs DROP', text:"DELETE removes rows one at a time and can be filtered with WHERE (DML, can be rolled back in a transaction). TRUNCATE empties an entire table in one fast operation with no WHERE support (DDL in most databases). DROP removes the table structure itself entirely."}
},

'm11::MERGE': {
  intro:"MERGE combines INSERT, UPDATE, and even DELETE into a single statement by comparing a source dataset against a target table on a matching key — commonly called an 'upsert' operation when used for insert-or-update logic.",
  body:[
    {h:'Not Supported in SQLite', p:"Standard SQL MERGE syntax (supported by SQL Server, Oracle, PostgreSQL 15+, Snowflake and Databricks SQL) looks roughly like: <span class='ic'>MERGE INTO target USING source ON target.id = source.id WHEN MATCHED THEN UPDATE SET ... WHEN NOT MATCHED THEN INSERT ...</span>. SQLite doesn't implement MERGE at all, but the exact same insert-or-update logic can be built manually with two statements."},
    {h:'Simulating MERGE Manually', p:"This mirrors what MERGE would do: update the target row if the id already exists, otherwise insert it as new — run twice and notice the second run only updates, it never duplicates.",
     runner:{id:'mrg1', tabs:[
       {label:'Manual Upsert Logic', sql:"CREATE TEMP TABLE target (id INTEGER PRIMARY KEY, name TEXT, salary INTEGER);\nINSERT INTO target VALUES (1, 'Zara', 70000);\n\n-- Simulate MERGE: update if exists, insert if not\nUPDATE target SET salary = 76000 WHERE id = 1;\nINSERT INTO target (id, name, salary)\n  SELECT 2, 'Omar', 81000\n  WHERE NOT EXISTS (SELECT 1 FROM target WHERE id = 2);\n\nSELECT * FROM target;\nDROP TABLE target;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On SQL Server/Oracle/Databricks SQL: MERGE INTO target t USING source s ON t.id = s.id WHEN MATCHED THEN UPDATE SET t.salary = s.salary WHEN NOT MATCHED THEN INSERT (id, name, salary) VALUES (s.id, s.name, s.salary);"}
},

'm11::UPSERT': {
  intro:"UPSERT is shorthand for 'insert, or update if it already exists' — most modern databases provide dedicated syntax for this exact pattern instead of requiring a full MERGE statement or manual two-step logic.",
  body:[
    {h:'SQLite / PostgreSQL: ON CONFLICT', p:"When an INSERT would violate a uniqueness constraint (like a duplicate primary key), <span class='ic'>ON CONFLICT ... DO UPDATE</span> tells the database to update the existing row instead of raising an error.",
     runner:{id:'ups1', tabs:[
       {label:'Insert, Then Upsert Same ID', sql:"CREATE TEMP TABLE demo_pay (id INTEGER PRIMARY KEY, name TEXT, salary INTEGER);\nINSERT INTO demo_pay VALUES (1, 'Zara', 70000);\n\n-- id 1 already exists, so this UPDATEs instead of failing\nINSERT INTO demo_pay (id, name, salary) VALUES (1, 'Zara', 76000)\n  ON CONFLICT(id) DO UPDATE SET salary = excluded.salary;\n\nSELECT * FROM demo_pay;\nDROP TABLE demo_pay;"}
     ]}},
    {h:'A Fresh Row Just Inserts Normally', p:"When the id doesn't already exist, the exact same ON CONFLICT statement simply behaves like a plain INSERT — no error, no update needed.",
     runner:{id:'ups2', tabs:[
       {label:'New ID Inserts Cleanly', sql:"CREATE TEMP TABLE demo_pay (id INTEGER PRIMARY KEY, name TEXT, salary INTEGER);\nINSERT INTO demo_pay VALUES (1, 'Zara', 70000);\n\nINSERT INTO demo_pay (id, name, salary) VALUES (2, 'Omar', 81000)\n  ON CONFLICT(id) DO UPDATE SET salary = excluded.salary;\n\nSELECT * FROM demo_pay;\nDROP TABLE demo_pay;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Syntax Differs by Database', text:"SQLite and PostgreSQL use INSERT ... ON CONFLICT(column) DO UPDATE SET .... MySQL uses INSERT ... ON DUPLICATE KEY UPDATE .... SQL Server and Oracle typically use a full MERGE statement instead — the underlying goal is identical everywhere."}
},

'm12::CREATE DATABASE': {
  intro:"CREATE DATABASE sets up a brand-new, empty database on the server — the container that will eventually hold your tables, views, and other objects. It's a server-level operation, not something you run against a specific table.",
  body:[
    {h:'Not a SQLite Concept', p:"In MySQL, PostgreSQL, or SQL Server you'd run <span class='ic'>CREATE DATABASE company_db;</span> to create a new database on the server. SQLite works differently — an entire SQLite database is just a single file, so a 'database' is created simply by opening a new file, with no CREATE DATABASE statement involved at all."},
    {h:"SQLite's Related Concept: ATTACH", p:"SQLite does support attaching multiple database files to one connection and querying across them — the closest thing SQLite has to working with multiple databases. You can inspect the databases currently attached to this in-browser session below.",
     runner:{id:'cdb1', tabs:[
       {label:'List Attached Databases', sql:"PRAGMA database_list;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On MySQL/PostgreSQL/SQL Server: CREATE DATABASE company_db; — then DROP DATABASE company_db; to remove it entirely. Always double-check you're connected to the right server before running either statement, since both affect everything inside that database."}
},

'm12::CREATE TABLE': {
  intro:"CREATE TABLE defines a brand-new table — its name, its columns, each column's data type, and any constraints those columns should enforce.",
  body:[
    {h:'Basic Table Definition', p:"Each column gets a name, a data type, and optional constraints like <span class='ic'>PRIMARY KEY</span>, <span class='ic'>NOT NULL</span>, or <span class='ic'>DEFAULT</span> — covered in full in the Constraints module.",
     runner:{id:'ct1', tabs:[
       {label:'Create + Inspect', sql:"CREATE TEMP TABLE products (\n  id INTEGER PRIMARY KEY,\n  name TEXT NOT NULL,\n  price REAL,\n  in_stock INTEGER DEFAULT 1\n);\nPRAGMA table_info(products);\nDROP TABLE products;"}
     ]}},
    {h:'Populating a New Table', p:"A freshly created table starts completely empty — INSERT is how you first put data into it.",
     runner:{id:'ct2', tabs:[
       {label:'Create, Insert, Select', sql:"CREATE TEMP TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL, price REAL, in_stock INTEGER DEFAULT 1);\nINSERT INTO products (id, name, price) VALUES (1, 'Keyboard', 45.99), (2, 'Monitor', 210.00);\nSELECT * FROM products;\nDROP TABLE products;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'CREATE TABLE IF NOT EXISTS', text:"Adding IF NOT EXISTS — e.g. CREATE TABLE IF NOT EXISTS products (...) — prevents an error if the table already happens to exist, which is especially useful in setup scripts that might run more than once."}
},

'm12::ALTER TABLE': {
  intro:"ALTER TABLE changes the structure of an existing table — adding, renaming, or removing columns, without needing to drop and recreate the whole table (and losing its data in the process).",
  body:[
    {h:'Adding a Column', p:"A new column is added to every existing row too — since there's no default supplied here, existing rows simply get NULL in the new column.",
     runner:{id:'at1', tabs:[
       {label:'ADD COLUMN', sql:"CREATE TEMP TABLE demo_staff (id INTEGER, name TEXT);\nINSERT INTO demo_staff VALUES (1, 'Zara'), (2, 'Omar');\nALTER TABLE demo_staff ADD COLUMN salary INTEGER;\nSELECT * FROM demo_staff;\nDROP TABLE demo_staff;"}
     ]}},
    {h:'Renaming a Column', p:"Modern SQLite (3.25+), PostgreSQL, MySQL 8+, and SQL Server all support renaming a column in place without rebuilding the table.",
     runner:{id:'at2', tabs:[
       {label:'RENAME COLUMN', sql:"CREATE TEMP TABLE demo_staff (id INTEGER, name TEXT);\nALTER TABLE demo_staff RENAME COLUMN name TO full_name;\nPRAGMA table_info(demo_staff);\nDROP TABLE demo_staff;"}
     ]}},
    {h:'Dropping a Column', p:"SQLite only added DROP COLUMN support in version 3.35.0 (2021) — older versions require rebuilding the table manually to remove a column. This runner uses a modern SQLite build.",
     runner:{id:'at3', tabs:[
       {label:'DROP COLUMN', sql:"CREATE TEMP TABLE demo_staff (id INTEGER, name TEXT, temp_note TEXT);\nALTER TABLE demo_staff DROP COLUMN temp_note;\nPRAGMA table_info(demo_staff);\nDROP TABLE demo_staff;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Big Tables, Bigger Caution', text:"On some databases, adding or dropping a column can lock or rewrite the entire table, which is risky on large production tables. Always check your specific database's behavior (and consider off-peak maintenance windows) before altering a heavily-used table."}
},

'm12::DROP TABLE': {
  intro:"DROP TABLE permanently removes a table's structure AND all of its data — unlike DELETE, there's no table left behind afterward, and in most databases this can't be undone once committed.",
  body:[
    {h:'Before and After', p:"This checks whether a table exists in the database catalog, drops it, then checks again — confirming the table is completely gone, not just emptied.",
     runner:{id:'dt1', tabs:[
       {label:'Before Drop', sql:"CREATE TEMP TABLE scratch (id INTEGER);\nSELECT name FROM sqlite_temp_master WHERE type='table' AND name='scratch';"},
       {label:'After Drop', sql:"CREATE TEMP TABLE scratch (id INTEGER);\nDROP TABLE scratch;\nSELECT name FROM sqlite_temp_master WHERE type='table' AND name='scratch';"}
     ]}},
    {h:'IF EXISTS Guards Against Errors', p:"Trying to DROP a table that doesn't exist normally throws an error — adding IF EXISTS makes the statement safely do nothing instead, which is handy in cleanup or setup scripts.",
     runner:{id:'dt2', tabs:[
       {label:'Safe Drop', sql:"DROP TABLE IF EXISTS a_table_that_was_never_created;\nSELECT 'No error thrown' AS result;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'DROP TABLE vs DELETE vs TRUNCATE', text:"DELETE removes rows but keeps the table and can be filtered with WHERE. TRUNCATE empties every row fast but keeps the table structure. DROP TABLE removes the structure itself — there's nothing left to insert into afterward until you CREATE TABLE again."}
},

'm12::TRUNCATE TABLE': {
  intro:"TRUNCATE TABLE instantly empties every row from a table while keeping its structure, indexes, and constraints fully intact — much faster than DELETE for wiping an entire table, since it typically skips row-by-row logging.",
  body:[
    {h:'Not Supported in SQLite', p:"MySQL, PostgreSQL, SQL Server and Oracle all support <span class='ic'>TRUNCATE TABLE table_name;</span> directly. SQLite has no TRUNCATE keyword at all — but a DELETE with no WHERE clause achieves the same end result, and SQLite even applies an internal 'truncate optimization' to make it fast when there's no WHERE to evaluate.",
     runner:{id:'tt1', tabs:[
       {label:'SQLite Equivalent (DELETE, no WHERE)', sql:"CREATE TEMP TABLE demo_log (id INTEGER, msg TEXT);\nINSERT INTO demo_log VALUES (1,'a'), (2,'b'), (3,'c');\nSELECT COUNT(*) AS before_count FROM demo_log;\nDELETE FROM demo_log;\nSELECT COUNT(*) AS after_count FROM demo_log;\nDROP TABLE demo_log;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'TRUNCATE Is Usually DDL, Not DML', text:"On most databases that support it, TRUNCATE TABLE auto-commits immediately and often can't be rolled back inside a transaction the way DELETE can — treat it with the same caution as DROP TABLE, not the lighter caution of a filtered DELETE."}
},

'm12::RENAME TABLE': {
  intro:"Renaming a table changes its name while leaving all of its data, columns, indexes, and constraints completely untouched — only the identifier used to refer to it changes.",
  body:[
    {h:'ALTER TABLE ... RENAME TO', p:"SQLite, PostgreSQL, and SQL Server all use this same ALTER TABLE-based syntax to rename a table in place.",
     runner:{id:'rt1', tabs:[
       {label:'Rename and Verify', sql:"CREATE TEMP TABLE old_staff (id INTEGER, name TEXT);\nALTER TABLE old_staff RENAME TO new_staff;\nSELECT name FROM sqlite_temp_master WHERE type='table' AND name='new_staff';\nDROP TABLE new_staff;"}
     ]}}
  ],
  tip:{type:'c-note', title:'MySQL Has Its Own RENAME TABLE Statement', text:"MySQL uniquely also supports a dedicated RENAME TABLE old_name TO new_name; statement (and can even rename several tables atomically in one go), separate from its ALTER TABLE syntax — but ALTER TABLE ... RENAME TO works there too, for consistency with other databases."}
},

'm13::PRIMARY KEY': {
  intro:"A PRIMARY KEY uniquely identifies every row in a table — it automatically combines NOT NULL and UNIQUE, and a table can have only one primary key (though that key can span multiple columns).",
  body:[
    {h:'Defining and Using a Primary Key', p:"Once id is declared PRIMARY KEY, the database itself guarantees no two rows can ever share the same id value.",
     runner:{id:'pk1', tabs:[
       {label:'Define + Insert', sql:"CREATE TEMP TABLE demo_staff (id INTEGER PRIMARY KEY, name TEXT);\nINSERT INTO demo_staff VALUES (1, 'Zara'), (2, 'Omar');\nSELECT * FROM demo_staff;\nDROP TABLE demo_staff;"},
       {label:'❌ Duplicate Key Fails', sql:"CREATE TEMP TABLE demo_staff (id INTEGER PRIMARY KEY, name TEXT);\nINSERT INTO demo_staff VALUES (1, 'Zara');\nINSERT INTO demo_staff VALUES (1, 'Omar');\nSELECT * FROM demo_staff;\nDROP TABLE demo_staff;"}
     ]}},
    {h:'Composite Primary Keys', p:"When no single column is unique on its own, you can declare a primary key across multiple columns together — the combination of values must be unique, even if individual columns repeat.",
     runner:{id:'pk2', tabs:[
       {label:'Composite Key', sql:"CREATE TEMP TABLE enrollments (student_id INTEGER, course_id INTEGER, grade TEXT, PRIMARY KEY (student_id, course_id));\nINSERT INTO enrollments VALUES (1, 101, 'A'), (1, 102, 'B'), (2, 101, 'C');\nSELECT * FROM enrollments;\nDROP TABLE enrollments;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'One Per Table, But Multiple Columns Allowed', text:"A table can only have one PRIMARY KEY constraint total — but that one constraint is free to cover several columns at once, as shown in the composite key example above."}
},

'm13::FOREIGN KEY': {
  intro:"A FOREIGN KEY links a column in one table to the PRIMARY KEY of another, enforcing that every value in the child column must already exist in the parent table — this is what keeps related data consistent.",
  body:[
    {h:'Enabling Enforcement in SQLite', p:"Unlike most databases, SQLite doesn't enforce foreign keys by default — <span class='ic'>PRAGMA foreign_keys = ON;</span> must be run first (usually once per connection) before violations will actually be blocked.",
     runner:{id:'fk1', tabs:[
       {label:'Valid Reference', sql:"PRAGMA foreign_keys = ON;\nCREATE TEMP TABLE depts_demo (id INTEGER PRIMARY KEY, dept_name TEXT);\nCREATE TEMP TABLE staff_demo (id INTEGER, dept_id INTEGER, FOREIGN KEY (dept_id) REFERENCES depts_demo(id));\nINSERT INTO depts_demo VALUES (1, 'Engineering');\nINSERT INTO staff_demo VALUES (1, 1);\nSELECT * FROM staff_demo;\nDROP TABLE staff_demo;\nDROP TABLE depts_demo;"},
       {label:'❌ Invalid Reference Fails', sql:"PRAGMA foreign_keys = ON;\nCREATE TEMP TABLE depts_demo (id INTEGER PRIMARY KEY, dept_name TEXT);\nCREATE TEMP TABLE staff_demo (id INTEGER, dept_id INTEGER, FOREIGN KEY (dept_id) REFERENCES depts_demo(id));\nINSERT INTO depts_demo VALUES (1, 'Engineering');\nINSERT INTO staff_demo VALUES (1, 99);\nSELECT * FROM staff_demo;\nDROP TABLE staff_demo;\nDROP TABLE depts_demo;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Check Your Database Default', text:"SQLite requires PRAGMA foreign_keys = ON; per connection to enforce foreign keys at all. PostgreSQL, SQL Server, Oracle and MySQL (with InnoDB) all enforce foreign keys by default the moment they're declared — no extra setup step needed."}
},

'm13::UNIQUE': {
  intro:"A UNIQUE constraint ensures every value in a column (or set of columns) is distinct across the whole table — similar to PRIMARY KEY, but a table can have several UNIQUE constraints, and most databases allow more than one NULL in a UNIQUE column.",
  body:[
    {h:'Enforcing Distinct Values', p:"An email column is a classic candidate for UNIQUE — the business rule is that no two people should share the same email address.",
     runner:{id:'uq1', tabs:[
       {label:'Valid Unique Values', sql:"CREATE TEMP TABLE demo_users (id INTEGER, email TEXT UNIQUE);\nINSERT INTO demo_users VALUES (1, 'zara@example.com'), (2, 'omar@example.com');\nSELECT * FROM demo_users;\nDROP TABLE demo_users;"},
       {label:'❌ Duplicate Value Fails', sql:"CREATE TEMP TABLE demo_users (id INTEGER, email TEXT UNIQUE);\nINSERT INTO demo_users VALUES (1, 'zara@example.com');\nINSERT INTO demo_users VALUES (2, 'zara@example.com');\nSELECT * FROM demo_users;\nDROP TABLE demo_users;"}
     ]}}
  ],
  tip:{type:'c-note', title:'UNIQUE vs PRIMARY KEY', text:"Both prevent duplicates, but a table can have only one PRIMARY KEY while it can have many UNIQUE constraints, and UNIQUE columns (unlike most primary keys) are typically still allowed to contain NULL values."}
},

'm13::CHECK': {
  intro:"A CHECK constraint enforces a custom condition that every row must satisfy — anything that isn't a simple 'must be unique' or 'must reference another table' rule usually belongs in a CHECK.",
  body:[
    {h:'Validating a Business Rule', p:"This guarantees salary can never be stored as zero or negative — the database rejects any row that would violate the condition, no application-side validation required.",
     runner:{id:'chk1', tabs:[
       {label:'Valid Insert', sql:"CREATE TEMP TABLE demo_pay (id INTEGER, salary INTEGER CHECK (salary > 0));\nINSERT INTO demo_pay VALUES (1, 55000);\nSELECT * FROM demo_pay;\nDROP TABLE demo_pay;"},
       {label:'❌ Violates CHECK', sql:"CREATE TEMP TABLE demo_pay (id INTEGER, salary INTEGER CHECK (salary > 0));\nINSERT INTO demo_pay VALUES (1, -500);\nSELECT * FROM demo_pay;\nDROP TABLE demo_pay;"}
     ]}},
    {h:'Checking Across Multiple Columns', p:"A CHECK condition can reference more than one column in the same row, enabling more complex validation logic.",
     runner:{id:'chk2', tabs:[
       {label:'Multi-Column CHECK', sql:"CREATE TEMP TABLE demo_dates (id INTEGER, start_date TEXT, end_date TEXT, CHECK (end_date > start_date));\nINSERT INTO demo_dates VALUES (1, '2026-01-01', '2026-06-01');\nSELECT * FROM demo_dates;\nDROP TABLE demo_dates;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Push Validation Down to the Database', text:"A CHECK constraint enforces a rule no matter which application, script, or person inserts data — application-level validation alone can always be bypassed by a direct database connection, but a CHECK constraint can't be."}
},

'm13::DEFAULT': {
  intro:"A DEFAULT constraint supplies an automatic fallback value for a column whenever an INSERT doesn't explicitly provide one — useful for status flags, timestamps, and any 'usually this value' field.",
  body:[
    {h:'Automatic Fallback Values', p:"Omitting the status column entirely still fills it in — the DEFAULT value kicks in automatically, with no extra logic needed in the INSERT statement.",
     runner:{id:'def1', tabs:[
       {label:'DEFAULT Applied', sql:"CREATE TEMP TABLE demo_tasks (id INTEGER, title TEXT, status TEXT DEFAULT 'active');\nINSERT INTO demo_tasks (id, title) VALUES (1, 'Ship the report');\nSELECT * FROM demo_tasks;\nDROP TABLE demo_tasks;"},
       {label:'Explicit Value Overrides Default', sql:"CREATE TEMP TABLE demo_tasks (id INTEGER, title TEXT, status TEXT DEFAULT 'active');\nINSERT INTO demo_tasks (id, title, status) VALUES (1, 'Ship the report', 'done');\nSELECT * FROM demo_tasks;\nDROP TABLE demo_tasks;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Defaults Can Be Expressions Too', text:"Many databases allow a function call as a default, not just a literal — e.g. created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP automatically stamps every new row with the moment it was inserted."}
},

'm13::IDENTITY': {
  intro:"IDENTITY is SQL Server's (and standard SQL's newer) way of marking a column as auto-generated and auto-incrementing — the database assigns the next number in sequence automatically, so you never specify it manually on INSERT.",
  body:[
    {h:'Not SQLite Syntax', p:"SQL Server syntax looks like <span class='ic'>id INT IDENTITY(1,1) PRIMARY KEY</span> — starting at 1 and incrementing by 1 each time. SQLite doesn't use the IDENTITY keyword, but an <span class='ic'>INTEGER PRIMARY KEY</span> column automatically behaves as an auto-incrementing alias for SQLite's internal rowid, achieving the same practical result.",
     runner:{id:'id1', tabs:[
       {label:'SQLite Equivalent', sql:"CREATE TEMP TABLE demo_orders (id INTEGER PRIMARY KEY, customer TEXT);\nINSERT INTO demo_orders (customer) VALUES ('Zara'), ('Omar'), ('Priya');\nSELECT * FROM demo_orders;\nDROP TABLE demo_orders;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On SQL Server: CREATE TABLE demo_orders (id INT IDENTITY(1,1) PRIMARY KEY, customer VARCHAR(50)); — the (1,1) means 'start at 1, increment by 1'; other starting points and step sizes are also allowed."}
},

'm13::AUTO_INCREMENT': {
  intro:"AUTO_INCREMENT is MySQL's keyword for the same auto-generated, self-incrementing column concept as IDENTITY — SQLite has its own AUTOINCREMENT keyword too, with one subtle but important difference from its default behavior.",
  body:[
    {h:'Default Behavior Can Reuse IDs', p:"Without AUTOINCREMENT, SQLite's default INTEGER PRIMARY KEY can sometimes reuse the highest deleted id's number after a row is removed and a new one is inserted.",
     runner:{id:'ai1', tabs:[
       {label:'Default: ID May Be Reused', sql:"CREATE TEMP TABLE demo_tickets (id INTEGER PRIMARY KEY, note TEXT);\nINSERT INTO demo_tickets (note) VALUES ('first'), ('second');\nDELETE FROM demo_tickets WHERE id = 2;\nINSERT INTO demo_tickets (note) VALUES ('third');\nSELECT * FROM demo_tickets;\nDROP TABLE demo_tickets;"}
     ]}},
    {h:'AUTOINCREMENT Guarantees No Reuse', p:"Adding the AUTOINCREMENT keyword forces SQLite to always hand out a number strictly higher than any id ever used before in that table — even after deletes — at a small performance cost.",
     runner:{id:'ai2', tabs:[
       {label:'AUTOINCREMENT: ID Never Reused', sql:"CREATE TEMP TABLE demo_tickets (id INTEGER PRIMARY KEY AUTOINCREMENT, note TEXT);\nINSERT INTO demo_tickets (note) VALUES ('first'), ('second');\nDELETE FROM demo_tickets WHERE id = 2;\nINSERT INTO demo_tickets (note) VALUES ('third');\nSELECT * FROM demo_tickets;\nDROP TABLE demo_tickets;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'MySQL Syntax (not runnable here)', text:"On MySQL: CREATE TABLE demo_tickets (id INT AUTO_INCREMENT PRIMARY KEY, note VARCHAR(100)); — MySQL's AUTO_INCREMENT behaves like SQLite's plain INTEGER PRIMARY KEY by default (IDs can occasionally be skipped but not typically reused within the same session)."}
},

'm14::Views': {
  intro:"A view is a saved, named SELECT query — a virtual table that stores no data of its own. Every time you query a view, the database re-runs its underlying SELECT against the real, current data behind the scenes.",
  body:[
    {h:'Creating and Querying a View', p:"Once created, a view can be queried exactly like a real table — the complexity of the underlying query is hidden behind a simple, reusable name.",
     runner:{id:'vw1', tabs:[
       {label:'Create + Query', sql:"CREATE TEMP VIEW high_earners_view AS\n  SELECT name, department, salary FROM employees WHERE salary > 85000;\nSELECT * FROM high_earners_view;\nDROP VIEW high_earners_view;"}
     ]}},
    {h:'A View Always Reflects Live Data', p:"Because a view has no storage of its own, inserting a new row into the underlying table immediately shows up through the view too — there's no syncing or refreshing needed.",
     runner:{id:'vw2', tabs:[
       {label:'View Updates Automatically', sql:"CREATE TEMP TABLE demo_staff (id INTEGER, name TEXT, salary INTEGER);\nINSERT INTO demo_staff VALUES (1, 'Zara', 60000);\nCREATE TEMP VIEW well_paid AS SELECT * FROM demo_staff WHERE salary > 55000;\nSELECT * FROM well_paid;\nINSERT INTO demo_staff VALUES (2, 'Omar', 90000);\nSELECT * FROM well_paid;\nDROP VIEW well_paid;\nDROP TABLE demo_staff;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Why Use a View at All?', text:"Views are great for hiding complexity behind a simple name (a big multi-JOIN report becomes 'SELECT * FROM sales_summary'), and for security — you can grant access to a view exposing only certain columns or rows, without giving access to the full underlying table."}
},

'm14::Materialized Views': {
  intro:"A materialized view looks like a regular view but actually stores its result set physically, like a real table — trading automatic freshness for much faster read performance, since the query doesn't need to be re-run every time.",
  body:[
    {h:'Not Supported in SQLite', p:"SQLite only supports regular (non-materialized) views — there's no CREATE MATERIALIZED VIEW syntax at all. PostgreSQL, Oracle, and most cloud data warehouses (Snowflake, Databricks SQL) support them directly. The closest SQLite equivalent is simply a real table populated from a query, refreshed manually when needed.",
     runner:{id:'mv1', tabs:[
       {label:'SQLite "Snapshot Table" Equivalent', sql:"CREATE TEMP TABLE dept_summary_snapshot AS\n  SELECT department, COUNT(*) AS headcount, AVG(salary) AS avg_salary FROM employees GROUP BY department;\nSELECT * FROM dept_summary_snapshot;\nDROP TABLE dept_summary_snapshot;"}
     ]}},
    {h:'Refreshing Is a Manual Step', p:"Unlike a regular view, a materialized view does NOT automatically pick up changes to the underlying data — someone (or some schedule) has to explicitly refresh it.",}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL: CREATE MATERIALIZED VIEW dept_summary AS SELECT department, COUNT(*) AS headcount FROM employees GROUP BY department; — then later, REFRESH MATERIALIZED VIEW dept_summary; to bring it back up to date with the latest underlying data."}
},

'm14::Indexed Views': {
  intro:"An indexed view is SQL Server's term for a materialized view that also has a unique clustered index built directly on it — physically storing the data in sorted, indexed form for very fast reads, at the cost of slower writes to the underlying tables.",
  body:[
    {h:'Not Supported in SQLite (as a Named Feature)', p:"SQL Server requires the view be created WITH SCHEMABINDING, then a unique clustered index is added on top of it, which is what actually materializes and indexes the data. SQLite has no equivalent named feature, but the same practical benefit — an indexed physical snapshot — can be approximated with a real table plus a regular index.",
     runner:{id:'iv1', tabs:[
       {label:'SQLite Approximation', sql:"CREATE TEMP TABLE dept_summary_snapshot AS\n  SELECT department, COUNT(*) AS headcount FROM employees GROUP BY department;\nCREATE INDEX idx_dept_summary ON dept_summary_snapshot(department);\nSELECT * FROM dept_summary_snapshot WHERE department = 'Engineering';\nDROP INDEX idx_dept_summary;\nDROP TABLE dept_summary_snapshot;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On SQL Server: CREATE VIEW dept_summary WITH SCHEMABINDING AS SELECT department, COUNT_BIG(*) AS headcount FROM dbo.employees GROUP BY department; then CREATE UNIQUE CLUSTERED INDEX idx_dept_summary ON dept_summary(department); — this is what actually materializes and indexes the view's data on disk."}
},

'm15::Clustered Index': {
  intro:"A clustered index determines the actual physical storage order of a table's rows — since data can only be physically sorted one way, a table can have at most one clustered index.",
  body:[
    {h:'SQLite: Clustered Around the Primary Key', p:"An INTEGER PRIMARY KEY column in SQLite is stored as an alias for the table's internal rowid, and rows are physically organized around that value — functioning as a clustered index automatically, with no separate CREATE CLUSTERED INDEX statement needed.",
     runner:{id:'ci1', tabs:[
       {label:'Lookup by Primary Key', sql:"EXPLAIN QUERY PLAN SELECT * FROM employees WHERE id = 3;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Explicit Elsewhere', text:"SQL Server and MySQL (InnoDB) make the primary key the clustered index by default too, but also let you explicitly declare a different column as clustered instead — SQLite doesn't expose that level of control; its rowid-based clustering is fixed."}
},

'm15::Non Clustered Index': {
  intro:"A non-clustered index builds a separate lookup structure that points back to a table's rows, without changing the table's own physical row order — and unlike a clustered index, a table can have many non-clustered indexes.",
  body:[
    {h:'Before and After Adding an Index', p:"Without any index on department, the database must scan every row to find matches. After adding one, the query plan switches to a targeted search instead.",
     runner:{id:'nci1', tabs:[
       {label:'❌ Before: Full Table Scan', sql:"EXPLAIN QUERY PLAN SELECT * FROM employees WHERE department = 'Engineering';"},
       {label:'✅ After: Index Search', sql:"CREATE INDEX idx_dept ON employees(department);\nEXPLAIN QUERY PLAN SELECT * FROM employees WHERE department = 'Engineering';\nDROP INDEX idx_dept;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'The Most Common Index Type', text:"When people say 'add an index' without further detail, they almost always mean a non-clustered (secondary) index — most CREATE INDEX statements you'll write day-to-day create this kind."}
},

'm15::Composite Index': {
  intro:"A composite (or compound) index is built across two or more columns together — useful whenever queries commonly filter or sort using that exact combination of columns.",
  body:[
    {h:'Indexing Two Columns Together', p:"This index helps queries that filter on department AND salary together — far more effectively than two separate single-column indexes would for this specific combined condition.",
     runner:{id:'cpi1', tabs:[
       {label:'Composite Index in Action', sql:"CREATE INDEX idx_dept_salary ON employees(department, salary);\nEXPLAIN QUERY PLAN SELECT * FROM employees WHERE department = 'Engineering' AND salary > 80000;\nDROP INDEX idx_dept_salary;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Column Order Matters — The Leftmost Prefix Rule', text:"An index on (department, salary) can efficiently serve queries filtering on department alone, or on department AND salary together — but it generally can't help a query that filters on salary alone, since salary isn't the leftmost column in the index."}
},

'm15::Covering Index': {
  intro:"A covering index contains every single column a query needs — the SELECT columns, the WHERE columns, all of it — so the database can answer the query entirely from the index itself, without ever touching the underlying table.",
  body:[
    {h:'An Index That Answers the Whole Query', p:"Because name and salary are both included directly in the index (alongside the filtered department column), the database plan can potentially skip visiting the table rows altogether.",
     runner:{id:'covi1', tabs:[
       {label:'Covering Index Example', sql:"CREATE INDEX idx_covering ON employees(department, name, salary);\nEXPLAIN QUERY PLAN SELECT name, salary FROM employees WHERE department = 'Engineering';\nDROP INDEX idx_covering;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Fewer Table Lookups, Faster Reads', text:"Covering indexes trade extra storage and slightly slower writes for significantly faster reads — they're most valuable on frequently-run queries against large tables where avoiding the table lookup entirely makes a measurable difference."}
},

'm15::Bitmap Index': {
  intro:"A bitmap index stores a compact string of bits per distinct column value — one bit per row, flagged 1 if that row has the value or 0 if not — making it extremely efficient at combining conditions across many low-cardinality columns.",
  body:[
    {h:'Not Supported in SQLite', p:"Bitmap indexes are a specialty feature of Oracle and some data warehouse engines, ideal for columns with few distinct values (like gender, status, or region) in analytical (OLAP) workloads with lots of AND/OR filtering. SQLite always uses B-tree indexes internally and has no bitmap index type or syntax at all."},
    {h:'Why Cardinality Matters', p:"On a high-cardinality column like an email address, a bitmap per value would be enormous and pointless — bitmap indexes only make sense when the number of distinct values is small relative to the row count."}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On Oracle: CREATE BITMAP INDEX idx_dept_bitmap ON employees(department); — best suited to read-heavy analytical tables, since bitmap indexes are typically much slower to update than B-tree indexes on write-heavy OLTP tables."}
},

'm15::Hash Index': {
  intro:"A hash index runs each column value through a hash function and stores the result in buckets — this makes exact-match equality lookups extremely fast, but it can't support range queries like BETWEEN, >, or ORDER BY at all.",
  body:[
    {h:'Not Available in SQLite', p:"PostgreSQL supports <span class='ic'>CREATE INDEX ... USING HASH</span> as an explicit option, and MySQL's in-memory (MEMORY) storage engine supports HASH indexes too. SQLite only implements B-tree indexes — every SQLite index, whether on an equality or range condition, uses the same underlying B-tree structure."},
    {h:'Equality-Only, By Design', p:"A hash index can answer 'find the row where email = X' almost instantly, but it's structurally incapable of answering 'find rows where salary BETWEEN 60000 AND 90000' — a B-tree index is required for that kind of range lookup."}
  ],
  tip:{type:'c-warn', title:'Standard Syntax (not runnable here)', text:"On PostgreSQL: CREATE INDEX idx_email_hash ON users USING HASH (email); — use this only for pure equality lookups on a column that will never need range-based filtering or sorting."}
},

'm15::Execution Plans': {
  intro:"An execution plan (or query plan) shows exactly how the database engine intends to carry out a query — which indexes it will use, which tables it scans in full, and in what order it joins things. It's the single most important tool for diagnosing why a query is slow.",
  body:[
    {h:'Reading a Simple Plan', p:"<span class='ic'>EXPLAIN QUERY PLAN</span> in SQLite (similar to EXPLAIN in MySQL/PostgreSQL, or SET SHOWPLAN in SQL Server) prints a summary instead of actually running the query.",
     runner:{id:'ep1', tabs:[
       {label:'Simple SELECT Plan', sql:"EXPLAIN QUERY PLAN SELECT * FROM employees WHERE salary > 80000;"}
     ]}},
    {h:'Reading a JOIN Plan', p:"With a JOIN, the plan reveals the order the tables are processed in and whether each step is a full SCAN or a targeted SEARCH using an index.",
     runner:{id:'ep2', tabs:[
       {label:'JOIN Plan', sql:"EXPLAIN QUERY PLAN SELECT e.name, d.dept_name FROM employees e JOIN departments d ON e.dept_id = d.id;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'SCAN vs SEARCH', text:"In SQLite's plan output, 'SCAN' means the engine reads every row of a table (slow on large tables), while 'SEARCH ... USING INDEX' means it jumped directly to matching rows via an index — that single word difference is often the whole story behind a performance problem."}
},

'm15::Index Optimization': {
  intro:"Adding indexes isn't free — each one speeds up certain reads but adds overhead to every INSERT, UPDATE, and DELETE that touches the indexed columns. Index optimization is about choosing carefully, not indexing everything.",
  body:[
    {h:"What's Actually Worth Indexing", p:"<ul><li>Columns frequently used in WHERE clauses</li><li>Columns used to JOIN tables together (foreign keys especially)</li><li>Columns used in ORDER BY, particularly on large result sets</li><li>Columns with high cardinality (many distinct values) tend to benefit more than low-cardinality ones</li></ul>"},
    {h:'Confirming an Index Is Actually Used', p:"Adding an index doesn't guarantee the optimizer will use it — always confirm with an execution plan rather than assuming.",
     runner:{id:'iopt1', tabs:[
       {label:'Verify Index Usage', sql:"CREATE INDEX idx_salary ON employees(salary);\nEXPLAIN QUERY PLAN SELECT name FROM employees WHERE salary > 80000 ORDER BY salary;\nDROP INDEX idx_salary;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Watch for Over-Indexing', text:"Every extra index makes writes slightly slower and consumes more storage — periodically review which indexes are actually being used by real queries (most databases expose index-usage statistics) and drop the ones that aren't earning their keep."}
},

'm16::ACID': {
  intro:"ACID is the set of four guarantees a database transaction promises to uphold: Atomicity, Consistency, Isolation, and Durability — together they're what make transactions safe to rely on even when things go wrong mid-operation.",
  body:[
    {h:'The Four Guarantees', p:"<ul><li><strong>Atomicity</strong> — a transaction either completes entirely or not at all; there's no 'half-finished' state</li><li><strong>Consistency</strong> — a transaction can only bring the database from one valid state to another, never violating constraints</li><li><strong>Isolation</strong> — concurrent transactions don't see each other's incomplete, in-progress changes</li><li><strong>Durability</strong> — once committed, a change survives even a power loss or crash immediately afterward</li></ul>"},
    {h:'Atomicity in Action: An All-or-Nothing Transfer', p:"This simulates a bank transfer — debit one account, credit another — then rolls the whole thing back, proving neither change survives on its own. Real money transfers rely on exactly this guarantee.",
     runner:{id:'acid1', tabs:[
       {label:'All-or-Nothing Transfer', sql:"CREATE TEMP TABLE accounts (name TEXT, balance INTEGER);\nINSERT INTO accounts VALUES ('Alice', 500), ('Bob', 200);\n\nBEGIN TRANSACTION;\nUPDATE accounts SET balance = balance - 100 WHERE name = 'Alice';\nUPDATE accounts SET balance = balance + 100 WHERE name = 'Bob';\nROLLBACK;\n\nSELECT * FROM accounts;\nDROP TABLE accounts;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'Why This Matters for Money and Inventory', text:"Without atomicity, a crash between the debit and the credit above could leave Alice's money simply gone — deducted from one account but never added to the other. ACID is what makes financial systems, inventory systems, and booking systems trustworthy."}
},

'm16::BEGIN TRANSACTION': {
  intro:"BEGIN TRANSACTION (or simply BEGIN) explicitly marks the start of a transaction — every statement that follows becomes part of one atomic unit, until it's ended with either COMMIT or ROLLBACK.",
  body:[
    {h:'Grouping Statements Together', p:"Without an explicit BEGIN, most databases auto-commit each statement individually. Wrapping several statements in BEGIN ... COMMIT makes them succeed or fail together as one unit.",
     runner:{id:'bt1', tabs:[
       {label:'Grouped Statements', sql:"CREATE TEMP TABLE demo_ledger (id INTEGER, note TEXT);\n\nBEGIN TRANSACTION;\nINSERT INTO demo_ledger VALUES (1, 'Order placed');\nINSERT INTO demo_ledger VALUES (2, 'Payment recorded');\nCOMMIT;\n\nSELECT * FROM demo_ledger;\nDROP TABLE demo_ledger;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Different Databases, Similar Keyword', text:"SQLite, PostgreSQL, and MySQL all accept BEGIN or BEGIN TRANSACTION interchangeably. SQL Server requires BEGIN TRANSACTION (or the shorthand BEGIN TRAN) — the underlying concept of marking a transaction's start is identical everywhere."}
},

'm16::COMMIT': {
  intro:"COMMIT permanently saves every change made since the transaction began — once committed, those changes are durable and can no longer be undone with ROLLBACK.",
  body:[
    {h:'Making Changes Permanent', p:"After COMMIT runs, the inserted row is now a permanent part of the table — there's no going back to the pre-transaction state from here.",
     runner:{id:'cmt1', tabs:[
       {label:'Commit and Confirm', sql:"CREATE TEMP TABLE demo_orders (id INTEGER, status TEXT);\n\nBEGIN TRANSACTION;\nINSERT INTO demo_orders VALUES (1, 'pending');\nUPDATE demo_orders SET status = 'confirmed' WHERE id = 1;\nCOMMIT;\n\nSELECT * FROM demo_orders;\nDROP TABLE demo_orders;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Point of No Return', text:"Once a COMMIT succeeds, the only way to undo it is with a brand-new transaction that explicitly reverses the change (e.g. another UPDATE putting values back) — COMMIT itself cannot be rolled back after the fact."}
},

'm16::ROLLBACK': {
  intro:"ROLLBACK undoes every change made since the transaction began, restoring the database to exactly how it looked right before BEGIN — as if the transaction never happened at all.",
  body:[
    {h:'Undoing an In-Progress Transaction', p:"The initial row exists before any transaction starts. Everything inserted or changed inside the BEGIN...ROLLBACK block below vanishes completely once ROLLBACK runs.",
     runner:{id:'rb1', tabs:[
       {label:'Rollback Undoes Everything', sql:"CREATE TEMP TABLE demo_cart (id INTEGER, item TEXT);\nINSERT INTO demo_cart VALUES (1, 'Keyboard');\n\nBEGIN TRANSACTION;\nINSERT INTO demo_cart VALUES (2, 'Mouse');\nINSERT INTO demo_cart VALUES (3, 'Monitor');\nROLLBACK;\n\nSELECT * FROM demo_cart;\nDROP TABLE demo_cart;"}
     ]}}
  ],
  tip:{type:'c-tip', title:'A Safety Net for Risky Operations', text:"Wrapping a risky bulk UPDATE or DELETE in BEGIN TRANSACTION lets you inspect the results with a SELECT before deciding whether to COMMIT or ROLLBACK — a common safety habit before running mass changes in production."}
},

'm16::SAVEPOINT': {
  intro:"A SAVEPOINT marks a named checkpoint inside a larger transaction — letting you roll back just part of the work done so far, without discarding the entire transaction.",
  body:[
    {h:'Rolling Back to a Checkpoint, Not the Start', p:"The insert before the savepoint survives; the insert after it gets undone by ROLLBACK TO — and the transaction is still open afterward, letting more work continue before the final COMMIT.",
     runner:{id:'sp1', tabs:[
       {label:'Partial Rollback with SAVEPOINT', sql:"CREATE TEMP TABLE demo_cart (id INTEGER, item TEXT);\n\nBEGIN TRANSACTION;\nINSERT INTO demo_cart VALUES (1, 'Keyboard');\nSAVEPOINT after_keyboard;\nINSERT INTO demo_cart VALUES (2, 'Broken Item');\nROLLBACK TO after_keyboard;\nINSERT INTO demo_cart VALUES (3, 'Mouse');\nCOMMIT;\n\nSELECT * FROM demo_cart;\nDROP TABLE demo_cart;"}
     ]}}
  ],
  tip:{type:'c-note', title:'Multiple Savepoints Are Allowed', text:"A single transaction can contain several named savepoints — rolling back to an earlier one automatically discards any savepoints created after it, while keeping the transaction itself open for further work."}
},

'm16::Isolation Levels': {
  intro:"An isolation level controls how much of one transaction's in-progress, uncommitted work is visible to other transactions running at the same time — a trade-off between data consistency and concurrency performance.",
  body:[
    {h:'The Four Standard Levels', p:"<ul><li><strong>READ UNCOMMITTED</strong> — can see other transactions' uncommitted changes (dirty reads); fastest, least safe</li><li><strong>READ COMMITTED</strong> — only sees changes that have been committed; the common default in PostgreSQL and SQL Server</li><li><strong>REPEATABLE READ</strong> — guarantees the same query returns the same rows if repeated within one transaction; MySQL's InnoDB default</li><li><strong>SERIALIZABLE</strong> — the strictest level, behaving as if transactions ran one at a time in sequence; slowest, safest</li></ul>"},
    {h:"SQLite's Approach", p:"SQLite doesn't expose the standard SET TRANSACTION ISOLATION LEVEL syntax — its default transaction behavior is effectively serializable-like for writers, since only one write transaction can be active at a time. It does offer a limited PRAGMA for read behavior.",
     runner:{id:'iso1', tabs:[
       {label:'Check read_uncommitted Setting', sql:"PRAGMA read_uncommitted;"}
     ]}}
  ],
  tip:{type:'c-warn', title:'Stricter Isolation, Less Concurrency', text:"Moving from READ COMMITTED toward SERIALIZABLE reduces the risk of anomalies like dirty reads, non-repeatable reads, and phantom reads — but it also increases blocking between concurrent transactions, so it's a genuine performance trade-off, not a free upgrade."}
},

'm16::Locks': {
  intro:"Locks are how a database prevents concurrent transactions from making conflicting changes to the same data at the same time — a transaction acquires a lock on the data it's using, and other transactions must wait or coordinate around it.",
  body:[
    {h:'Shared vs Exclusive Locks', p:"A <strong>shared lock</strong> (used for reading) can be held by multiple transactions at once — many readers don't block each other. An <strong>exclusive lock</strong> (used for writing) can only be held by one transaction at a time, and blocks both other writers and, in stricter isolation levels, other readers too."},
    {h:"SQLite's Locking Model", p:"SQLite locks at the level of the whole database file (SHARED, RESERVED, PENDING, EXCLUSIVE), not individual rows — this is much coarser than PostgreSQL, MySQL (InnoDB), or SQL Server, which all support fine-grained row-level locking, allowing far more concurrent writers on different rows of the same table."}
  ],
  tip:{type:'c-note', title:'Row-Level Locking Elsewhere', text:"In PostgreSQL, MySQL (InnoDB) and SQL Server, two transactions can typically update two different rows in the same table at the same time without blocking each other — SQLite's single-writer, whole-database lock model is one reason it's better suited to smaller-scale or embedded use cases than high-concurrency server workloads."}
},

'm16::Deadlocks': {
  intro:"A deadlock happens when two (or more) transactions each hold a lock the other one needs — Transaction A is waiting on a lock held by Transaction B, while B is simultaneously waiting on a lock held by A. Neither can ever proceed on its own.",
  body:[
    {h:'A Classic Deadlock Scenario', p:"<ul><li>Transaction A locks Row 1, then tries to lock Row 2</li><li>Transaction B locks Row 2, then tries to lock Row 1</li><li>A is now waiting for B to release Row 2; B is waiting for A to release Row 1</li><li>Neither transaction can move forward — a true deadlock</li></ul> This requires two separate concurrent connections to actually occur, so it can't be demonstrated in this single-connection in-browser SQL runner."},
    {h:'How Databases Resolve It', p:"Most production databases (PostgreSQL, MySQL, SQL Server, Oracle) run a deadlock detector in the background. When a cycle like the one above is found, the database picks one transaction as the 'deadlock victim', forcibly rolls it back with an error, and lets the other proceed."}
  ],
  tip:{type:'c-warn', title:'Reducing Deadlock Risk', text:"The most reliable fix is consistency: always acquire locks on multiple resources in the same order across every part of your application (e.g. always lock the lower id first). If A and B both lock rows in id order, the scenario above can't happen in the first place."}
},

'm17::Stored Procedures': {
  intro:"A stored procedure is a named block of procedural SQL logic — with variables, conditionals, and loops — that's compiled once and stored inside the database, then executed by simply calling its name.",
  body:[
    {h:'Not Supported in SQLite', p:"SQLite has no procedural language at all — no PL/pgSQL, no T-SQL, no PL/SQL equivalent — so there's no CREATE PROCEDURE syntax to run. Application code, a sequence of plain SQL statements, or triggers typically fill the role that a stored procedure would play elsewhere."},
