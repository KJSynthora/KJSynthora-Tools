<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KJSynthora Tools</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:
radial-gradient(circle at top left,#1e3a8a,#020617 40%),
linear-gradient(to bottom,#020617,#000814);
color:white;
overflow-x:hidden;
}

/* Animated Background */

body::before{
content:"";
position:fixed;
width:800px;
height:800px;
background:radial-gradient(circle,#2563eb44,#7c3aed22,transparent);
top:-250px;
left:-200px;
z-index:-1;
filter:blur(100px);
animation:floatbg 8s infinite alternate;
}

@keyframes floatbg{
0%{
transform:translateY(0px);
}
100%{
transform:translateY(100px);
}
}

/* Navbar */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
position:sticky;
top:0;
z-index:1000;
backdrop-filter:blur(16px);
background:rgba(2,6,23,0.7);
border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo img{
width:90px;
height:90px;
object-fit:contain;
filter:drop-shadow(0 0 12px #38bdf8);
transition:0.3s;
}

.logo img:hover{
transform:scale(1.08);
}

nav a{
text-decoration:none;
color:#cbd5e1;
margin-left:30px;
transition:0.3s;
font-size:15px;
font-weight:500;
}

nav a:hover{
color:#38bdf8;
text-shadow:0 0 12px #38bdf8;
}

/* Hero */

.hero{
text-align:center;
padding:140px 20px 90px;
}

.hero h1{
font-size:74px;
line-height:1.1;
margin-bottom:25px;
font-weight:800;
background:linear-gradient(to right,#38bdf8,#a855f7);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
max-width:900px;
margin:auto;
font-size:20px;
line-height:1.9;
color:#cbd5e1;
}

.hero-buttons{
margin-top:45px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.hero-buttons button{
padding:15px 32px;
border:none;
border-radius:14px;
font-size:16px;
cursor:pointer;
transition:0.3s;
font-weight:600;
}

.btn-primary{
background:linear-gradient(to right,#0ea5e9,#7c3aed);
color:white;
box-shadow:0 0 20px rgba(14,165,233,0.4);
}

.btn-primary:hover{
transform:translateY(-5px) scale(1.03);
}

.btn-secondary{
background:#111827;
color:white;
border:1px solid rgba(255,255,255,0.08);
}

.btn-secondary:hover{
background:#1e293b;
}

/* Search */

.search-box{
text-align:center;
margin:10px 0 40px;
}

.search-box input{
width:420px;
max-width:90%;
padding:16px 20px;
border:none;
border-radius:14px;
background:#111827;
color:white;
font-size:16px;
outline:none;
box-shadow:0 0 18px rgba(6,182,212,0.25);
transition:0.3s;
}

.search-box input:focus{
transform:scale(1.03);
box-shadow:0 0 25px rgba(124,58,237,0.45);
}

.search-box input::placeholder{
color:#94a3b8;
}

/* Section */

.tools-section{
padding:70px 50px;
}

.section-title{
text-align:center;
font-size:48px;
margin-bottom:60px;
font-weight:700;
background:linear-gradient(to right,#38bdf8,#a855f7);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* Cards */

.tools-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:35px;
}

.tool-card{
background:rgba(15,23,42,0.82);
border:1px solid rgba(255,255,255,0.06);
border-radius:26px;
padding:35px;
transition:0.4s;
position:relative;
overflow:hidden;
backdrop-filter:blur(12px);
min-height:390px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.tool-card::before{
content:"";
position:absolute;
width:130px;
height:130px;
background:#38bdf822;
border-radius:50%;
top:-40px;
right:-40px;
filter:blur(20px);
}

.tool-card:hover{
transform:translateY(-10px) scale(1.03);

box-shadow:
0 0 20px rgba(56,189,248,0.35),
0 0 50px rgba(168,85,247,0.25);

border:1px solid #38bdf8;
}

.icon{
font-size:48px;
margin-bottom:20px;
}

.tool-card h3{
font-size:28px;
margin-bottom:16px;
color:#38bdf8;
}

.tool-card p{
color:#cbd5e1;
line-height:1.8;
margin-bottom:25px;
}

.tool-card button{
padding:13px 24px;
border:none;
border-radius:12px;
background:linear-gradient(to right,#0ea5e9,#7c3aed);
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
font-weight:600;
}

.tool-card button:hover{
transform:scale(1.05);
}

/* Footer */

footer{
margin-top:90px;
padding:45px;
text-align:center;
border-top:1px solid rgba(255,255,255,0.08);
color:#94a3b8;
}

footer a{
color:#38bdf8;
text-decoration:none;
margin:0 10px;
}

/* Responsive */

@media(max-width:768px){

header{
padding:20px;
}

nav{
display:none;
}

.hero h1{
font-size:48px;
}

.hero p{
font-size:17px;
}

.section-title{
font-size:38px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
<img src="logo.png">
</div>

<nav>
<a href="#">Home</a>
<a href="#tools">Tools</a>
<a href="#tools">AI Tools</a>
<a href="#contact">Contact</a>
</nav>

</header>

<section class="hero">

<h1>All-in-One AI & Productivity Platform</h1>

<p>
KJSynthora Tools is your futuristic platform for AI tools,
PDF utilities, image editing, automation, productivity and content creation.
</p>

<div class="hero-buttons">

<button class="btn-primary" onclick="document.getElementById('tools').scrollIntoView()">
Explore Tools
</button>

<button class="btn-secondary">
Learn More
</button>

</div>

</section>

<section class="tools-section" id="tools">

<div class="search-box">
<input
type="text"
id="toolSearch"
placeholder="Search tools..."
onkeyup="searchTools()">
</div>

<h2 class="section-title">Popular Tools</h2>

<div class="tools-grid">

<!-- YOUR EXISTING TOOL CARDS STAY SAME -->

</div>

</section>

<footer id="contact">

<p>© 2026 KJSynthora — AI • Tech • Tools • Creation</p>

<br>

<p>
<a href="#">YouTube</a>
•
<a href="#">Instagram</a>
•
<a href="#">GitHub</a>
</p>

</footer>

<script>

function searchTools(){

let input=document.getElementById("toolSearch").value.toLowerCase();

let cards=document.querySelectorAll(".tool-card");

cards.forEach(card=>{

let text=card.innerText.toLowerCase();

if(text.includes(input)){
card.style.display="flex";
}
else{
card.style.display="none";
}

});

}

</script>

</body>
</html>
