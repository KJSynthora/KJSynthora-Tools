<!--
  ╔══════════════════════════════════════════════════════╗
  ║   KJSynthora PWA — Copy-paste snippets for index.html ║
  ╚══════════════════════════════════════════════════════╝

  STEP 1 ── Paste this inside your <head> tag
-->

<!-- PWA Manifest -->
<link rel="manifest" href="/manifest.json">

<!-- iOS support (Safari doesn't use manifest for these) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KJSynthora">
<link rel="apple-touch-icon" href="/logo.png">

<!-- Theme color (browser toolbar) -->
<meta name="theme-color" content="#7c6af7">
<meta name="msapplication-TileColor" content="#7c6af7">
<meta name="msapplication-TileImage" content="/logo.png">

<!-- PWA CSS -->
<link rel="stylesheet" href="/pwa-ui.css">

<!--
  STEP 2 ── Paste this just before your </body> tag
-->

<!-- PWA Install Banner -->
<div id="pwa-install-banner">
  <div class="pwa-banner-icon">⚡</div>
  <div class="pwa-banner-text">
    <strong>Install KJSynthora</strong>
    <span>90+ tools · works offline · no ads</span>
  </div>
  <div class="pwa-banner-actions">
    <button class="pwa-btn-install" onclick="kjPWA.install()">Install App</button>
    <button class="pwa-btn-dismiss" onclick="kjPWA.dismissInstall()">✕</button>
  </div>
</div>

<!-- PWA Update Banner -->
<div id="pwa-update-banner">
  <span>🚀 New version available!</span>
  <button class="pwa-btn-update" onclick="kjPWA.applyUpdate()">Update Now</button>
</div>

<!-- PWA Script -->
<script src="/pwa-install.js"></script>

<!--
  STEP 3 ── (Optional) Add notification bell to your header
  Paste inside your <header> or nav bar:
-->
<button class="pwa-notif-btn" onclick="kjPWA.requestNotifications()" title="Enable notifications">
  🔔
  <span class="pwa-notif-dot"></span>
</button>

<!--
  STEP 4 ── Push Notifications (Optional, needs backend)
  In pwa-install.js, replace:
    const VAPID_PUBLIC_KEY = 'YOUR_VAPID_PUBLIC_KEY_HERE';
  With your VAPID public key from:
    npm install web-push
    npx web-push generate-vapid-keys
  And create a /api/push-subscribe endpoint on your server.
  (If you're on static hosting like GitHub Pages, skip push notifications)
-->
