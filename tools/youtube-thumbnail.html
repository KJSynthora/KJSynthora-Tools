<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Thumbnail - KJSynthora</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#020617;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:420px;
background:rgba(15,23,42,0.9);
padding:50px;
border-radius:24px;
text-align:center;
box-shadow:
0 0 25px rgba(6,182,212,0.15),
0 0 50px rgba(124,58,237,0.12);
border:1px solid rgba(255,255,255,0.08);
}

h1{
font-size:32px;
margin-bottom:25px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:none;
margin-top:20px;
}

button{
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
border:none;
padding:14px 30px;
border-radius:12px;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

#success-msg{
margin-top:20px;
color:#4ade80;
font-weight:bold;
}

.back-home{
margin-top:20px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>YouTube Thumbnail</h1>

<p>Enter YouTube video link</p>

<input type="text" id="ytlink" placeholder="Paste YouTube URL">

<br>

<button onclick="generateThumb()">Generate Thumbnail</button>

<p id="success-msg"></p>

<div class="back-home">
<a href="../index.html">← Back to Home</a>
</div>

</div>

<script>

function generateThumb(){

const link=document.getElementById("ytlink").value;

if(link===""){

document.getElementById("success-msg").innerHTML=
"❌ Please enter YouTube link";

return;

}

document.getElementById("success-msg").innerHTML=
"✅ Thumbnail Generated Successfully!";

}

</script>

</body>
</html>
