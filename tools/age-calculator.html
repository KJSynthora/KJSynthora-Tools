<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KJSynthora Advanced Age Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020b2f;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

.container{
width:1200px;
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.card{
background:#08164f;
padding:30px;
border-radius:25px;
box-shadow:0 0 25px rgba(0,162,255,0.3);
}

.title{
font-size:52px;
font-weight:700;
background:linear-gradient(to right,#3db2ff,#9d4edd);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:25px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:500;
}

input, textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0f1d57;
color:white;
font-size:15px;
outline:none;
}

.btn-group{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:20px;
}

button{
padding:13px;
border:none;
border-radius:12px;
background:linear-gradient(to right,#2ea8ff,#9d4edd);
color:white;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-3px);
opacity:0.9;
}

.result-box{
margin-top:25px;
background:#122169;
padding:25px;
border-radius:20px;
text-align:center;
}

.result-age{
font-size:40px;
font-weight:700;
color:#43c0ff;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.small-card{
background:#122169;
padding:18px;
border-radius:18px;
text-align:center;
}

.small-card h4{
font-size:15px;
margin-bottom:8px;
}

.small-card p{
font-size:20px;
font-weight:600;
color:#5cc9ff;
}

.avatar{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
margin:auto;
display:block;
margin-top:20px;
border:4px solid #43c0ff;
}

.timer{
font-size:28px;
margin-top:15px;
font-weight:600;
color:#5cc9ff;
}

.progress{
width:100%;
height:22px;
background:#0f1d57;
border-radius:30px;
overflow:hidden;
margin-top:15px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(to right,#2ea8ff,#9d4edd);
transition:1s;
}

.chart-box{
margin-top:30px;
}

textarea{
height:90px;
resize:none;
}

@media(max-width:1000px){

.container{
grid-template-columns:1fr;
}

.title{
font-size:38px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1 class="title">Age Calculator</h1>

<label>Date of Birth</label>
<input type="date" id="dob">

<label>As Of Date</label>
<input type="date" id="today">

<label>Retirement Age</label>
<input type="number" id="retireAge" value="60">

<div class="btn-group">

<button onclick="calculateAge()">Calculate</button>

<button onclick="copySummary()">Copy</button>

<button onclick="window.print()">Print</button>

<button onclick="shareResult()">Share</button>

<button onclick="resetAll()">Reset</button>

<button onclick="window.location.href='../index.html'">Return Home</button>

</div>

<img id="avatar" class="avatar"
src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">

<div class="result-box">

<h2>Exact Age</h2>

<div class="result-age" id="exactAge">--</div>

<div class="timer" id="liveSeconds">--</div>

<div class="progress">
<div class="progress-bar" id="lifeProgress"></div>
</div>

<p id="lifePercent"></p>

</div>

<div class="grid">

<div class="small-card">
<h4>Next Birthday</h4>
<p id="nextBirthday">--</p>
</div>

<div class="small-card">
<h4>Zodiac Sign</h4>
<p id="zodiac">--</p>
</div>

<div class="small-card">
<h4>Born On</h4>
<p id="bornDay">--</p>
</div>

<div class="small-card">
<h4>Retirement In</h4>
<p id="retirement">--</p>
</div>

<div class="small-card">
<h4>Total Days</h4>
<p id="daysLived">--</p>
</div>

<div class="small-card">
<h4>Total Hours</h4>
<p id="hoursLived">--</p>
</div>

<div class="small-card">
<h4>Total Minutes</h4>
<p id="minutesLived">--</p>
</div>

<div class="small-card">
<h4>Half Birthday</h4>
<p id="halfBirthday">--</p>
</div>

</div>

</div>

<div class="card">

<h2 style="margin-bottom:20px;">Working Days Calculator</h2>

<label>Start Date</label>
<input type="date" id="startDate">

<label>End Date</label>
<input type="date" id="endDate">

<label>Optional Holidays</label>
<textarea id="holidays"
placeholder="2026-01-26,2026-08-15"></textarea>

<button style="margin-top:15px;"
onclick="countWorkingDays()">
Count Working Days
</button>

<div class="result-box">
<h2 id="workingResult">--</h2>
</div>

<div class="chart-box">
<canvas id="ageChart"></canvas>
</div>

</div>

</div>

<script>

let secondsInterval;

function calculateAge(){

const dobInput=document.getElementById("dob").value;

const todayInput=document.getElementById("today").value || new Date().toISOString().split('T')[0];

if(!dobInput){
alert("Select DOB");
return;
}

const dob=new Date(dobInput);
const today=new Date(todayInput);

let years=today.getFullYear()-dob.getFullYear();
let months=today.getMonth()-dob.getMonth();
let days=today.getDate()-dob.getDate();

if(days<0){
months--;
days+=30;
}

if(months<0){
years--;
months+=12;
}

document.getElementById("exactAge").innerHTML=
`${years} Years ${months} Months ${days} Days`;

const totalSeconds=Math.floor((today-dob)/1000);

updateLiveSeconds(totalSeconds);

clearInterval(secondsInterval);

secondsInterval=setInterval(()=>{
updateLiveSeconds(++totalSeconds);
},1000);

const totalDays=Math.floor((today-dob)/(1000*60*60*24));

document.getElementById("daysLived").innerHTML=totalDays;

document.getElementById("hoursLived").innerHTML=
(totalDays*24).toLocaleString();

document.getElementById("minutesLived").innerHTML=
(totalDays*24*60).toLocaleString();

const birthday=new Date(today.getFullYear(),
dob.getMonth(),
dob.getDate());

if(today>birthday){
birthday.setFullYear(today.getFullYear()+1);
}

const diff=Math.ceil((birthday-today)/(1000*60*60*24));

document.getElementById("nextBirthday").innerHTML=
diff+" Days";

const bornDay=dob.toLocaleDateString('en-US',{weekday:'long'});

document.getElementById("bornDay").innerHTML=bornDay;

const retireAge=document.getElementById("retireAge").value;

document.getElementById("retirement").innerHTML=
(retireAge-years)+" Years";

const half=new Date(dob);
half.setMonth(half.getMonth()+6);

document.getElementById("halfBirthday").innerHTML=
half.toLocaleDateString();

const zodiac=getZodiac(dob.getDate(),dob.getMonth()+1);

document.getElementById("zodiac").innerHTML=zodiac;

const progress=(years/80)*100;

document.getElementById("lifeProgress").style.width=
progress+"%";

document.getElementById("lifePercent").innerHTML=
Math.floor(progress)+"% of average life completed";

const avatar=document.getElementById("avatar");

if(years<18){
avatar.src="https://cdn-icons-png.flaticon.com/512/3048/3048122.png";
}
else if(years<50){
avatar.src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png";
}
else{
avatar.src="https://cdn-icons-png.flaticon.com/512/2922/2922510.png";
}

drawChart(years,totalDays);

}

function updateLiveSeconds(sec){

document.getElementById("liveSeconds").innerHTML=
sec.toLocaleString()+" Seconds Lived";

}

function getZodiac(day,month){

const signs=[
["Capricorn",19],
["Aquarius",18],
["Pisces",20],
["Aries",19],
["Taurus",20],
["Gemini",20],
["Cancer",22],
["Leo",22],
["Virgo",22],
["Libra",22],
["Scorpio",21],
["Sagittarius",21],
["Capricorn",31]
];

return day>signs[month-1][1]
?signs[month][0]
:signs[month-1][0];

}

function copySummary(){

navigator.clipboard.writeText(
document.getElementById("exactAge").innerText
);

alert("Summary Copied");

}

function shareResult(){

if(navigator.share){

navigator.share({
title:"KJSynthora Age Calculator",
text:document.getElementById("exactAge").innerText
});

}

}

function resetAll(){

location.reload();

}

function countWorkingDays(){

const start=new Date(
document.getElementById("startDate").value
);

const end=new Date(
document.getElementById("endDate").value
);

const holidayInput=
document.getElementById("holidays").value;

const holidays=holidayInput.split(",");

let count=0;

for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){

const day=d.getDay();

const formatted=d.toISOString().split('T')[0];

if(day!==0 && day!==6 && !holidays.includes(formatted)){

count++;

}

}

document.getElementById("workingResult").innerHTML=
count+" Working Days";

}

function drawChart(years,days){

const ctx=document.getElementById('ageChart');

new Chart(ctx,{
type:'doughnut',
data:{
labels:['Years','Days'],
datasets:[{
data:[years,days],
backgroundColor:['#3db2ff','#9d4edd']
}]
}
});

}

</script>

</body>
</html>
