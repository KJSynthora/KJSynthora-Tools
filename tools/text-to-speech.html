<!DOCTYPE html>
<html>
<head>
<title>Text To Speech</title>
<style>
body{
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}
.container{
background:#111827;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}
textarea{
width:90%;
height:120px;
padding:12px;
border:none;
border-radius:10px;
}
button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

<h1>Text To Speech</h1>

<textarea id="speechText"></textarea>

<br>

<button onclick="speakText()">
Speak
</button>

</div>

<script>

function speakText(){

const text=document.getElementById("speechText").value;

const speech=new SpeechSynthesisUtterance(text);

speechSynthesis.speak(speech);

}

</script>

</body>
</html>
