<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word to PDF - KJSynthora</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#020617;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:rgba(15,23,42,0.9);
    padding:50px;
    border-radius:24px;
    text-align:center;
    box-shadow:
    0 0 25px rgba(6,182,212,0.15),
    0 0 50px rgba(124,58,237,0.12);
    border:1px solid rgba(255,255,255,0.08);
}

h1{
    font-size:32px;
    margin-bottom:25px;
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{
    color:#cbd5e1;
    margin-bottom:25px;
}

input{
    margin:20px 0;
}

button{
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

#success-msg{
    margin-top:20px;
    color:#4ade80;
    font-weight:bold;
}

.back-home{
    margin-top:20px;
}

.back-home a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:bold;
}

.back-home a:hover{
    color:#7dd3fc;
}

</style>

</head>

<body>

<div class="container">

<h1>Word to PDF</h1>

<p>Select Word file and convert into PDF</p>

<input type="file" accept=".doc,.docx">

<br>

<button onclick="convertWord()">Convert PDF</button>

<p id="success-msg"></p>

<div class="back-home">
<a href="../index.html">← Back to Home</a>
</div>

</div>

<script>

async function convertWord(){

const input = document.querySelector('input[type="file"]');

if(input.files.length === 0){

document.getElementById("success-msg").innerHTML =
"❌ Please select Word file";

return;

}

const file = input.files[0];

const blob = new Blob([await file.arrayBuffer()], {type:'application/pdf'});

const link = document.createElement('a');

link.href = URL.createObjectURL(blob);

link.download = "KJSynthora-Word.pdf";

link.click();

document.getElementById("success-msg").innerHTML =
"✅ PDF Downloaded Successfully!";

}

</script>

</body>
</html>
