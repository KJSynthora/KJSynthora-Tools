<!DOCTYPE html>
<html>
<head>
<title>AI Bio Generator</title>

<style>
body{
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}

.container{
background:#111827;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}

input{
width:90%;
padding:12px;
border:none;
border-radius:10px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
cursor:pointer;
}

#bio{
margin-top:20px;
color:#38bdf8;
}
</style>
</head>

<body>

<div class="container">

<h1>AI Bio Generator</h1>

<input type="text" id="name" placeholder="Enter your name">

<br>

<button onclick="generateBio()">
Generate Bio
</button>

<p id="bio"></p>

<a href="../index.html">⬅ Back To Home</a>

</div>

<script>

function generateBio(){

const name=document.getElementById("name").value;

if(name===""){

document.getElementById("bio").innerHTML=
"❌ Enter name";

return;

}

document.getElementById("bio").innerHTML=
"🚀 "+name+" | Creator | Dreamer | Digital Explorer";

}

</script>

</body>
</html>
