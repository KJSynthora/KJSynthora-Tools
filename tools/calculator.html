<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Scientific Calculator | KJSynthora</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
radial-gradient(circle at top left,#1e3a8a22,transparent 40%),
linear-gradient(135deg,#020617,#020b2d,#000814);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
color:white;
overflow-x:hidden;
}

.container{
width:100%;
max-width:1200px;
display:grid;
grid-template-columns: 2fr 1fr;
gap:25px;
}

.calculator{
background:rgba(15,23,42,.7);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
padding:30px;
box-shadow:
0 0 40px rgba(59,130,246,.18),
0 0 90px rgba(168,85,247,.08);
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logo{
font-size:32px;
font-weight:800;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.mode{
padding:10px 18px;
border-radius:12px;
background:rgba(255,255,255,.05);
font-size:14px;
}

.display{
width:100%;
height:120px;
border:none;
outline:none;
background:rgba(255,255,255,.04);
border-radius:22px;
padding:25px;
font-size:42px;
font-weight:600;
color:white;
text-align:right;
margin-bottom:25px;
box-shadow:inset 0 0 15px rgba(255,255,255,.05);
}

.buttons{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:16px;
}

button{
height:75px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:600;
cursor:pointer;
transition:.25s;
background:rgba(255,255,255,.05);
color:white;
box-shadow:
0 0 10px rgba(255,255,255,.03);
}

button:hover{
transform:translateY(-3px) scale(1.03);
background:linear-gradient(135deg,#0ea5e9,#9333ea);
}

.operator{
background:linear-gradient(135deg,#0ea5e9,#9333ea);
}

.equal{
background:linear-gradient(135deg,#22c55e,#16a34a);
}

.clear{
background:linear-gradient(135deg,#ef4444,#dc2626);
}

.history-panel{
background:rgba(15,23,42,.7);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
padding:25px;
overflow:auto;
max-height:800px;
}

.history-panel h2{
margin-bottom:20px;
font-size:28px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.history-item{
padding:14px;
border-radius:16px;
background:rgba(255,255,255,.05);
margin-bottom:12px;
font-size:16px;
word-break:break-word;
}

.bottom-buttons{
margin-top:25px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

.bottom-buttons a{
flex:1;
text-align:center;
padding:15px;
border-radius:16px;
text-decoration:none;
font-weight:600;
color:white;
background:linear-gradient(135deg,#0ea5e9,#9333ea);
transition:.3s;
}

.bottom-buttons a:hover{
transform:scale(1.04);
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.display{
font-size:34px;
height:100px;
}

button{
height:65px;
font-size:20px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="calculator">

<div class="top-bar">
<div class="logo">KJSynthora Calculator</div>
<div class="mode">Scientific Mode</div>
</div>

<input type="text" id="display" class="display" readonly>

<div class="buttons">

<button onclick="append('sin(')">sin</button>
<button onclick="append('cos(')">cos</button>
<button onclick="append('tan(')">tan</button>
<button onclick="append('Math.PI')">π</button>
<button class="clear" onclick="clearDisplay()">C</button>

<button onclick="append('Math.sqrt(')">√</button>
<button onclick="append('**2')">x²</button>
<button onclick="append('%')">%</button>
<button onclick="append('(')">(</button>
<button onclick="append(')')">)</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="operator" onclick="append('/')">÷</button>
<button class="operator" onclick="backspace()">⌫</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="operator" onclick="append('*')">×</button>
<button onclick="append('Math.log10(')">log</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button class="operator" onclick="append('-')">−</button>
<button onclick="append('.')">.</button>

<button onclick="append('0')">0</button>
<button onclick="append('+')">+</button>
<button onclick="append('Math.E')">e</button>
<button class="equal" onclick="calculate()">=</button>
<button onclick="append('**')">xʸ</button>

</div>

<div class="bottom-buttons">
<a href="../index.html">← Return Home</a>
<a href="#">More Tools</a>
</div>

</div>

<div class="history-panel">

<h2>History</h2>

<div id="history"></div>

</div>

</div>

<script>

const display = document.getElementById("display");
const historyBox = document.getElementById("history");

function append(value){
display.value += value;
}

function clearDisplay(){
display.value = "";
}

function backspace(){
display.value = display.value.slice(0,-1);
}

function calculate(){

try{

let expression = display.value
.replace(/sin\(/g,'Math.sin(')
.replace(/cos\(/g,'Math.cos(')
.replace(/tan\(/g,'Math.tan(');

let result = eval(expression);

const historyItem = document.createElement("div");
historyItem.classList.add("history-item");
historyItem.innerHTML = `
${display.value}
<br>
=
<strong>${result}</strong>
`;

historyBox.prepend(historyItem);

display.value = result;

}catch{
display.value = "Error";
}

}

document.addEventListener("keydown",(e)=>{

if(!isNaN(e.key) || "+-*/.%()".includes(e.key)){
append(e.key);
}

if(e.key==="Enter"){
calculate();
}

if(e.key==="Backspace"){
backspace();
}

if(e.key==="Escape"){
clearDisplay();
}

});

</script>

</body>
</html>
