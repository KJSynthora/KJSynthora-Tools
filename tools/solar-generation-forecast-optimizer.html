<!-- ========================= -->
<!-- CSS -->
<!-- ========================= -->

<style>

html{
scroll-behavior:smooth;
}

body{
overflow-x:hidden;
background:#020b2d;
}

/* GRID FIX */

.tools-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:28px;
align-items:stretch;
}

.tools-section{
padding-bottom:120px;
}

/* SOLAR CARD */

.solar-card{

position:relative;
overflow:hidden;

background:
linear-gradient(
145deg,
#07133d,
#0b1f5e
);

border-radius:24px;

padding:28px;

border:1px solid rgba(66,182,255,.25);

box-shadow:
0 0 30px rgba(66,182,255,.15);

transition:.4s;

}

.solar-card:hover{

transform:translateY(-10px);

box-shadow:
0 0 40px rgba(66,182,255,.4);

}

/* GLOW EFFECT */

.solar-card::before{

content:"";

position:absolute;

top:-100px;
right:-100px;

width:220px;
height:220px;

background:
radial-gradient(
circle,
rgba(66,182,255,.3),
transparent
);

}

/* BADGE */

.solar-badge{

position:absolute;

top:18px;
right:18px;

padding:6px 12px;

background:
linear-gradient(
to right,
#ff9800,
#ff5722
);

border-radius:20px;

font-size:12px;
font-weight:700;

color:white;

box-shadow:
0 0 15px rgba(255,87,34,.4);

}

/* ICON */

.solar-icon{

width:72px;
height:72px;

margin-bottom:18px;

filter:
drop-shadow(0 0 15px rgba(255,193,7,.6));

animation:float 3s ease-in-out infinite;

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

/* TITLE */

.solar-card h3{

font-size:30px;
font-weight:800;

margin-bottom:14px;

background:
linear-gradient(
to right,
#42b6ff,
#9d4edd
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* TEXT */

.solar-card p{

color:#d5e3ff;

line-height:1.7;

font-size:15px;

margin-bottom:20px;

}

/* FEATURES */

.solar-features{

display:flex;
flex-wrap:wrap;
gap:10px;

margin-bottom:20px;

}

.solar-features span{

padding:8px 14px;

background:
rgba(255,255,255,.08);

border-radius:30px;

font-size:13px;
font-weight:600;

color:#9fd4ff;

border:
1px solid rgba(255,255,255,.08);

}

/* STATUS */

.solar-status{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;

margin-bottom:22px;

}

.status-box{

background:
rgba(255,255,255,.05);

padding:14px;

border-radius:16px;

text-align:center;

border:
1px solid rgba(255,255,255,.05);

}

.status-box small{

display:block;

color:#9fb6ff;

margin-bottom:6px;

}

.status-box strong{

font-size:22px;

color:#42ff9c;

}

/* MINI CHART */

.mini-chart{

display:flex;
align-items:flex-end;
gap:8px;

height:90px;

margin-bottom:25px;

}

.bar{

flex:1;

background:
linear-gradient(
to top,
#42b6ff,
#9d4edd
);

border-radius:12px 12px 0 0;

animation:bars 2s ease infinite alternate;

}

@keyframes bars{

from{
opacity:.7;
}

to{
opacity:1;
}

}

/* BUTTONS */

.solar-buttons{

display:flex;
gap:12px;

}

.tool-btn,
.preview-btn{

flex:1;

padding:14px;

border:none;

border-radius:14px;

font-size:15px;
font-weight:700;

cursor:pointer;

transition:.3s;

text-align:center;

text-decoration:none;

}

.tool-btn{

background:
linear-gradient(
to right,
#29b6ff,
#9d4edd
);

color:white;

}

.preview-btn{

background:
rgba(255,255,255,.08);

color:#9fd4ff;

border:
1px solid rgba(255,255,255,.08);

}

.tool-btn:hover,
.preview-btn:hover{

transform:translateY(-3px);

box-shadow:
0 0 20px rgba(66,182,255,.35);

}

/* MOBILE */

@media(max-width:768px){

.solar-card{
padding:22px;
}

.solar-card h3{
font-size:24px;
}

}

</style>
