<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Builder</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;
overflow:auto;
}

.container{
width:500px;
background:#0f172a;
padding:25px;
border-radius:20px;
box-shadow:0 0 25px rgba(59,130,246,0.4);
}

h1{
text-align:center;
margin-bottom:20px;
font-size:34px;
background:linear-gradient(to right,#38bdf8,#9333ea);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

label{
display:block;
margin-top:14px;
margin-bottom:6px;
color:#cbd5e1;
font-size:14px;
}

input, textarea, select{
width:100%;
padding:12px;
border-radius:10px;
border:none;
outline:none;
background:#1e293b;
color:white;
margin-bottom:10px;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(to right,#0ea5e9,#9333ea);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

button:hover{
opacity:0.9;
}

#resumeOutput{
margin-top:25px;
background:white;
color:black;
padding:35px;
border-radius:15px;
line-height:1.7;
white-space:pre-wrap;
}

.loading{
text-align:center;
font-size:18px;
font-weight:bold;
color:#38bdf8;
}

</style>

</head>

<body>

<div class="container">

<h1>AI Resume Builder</h1>

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter full name">

<label>Email</label>
<input type="email" id="email" placeholder="Enter email">

<label>Mobile Number</label>
<input type="text" id="phone" placeholder="Enter mobile number">

<label>Experience</label>
<input type="text" id="experience" placeholder="Example: 6 Years">

<label>Skills</label>
<textarea id="skills" placeholder="SQL, Power BI, Python, ADF"></textarea>

<label>Current Role</label>
<input type="text" id="role" placeholder="Example: Data Engineer">

<label>Education</label>
<input type="text" id="education" placeholder="Bachelor Degree">

<label>Certifications</label>
<input type="text" id="certifications" placeholder="Azure, Power BI">

<label>Domain</label>
<input type="text" id="domain" placeholder="Banking, Healthcare, Finance">

<button onclick="generateResume()">
Generate AI Resume
</button>

<div id="resumeOutput"></div>

</div>

<script>

async function generateResume(){

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const phone =
document.getElementById("phone").value;

const experience =
document.getElementById("experience").value;

const skills =
document.getElementById("skills").value;

const role =
document.getElementById("role").value;

const education =
document.getElementById("education").value;

const certifications =
document.getElementById("certifications").value;

const domain =
document.getElementById("domain").value;

const output =
document.getElementById("resumeOutput");

if(
name === "" ||
skills === "" ||
role === ""
){
alert("Please fill required fields");
return;
}

output.innerHTML =
"<div class='loading'>Generating Professional AI Resume...</div>";

const prompt = `

Create a modern ATS friendly professional resume.

Candidate Details:

Name: ${name}
Email: ${email}
Phone: ${phone}
Experience: ${experience}
Skills: ${skills}
Current Role: ${role}
Education: ${education}
Certifications: ${certifications}
Domain: ${domain}

Generate:

1. Professional Summary
2. Technical Skills
3. Roles and Responsibilities
4. Projects
5. Environment
6. Achievements
7. Certifications
8. Education
9. ATS Keywords
10. Professional Resume Format

Create very professional corporate style content.

`;

try{

const response = await fetch(
"https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=AIzaSyBCUz0ByQaR2ZYFCAq7neyXyttKs4haSNc",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[
{
parts:[
{
text:prompt
}
]
}
]

})

}
);

const data = await response.json();

const result =
data.candidates[0].content.parts[0].text;

output.innerHTML = `

<div style="font-family:Arial;">

<h1 style="
color:#2563eb;
font-size:36px;
margin-bottom:10px;
">
${name}
</h1>

<p>
${email} | ${phone}
</p>

<hr style="margin:20px 0;">

<div style="
line-height:1.9;
font-size:15px;
">

${result.replace(/\n/g,"<br>")}

</div>

</div>

`;

}

catch(error){

output.innerHTML =
"Resume generation failed. Check API key.";

console.log(error);

}

}

</script>

</body>
</html>
