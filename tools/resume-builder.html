<!DOCTYPE html>
<html>
<head>
<title>Resume Builder</title>
<style>
body{
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}
.container{
background:#111827;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}
input{
width:90%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
}
button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

<h1>Resume Builder</h1>

<input type="text" id="name" placeholder="Enter Name">

<input type="text" id="role" placeholder="Enter Role">

<button onclick="downloadResume()">
Download Resume
</button>

</div>

<script>

function downloadResume(){

const name=document.getElementById("name").value;

const role=document.getElementById("role").value;

if(name==="" || role===""){
alert("Fill all fields");
return;
}

const content=
"Name: "+name+"\nRole: "+role;

const blob=new Blob([content],{type:"text/plain"});

const link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="resume.txt";

link.click();

}

</script>

</body>
</html>
