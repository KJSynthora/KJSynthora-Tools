<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart AI Resume Builder</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
padding:20px;
color:white;
}

.container{
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:400px 1fr;
gap:20px;
}

.form-section,
.resume-section{
background:#0f172a;
padding:25px;
border-radius:20px;
box-shadow:0 0 25px rgba(59,130,246,0.25);
}

h1{
margin-bottom:20px;
font-size:32px;
background:linear-gradient(to right,#38bdf8,#9333ea);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

label{
display:block;
margin-top:14px;
margin-bottom:6px;
font-size:14px;
color:#cbd5e1;
}

input,
textarea,
select{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:10px;
background:#1e293b;
color:white;
margin-bottom:10px;
}

textarea{
height:90px;
resize:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(to right,#0ea5e9,#9333ea);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.resume-preview{
background:white;
color:black;
padding:40px;
border-radius:15px;
min-height:1000px;
}

.resume-name{
font-size:36px;
font-weight:bold;
color:#2563eb;
}

.resume-role{
font-size:18px;
margin-top:5px;
color:#475569;
}

.section-title{
margin-top:28px;
margin-bottom:12px;
font-size:20px;
color:#2563eb;
border-bottom:2px solid #e2e8f0;
padding-bottom:6px;
}

ul{
padding-left:20px;
line-height:1.8;
}

p{
line-height:1.8;
}

.small{
font-size:14px;
color:#475569;
margin-top:5px;
}

.skill-box{
display:inline-block;
padding:8px 12px;
background:#dbeafe;
color:#1e3a8a;
border-radius:20px;
margin:5px;
font-size:14px;
}

@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="container">

<div class="form-section">

<h1>Smart Resume Builder</h1>

<label>Full Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="email" id="email">

<label>Phone</label>
<input type="text" id="phone">

<label>Experience</label>
<select id="experience">
<option>Fresher</option>
<option>1 Year</option>
<option>2 Years</option>
<option>3 Years</option>
<option>4 Years</option>
<option>5 Years</option>
<option>6 Years</option>
<option>7 Years</option>
<option>8 Years</option>
<option>10+ Years</option>
</select>

<label>Primary Role</label>
<select id="role">
<option>Manual Tester</option>
<option>Automation Tester</option>
<option>Data Engineer</option>
<option>Java Developer</option>
<option>.NET Developer</option>
<option>DevOps Engineer</option>
<option>SQL Developer</option>
<option>Power BI Developer</option>
<option>Python Developer</option>
<option>Service Desk Engineer</option>
<option>Cloud Engineer</option>
</select>

<label>Skills</label>
<textarea id="skills" placeholder="SQL, Power BI, ADF, Python"></textarea>

<label>Education</label>
<select id="education">
<option>B.Tech</option>
<option>B.E</option>
<option>B.Sc</option>
<option>BCA</option>
<option>MCA</option>
<option>M.Tech</option>
<option>MBA</option>
<option>Diploma</option>
<option>Graduate</option>
<option>Post Graduate</option>
</select>

<label>Domain</label>
<input type="text" id="domain" placeholder="Banking, Healthcare">

<label>Certifications</label>
<textarea id="certifications"></textarea>

<button onclick="generateResume()">
Generate Resume
</button>

</div>

<div class="resume-section">

<div id="resumeOutput" class="resume-preview">
Resume preview will appear here...
</div>

<div style="text-align:center;margin-top:20px;">
<a href="../index.html" style="color:#38bdf8;text-decoration:none;font-weight:bold;">
⬅ Return To Home
</a>
</div>

</div>

</div>

<script>

function generateResume(){

const name=document.getElementById("name").value;
const email=document.getElementById("email").value;
const phone=document.getElementById("phone").value;
const experience=document.getElementById("experience").value;
const role=document.getElementById("role").value;
const skills=document.getElementById("skills").value;
const education=document.getElementById("education").value;
const domain=document.getElementById("domain").value;
const certifications=document.getElementById("certifications").value;

const output=document.getElementById("resumeOutput");

let summary="";
let responsibilities=[];
let projects=[];
let environment="";

if(role==="Data Engineer"){

summary=`${experience} experienced Data Engineer with expertise in Azure Data Factory, Databricks, SQL, ETL pipelines, cloud data solutions, and enterprise data transformation projects.`;

responsibilities=[
"Developed ADF pipelines for incremental and full loads",
"Worked on Databricks notebooks and PySpark transformations",
"Handled cloud ETL workflows and data validation",
"Optimized SQL queries and pipeline performance",
"Collaborated with business and analytics teams"
];

projects=[
"Enterprise Data Warehouse Migration",
"Cloud ETL Framework",
"ADF Incremental Load Automation"
];

environment="ADF, Databricks, PySpark, Azure SQL, ADLS, Power BI";

}

else if(role==="DevOps Engineer"){

summary=`${experience} experienced DevOps Engineer skilled in CI/CD automation, Docker, Kubernetes, Linux administration, cloud deployments, and infrastructure automation.`;

responsibilities=[
"Built CI/CD pipelines using Jenkins",
"Managed Docker and Kubernetes deployments",
"Worked on infrastructure automation",
"Monitored application and server health",
"Collaborated with development and operations teams"
];

projects=[
"CI/CD Automation Platform",
"Cloud Deployment System",
"Containerized Enterprise Applications"
];

environment="Jenkins, Docker, Kubernetes, Linux, GitHub Actions, AWS";

}

else if(role==="Manual Tester"){

summary=`${experience} experienced Manual Tester with expertise in functional testing, regression testing, defect tracking, and application quality assurance.`;

responsibilities=[
"Prepared test cases and test scenarios",
"Performed functional and regression testing",
"Logged and tracked defects using JIRA",
"Worked closely with developers and business teams",
"Supported UAT and release validation"
];

projects=[
"Banking Web Portal Testing",
"Insurance Claims Application Testing",
"Mobile Application QA"
];

environment="JIRA, TestRail, QC, Agile, SQL";

}

else if(role==="SQL Developer"){

summary=`${experience} experienced SQL Developer skilled in query optimization, stored procedures, database performance tuning, and reporting solutions.`;

responsibilities=[
"Developed complex SQL queries",
"Created stored procedures and functions",
"Optimized database performance",
"Worked on indexing and tuning",
"Generated reports and analytics"
];

projects=[
"Enterprise Reporting Platform",
"Database Optimization Project",
"Business Analytics Reporting"
];

environment="SQL Server, SSMS, Power BI, ETL";

}

else {

summary=`${experience} experienced ${role} with strong technical and professional expertise in enterprise applications and business solutions.`;

responsibilities=[
"Worked on enterprise level applications",
"Collaborated with technical teams",
"Handled production and support activities",
"Worked in Agile environment",
"Delivered high quality solutions"
];

projects=[
"Enterprise Application",
"Automation Project",
"Business Transformation Platform"
];

environment=skills;

}

output.innerHTML=`

<div class="resume-name">${name}</div>
<div class="resume-role">${role}</div>

<div class="small">
${email} | ${phone}
</div>

<div class="section-title">Professional Summary</div>
<p>${summary}</p>

<div class="section-title">Technical Skills</div>

${skills.split(',').map(skill=>`<span class="skill-box">${skill.trim()}</span>`).join('')}

<div class="section-title">Roles & Responsibilities</div>
<ul>
${responsibilities.map(item=>`<li>${item}</li>`).join('')}
</ul>

<div class="section-title">Projects</div>
<ul>
${projects.map(item=>`<li>${item}</li>`).join('')}
</ul>

<div class="section-title">Environment</div>
<p>${environment}</p>

<div class="section-title">Education</div>
<p>${education}</p>

<div class="section-title">Domain</div>
<p>${domain}</p>

<div class="section-title">Certifications</div>
<p>${certifications}</p>

<div class="section-title">Achievements</div>
<ul>
<li>Successfully delivered enterprise level solutions</li>
<li>Worked in Agile and production environments</li>
<li>Improved operational efficiency and application stability</li>
<li>Collaborated with cross functional teams</li>
</ul>

<div class="section-title">ATS Keywords</div>
<p>${skills}, ${role}, Agile, SDLC, Enterprise Applications, Production Support</p>

`;

}

</script>

</body>
</html>
