<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Builder</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#020617;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
overflow:auto;
color:white;
}

.container{
width:450px;
background:rgba(15,23,42,0.95);
padding:25px;
border-radius:20px;
box-shadow:0 0 25px rgba(37,99,235,0.4);
border:1px solid rgba(255,255,255,0.08);
}

h1{
text-align:center;
margin-bottom:20px;
font-size:32px;
background:linear-gradient(to right,#38bdf8,#9333ea);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

label{
display:block;
margin-top:12px;
margin-bottom:5px;
font-size:14px;
color:#cbd5e1;
}

input, textarea, select{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:10px;
background:#0f172a;
color:white;
margin-bottom:10px;
border:1px solid rgba(255,255,255,0.08);
}

textarea{
height:90px;
resize:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(to right,#0ea5e9,#9333ea);
color:white;
font-size:16px;
cursor:pointer;
margin-top:15px;
font-weight:bold;
}

button:hover{
opacity:0.9;
}

#resumeOutput{
margin-top:25px;
background:white;
padding:35px;
border-radius:14px;
color:black;
}

.resume-name{
font-size:34px;
font-weight:bold;
color:#2563eb;
}

.section-title{
margin-top:25px;
margin-bottom:10px;
font-size:20px;
color:#2563eb;
border-bottom:2px solid #e5e7eb;
padding-bottom:5px;
}

ul{
padding-left:20px;
line-height:1.8;
}

p{
line-height:1.7;
}

.small{
font-size:14px;
color:#475569;
}

</style>
</head>

<body>

<div class="container">

<h1>AI Resume Builder</h1>

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter full name">

<label>Email</label>
<input type="email" id="email" placeholder="Enter email">

<label>Mobile Number</label>
<input type="text" id="phone" placeholder="Enter mobile number">

<label>Experience (Years)</label>
<input type="text" id="years" placeholder="Example: 6">

<label>Skills</label>
<textarea id="skills" placeholder="SQL, Power BI, Azure, ADF"></textarea>

<label>Role Type</label>
<select id="role">
<option>Support</option>
<option>Developer</option>
<option>Migration</option>
<option>Data Engineer</option>
<option>Power BI Developer</option>
<option>SQL Developer</option>
</select>

<label>Education</label>
<input type="text" id="education" placeholder="Bachelor Degree">

<label>Certifications</label>
<input type="text" id="certifications" placeholder="Azure, SQL, Power BI">

<button onclick="generateResume()">
Generate Professional Resume
</button>

<div id="resumeOutput"></div>

</div>

<script>

function generateResume(){

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;
const years = document.getElementById("years").value;
const skills = document.getElementById("skills").value;
const role = document.getElementById("role").value;
const education = document.getElementById("education").value;
const certifications = document.getElementById("certifications").value;

const output = document.getElementById("resumeOutput");

let summary = "";
let responsibilities = "";
let projects = "";
let environment = "";

if(role === "Support"){

summary =
`${years}+ years experienced Application Support Engineer with expertise in SQL, troubleshooting, incident management, production support, and enterprise application maintenance.`;

responsibilities = `
<ul>
<li>Handled production support tickets and incidents</li>
<li>Worked on SQL query troubleshooting</li>
<li>Resolved incidents within SLA timelines</li>
<li>Performed root cause analysis</li>
<li>Supported enterprise applications</li>
<li>Worked with business users for issue resolution</li>
</ul>
`;

projects = `
<ul>
<li>Enterprise Production Support System</li>
<li>SQL Monitoring Dashboard</li>
<li>Incident Management Reporting Tool</li>
</ul>
`;

environment =
"SQL Server, Power BI, ServiceNow, Excel, Windows Server";

}

else if(role === "Developer"){

summary =
`${years}+ years experienced Software Developer skilled in enterprise application development, backend SQL programming, debugging, testing, and deployment activities.`;

responsibilities = `
<ul>
<li>Developed enterprise applications</li>
<li>Worked on backend SQL development</li>
<li>Optimized application performance</li>
<li>Created reusable code modules</li>
<li>Performed debugging and testing</li>
</ul>
`;

projects = `
<ul>
<li>Enterprise Web Application</li>
<li>Automation Reporting Tool</li>
<li>Database Optimization Project</li>
</ul>
`;

environment =
"JavaScript, SQL, HTML, CSS, APIs, GitHub";

}

else if(role === "Migration"){

summary =
`${years}+ years experienced Data Migration Specialist with expertise in SQL migration, ETL processes, data validation, system upgrades, and cloud migration activities.`;

responsibilities = `
<ul>
<li>Performed large scale data migration activities</li>
<li>Validated migrated datasets</li>
<li>Worked on ETL transformations</li>
<li>Resolved migration related issues</li>
<li>Prepared migration reports</li>
</ul>
`;

projects = `
<ul>
<li>Legacy Data Migration</li>
<li>Cloud Migration Project</li>
<li>Database Upgrade Program</li>
</ul>
`;

environment =
"SQL Server, ETL, Azure, Data Validation Tools";

}

else if(role === "Data Engineer"){

summary =
`${years}+ years experienced Azure Data Engineer skilled in ADF, Databricks, PySpark, SQL, data pipelines, ETL workflows, and cloud data engineering solutions.`;

responsibilities = `
<ul>
<li>Developed Azure Data Factory pipelines</li>
<li>Worked on Databricks notebooks</li>
<li>Handled ETL and data transformation</li>
<li>Optimized PySpark jobs</li>
<li>Worked with cloud storage solutions</li>
</ul>
`;

projects = `
<ul>
<li>Azure Data Lake Project</li>
<li>Enterprise ETL Framework</li>
<li>Cloud Data Warehouse Migration</li>
</ul>
`;

environment =
"ADF, Databricks, PySpark, Azure SQL, Power BI";

}

else if(role === "Power BI Developer"){

summary =
`${years}+ years experienced Power BI Developer skilled in dashboards, DAX, data modeling, SQL reporting, and business intelligence solutions.`;

responsibilities = `
<ul>
<li>Created Power BI dashboards</li>
<li>Worked on DAX calculations</li>
<li>Prepared business reports</li>
<li>Optimized report performance</li>
<li>Worked with stakeholders for reporting needs</li>
</ul>
`;

projects = `
<ul>
<li>Sales Dashboard</li>
<li>Executive KPI Reporting</li>
<li>Business Analytics Platform</li>
</ul>
`;

environment =
"Power BI, SQL Server, Excel, DAX";

}

else if(role === "SQL Developer"){

summary =
`${years}+ years experienced SQL Developer skilled in stored procedures, query optimization, database performance tuning, and reporting solutions.`;

responsibilities = `
<ul>
<li>Developed complex SQL queries</li>
<li>Created stored procedures and functions</li>
<li>Optimized database performance</li>
<li>Worked on indexing and tuning</li>
<li>Generated reports and analytics</li>
</ul>
`;

projects = `
<ul>
<li>SQL Reporting Platform</li>
<li>Database Performance Optimization</li>
<li>Enterprise Data Solutions</li>
</ul>
`;

environment =
"SQL Server, SSMS, Power BI, ETL";

}

output.innerHTML = `

<div>

<div class="resume-name">
${name}
</div>

<p class="small">
${email} | ${phone}
</p>

<div class="section-title">
Professional Summary
</div>

<p>
${summary}
</p>

<div class="section-title">
Technical Skills
</div>

<ul>
${skills.split(",").map(skill => `<li>${skill}</li>`).join("")}
</ul>

<div class="section-title">
Roles & Responsibilities
</div>

${responsibilities}

<div class="section-title">
Projects
</div>

${projects}

<div class="section-title">
Environment
</div>

<p>
${environment}
</p>

<div class="section-title">
Education
</div>

<p>
${education}
</p>

<div class="section-title">
Certifications
</div>

<p>
${certifications}
</p>

<div class="section-title">
Achievements
</div>

<ul>
<li>Successfully delivered enterprise level solutions</li>
<li>Worked in Agile and production environments</li>
<li>Handled business critical applications</li>
<li>Improved operational efficiency</li>
</ul>

</div>

`;

}

</script>

</body>
</html>
