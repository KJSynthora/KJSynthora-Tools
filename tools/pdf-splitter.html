<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Splitter</title>

<style>

body{
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}

.container{
background:#111827;
padding:40px;
border-radius:20px;
text-align:center;
width:400px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input{
margin-top:20px;
padding:12px;
width:90%;
border:none;
border-radius:10px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
font-size:16px;
cursor:pointer;
}

#msg{
margin-top:20px;
color:#38bdf8;
}

a{
display:block;
margin-top:20px;
color:#38bdf8;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<h1>PDF Splitter</h1>

<p>Select PDF file to split</p>

<input type="file" id="pdfInput" accept=".pdf">

<br>

<button onclick="splitPDF()">Split PDF</button>

<p id="msg"></p>

<a href="../index.html">⬅ Back To Home</a>

</div>

<script>

function splitPDF(){

const file=document.getElementById("pdfInput").files[0];

if(!file){

document.getElementById("msg").innerHTML=
"❌ Select PDF file";

return;

}

document.getElementById("msg").innerHTML=
"✅ PDF Split Successfully (Demo Version)";

const link=document.createElement("a");

link.href=URL.createObjectURL(file);

link.download="split-"+file.name;

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

}

</script>

</body>
</html>
