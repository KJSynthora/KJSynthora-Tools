<!DOCTYPE html>
<html>
<head>
<title>Sentence Corrector</title>
<style>
body{
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}
.container{
background:#111827;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}
textarea{
width:90%;
height:120px;
padding:12px;
border:none;
border-radius:10px;
}
button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
cursor:pointer;
}
#result{
margin-top:20px;
color:#38bdf8;
}
</style>
</head>
<body>

<div class="container">

<h1>Sentence Corrector</h1>

<textarea id="text"></textarea>

<br>

<button onclick="correctSentence()">
Correct Sentence
</button>

<p id="result"></p>

</div>

<script>

function correctSentence(){

const text=document.getElementById("text").value;

if(text===""){
document.getElementById("result").innerHTML=
"❌ Enter text";
return;
}

document.getElementById("result").innerHTML=
"✅ Corrected: "+text.charAt(0).toUpperCase()+text.slice(1)+".";

}

</script>

</body>
</html>
