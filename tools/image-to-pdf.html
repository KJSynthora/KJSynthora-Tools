<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image to PDF - KJSynthora</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#020617;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:rgba(15,23,42,0.9);
    padding:50px;
    border-radius:24px;
    text-align:center;
    box-shadow:
    0 0 25px rgba(6,182,212,0.15),
    0 0 50px rgba(124,58,237,0.12);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    transition:0.3s;
    animation:float 3s ease-in-out infinite;
}

h1{
    font-size:32px;
    margin-bottom:25px;
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

input{
    margin:20px 0;
}

button{
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    color:white;
    border:none;
    padding:16px 34px;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

button:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 0 20px rgba(124,58,237,0.5);
}

p{
    color:#cbd5e1;
}
.back-home{
    margin-top:20px;
}

.back-home a{
    color:#22d3ee;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    transition:0.3s;
    display:inline-block;
    margin-top:8px;
}

.back-home a:hover{
    color:#ffffff;
    text-shadow:0 0 10px #7c3aed;
    transform:scale(1.05);
}

#success-msg{
    color:#22c55e;
    margin-top:15px;
    font-weight:bold;
    font-size:16px;
}
</style>

</head>

<body>

<div class="container">

<h1>Image to PDF</h1>

<p>Select images and convert them into PDF</p>

<input type="file" multiple>

<br>

<button onclick="showMessage()">Convert PDF</button>

<p id="success-msg"></p>
<div class="back-home">
<a href="../index.html">⬅ Back to Home</a>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

async function showMessage(){

const input = document.querySelector('input[type="file"]');

if(input.files.length === 0){

document.getElementById("success-msg").innerHTML =
"❌ Please select images";

return;

}

const { jsPDF } = window.jspdf;

const pdf = new jsPDF();

for(let i=0; i<input.files.length; i++){

const file = input.files[i];

const reader = new FileReader();

await new Promise((resolve)=>{

reader.onload = function(e){

const img = new Image();

img.onload = function(){

if(i>0) pdf.addPage();

pdf.addImage(img,'JPEG',10,10,180,160);

resolve();

}

img.src = e.target.result;

}

reader.readAsDataURL(file);

});

}

pdf.save("KJSynthora-Images.pdf");

document.getElementById("success-msg").innerHTML =
"✅ PDF Downloaded Successfully!";

}

</script>
</body>
</html>
