<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image to PDF - KJSynthora</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#020617;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:rgba(15,23,42,0.9);
    padding:50px;
    border-radius:24px;
    text-align:center;
    box-shadow:
    0 0 25px rgba(6,182,212,0.15),
    0 0 50px rgba(124,58,237,0.12);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    transition:0.3s;
}

h1{
    font-size:32px;
    margin-bottom:25px;
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

input{
    margin:20px 0;
}

button{
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

p{
    color:#cbd5e1;
}
.back-home{
    margin-top:20px;
}

.back-home a{
    color:#38bdf8;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    transition:0.3s;
}

.back-home a:hover{
    color:#a855f7;
    letter-spacing:1px;
}
</style>

</head>

<body>

<div class="container">

<h1>Image to PDF</h1>

<p>Select images and convert them into PDF</p>

<input type="file" multiple>

<br>

<button>Convert PDF</button>
<div class="back-home">
<a href="../index.html">⬅ Back to Home</a>
</div>
</div>

</body>
</html>
