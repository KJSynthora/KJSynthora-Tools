<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF to Word Converter - KJSynthora</title>

<meta name="description" content="Convert PDF to Word document online free with KJSynthora PDF tools.">

<link rel="canonical" href="https://kjsynthora.com/tools/pdf-to-word.html">

<link rel="icon" type="image/png" href="../logo.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.0.3/docx.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:520px;
background:#081028;
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,0.5);
border:1px solid rgba(255,255,255,0.08);
}

h1{
font-size:42px;
margin-bottom:20px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
color:#cbd5e1;
margin-bottom:25px;
line-height:1.7;
}

input[type=file]{
width:100%;
padding:14px;
background:#0f172a;
border:1px solid #334155;
border-radius:12px;
color:white;
margin-bottom:25px;
cursor:pointer;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

#status{
margin-top:25px;
font-size:15px;
font-weight:500;
}

.loading{
color:#facc15;
}

.error{
color:#f87171;
}

.success{
color:#4ade80;
}

.note{
margin-top:20px;
padding:15px;
border-radius:12px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
font-size:14px;
color:#94a3b8;
line-height:1.7;
}

.home-btn{
display:inline-block;
margin-top:30px;
text-decoration:none;
color:#38bdf8;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>PDF to Word</h1>

<p>
Convert text-based PDF files into editable Word documents instantly.
</p>

<input type="file" id="pdfFile" accept=".pdf">

<button onclick="convertPDFtoWord()">
Convert to Word
</button>

<div id="status"></div>

<div class="note">
⚠ Best results work with text-based PDFs.<br>
Scanned/image PDFs may not convert perfectly.
</div>

<a href="../index.html" class="home-btn">
← Return Home
</a>

</div>

<script>

async function convertPDFtoWord(){

const file =
document.getElementById("pdfFile").files[0];

const status =
document.getElementById("status");

if(!file){

status.innerHTML =
"Please select a PDF file";

status.className = "error";

return;

}

status.innerHTML =
"Converting PDF to Word...";

status.className = "loading";

try{

const reader = new FileReader();

reader.onload = async function(){

try{

const typedarray =
new Uint8Array(this.result);

const pdf =
await pdfjsLib
.getDocument(typedarray)
.promise;

let fullText = "";

for(let i = 1; i <= pdf.numPages; i++){

const page =
await pdf.getPage(i);

const content =
await page.getTextContent();

const strings =
content.items.map(
item => item.str
);

fullText +=
strings.join(" ");

fullText += "\n\n";

}

if(fullText.trim() === ""){

status.innerHTML =
"No readable text found in PDF";

status.className = "error";

return;

}

const doc =
new docx.Document({

sections:[
{
properties:{},

children:[

new docx.Paragraph({
text:fullText
})

]
}
]

});

docx.Packer
.toBlob(doc)
.then(blob => {

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"KJSynthora-Converted.docx";

link.click();

status.innerHTML =
"✅ Word file downloaded successfully!";

status.className = "success";

});

}
catch(error){

console.log(error);

status.innerHTML =
"Conversion failed. Try another PDF.";

status.className = "error";

}

};

reader.readAsArrayBuffer(file);

}
catch(error){

console.log(error);

status.innerHTML =
"Something went wrong";

status.className = "error";

}

}

</script>

</body>
</html>
