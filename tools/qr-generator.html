<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{
background:#020617;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}

.container{
background:#111827;
padding:40px;
border-radius:20px;
text-align:center;
width:350px;
box-shadow:0 0 25px rgba(0,0,0,0.5);
}

h1{
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
margin-bottom:20px;
font-size:16px;
outline:none;
}

button{
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
border:none;
padding:12px 25px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:0.9;
}

#qrcode{
margin-top:20px;
}

a{
display:block;
margin-top:20px;
color:#38bdf8;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>QR Code Generator</h1>

<input type="text" id="qrText" placeholder="Enter text or URL">

<button onclick="generateQR()">Generate QR</button>

<div id="qrcode"></div>

<a href="../index.html">⬅ Back to Home</a>

</div>

<script>
function generateQR(){

let qrDiv=document.getElementById("qrcode");

qrDiv.innerHTML="";

let text=document.getElementById("qrText").value;

if(text===""){
alert("Enter text or URL");
return;
}

QRCode.toCanvas(text,{width:220},function(error,canvas){

if(error){
console.error(error);
return;
}

qrDiv.appendChild(canvas);

});
}
</script>

</body>
</html>
