<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Generator | KJSynthora</title>

<link rel="icon" type="image/png" href="../logo.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
background:#020617;
font-family:Poppins,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
background:#081028;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}

input,button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

button{
background:linear-gradient(90deg,#0ea5e9,#9333ea);
cursor:pointer;
}

#qrcode{
margin-top:20px;
display:flex;
justify-content:center;
}

a{
display:block;
margin-top:20px;
color:#38bdf8;
}

</style>
</head>

<body>

<div class="container">

<h1>QR Generator</h1>

<input type="text" id="qrText" placeholder="Enter text or URL">

<button onclick="generateQR()">
Generate QR
</button>

<div id="qrcode"></div>

<a href="../index.html">
← Return Home
</a>

</div>

<script>

function generateQR(){

document.getElementById("qrcode").innerHTML="";

new QRCode(
document.getElementById("qrcode"),
document.getElementById("qrText").value
);

}

</script>

</body>
</html>
