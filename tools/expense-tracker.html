<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense & Savings Tracker | KJSynthora</title>

<link rel="icon" type="image/png" href="../logo.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
padding:30px;
min-height:100vh;
}

.container{
max-width:1100px;
margin:auto;
background:#081028;
padding:40px;
border-radius:25px;
}

h1{
text-align:center;
margin-bottom:30px;
font-size:42px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

input,select{
padding:14px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
width:100%;
}

button{
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
width:100%;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#0f172a;
padding:25px;
border-radius:18px;
text-align:center;
}

.card h2{
margin-bottom:10px;
font-size:20px;
}

.card p{
font-size:30px;
font-weight:700;
color:#38bdf8;
}

table{
width:100%;
margin-top:30px;
border-collapse:collapse;
overflow:hidden;
border-radius:16px;
}

th,td{
padding:16px;
text-align:center;
background:#0f172a;
}

th{
background:#111827;
}

.delete-btn{
background:#ef4444;
padding:8px 12px;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

canvas{
margin-top:40px;
background:white;
padding:20px;
border-radius:20px;
}

.home-btn{
display:block;
margin-top:40px;
text-align:center;
color:#38bdf8;
text-decoration:none;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>Expense Tracker</h1>

<div class="grid">

<input type="text" id="title"
placeholder="Expense title">

<input type="number" id="amount"
placeholder="Amount">

<select id="category">

<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
<option>Bills</option>
<option>Entertainment</option>

</select>

<input type="date" id="date">

<button onclick="addExpense()">
Add Expense
</button>

</div>

<div class="summary">

<div class="card">
<h2>Total Expenses</h2>
<p id="totalExpense">₹0</p>
</div>

<div class="card">
<h2>Total Savings</h2>
<p id="totalSavings">₹0</p>
</div>

<div class="card">
<h2>Monthly Budget</h2>
<p id="budget">₹50,000</p>
</div>

</div>

<table>

<thead>

<tr>

<th>Title</th>
<th>Amount</th>
<th>Category</th>
<th>Date</th>
<th>Delete</th>

</tr>

</thead>

<tbody id="expenseList">

</tbody>

</table>

<canvas id="expenseChart"></canvas>

<a href="../index.html" class="home-btn">
← Return Home
</a>

</div>

<script>

let expenses =
JSON.parse(localStorage.getItem("expenses")) || [];

let chart;

function addExpense(){

const title =
document.getElementById("title").value;

const amount =
parseFloat(document.getElementById("amount").value);

const category =
document.getElementById("category").value;

const date =
document.getElementById("date").value;

if(!title || !amount || !date){

alert("Fill all fields");

return;

}

expenses.push({
title,
amount,
category,
date
});

localStorage.setItem(
"expenses",
JSON.stringify(expenses)
);

renderExpenses();

}

function renderExpenses(){

const list =
document.getElementById("expenseList");

list.innerHTML = "";

let total = 0;

expenses.forEach((expense,index)=>{

total += expense.amount;

list.innerHTML += `

<tr>

<td>${expense.title}</td>

<td>₹${expense.amount}</td>

<td>${expense.category}</td>

<td>${expense.date}</td>

<td>
<button
class="delete-btn"
onclick="deleteExpense(${index})">

Delete

</button>
</td>

</tr>

`;

});

document.getElementById("totalExpense")
.innerText =
"₹" + total.toLocaleString();

const savings =
50000-total;

document.getElementById("totalSavings")
.innerText =
"₹" + savings.toLocaleString();

updateChart();

}

function deleteExpense(index){

expenses.splice(index,1);

localStorage.setItem(
"expenses",
JSON.stringify(expenses)
);

renderExpenses();

}

function updateChart(){

const ctx =
document.getElementById("expenseChart");

const categories = {};

expenses.forEach(exp=>{

if(categories[exp.category]){

categories[exp.category] += exp.amount;

}
else{

categories[exp.category] = exp.amount;

}

});

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'pie',

data:{

labels:Object.keys(categories),

datasets:[{

data:Object.values(categories)

}]

},

options:{
responsive:true
}

});

}

renderExpenses();

</script>

</body>
</html>
