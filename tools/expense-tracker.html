<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Expense & Savings Planner | KJSynthora</title>

<link rel="icon" type="image/png" href="../logo.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
padding:30px;
min-height:100vh;
}

.container{
max-width:1200px;
margin:auto;
background:#081028;
padding:40px;
border-radius:25px;
box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h1{
text-align:center;
margin-bottom:35px;
font-size:42px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.section-title{
margin:35px 0 20px;
font-size:24px;
color:#38bdf8;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.input-box{
display:flex;
flex-direction:column;
}

label{
margin-bottom:8px;
font-size:14px;
color:#cbd5e1;
}

input,select{
padding:14px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
font-size:15px;
}

button{
margin-top:25px;
padding:16px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:0.3s;
width:100%;
}

button:hover{
transform:translateY(-2px);
}

.summary{
margin-top:35px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#0f172a;
padding:25px;
border-radius:18px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
}

.card h2{
font-size:18px;
margin-bottom:12px;
}

.card p{
font-size:28px;
font-weight:700;
color:#38bdf8;
}

.alert{
margin-top:30px;
padding:22px;
border-radius:18px;
background:rgba(239,68,68,0.12);
border:1px solid rgba(239,68,68,0.3);
font-size:18px;
line-height:1.8;
}

.success{
background:rgba(34,197,94,0.12);
border:1px solid rgba(34,197,94,0.3);
}

table{
width:100%;
margin-top:30px;
border-collapse:collapse;
overflow:hidden;
border-radius:16px;
}

th,td{
padding:16px;
text-align:center;
background:#0f172a;
}

th{
background:#111827;
}

.delete-btn{
background:#ef4444;
padding:8px 14px;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

canvas{
margin-top:40px;
background:white;
padding:20px;
border-radius:20px;
}

.home-btn{
display:block;
text-align:center;
margin-top:40px;
color:#38bdf8;
text-decoration:none;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>Smart Expense Planner</h1>

<div class="section-title">
Monthly Financial Setup
</div>

<div class="grid">

<div class="input-box">
<label>Monthly Salary</label>
<input type="number" id="salary" placeholder="Enter salary">
</div>

<div class="input-box">
<label>Other Income</label>
<input type="number" id="otherIncome" placeholder="Other income">
</div>

<div class="input-box">
<label>Monthly EMI</label>
<input type="number" id="emi" placeholder="EMI amount">
</div>

<div class="input-box">
<label>House Rent</label>
<input type="number" id="rent" placeholder="Rent">
</div>

<div class="input-box">
<label>Utility Bills</label>
<input type="number" id="bills" placeholder="Bills">
</div>

<div class="input-box">
<label>Monthly Savings Goal</label>
<input type="number" id="goal" placeholder="Savings target">
</div>

</div>

<button onclick="calculatePlan()">
Generate Smart Plan
</button>

<div class="summary">

<div class="card">
<h2>Total Income</h2>
<p id="incomeResult">₹0</p>
</div>

<div class="card">
<h2>Fixed Expenses</h2>
<p id="fixedResult">₹0</p>
</div>

<div class="card">
<h2>Available Spending</h2>
<p id="spendingResult">₹0</p>
</div>

<div class="card">
<h2>Daily Safe Budget</h2>
<p id="dailyResult">₹0</p>
</div>

<div class="card">
<h2>Expected Savings</h2>
<p id="savingsResult">₹0</p>
</div>

</div>

<div id="adviceBox" class="alert">
Financial insights will appear here.
</div>

<div class="section-title">
Add Daily Expenses
</div>

<div class="grid">

<div class="input-box">
<label>Expense Title</label>
<input type="text" id="expenseTitle" placeholder="Food, Petrol">
</div>

<div class="input-box">
<label>Amount</label>
<input type="number" id="expenseAmount" placeholder="Amount">
</div>

<div class="input-box">
<label>Category</label>

<select id="expenseCategory">

<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
<option>Bills</option>
<option>Entertainment</option>
<option>Medical</option>

</select>

</div>

<div class="input-box">
<label>Date</label>
<input type="date" id="expenseDate">
</div>

</div>

<button onclick="addExpense()">
Add Expense
</button>

<table>

<thead>

<tr>

<th>Title</th>
<th>Amount</th>
<th>Category</th>
<th>Date</th>
<th>Delete</th>

</tr>

</thead>

<tbody id="expenseList">

</tbody>

</table>

<canvas id="expenseChart"></canvas>

<a href="../index.html" class="home-btn">
← Return Home
</a>

</div>

<script>

let expenses =
JSON.parse(localStorage.getItem("expenses")) || [];

let chart;

let availableMoney = 0;

function calculatePlan(){

const salary =
parseFloat(document.getElementById("salary").value)||0;

const otherIncome =
parseFloat(document.getElementById("otherIncome").value)||0;

const emi =
parseFloat(document.getElementById("emi").value)||0;

const rent =
parseFloat(document.getElementById("rent").value)||0;

const bills =
parseFloat(document.getElementById("bills").value)||0;

const goal =
parseFloat(document.getElementById("goal").value)||0;

const totalIncome =
salary + otherIncome;

const fixedExpenses =
emi + rent + bills;

availableMoney =
totalIncome - fixedExpenses - goal;

const dailyBudget =
availableMoney / 30;

document.getElementById("incomeResult")
.innerText =
"₹" + totalIncome.toLocaleString();

document.getElementById("fixedResult")
.innerText =
"₹" + fixedExpenses.toLocaleString();

document.getElementById("spendingResult")
.innerText =
"₹" + availableMoney.toLocaleString();

document.getElementById("dailyResult")
.innerText =
"₹" + dailyBudget.toFixed(0);

document.getElementById("savingsResult")
.innerText =
"₹" + goal.toLocaleString();

const advice =
document.getElementById("adviceBox");

if(availableMoney <= 0){

advice.className = "alert";

advice.innerHTML = `
⚠ Your expenses and savings goal exceed your income.<br>
Reduce expenses or lower savings target.
`;

}
else{

advice.className =
"alert success";

advice.innerHTML = `
✅ Excellent financial balance.<br><br>

Recommended Daily Spending:
<b>₹${dailyBudget.toFixed(0)}</b><br><br>

Potential Monthly Savings:
<b>₹${goal.toLocaleString()}</b>
`;

}

}

function addExpense(){

const title =
document.getElementById("expenseTitle").value;

const amount =
parseFloat(document.getElementById("expenseAmount").value);

const category =
document.getElementById("expenseCategory").value;

const date =
document.getElementById("expenseDate").value;

if(!title || !amount || !date){

alert("Fill all fields");

return;

}

expenses.push({
title,
amount,
category,
date
});

localStorage.setItem(
"expenses",
JSON.stringify(expenses)
);

renderExpenses();

}

function renderExpenses(){

const list =
document.getElementById("expenseList");

list.innerHTML = "";

let totalSpent = 0;

expenses.forEach((expense,index)=>{

totalSpent += expense.amount;

list.innerHTML += `

<tr>

<td>${expense.title}</td>

<td>₹${expense.amount}</td>

<td>${expense.category}</td>

<td>${expense.date}</td>

<td>
<button
class="delete-btn"
onclick="deleteExpense(${index})">

Delete

</button>
</td>

</tr>

`;

});

updateChart();

}

function deleteExpense(index){

expenses.splice(index,1);

localStorage.setItem(
"expenses",
JSON.stringify(expenses)
);

renderExpenses();

}

function updateChart(){

const ctx =
document.getElementById("expenseChart");

const categories = {};

expenses.forEach(exp=>{

if(categories[exp.category]){

categories[exp.category] += exp.amount;

}
else{

categories[exp.category] = exp.amount;

}

});

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'doughnut',

data:{

labels:Object.keys(categories),

datasets:[{

data:Object.values(categories)

}]

},

options:{
responsive:true
}

});

}

renderExpenses();

</script>

</body>
</html>
