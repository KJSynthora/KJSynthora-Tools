<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Background Remover | KJSynthora</title>

<link rel="icon" type="image/png" href="../logo.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
min-height:100vh;
padding:30px;
}

.container{
max-width:1000px;
margin:auto;
background:#081028;
padding:40px;
border-radius:25px;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:30px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.upload-box{
border:2px dashed #38bdf8;
padding:40px;
border-radius:20px;
text-align:center;
cursor:pointer;
background:#0f172a;
transition:0.3s;
}

.upload-box:hover{
background:#111827;
}

input{
display:none;
}

.preview-section{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:30px;
}

.image-box{
background:#0f172a;
padding:20px;
border-radius:20px;
text-align:center;
}

.image-box h2{
margin-bottom:15px;
font-size:20px;
}

.image-box img{
max-width:100%;
border-radius:14px;
}

button{
margin-top:30px;
padding:15px;
width:100%;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:18px;
font-weight:600;
cursor:pointer;
}

.home-btn{
display:block;
margin-top:40px;
text-align:center;
color:#38bdf8;
text-decoration:none;
font-weight:600;
}

canvas{
display:none;
}

@media(max-width:768px){

.preview-section{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<h1>AI Background Remover</h1>

<label class="upload-box">

<input type="file"
id="imageInput"
accept="image/*">

<h2>Upload Image</h2>

<p>
Drag & Drop or Click to Upload
</p>

</label>

<div class="preview-section">

<div class="image-box">

<h2>Original</h2>

<img id="originalImage">

</div>

<div class="image-box">

<h2>Background Removed</h2>

<img id="outputImage">

</div>

</div>

<button onclick="removeBackground()">
Remove Background
</button>

<button onclick="downloadImage()">
Download PNG
</button>

<canvas id="canvas"></canvas>

<a href="../index.html"
class="home-btn">

← Return Home

</a>

</div>

<script>

const imageInput =
document.getElementById("imageInput");

const originalImage =
document.getElementById("originalImage");

const outputImage =
document.getElementById("outputImage");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

imageInput.addEventListener("change",function(){

const file = this.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

originalImage.src =
e.target.result;

};

reader.readAsDataURL(file);

}

});

function removeBackground(){

const img = new Image();

img.src = originalImage.src;

img.onload = function(){

canvas.width = img.width;

canvas.height = img.height;

ctx.drawImage(img,0,0);

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const pixels =
imageData.data;

for(let i=0;i<pixels.length;i+=4){

const red = pixels[i];

const green = pixels[i+1];

const blue = pixels[i+2];

if(
red > 200 &&
green > 200 &&
blue > 200
){

pixels[i+3] = 0;

}

}

ctx.putImageData(
imageData,
0,
0
);

outputImage.src =
canvas.toDataURL("image/png");

};

}

function downloadImage(){

const link =
document.createElement("a");

link.download =
"KJSynthora-Background-Removed.png";

link.href =
canvas.toDataURL();

link.click();

}

</script>

</body>

</html>
