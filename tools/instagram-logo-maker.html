<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Logo Maker - KJSynthora</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#020617;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:420px;
background:rgba(15,23,42,0.9);
padding:50px;
border-radius:24px;
text-align:center;
box-shadow:
0 0 25px rgba(6,182,212,0.15),
0 0 50px rgba(124,58,237,0.12);
border:1px solid rgba(255,255,255,0.08);
}

h1{
font-size:30px;
margin-bottom:25px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:none;
margin-top:20px;
}

button{
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
border:none;
padding:14px 30px;
border-radius:12px;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

#success-msg{
margin-top:20px;
color:#4ade80;
font-weight:bold;
}

.back-home{
margin-top:20px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Instagram Logo Maker</h1>

<p>Enter Instagram name</p>

<input type="text" id="instaName" placeholder="Enter Instagram Name">

<br>

<button onclick="createLogo()">Create Logo</button>

<p id="success-msg"></p>

<div class="back-home">
<a href="../index.html">← Back to Home</a>
</div>

</div>

<script>

function generateLogo(){

const input=document.querySelector('input');

if(input.files.length===0){

document.getElementById("success-msg").innerHTML =
"❌ Please select image";

return;

}

const file=input.files[0];

const reader=new FileReader();

reader.onload=function(e){

const link=document.createElement("a");

link.href=e.target.result;

link.download="KJSynthora-Instagram-Logo.png";

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

document.getElementById("success-msg").innerHTML =
"✅ Logo Downloaded Successfully!";

}

reader.readAsDataURL(file);

}

</script>


</body>
</html>
