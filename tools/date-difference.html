<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Date Difference Calculator | KJSynthora</title>

<style>

body{
background:#020617;
font-family:Poppins,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
background:#081028;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}

input,button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

button{
background:linear-gradient(90deg,#0ea5e9,#9333ea);
cursor:pointer;
}

.result{
margin-top:20px;
font-size:22px;
color:#38bdf8;
}

.home-btn{
display:block;
margin-top:20px;
color:#38bdf8;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<h1>Date Difference</h1>

<input type="date" id="date1">

<input type="date" id="date2">

<button onclick="calculateDiff()">
Calculate Difference
</button>

<div class="result" id="result"></div>

<a href="../index.html" class="home-btn">
← Return Home
</a>

</div>

<script>

function calculateDiff(){

const d1 = new Date(document.getElementById("date1").value);

const d2 = new Date(document.getElementById("date2").value);

const diff = Math.abs(d2 - d1);

const days = Math.ceil(diff / (1000*60*60*24));

document.getElementById("result").innerHTML =
`${days} Days Difference`;

}

</script>

</body>
</html>
