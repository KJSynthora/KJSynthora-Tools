<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tax Regime Comparison Calculator | KJSynthora</title>

<meta name="description"
content="Compare old vs new tax regime instantly with advanced salary tax calculator.">

<link rel="icon" type="image/png" href="../logo.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
padding:30px;
min-height:100vh;
}

.container{
max-width:1000px;
margin:auto;
background:#081028;
padding:40px;
border-radius:25px;
box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h1{
text-align:center;
margin-bottom:30px;
font-size:42px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.input-box{
display:flex;
flex-direction:column;
}

label{
margin-bottom:8px;
font-size:14px;
color:#cbd5e1;
}

input{
padding:14px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
font-size:15px;
}

button{
margin-top:30px;
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
}

.result{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#0f172a;
padding:25px;
border-radius:18px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
}

.card h2{
font-size:22px;
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:700;
color:#38bdf8;
}

.best{
margin-top:30px;
padding:25px;
border-radius:18px;
background:rgba(34,197,94,0.12);
border:1px solid rgba(34,197,94,0.3);
text-align:center;
font-size:22px;
font-weight:600;
color:#4ade80;
}

canvas{
margin-top:40px;
background:white;
border-radius:20px;
padding:20px;
}

.home-btn{
display:block;
text-align:center;
margin-top:40px;
color:#38bdf8;
text-decoration:none;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>Tax Regime Comparison</h1>

<div class="grid">

<div class="input-box">
<label>Annual Salary (₹)</label>
<input type="number" id="salary" placeholder="Enter salary">
</div>

<div class="input-box">
<label>80C Investments (₹)</label>
<input type="number" id="investment" placeholder="PF, LIC, ELSS">
</div>

<div class="input-box">
<label>HRA Exemption (₹)</label>
<input type="number" id="hra" placeholder="HRA exemption">
</div>

<div class="input-box">
<label>Home Loan Interest (₹)</label>
<input type="number" id="homeLoan" placeholder="Interest paid">
</div>

</div>

<button onclick="calculateTax()">
Compare Tax Regimes
</button>

<div class="result">

<div class="card">
<h2>Old Regime Tax</h2>
<p id="oldTax">₹0</p>
</div>

<div class="card">
<h2>New Regime Tax</h2>
<p id="newTax">₹0</p>
</div>

<div class="card">
<h2>Total Savings</h2>
<p id="savings">₹0</p>
</div>

</div>

<div class="best" id="bestOption">
Best option will appear here
</div>

<canvas id="taxChart"></canvas>

<a href="../index.html" class="home-btn">
← Return Home
</a>

</div>

<script>

let chart;

function calculateOldRegime(income,deductions){

let taxable = income - deductions;

let tax = 0;

if(taxable <= 250000){

tax = 0;

}
else if(taxable <= 500000){

tax = (taxable-250000)*0.05;

}
else if(taxable <= 1000000){

tax =
12500 +
(taxable-500000)*0.2;

}
else{

tax =
112500 +
(taxable-1000000)*0.3;

}

return Math.max(tax,0);

}

function calculateNewRegime(income){

let tax = 0;

if(income <= 300000){

tax = 0;

}
else if(income <= 600000){

tax = (income-300000)*0.05;

}
else if(income <= 900000){

tax =
15000 +
(income-600000)*0.1;

}
else if(income <= 1200000){

tax =
45000 +
(income-900000)*0.15;

}
else if(income <= 1500000){

tax =
90000 +
(income-1200000)*0.2;

}
else{

tax =
150000 +
(income-1500000)*0.3;

}

return Math.max(tax,0);

}

function calculateTax(){

const salary =
parseFloat(document.getElementById("salary").value)||0;

const investment =
parseFloat(document.getElementById("investment").value)||0;

const hra =
parseFloat(document.getElementById("hra").value)||0;

const homeLoan =
parseFloat(document.getElementById("homeLoan").value)||0;

const deductions =
investment + hra + homeLoan;

const oldTax =
calculateOldRegime(salary,deductions);

const newTax =
calculateNewRegime(salary);

document.getElementById("oldTax")
.innerText =
"₹" + oldTax.toLocaleString();

document.getElementById("newTax")
.innerText =
"₹" + newTax.toLocaleString();

let savings = 0;

let better = "";

if(oldTax < newTax){

savings = newTax-oldTax;

better = "Old Regime is Better";

}
else{

savings = oldTax-newTax;

better = "New Regime is Better";

}

document.getElementById("savings")
.innerText =
"₹" + savings.toLocaleString();

document.getElementById("bestOption")
.innerText =
better + " — Save ₹" +
savings.toLocaleString();

updateChart(oldTax,newTax);

}

function updateChart(oldTax,newTax){

const ctx =
document.getElementById("taxChart");

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'bar',

data:{
labels:[
'Old Regime',
'New Regime'
],

datasets:[{
label:'Tax Amount',
data:[oldTax,newTax]
}]
},

options:{
responsive:true,
plugins:{
legend:{
labels:{
color:'black'
}
}
},
scales:{
y:{
ticks:{
color:'black'
}
},
x:{
ticks:{
color:'black'
}
}
}
}

});

}

</script>

</body>
</html>
