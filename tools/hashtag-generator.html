<!DOCTYPE html>
<html>
<head>
<title>Hashtag Generator</title>

<style>
body{
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}

.container{
background:#111827;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}

input{
width:90%;
padding:12px;
border:none;
border-radius:10px;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
cursor:pointer;
}

#hashtags{
margin-top:20px;
color:#38bdf8;
}
</style>
</head>

<body>

<div class="container">

<h1>AI Hashtag Generator</h1>

<input type="text" id="keyword" placeholder="Enter keyword">

<br>

<button onclick="generateTags()">
Generate Hashtags
</button>

<p id="hashtags"></p>

<a href="../index.html">⬅ Back To Home</a>

</div>

<script>

function generateTags(){

const keyword=document.getElementById("keyword").value;

if(keyword===""){

document.getElementById("hashtags").innerHTML=
"❌ Enter keyword";

return;

}

document.getElementById("hashtags").innerHTML=
"#"+keyword+" #viral #trending #reels #explore";

}

</script>

</body>
</html>
