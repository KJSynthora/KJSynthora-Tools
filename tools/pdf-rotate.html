<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Rotate Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #7c6af7;
    --accent2: #f76a8a;
    --accent3: #6af7c4;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --success: #4ade80;
    --warning: #facc15;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated BG */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124,106,247,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(247,106,138,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  header {
    padding: 32px 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: grid; place-items: center;
    font-size: 22px;
  }

  header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
  header span { color: var(--accent); }
  header p { font-size: 0.85rem; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }

  .badge {
    margin-left: auto;
    background: rgba(124,106,247,0.15);
    border: 1px solid rgba(124,106,247,0.3);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
  }

  /* Upload Zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 60px 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }

  .upload-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(124,106,247,0.05) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .upload-zone:hover::before, .upload-zone.drag-over::before { opacity: 1; }

  .upload-icon {
    font-size: 56px;
    margin-bottom: 16px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .upload-zone h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
  .upload-zone p { color: var(--muted); font-size: 0.9rem; }

  .upload-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 28px;
    background: linear-gradient(135deg, var(--accent), #9b5cf0);
    border-radius: 30px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    color: white;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    transition: all 0.3s;
  }

  .upload-btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(124,106,247,0.4); }

  /* Controls */
  .controls-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .ctrl-group label { font-size: 0.8rem; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; }

  .btn {
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
    font-weight: 600;
    white-space: nowrap;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .btn.active { background: rgba(124,106,247,0.2); border-color: var(--accent); color: var(--accent); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #9b5cf0);
    border: none;
    color: white;
    padding: 10px 24px;
  }

  .btn-primary:hover { color: white; box-shadow: 0 6px 20px rgba(124,106,247,0.4); }

  .btn-danger { border-color: var(--accent2); color: var(--accent2); }
  .btn-danger:hover { background: rgba(247,106,138,0.15); }

  .btn-success { border-color: var(--success); color: var(--success); }
  .btn-success:hover { background: rgba(74,222,128,0.15); }

  .sep { width: 1px; height: 32px; background: var(--border); }

  .ml-auto { margin-left: auto; }

  /* Angle Wheel */
  .angle-wheel {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .angle-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.2s;
    padding: 0;
  }

  .angle-btn:hover { border-color: var(--accent); color: var(--accent); }

  .angle-display {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    color: var(--accent);
    min-width: 60px;
    text-align: center;
  }

  /* Page Grid */
  .pages-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .pages-header h3 { font-size: 1rem; font-weight: 700; }
  .page-count { font-family: 'DM Mono', monospace; color: var(--muted); font-size: 0.8rem; }

  .pages-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .page-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    user-select: none;
  }

  .page-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .page-card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,247,0.3); }

  .page-thumb {
    width: 100%;
    aspect-ratio: 3/4;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a25;
    position: relative;
    overflow: hidden;
  }

  .page-thumb canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: transform 0.4s ease;
  }

  .page-info {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .page-num { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--muted); }
  .page-angle { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--accent); font-weight: 600; }

  .page-select-check {
    position: absolute;
    top: 8px; left: 8px;
    width: 22px; height: 22px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 6px;
    display: grid; place-items: center;
    font-size: 12px;
    transition: all 0.2s;
    z-index: 2;
  }

  .page-card.selected .page-select-check {
    background: var(--accent);
    border-color: var(--accent);
  }

  .page-quick-btns {
    position: absolute;
    top: 8px; right: 8px;
    display: flex; flex-direction: column; gap: 4px;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 2;
  }

  .page-card:hover .page-quick-btns { opacity: 1; }

  .quick-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: none;
    background: rgba(13,13,20,0.9);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
  }

  .quick-btn:hover { background: var(--accent); }

  /* Progress */
  .progress-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(8px);
    display: none;
    place-items: center;
    z-index: 100;
    flex-direction: column;
    gap: 20px;
  }

  .progress-overlay.show { display: grid; }

  .progress-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    min-width: 320px;
  }

  .spinner {
    width: 56px; height: 56px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 10px;
    height: 6px;
    overflow: hidden;
    margin-top: 16px;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 10px;
    transition: width 0.3s;
    width: 0%;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 200;
    max-width: 320px;
  }

  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--accent2); }

  /* Stats row */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-chip strong { color: var(--text); }

  /* Range slider */
  input[type=range] {
    -webkit-appearance: none;
    height: 4px;
    border-radius: 4px;
    background: var(--border);
    outline: none;
    cursor: pointer;
    width: 100px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(124,106,247,0.4);
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 40px;
    color: var(--muted);
  }
  .empty-state .big-icon { font-size: 64px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 1.2rem; color: var(--text); margin-bottom: 8px; }

  #fileInput { display: none; }

  .selection-info {
    background: rgba(124,106,247,0.1);
    border: 1px solid rgba(124,106,247,0.3);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 0.85rem;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
  }

  @media (max-width: 640px) {
    .controls-bar { flex-direction: column; align-items: flex-start; }
    .pages-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .progress-box { min-width: 280px; padding: 30px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-icon">🔄</div>
    <div>
      <h1>PDF <span>Rotate</span> Pro</h1>
      <p>Advanced page rotation with precision controls</p>
    </div>
    <div class="badge">v2.0 ADVANCED</div>
  </header>

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone">
    <span class="upload-icon">📄</span>
    <h2>Drop your PDF here</h2>
    <p>Supports multi-page PDFs • Drag & drop or browse files</p>
    <label class="upload-btn" for="fileInput">Choose PDF File</label>
    <input type="file" id="fileInput" accept=".pdf">
  </div>

  <!-- Main UI (hidden initially) -->
  <div id="mainUI" style="display:none">
    <!-- Stats -->
    <div class="stats-row" id="statsRow"></div>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="ctrl-group">
        <label>SELECT:</label>
        <button class="btn" onclick="selectAll()">✓ All</button>
        <button class="btn" onclick="selectNone()">✕ None</button>
        <button class="btn" onclick="selectOdd()">Odd</button>
        <button class="btn" onclick="selectEven()">Even</button>
        <button class="btn" onclick="invertSelection()">↕ Invert</button>
      </div>
      <div class="sep"></div>
      <div class="ctrl-group">
        <label>ROTATION:</label>
        <div class="angle-wheel">
          <button class="angle-btn btn" onclick="rotateSelected(-90)">↺</button>
          <div class="angle-display" id="angleDisplay">90°</div>
          <button class="angle-btn btn" onclick="rotateSelected(90)">↻</button>
        </div>
        <button class="btn" onclick="rotateSelected(180)">⟳ 180°</button>
      </div>
      <div class="ctrl-group ml-auto">
        <div class="selection-info" id="selectionInfo">0 selected</div>
        <button class="btn btn-danger" onclick="resetAll()">↺ Reset</button>
        <button class="btn btn-success" onclick="downloadPDF()">⬇ Download PDF</button>
      </div>
    </div>

    <!-- Pages Grid -->
    <div class="pages-header">
      <h3>Pages</h3>
      <span class="page-count" id="pageCount"></span>
    </div>
    <div class="pages-grid" id="pagesGrid"></div>
  </div>

  <!-- Empty state in grid -->
  <div id="emptyState" style="display:none">
    <div class="empty-state">
      <div class="big-icon">📋</div>
      <h3>No pages found</h3>
      <p>Load a valid PDF file to get started</p>
    </div>
  </div>
</div>

<!-- Progress Overlay -->
<div class="progress-overlay" id="progressOverlay">
  <div class="progress-box">
    <div class="spinner"></div>
    <h3 id="progressTitle">Processing...</h3>
    <p id="progressMsg" style="color:var(--muted);font-size:0.85rem;margin-top:8px">Please wait</p>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let originalBytes = null;
let pageRotations = []; // extra rotation added by user per page
let selectedPages = new Set();
let totalPages = 0;
let fileName = 'document.pdf';

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const mainUI = document.getElementById('mainUI');
const pagesGrid = document.getElementById('pagesGrid');

// Drag & Drop
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') loadPDF(file);
  else showToast('⚠️ Please drop a valid PDF file', 'error');
});

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadPDF(e.target.files[0]);
});

async function loadPDF(file) {
  fileName = file.name;
  showProgress('Loading PDF...', 'Rendering page thumbnails');

  const arrayBuffer = await file.arrayBuffer();
  originalBytes = new Uint8Array(arrayBuffer);

  pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  totalPages = pdfDoc.numPages;
  pageRotations = new Array(totalPages).fill(0);
  selectedPages = new Set();

  setProgress(20);
  uploadZone.style.display = 'none';
  mainUI.style.display = 'block';

  updateStats(file);
  await renderAllPages();

  hideProgress();
  showToast(`✅ Loaded "${fileName}" • ${totalPages} pages`, 'success');
}

function updateStats(file) {
  const sizeMB = (file.size / 1024 / 1024).toFixed(2);
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-chip">📄 <strong>${totalPages}</strong> Pages</div>
    <div class="stat-chip">💾 <strong>${sizeMB} MB</strong> Size</div>
    <div class="stat-chip">📁 <strong>${file.name}</strong></div>
  `;
  document.getElementById('pageCount').textContent = `${totalPages} pages total`;
}

async function renderAllPages() {
  pagesGrid.innerHTML = '';
  for (let i = 1; i <= totalPages; i++) {
    const card = createPageCard(i);
    pagesGrid.appendChild(card);
    await renderPageThumb(i, card.querySelector('canvas'));
    setProgress(20 + (i / totalPages) * 70);
  }
}

function createPageCard(pageNum) {
  const card = document.createElement('div');
  card.className = 'page-card';
  card.dataset.page = pageNum;
  card.innerHTML = `
    <div class="page-select-check" onclick="toggleSelect(${pageNum}, event)">
      ${selectedPages.has(pageNum) ? '✓' : ''}
    </div>
    <div class="page-quick-btns">
      <button class="quick-btn" title="Rotate left" onclick="rotatePage(${pageNum}, -90, event)">↺</button>
      <button class="quick-btn" title="Rotate right" onclick="rotatePage(${pageNum}, 90, event)">↻</button>
    </div>
    <div class="page-thumb">
      <canvas></canvas>
    </div>
    <div class="page-info">
      <span class="page-num">P${pageNum}</span>
      <span class="page-angle" id="angle-${pageNum}">0°</span>
    </div>
  `;
  card.addEventListener('click', (e) => {
    if (!e.target.closest('.page-select-check') && !e.target.closest('.page-quick-btns')) {
      toggleSelect(pageNum, e);
    }
  });
  return card;
}

async function renderPageThumb(pageNum, canvas) {
  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale: 0.6 });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  applyCanvasRotation(canvas, pageNum);
}

function applyCanvasRotation(canvas, pageNum) {
  canvas.style.transform = `rotate(${pageRotations[pageNum - 1]}deg)`;
  const a = ((pageRotations[pageNum - 1] % 360) + 360) % 360;
  document.getElementById(`angle-${pageNum}`).textContent = `${a}°`;
}

function toggleSelect(pageNum, e) {
  if (selectedPages.has(pageNum)) selectedPages.delete(pageNum);
  else selectedPages.add(pageNum);
  updateCard(pageNum);
  updateSelectionInfo();
}

function updateCard(pageNum) {
  const card = document.querySelector(`.page-card[data-page="${pageNum}"]`);
  if (!card) return;
  if (selectedPages.has(pageNum)) card.classList.add('selected');
  else card.classList.remove('selected');
  card.querySelector('.page-select-check').innerHTML = selectedPages.has(pageNum) ? '✓' : '';
}

function updateSelectionInfo() {
  document.getElementById('selectionInfo').textContent = `${selectedPages.size} selected`;
}

function selectAll() { for (let i = 1; i <= totalPages; i++) { selectedPages.add(i); updateCard(i); } updateSelectionInfo(); }
function selectNone() { selectedPages.forEach(p => updateCard(p)); selectedPages.clear(); updateSelectionInfo(); }
function selectOdd() { selectNone(); for (let i = 1; i <= totalPages; i += 2) { selectedPages.add(i); updateCard(i); } updateSelectionInfo(); }
function selectEven() { selectNone(); for (let i = 2; i <= totalPages; i += 2) { selectedPages.add(i); updateCard(i); } updateSelectionInfo(); }
function invertSelection() { for (let i = 1; i <= totalPages; i++) { if (selectedPages.has(i)) selectedPages.delete(i); else selectedPages.add(i); updateCard(i); } updateSelectionInfo(); }

function rotateSelected(deg) {
  if (selectedPages.size === 0) { showToast('⚠️ Select pages first', 'error'); return; }
  selectedPages.forEach(pageNum => {
    pageRotations[pageNum - 1] = (pageRotations[pageNum - 1] + deg + 360) % 360;
    const card = document.querySelector(`.page-card[data-page="${pageNum}"]`);
    if (card) applyCanvasRotation(card.querySelector('canvas'), pageNum);
  });
  showToast(`✅ Rotated ${selectedPages.size} pages by ${deg > 0 ? '+' : ''}${deg}°`);
}

function rotatePage(pageNum, deg, e) {
  e.stopPropagation();
  pageRotations[pageNum - 1] = (pageRotations[pageNum - 1] + deg + 360) % 360;
  const card = document.querySelector(`.page-card[data-page="${pageNum}"]`);
  if (card) applyCanvasRotation(card.querySelector('canvas'), pageNum);
}

function resetAll() {
  pageRotations.fill(0);
  for (let i = 1; i <= totalPages; i++) {
    const card = document.querySelector(`.page-card[data-page="${i}"]`);
    if (card) applyCanvasRotation(card.querySelector('canvas'), i);
  }
  showToast('↺ All rotations reset');
}

async function downloadPDF() {
  showProgress('Generating PDF...', 'Applying rotations to all pages');
  try {
    const { PDFDocument, degrees } = PDFLib;
    const pdfLibDoc = await PDFDocument.load(originalBytes);
    const pages = pdfLibDoc.getPages();

    for (let i = 0; i < pages.length; i++) {
      const currentRot = pages[i].getRotation().angle;
      const totalRot = (currentRot + pageRotations[i] + 360) % 360;
      pages[i].setRotation(degrees(totalRot));
      setProgress(20 + (i / pages.length) * 70);
    }

    setProgress(95);
    const pdfBytes = await pdfLibDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName.replace('.pdf', '_rotated.pdf');
    a.click();
    URL.revokeObjectURL(url);
    setProgress(100);
    hideProgress();
    showToast('✅ PDF downloaded successfully!', 'success');
  } catch (err) {
    hideProgress();
    showToast('❌ Error generating PDF: ' + err.message, 'error');
  }
}

// Progress helpers
function showProgress(title, msg) {
  document.getElementById('progressTitle').textContent = title;
  document.getElementById('progressMsg').textContent = msg;
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressOverlay').classList.add('show');
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function hideProgress() {
  setTimeout(() => document.getElementById('progressOverlay').classList.remove('show'), 500);
}

// Toast
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
