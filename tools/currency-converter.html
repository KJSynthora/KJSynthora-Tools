<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KJSynthora Currency Converter</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#020b2d;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:550px;
background:#07133d;
padding:40px;
border-radius:25px;
box-shadow:0 0 40px rgba(0,140,255,0.25);
}

h1{
text-align:center;
margin-bottom:30px;
font-size:42px;
background:linear-gradient(90deg,#2fb7ff,#9d4dff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

input,
select{
width:100%;
padding:16px;
margin-bottom:18px;
border:none;
outline:none;
border-radius:14px;
background:#0d1b4d;
color:white;
font-size:17px;
}

select{
cursor:pointer;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
color:white;
margin-bottom:15px;
}

button:hover{
transform:scale(1.02);
}

.convert-btn{
background:linear-gradient(90deg,#2fb7ff,#9d4dff);
}

.swap-btn{
background:#14255f;
}

.clear-btn{
background:#ff3b3b;
}

.result-box{
display:none;
margin-top:20px;
padding:20px;
background:#0d1b4d;
border-radius:16px;
text-align:center;
font-size:24px;
font-weight:bold;
line-height:1.8;
}

.update-text{
margin-top:12px;
text-align:center;
font-size:14px;
opacity:0.7;
}

.quick-buttons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:20px;
}

.quick-buttons button{
padding:12px;
font-size:14px;
margin-bottom:0;
background:linear-gradient(90deg,#2fb7ff,#9d4dff);
}

.bottom-buttons{
display:flex;
gap:15px;
margin-top:25px;
}

.bottom-buttons a{
flex:1;
text-align:center;
padding:14px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
color:white;
background:linear-gradient(90deg,#2fb7ff,#9d4dff);
transition:0.3s;
}

.bottom-buttons a:hover{
transform:scale(1.03);
}

@media(max-width:600px){

.container{
padding:25px;
}

h1{
font-size:34px;
}

.quick-buttons{
grid-template-columns:1fr;
}

.bottom-buttons{
flex-direction:column;
}

}

</style>
</head>

<body>

<div class="container">

<h1>Currency Converter</h1>

<div class="quick-buttons">

<button onclick="setPair('USD','INR')">
🇺🇸 USD → 🇮🇳 INR
</button>

<button onclick="setPair('INR','USD')">
🇮🇳 INR → 🇺🇸 USD
</button>

<button onclick="setPair('EUR','INR')">
🇪🇺 EUR → 🇮🇳 INR
</button>

<button onclick="setPair('AED','INR')">
🇦🇪 AED → 🇮🇳 INR
</button>

</div>

<input type="number" id="amount" placeholder="Enter Amount">

<select id="fromCurrency"></select>

<select id="toCurrency"></select>

<button class="swap-btn" onclick="swapCurrencies()">
⇅ Swap Currencies
</button>

<button class="convert-btn" onclick="convertCurrency()">
Convert Currency
</button>

<button class="clear-btn" onclick="clearFields()">
Clear
</button>

<div class="result-box" id="resultBox"></div>

<div class="update-text" id="updateInfo"></div>

<div class="bottom-buttons">

<a href="../index.html">
← Return Home
</a>

<a href="../index.html#tools">
More Tools
</a>

</div>

</div>

<script>

const currencies = [

{code:"USD",name:"United States Dollar",flag:"🇺🇸"},
{code:"INR",name:"Indian Rupee",flag:"🇮🇳"},
{code:"EUR",name:"Euro",flag:"🇪🇺"},
{code:"GBP",name:"British Pound",flag:"🇬🇧"},
{code:"JPY",name:"Japanese Yen",flag:"🇯🇵"},
{code:"AED",name:"UAE Dirham",flag:"🇦🇪"},
{code:"AUD",name:"Australian Dollar",flag:"🇦🇺"},
{code:"CAD",name:"Canadian Dollar",flag:"🇨🇦"},
{code:"CNY",name:"Chinese Yuan",flag:"🇨🇳"},
{code:"SGD",name:"Singapore Dollar",flag:"🇸🇬"},
{code:"CHF",name:"Swiss Franc",flag:"🇨🇭"},
{code:"SAR",name:"Saudi Riyal",flag:"🇸🇦"},
{code:"ZAR",name:"South African Rand",flag:"🇿🇦"},
{code:"KRW",name:"South Korean Won",flag:"🇰🇷"},
{code:"RUB",name:"Russian Ruble",flag:"🇷🇺"},
{code:"BRL",name:"Brazilian Real",flag:"🇧🇷"},
{code:"MXN",name:"Mexican Peso",flag:"🇲🇽"},
{code:"NZD",name:"New Zealand Dollar",flag:"🇳🇿"},
{code:"TRY",name:"Turkish Lira",flag:"🇹🇷"},
{code:"THB",name:"Thai Baht",flag:"🇹🇭"},
{code:"MYR",name:"Malaysian Ringgit",flag:"🇲🇾"},
{code:"PKR",name:"Pakistani Rupee",flag:"🇵🇰"},
{code:"LKR",name:"Sri Lankan Rupee",flag:"🇱🇰"},
{code:"NPR",name:"Nepalese Rupee",flag:"🇳🇵"}

];

const fromSelect=document.getElementById("fromCurrency");
const toSelect=document.getElementById("toCurrency");

currencies.forEach(currency=>{

const option1=document.createElement("option");

option1.value=currency.code;

option1.textContent=
`${currency.flag} ${currency.code} - ${currency.name}`;

fromSelect.appendChild(option1);

const option2=document.createElement("option");

option2.value=currency.code;

option2.textContent=
`${currency.flag} ${currency.code} - ${currency.name}`;

toSelect.appendChild(option2);

});

fromSelect.value="USD";
toSelect.value="INR";

async function convertCurrency(){

const amount=document.getElementById("amount").value;

const from=fromSelect.value;

const to=toSelect.value;

const resultBox=document.getElementById("resultBox");

const updateInfo=document.getElementById("updateInfo");

if(amount==="" || amount<=0){

alert("Please enter valid amount");
return;

}

try{

const response=
await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);

const data=await response.json();

const rate=data.rates[to];

const result=(amount*rate).toFixed(2);

resultBox.style.display="block";

resultBox.innerHTML=`

${amount} ${from}
<br><br>
=
<br><br>
${result} ${to}

`;

const now=new Date();

updateInfo.innerHTML=
`Live exchange rates updated at ${now.toLocaleTimeString()}`;

saveHistory(amount,from,to,result);

}
catch(error){

alert("Error fetching live exchange rates");

}

}

function swapCurrencies(){

let temp=fromSelect.value;

fromSelect.value=toSelect.value;

toSelect.value=temp;

}

function setPair(from,to){

fromSelect.value=from;

toSelect.value=to;

}

function clearFields(){

document.getElementById("amount").value="";

document.getElementById("resultBox").style.display="none";

document.getElementById("updateInfo").innerHTML="";

}

function saveHistory(amount,from,to,result){

let history=
JSON.parse(localStorage.getItem("currencyHistory")) || [];

history.unshift(`${amount} ${from} → ${result} ${to}`);

history=history.slice(0,5);

localStorage.setItem(
"currencyHistory",
JSON.stringify(history)
);

}

</script>

</body>
</html>
