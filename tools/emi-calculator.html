<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>KJSynthora EMI Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#020b2d;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.container{
width:100%;
max-width:1200px;
display:grid;
grid-template-columns:2fr 1fr;
gap:25px;
}

.calculator-box,
.chart-box{
background:#07154a;
border-radius:25px;
padding:35px;
box-shadow:0 0 30px rgba(0,140,255,0.2);
}

.title{
font-size:60px;
font-weight:800;
margin-bottom:30px;
background:linear-gradient(90deg,#2aa9ff,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.loan-types{
display:flex;
gap:15px;
margin-bottom:35px;
flex-wrap:wrap;
}

.loan-btn{
background:#101f5c;
border:none;
padding:12px 22px;
border-radius:12px;
color:white;
cursor:pointer;
font-size:15px;
transition:.3s;
}

.loan-btn:hover{
background:linear-gradient(90deg,#2aa9ff,#8b5cf6);
}

.input-group{
margin-bottom:35px;
}

label{
display:block;
font-size:28px;
margin-bottom:15px;
font-weight:600;
}

.range-value{
font-size:40px;
color:#2aa9ff;
font-weight:700;
margin-top:12px;
}

input[type="range"]{
width:100%;
height:8px;
appearance:none;
background:#ffffff;
border-radius:10px;
outline:none;
}

input[type="range"]::-webkit-slider-thumb{
appearance:none;
width:22px;
height:22px;
border-radius:50%;
background:#ff3b30;
cursor:pointer;
}

.results{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:25px;
}

.result-card{
background:#101f5c;
padding:25px;
border-radius:18px;
text-align:center;
}

.result-card h3{
font-size:24px;
margin-bottom:12px;
}

.result-card p{
font-size:42px;
font-weight:700;
color:#2aa9ff;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:35px;
}

.btn{
padding:18px;
border:none;
border-radius:16px;
font-size:24px;
font-weight:700;
cursor:pointer;
color:white;
background:linear-gradient(90deg,#2aa9ff,#8b5cf6);
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}

.chart-title{
font-size:42px;
font-weight:700;
text-align:center;
margin-bottom:25px;
}

.chart-container{
width:100%;
max-width:350px;
margin:auto;
}

.extra-section{
margin-top:35px;
background:#101f5c;
padding:25px;
border-radius:20px;
}

.extra-section h2{
margin-bottom:20px;
font-size:30px;
}

.extra-section input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#081238;
color:white;
font-size:18px;
margin-bottom:15px;
}

.extra-result{
margin-top:15px;
font-size:24px;
color:#2aa9ff;
font-weight:700;
}

.table-section{
margin-top:40px;
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:14px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.1);
}

th{
background:#101f5c;
}

tr:hover{
background:#0d1f61;
}

@media(max-width:950px){

.container{
grid-template-columns:1fr;
}

.title{
font-size:42px;
}

.results{
grid-template-columns:1fr;
}

.buttons{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div class="calculator-box">

<h1 class="title">EMI Calculator</h1>

<div class="loan-types">
<button class="loan-btn">Home Loan</button>
<button class="loan-btn">Car Loan</button>
<button class="loan-btn">Personal Loan</button>
</div>

<div class="input-group">
<label>Loan Amount</label>
<input type="range" id="amount" min="100000" max="5000000" step="10000" value="500000">
<div class="range-value" id="amountValue">₹5,00,000</div>
</div>

<div class="input-group">
<label>Interest Rate (%)</label>
<input type="range" id="interest" min="1" max="20" step="0.1" value="8">
<div class="range-value" id="interestValue">8%</div>
</div>

<div class="input-group">
<label>Loan Tenure (Years)</label>
<input type="range" id="years" min="1" max="30" value="5">
<div class="range-value" id="yearsValue">5 Years</div>
</div>

<div class="results">

<div class="result-card">
<h3>Monthly EMI</h3>
<p id="emi">₹0</p>
</div>

<div class="result-card">
<h3>Total Interest</h3>
<p id="interestAmount">₹0</p>
</div>

<div class="result-card">
<h3>Total Payment</h3>
<p id="totalPayment">₹0</p>
</div>

</div>

<div class="buttons">

<button class="btn" onclick="window.location.href='/'">
← Return Home
</button>

<button class="btn" onclick="document.getElementById('tools').scrollIntoView({behavior:'smooth'})">
More Tools
</button>

</div>

<div class="extra-section">

<h2>Prepayment Calculator</h2>

<input type="number" id="extraPayment" placeholder="Extra Monthly Payment">

<button class="btn" onclick="calculatePrepayment()">
Calculate Savings
</button>

<div class="extra-result" id="prepaymentResult"></div>

</div>

<div class="extra-section">

<h2>Salary Affordability Check</h2>

<input type="number" id="salary" placeholder="Monthly Salary">

<button class="btn" onclick="checkAffordability()">
Check Eligibility
</button>

<div class="extra-result" id="salaryResult"></div>

</div>

<div class="table-section">

<h2 style="font-size:34px;">Amortization Schedule</h2>

<table>

<thead>
<tr>
<th>Month</th>
<th>EMI</th>
<th>Principal</th>
<th>Interest</th>
<th>Balance</th>
</tr>
</thead>

<tbody id="scheduleTable"></tbody>

</table>

</div>

</div>

<div class="chart-box">

<h2 class="chart-title">Loan Breakdown</h2>

<div class="chart-container">
<canvas id="loanChart"></canvas>
</div>

</div>

</div>

<script>

const amountSlider=document.getElementById('amount');
const interestSlider=document.getElementById('interest');
const yearsSlider=document.getElementById('years');

const amountValue=document.getElementById('amountValue');
const interestValue=document.getElementById('interestValue');
const yearsValue=document.getElementById('yearsValue');

const emiText=document.getElementById('emi');
const interestText=document.getElementById('interestAmount');
const totalText=document.getElementById('totalPayment');

const ctx=document.getElementById('loanChart');

let chart;

function formatNumber(num){
return '₹'+Number(num).toLocaleString('en-IN');
}

function calculateEMI(){

const P=parseFloat(amountSlider.value);
const annualRate=parseFloat(interestSlider.value);
const years=parseFloat(yearsSlider.value);

const r=annualRate/12/100;
const n=years*12;

const emi=(P*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);

const totalPayment=emi*n;
const totalInterest=totalPayment-P;

amountValue.innerText=formatNumber(P);
interestValue.innerText=annualRate+'%';
yearsValue.innerText=years+' Years';

emiText.innerText=formatNumber(Math.round(emi));
interestText.innerText=formatNumber(Math.round(totalInterest));
totalText.innerText=formatNumber(Math.round(totalPayment));

updateChart(P,totalInterest);

generateTable(P,r,n,emi);

}

function updateChart(principal,interest){

if(chart){
chart.destroy();
}

chart=new Chart(ctx,{
type:'doughnut',
data:{
labels:['Principal','Interest'],
datasets:[{
data:[principal,interest],
backgroundColor:['#2aa9ff','#8b5cf6'],
borderWidth:0
}]
},
options:{
responsive:true,
plugins:{
legend:{
labels:{
color:'white',
font:{
size:18
}
}
}
}
}
});

}

function generateTable(P,r,n,emi){

let balance=P;

const table=document.getElementById('scheduleTable');

table.innerHTML='';

for(let i=1;i<=12;i++){

const interest=balance*r;
const principal=emi-interest;
balance-=principal;

table.innerHTML+=`
<tr>
<td>${i}</td>
<td>${formatNumber(Math.round(emi))}</td>
<td>${formatNumber(Math.round(principal))}</td>
<td>${formatNumber(Math.round(interest))}</td>
<td>${formatNumber(Math.round(balance))}</td>
</tr>
`;

}

}

function calculatePrepayment(){

const extra=parseFloat(document.getElementById('extraPayment').value);

if(!extra)return;

const saving=extra*12*5;

document.getElementById('prepaymentResult').innerText=
'Estimated Interest Saved: '+formatNumber(saving);

}

function checkAffordability(){

const salary=parseFloat(document.getElementById('salary').value);

const emi=parseFloat(
emiText.innerText.replace(/[^0-9]/g,'')
);

const ratio=(emi/salary)*100;

let message='';

if(ratio<35){
message='✅ Loan is Safe';
}
else if(ratio<50){
message='⚠ Moderate Risk';
}
else{
message='❌ High Financial Risk';
}

document.getElementById('salaryResult').innerText=
message+' ('+ratio.toFixed(1)+'% of salary)';

}

amountSlider.addEventListener('input',calculateEMI);
interestSlider.addEventListener('input',calculateEMI);
yearsSlider.addEventListener('input',calculateEMI);

calculateEMI();

</script>

</body>
</html>
