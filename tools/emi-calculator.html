<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Calculator | KJSynthora</title>

<link rel="icon" type="image/png" href="../logo.png">

<style>

body{
background:#020617;
font-family:Poppins,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
background:#081028;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}

input,button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

button{
background:linear-gradient(90deg,#0ea5e9,#9333ea);
cursor:pointer;
}

.result{
margin-top:20px;
font-size:22px;
color:#38bdf8;
}

a{
display:block;
margin-top:20px;
color:#38bdf8;
}

</style>
</head>

<body>

<div class="container">

<h1>EMI Calculator</h1>

<input type="number" id="amount" placeholder="Loan Amount">

<input type="number" id="rate" placeholder="Interest Rate">

<input type="number" id="months" placeholder="Months">

<button onclick="calculateEMI()">
Calculate EMI
</button>

<div class="result" id="result"></div>

<a href="../index.html">
← Return Home
</a>

</div>

<script>

function calculateEMI(){

const P =
parseFloat(document.getElementById("amount").value);

const annualRate =
parseFloat(document.getElementById("rate").value);

const N =
parseFloat(document.getElementById("months").value);

const R = annualRate / 12 / 100;

const EMI =
(P * R * Math.pow(1+R,N)) /
(Math.pow(1+R,N)-1);

document.getElementById("result")
.innerHTML =
`Monthly EMI: ₹${EMI.toFixed(2)}`;

}

</script>

</body>
</html>
