<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KJSynthora EMI Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#020b2d;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
color:white;
}

.container{
width:100%;
max-width:1200px;
display:grid;
grid-template-columns:1fr 400px;
gap:30px;
}

.calculator{
background:#07133d;
padding:40px;
border-radius:25px;
box-shadow:0 0 40px rgba(0,140,255,0.2);
}

.chart-box{
background:#07133d;
padding:30px;
border-radius:25px;
box-shadow:0 0 40px rgba(0,140,255,0.2);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

h1{
font-size:48px;
margin-bottom:30px;
background:linear-gradient(90deg,#2fb7ff,#9d4dff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.input-group{
margin-bottom:30px;
}

label{
display:block;
margin-bottom:10px;
font-size:18px;
}

input[type="range"]{
width:100%;
cursor:pointer;
}

.value{
margin-top:10px;
font-size:22px;
font-weight:bold;
color:#2fb7ff;
}

.result{
margin-top:40px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.result-card{
background:#0d1b4d;
padding:25px;
border-radius:18px;
text-align:center;
}

.result-card h3{
margin-bottom:10px;
font-size:18px;
opacity:0.8;
}

.result-card p{
font-size:24px;
font-weight:bold;
color:#2fb7ff;
}

.bottom-buttons{
display:flex;
gap:20px;
margin-top:40px;
}

.bottom-buttons a{
flex:1;
text-align:center;
padding:15px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
color:white;
background:linear-gradient(90deg,#2fb7ff,#9d4dff);
transition:0.3s;
}

.bottom-buttons a:hover{
transform:scale(1.03);
}

canvas{
max-width:300px;
}

.loan-type{
display:flex;
gap:10px;
margin-bottom:30px;
flex-wrap:wrap;
}

.loan-type button{
padding:12px 18px;
border:none;
border-radius:12px;
background:#0d1b4d;
color:white;
cursor:pointer;
transition:0.3s;
}

.loan-type button:hover{
background:linear-gradient(90deg,#2fb7ff,#9d4dff);
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.result{
grid-template-columns:1fr;
}

h1{
font-size:38px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="calculator">

<h1>EMI Calculator</h1>

<div class="loan-type">

<button onclick="setLoan(500000,8,5)">
Home Loan
</button>

<button onclick="setLoan(300000,10,3)">
Car Loan
</button>

<button onclick="setLoan(100000,14,2)">
Personal Loan
</button>

</div>

<div class="input-group">

<label>Loan Amount</label>

<input type="range" min="10000" max="5000000"
step="10000"
value="1000000"
id="loanAmount"
oninput="calculateEMI()">

<div class="value" id="loanAmountValue">
₹10,00,000
</div>

</div>

<div class="input-group">

<label>Interest Rate (%)</label>

<input type="range"
min="1"
max="20"
step="0.1"
value="8.5"
id="interestRate"
oninput="calculateEMI()">

<div class="value" id="interestRateValue">
8.5%
</div>

</div>

<div class="input-group">

<label>Loan Tenure (Years)</label>

<input type="range"
min="1"
max="30"
step="1"
value="5"
id="loanTenure"
oninput="calculateEMI()">

<div class="value" id="loanTenureValue">
5 Years
</div>

</div>

<div class="result">

<div class="result-card">

<h3>Monthly EMI</h3>

<p id="emiResult">₹0</p>

</div>

<div class="result-card">

<h3>Total Interest</h3>

<p id="interestResult">₹0</p>

</div>

<div class="result-card">

<h3>Total Payment</h3>

<p id="totalResult">₹0</p>

</div>

</div>

<div class="bottom-buttons">

<a href="../index.html">
← Return Home
</a>

<a href="../index.html#tools">
More Tools
</a>

</div>

</div>

<div class="chart-box">

<h2 style="margin-bottom:20px;">
Loan Breakdown
</h2>

<canvas id="emiChart"></canvas>

</div>

</div>

<script>

const loanAmount=
document.getElementById("loanAmount");

const interestRate=
document.getElementById("interestRate");

const loanTenure=
document.getElementById("loanTenure");

let chart;

function formatCurrency(value){

return new Intl.NumberFormat('en-IN',{
style:'currency',
currency:'INR',
maximumFractionDigits:0
}).format(value);

}

function calculateEMI(){

const principal=parseFloat(loanAmount.value);

const annualRate=parseFloat(interestRate.value);

const years=parseFloat(loanTenure.value);

const monthlyRate=annualRate/12/100;

const months=years*12;

const emi=
(principal*monthlyRate*Math.pow(1+monthlyRate,months))/
(Math.pow(1+monthlyRate,months)-1);

const totalPayment=emi*months;

const totalInterest=totalPayment-principal;

document.getElementById("loanAmountValue")
.innerHTML=formatCurrency(principal);

document.getElementById("interestRateValue")
.innerHTML=annualRate+"%";

document.getElementById("loanTenureValue")
.innerHTML=years+" Years";

document.getElementById("emiResult")
.innerHTML=formatCurrency(emi);

document.getElementById("interestResult")
.innerHTML=formatCurrency(totalInterest);

document.getElementById("totalResult")
.innerHTML=formatCurrency(totalPayment);

updateChart(principal,totalInterest);

}

function updateChart(principal,interest){

const ctx=document.getElementById("emiChart");

if(chart){
chart.destroy();
}

chart=new Chart(ctx,{

type:'doughnut',

data:{
labels:['Principal','Interest'],
datasets:[{
data:[principal,interest],
backgroundColor:[
'#2fb7ff',
'#9d4dff'
],
borderWidth:0
}]
},

options:{
responsive:true,
plugins:{
legend:{
labels:{
color:'white',
font:{
size:16
}
}
}
}
}

});

}

function setLoan(amount,rate,years){

loanAmount.value=amount;

interestRate.value=rate;

loanTenure.value=years;

calculateEMI();

}

calculateEMI();

</script>

</body>
</html>
