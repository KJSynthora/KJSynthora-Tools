<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Merge Tool - Combine PDF Files Online Free | KJSynthora</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#020617;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:rgba(15,23,42,0.9);
    padding:50px;
    border-radius:24px;
    text-align:center;
    box-shadow:
    0 0 25px rgba(6,182,212,0.15),
    0 0 50px rgba(124,58,237,0.12);
    border:1px solid rgba(255,255,255,0.08);
}

h1{
    font-size:32px;
    margin-bottom:25px;
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{
    color:#cbd5e1;
    margin-bottom:25px;
}

input{
    margin:20px 0;
}

button{
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

#success-msg{
    margin-top:20px;
    color:#4ade80;
    font-weight:bold;
}

.back-home{
    margin-top:20px;
}

.back-home a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:bold;
}

.back-home a:hover{
    color:#7dd3fc;
}

</style>

</head>

<body>

<div class="container">

<h1>PDF Merge</h1>

<p>Select multiple PDF files and merge them easily</p>

<input type="file" multiple>

<br>

<button onclick="showMessage()">Merge PDF</button>

<p id="success-msg"></p>

<div class="back-home">
<a href="../index.html">← Back to Home</a>
</div>

</div>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>

async function showMessage(){

const input = document.querySelector('input[type="file"]');

if(input.files.length < 2){

document.getElementById("success-msg").innerHTML =
"❌ Select at least 2 PDF files";

return;

}

try{

const mergedPdf = await PDFLib.PDFDocument.create();

for(const file of input.files){

const bytes = await file.arrayBuffer();

const pdf = await PDFLib.PDFDocument.load(bytes);

const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());

copiedPages.forEach((page)=>{
mergedPdf.addPage(page);
});

}

const mergedBytes = await mergedPdf.save();

const blob = new Blob([mergedBytes], {type:'application/pdf'});

const link = document.createElement('a');

link.href = URL.createObjectURL(blob);

link.download = "KJSynthora-Merged.pdf";

link.click();

document.getElementById("success-msg").innerHTML =
"✅ PDF Downloaded Successfully!";

}catch(error){

document.getElementById("success-msg").innerHTML =
"❌ Merge Failed";

}

}

</script>

</body>
</html>
