<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Translator Tool</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
width:430px;
background:#0f172a;
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(59,130,246,0.35);
}

h1{
text-align:center;
margin-bottom:25px;
color:#38bdf8;
}

textarea{
width:100%;
height:130px;
padding:15px;
border:none;
outline:none;
border-radius:12px;
background:#111827;
color:white;
font-size:16px;
resize:none;
margin-bottom:20px;
}

select{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#111827;
color:white;
font-size:16px;
margin-bottom:18px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
cursor:pointer;
margin-bottom:15px;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.result-box{
background:#111827;
padding:15px;
border-radius:12px;
margin-top:20px;
min-height:120px;
}

.result-box h3{
margin-top:0;
color:#38bdf8;
}

.back-home{
text-align:center;
margin-top:20px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

label{
display:block;
margin-bottom:5px;
color:#94a3b8;
font-size:14px;
}

.note{
font-size:13px;
color:#94a3b8;
margin-top:10px;
line-height:1.5;
}

</style>
</head>

<body>

<div class="container">

<h1>🌍 AI Translator Tool</h1>

<textarea id="inputText"
placeholder="Type text here... Example: ఈరోజు నేను సినిమా కి వెళ్ళాను"></textarea>

<label>From Language</label>

<select id="fromLanguage">

<option value="auto">Auto Detect</option>
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="zh-CN">Chinese</option>

</select>

<label>To Language</label>

<select id="toLanguage">

<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="zh-CN">Chinese</option>

</select>

<button onclick="translateText()">
Translate
</button>

<button onclick="speakTranslation()">
🔊 Listen Translation
</button>

<div class="result-box">

<h3>Translated Text</h3>

<p id="result">
Your translation will appear here...
</p>

</div>

<p class="note">
Best results come when typing native language text.<br>
Example Telugu:
ఈరోజు నేను సినిమా కి వెళ్ళాను
</p>

<div class="back-home">

<a href="../index.html">
⬅ Back to Home
</a>

</div>

</div>

<script>

let translatedText = "";
let selectedLanguage = "en-US";

async function translateText(){

const text =
document.getElementById("inputText").value;

const fromLang =
document.getElementById("fromLanguage").value;

const toLang =
document.getElementById("toLanguage").value;

if(text.trim()===""){

alert("Please enter text");

return;

}

if(fromLang===toLang && fromLang!=="auto"){

document.getElementById("result").innerHTML =
"Please select different languages";

return;

}

selectedLanguage = toLang;

let url = "";

if(fromLang==="auto"){

url =
`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${toLang}&dt=t&q=${encodeURIComponent(text)}`;

}
else{

url =
`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang}&tl=${toLang}&dt=t&q=${encodeURIComponent(text)}`;

}

try{

const response = await fetch(url);

const data = await response.json();

translatedText = data[0][0][0];

document.getElementById("result").innerHTML =
translatedText;

}
catch(error){

document.getElementById("result").innerHTML =
"Translation failed";

}

}

function speakTranslation(){

if(translatedText===""){

alert("Please translate text first");

return;

}

const speech =
new SpeechSynthesisUtterance(translatedText);

speech.lang = selectedLanguage;

speech.rate = 1;

speech.pitch = 1;

window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
