<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Translator Tool</title>

<style>

body{
margin:0;
padding:0;
background:#020617;
font-family:Arial,sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:#0f172a;
padding:40px;
border-radius:20px;
width:420px;
box-shadow:0 0 30px rgba(59,130,246,0.3);
}

h1{
text-align:center;
margin-bottom:25px;
color:#38bdf8;
}

textarea{
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:12px;
background:#111827;
color:white;
font-size:16px;
resize:none;
margin-bottom:20px;
}

select{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#111827;
color:white;
margin-bottom:20px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.9;
}

.result{
margin-top:25px;
background:#111827;
padding:20px;
border-radius:12px;
}

.result h3{
margin-top:0;
color:#38bdf8;
}

.back-home{
text-align:center;
margin-top:20px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🌍 Translator Tool</h1>

<textarea id="inputText" placeholder="Enter text..."></textarea>

<select id="language">

<option value="telugu">Telugu</option>

<option value="hindi">Hindi</option>

<option value="tamil">Tamil</option>

<option value="kannada">Kannada</option>

<option value="malayalam">Malayalam</option>

<option value="french">French</option>

<option value="spanish">Spanish</option>

<option value="chinese">Chinese</option>

<option value="english">English</option>

</select>

<button onclick="translateText()">Translate</button>

<button onclick="speakText()">🔊 Listen</button>

<div class="result">

<h3>Translated Text</h3>

<p id="outputText">Your translation will appear here...</p>

</div>

<div class="back-home">

<a href="../index.html">⬅ Back to Home</a>

</div>

</div>

<script>

function translateText(){

let text=document.getElementById("inputText").value.toLowerCase().trim();

let lang=document.getElementById("language").value;

let output="Translation not found";

if(text==="hello"){

if(lang==="telugu") output="హలో";

else if(lang==="hindi") output="नमस्ते";

else if(lang==="tamil") output="வணக்கம்";

else if(lang==="kannada") output="ನಮಸ್ಕಾರ";

else if(lang==="malayalam") output="ഹലോ";

else if(lang==="french") output="Bonjour";

else if(lang==="spanish") output="Hola";

else if(lang==="chinese") output="你好";

else output="Hello";

}

else if(text==="how are you"){

if(lang==="telugu") output="నువ్వు ఎలా ఉన్నావు";

else if(lang==="hindi") output="आप कैसे हैं";

else if(lang==="tamil") output="நீங்கள் எப்படி இருக்கிறீர்கள்";

else if(lang==="kannada") output="ನೀವು ಹೇಗಿದ್ದೀರಿ";

else if(lang==="malayalam") output="സുഖമാണോ";

else if(lang==="french") output="Comment ça va";

else if(lang==="spanish") output="Cómo estás";

else if(lang==="chinese") output="你好吗";

else output="How are you";

}

else if(text==="thank you"){

if(lang==="telugu") output="ధన్యవాదాలు";

else if(lang==="hindi") output="धन्यवाद";

else if(lang==="tamil") output="நன்றி";

else if(lang==="kannada") output="ಧನ್ಯವಾದಗಳು";

else if(lang==="malayalam") output="നന്ദി";

else if(lang==="french") output="Merci";

else if(lang==="spanish") output="Gracias";

else if(lang==="chinese") output="谢谢";

else output="Thank You";

}

else if(text==="welcome"){

if(lang==="telugu") output="స్వాగతం";

else if(lang==="hindi") output="स्वागत है";

else if(lang==="tamil") output="வரவேற்கிறேன்";

else if(lang==="kannada") output="ಸ್ವಾಗತ";

else if(lang==="malayalam") output="സ്വാഗതം";

else if(lang==="french") output="Bienvenue";

else if(lang==="spanish") output="Bienvenido";

else if(lang==="chinese") output="欢迎";

else output="Welcome";

}

document.getElementById("outputText").innerHTML=output;

}

function speakText(){

let text=document.getElementById("outputText").innerText;

let speech=new SpeechSynthesisUtterance();

speech.text=text;

window.speechSynthesis.speak(speech);

}

</script>

</body>

</html>
