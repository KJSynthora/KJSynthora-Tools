<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Translator Tool</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#020617;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
overflow:hidden;
}

body::before{
content:'';
position:fixed;
width:700px;
height:700px;
background:radial-gradient(circle,#2563eb55,#7c3aed22,transparent);
top:-200px;
left:-150px;
filter:blur(80px);
z-index:-1;
}

.container{
width:420px;
background:rgba(15,23,42,0.95);
padding:35px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 0 40px rgba(37,99,235,0.25);
}

h1{
text-align:center;
margin-bottom:25px;
font-size:38px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

textarea{
width:100%;
height:140px;
background:#0f172a;
border:1px solid rgba(255,255,255,0.08);
border-radius:15px;
padding:15px;
color:white;
font-size:16px;
resize:none;
margin-bottom:20px;
outline:none;
}

label{
display:block;
margin-bottom:8px;
color:#94a3b8;
font-size:14px;
}

select{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#111827;
color:white;
margin-bottom:20px;
outline:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.result{
margin-top:25px;
background:#111827;
padding:18px;
border-radius:15px;
min-height:100px;
}

.result h3{
margin-bottom:10px;
color:#38bdf8;
}

.back-home{
text-align:center;
margin-top:25px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

.note{
margin-top:20px;
font-size:12px;
color:#94a3b8;
line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 AI Translator Tool</h1>

<textarea id="inputText" placeholder="Type any sentence..."></textarea>

<label>From Language</label>
<select id="fromLang">
<option value="auto">Auto Detect</option>
<option value="te">Telugu</option>
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="zh">Chinese</option>
</select>

<label>To Language</label>
<select id="toLang">
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="zh">Chinese</option>
</select>

<button onclick="translateText()">Translate</button>

<button onclick="speakTranslation()">🔊 Listen Translation</button>

<div class="result">
<h3>Translated Text</h3>
<p id="outputText">Your translation will appear here...</p>
</div>

<div class="note">
Best results come when typing native language text.<br>
Example Telugu: నేను సినిమా కి వెళ్తున్నాను
</div>

<div class="back-home">
<a href="../index.html">⬅ Back to Home</a>
</div>

</div>

<script>

let translatedSpeech = "";

async function translateText(){

const text = document.getElementById("inputText").value.trim();
const from = document.getElementById("fromLang").value;
const to = document.getElementById("toLang").value;

if(text === ""){
alert("Please enter text");
return;
}

const output = document.getElementById("outputText");
output.innerHTML = "Translating...";

try{

const url =
`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;

const response = await fetch(url);

const data = await response.json();

let translated = "";

data[0].forEach(item=>{
translated += item[0];
});

translatedSpeech = translated;

output.innerHTML = translated;

}
catch(error){
output.innerHTML = "Translation failed";
console.log(error);
}

}

function speakTranslation(){

if(translatedSpeech === ""){
alert("Please translate text first");
return;
}

const speech = new SpeechSynthesisUtterance(translatedSpeech);

speech.lang = document.getElementById("toLang").value;

speech.rate = 1;

window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
