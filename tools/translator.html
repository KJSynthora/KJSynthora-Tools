<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator Tool</title>

<style>

body{
margin:0;
padding:0;
font-family:Poppins,sans-serif;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
width:380px;
background:#0f172a;
padding:35px;
border-radius:25px;
box-shadow:0 0 30px rgba(59,130,246,0.3);
}

h1{
text-align:center;
color:#38bdf8;
margin-bottom:25px;
}

textarea{
width:100%;
height:120px;
background:#111827;
border:none;
outline:none;
border-radius:12px;
padding:15px;
color:white;
font-size:16px;
resize:none;
margin-bottom:20px;
}

select{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#111827;
color:white;
font-size:15px;
margin-bottom:20px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
cursor:pointer;
margin-bottom:15px;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.result-box{
background:#111827;
padding:15px;
border-radius:12px;
margin-top:15px;
min-height:80px;
}

.result-box h3{
margin-top:0;
color:#38bdf8;
}

.back-home{
text-align:center;
margin-top:20px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🌍 Translator Tool</h1>

<textarea id="inputText" placeholder="Enter text here..."></textarea>

<select id="language">

<option value="te-IN">Telugu</option>
<option value="hi-IN">Hindi</option>
<option value="ta-IN">Tamil</option>
<option value="kn-IN">Kannada</option>
<option value="ml-IN">Malayalam</option>
<option value="fr-FR">French</option>
<option value="es-ES">Spanish</option>
<option value="zh-CN">Chinese</option>
<option value="en-US">English</option>

</select>

<button onclick="translateText()">Translate</button>

<button onclick="speakTranslation()">🔊 Listen</button>

<div class="result-box">

<h3>Translated Text</h3>

<p id="result">Your translation will appear here...</p>

</div>

<div class="back-home">

<a href="../index.html">⬅ Back to Home</a>

</div>

</div>

<script>

let translatedVoice = "";
let selectedLanguage = "en-US";

const translations = {

"hello": {
"te-IN":"హలో",
"hi-IN":"नमस्ते",
"ta-IN":"வணக்கம்",
"kn-IN":"ಹಲೋ",
"ml-IN":"ഹലോ",
"fr-FR":"Bonjour",
"es-ES":"Hola",
"zh-CN":"你好",
"en-US":"Hello"
},

"thank you": {
"te-IN":"ధన్యవాదాలు",
"hi-IN":"धन्यवाद",
"ta-IN":"நன்றி",
"kn-IN":"ಧನ್ಯವಾದಗಳು",
"ml-IN":"നന്ദി",
"fr-FR":"Merci",
"es-ES":"Gracias",
"zh-CN":"谢谢",
"en-US":"Thank You"
},

"how are you": {
"te-IN":"మీరు ఎలా ఉన్నారు",
"hi-IN":"आप कैसे हैं",
"ta-IN":"நீங்கள் எப்படி இருக்கிறீர்கள்",
"kn-IN":"ನೀವು ಹೇಗಿದ್ದೀರಾ",
"ml-IN":"സുഖമാണോ",
"fr-FR":"Comment ça va",
"es-ES":"Cómo estás",
"zh-CN":"你好吗",
"en-US":"How are you"
},

"good morning": {
"te-IN":"శుభోదయం",
"hi-IN":"सुप्रभात",
"ta-IN":"காலை வணக்கம்",
"kn-IN":"ಶುಭೋದಯ",
"ml-IN":"സുപ്രഭാതം",
"fr-FR":"Bonjour",
"es-ES":"Buenos días",
"zh-CN":"早上好",
"en-US":"Good Morning"
},

"good night": {
"te-IN":"శుభరాత్రి",
"hi-IN":"शुभ रात्रि",
"ta-IN":"இனிய இரவு",
"kn-IN":"ಶುಭ ರಾತ್ರಿ",
"ml-IN":"ശുഭ രാത്രി",
"fr-FR":"Bonne nuit",
"es-ES":"Buenas noches",
"zh-CN":"晚安",
"en-US":"Good Night"
}

};

function translateText(){

const input = document.getElementById("inputText").value.toLowerCase().trim();

const language = document.getElementById("language").value;

selectedLanguage = language;

if(input===""){
document.getElementById("result").innerHTML="Please enter text";
return;
}

if(translations[input]){

const translated = translations[input][language];

document.getElementById("result").innerHTML = translated;

translatedVoice = translated;

}
else{

document.getElementById("result").innerHTML = "Translation not found";

translatedVoice = "";

}

}

function speakTranslation(){

if(translatedVoice===""){
alert("Please translate text first");
return;
}

const speech = new SpeechSynthesisUtterance(translatedVoice);

speech.lang = selectedLanguage;

speech.rate = 1;

window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
