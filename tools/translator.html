<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Translator Tool</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#020617;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
color:white;
}

body::before{
content:'';
position:fixed;
width:700px;
height:700px;
background:radial-gradient(circle,#2563eb55,#7c3aed22,transparent);
top:-200px;
left:-150px;
filter:blur(80px);
z-index:-1;
}

.container{
width:430px;
background:rgba(15,23,42,0.95);
padding:35px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 0 40px rgba(37,99,235,0.25);
}

h1{
text-align:center;
margin-bottom:25px;
font-size:38px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

textarea{
width:100%;
height:140px;
background:#0f172a;
border:1px solid rgba(255,255,255,0.08);
border-radius:15px;
padding:15px;
color:white;
font-size:16px;
resize:none;
outline:none;
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#94a3b8;
}

select{
width:100%;
padding:12px;
background:#111827;
border:none;
border-radius:12px;
color:white;
margin-bottom:20px;
outline:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.result{
margin-top:25px;
background:#111827;
padding:18px;
border-radius:15px;
min-height:120px;
}

.result h3{
margin-bottom:10px;
color:#38bdf8;
}

.back-home{
text-align:center;
margin-top:25px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

.note{
margin-top:18px;
font-size:12px;
color:#94a3b8;
line-height:1.6;
}

</style>
</head>

<body>

<div class="container">

<h1>🌍 AI Translator</h1>

<textarea id="inputText" placeholder="Type anything... Example: nenu movie ki velthunnanu"></textarea>

<label>Translate To</label>

<select id="toLang">
<option value="English">English</option>
<option value="Hindi">Hindi</option>
<option value="Telugu">Telugu</option>
<option value="Tamil">Tamil</option>
<option value="Kannada">Kannada</option>
<option value="Malayalam">Malayalam</option>
<option value="French">French</option>
<option value="Spanish">Spanish</option>
<option value="Chinese">Chinese</option>
</select>

<button onclick="translateText()">Translate Using AI</button>

<button onclick="speakText()">🔊 Listen Voice</button>

<div class="result">

<h3>Translated Meaning</h3>

<p id="outputText">
Your AI translation will appear here...
</p>

</div>

<div class="note">
This AI translator understands Roman Telugu, Hinglish, Tanglish and natural language meaning.
</div>

<div class="back-home">
<a href="../index.html">⬅ Back to Home</a>
</div>

</div>

<script>

let translatedSpeech = "";

async function translateText(){

const text = document.getElementById("inputText").value.trim();

const language = document.getElementById("toLang").value;

const output = document.getElementById("outputText");

if(text === ""){
alert("Please enter text");
return;
}

output.innerHTML = "AI Translating...";

try{

const prompt = `
Understand the meaning of this sentence even if it is written in Roman Telugu, Hinglish, Tanglish or mixed language.

Sentence:
"${text}"

Translate it naturally into ${language}.

Only give translated sentence.
`;

const response = await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AIzaSyBLGwWy3uof1BV-_l7TZTLJMNc_SRfce0I",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
contents:[
{
parts:[
{
text:prompt
}
]
}
]
})
}
);

const data = await response.json();

const translated =
data.candidates[0].content.parts[0].text;

translatedSpeech = translated;

output.innerHTML = translated;

}
catch(error){

console.log(error);

output.innerHTML =
"Translation failed. Check Gemini API key.";

}

}

function speakText(){

if(translatedSpeech === ""){
alert("Please translate first");
return;
}

const speech = new SpeechSynthesisUtterance(translatedSpeech);

speech.rate = 1;

window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
