<!DOCTYPE html>
<html>
<head>
<title>Translator</title>
<style>
body{
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}
.container{
background:#111827;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}
textarea{
width:90%;
height:100px;
padding:12px;
border:none;
border-radius:10px;
}
select{
margin-top:20px;
padding:10px;
border-radius:10px;
}
button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
cursor:pointer;
}
#output{
margin-top:20px;
color:#38bdf8;
}
</style>
</head>
<body>

<div class="container">

<h1>Translator</h1>

<textarea id="inputText"></textarea>

<br>

<select id="language">
<option>Hindi</option>
<option>Telugu</option>
<option>Tamil</option>
<option>Kannada</option>
</select>

<br>

<button onclick="translateText()">
Translate
</button>

<p id="output"></p>

</div>

<script>

function translateText(){

const text=document.getElementById("inputText").value;

const lang=document.getElementById("language").value;

if(text===""){
document.getElementById("output").innerHTML=
"❌ Enter text";
return;
}

document.getElementById("output").innerHTML=
"🌍 Translated to "+lang+": "+text;

}

</script>

</body>
</html>
