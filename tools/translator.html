<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Translation Studio - Pro Enterprise</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #020617, #4c1d95);
            --panel-bg: #07114a;
            --text-main: white;
            --input-bg: #18245c;
            --card-bg: #f8fafc;
            --card-text: black;
            --editor-bg: white;
            --border-rgba: rgba(255, 255, 255, .08);
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #f1f5f9, #cbd5e1);
            --panel-bg: white;
            --text-main: #0f172a;
            --input-bg: #e2e8f0;
            --card-bg: #0f172a;
            --card-text: white;
            --editor-bg: #f8fafc;
            --border-rgba: rgba(15, 23, 42, 0.08);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        .app {
            display: grid;
            grid-template-columns: 290px 1fr 270px;
            gap: 14px;
            padding: 14px;
            height: 100vh;
        }

        /* SIDEBAR LEFT */
        .sidebar {
            background: var(--panel-bg);
            border-radius: 22px;
            padding: 18px;
            overflow-y: auto;
            border: 1px solid var(--border-rgba);
        }

        .logo {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 14px;
            background: linear-gradient(to right, #38bdf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            font-size: 11px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 14px;
        }

        .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .badge {
            background: #1e3a8a;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 9px;
            color: white;
        }

        .mode-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .mode-tab {
            background: #1e3a8a;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            color: white;
            transition: .3s;
        }

        .mode-tab.active {
            background: linear-gradient(to right, #38bdf8, #ec4899);
        }

        .mode-section {
            display: none;
        }

        .mode-section.active {
            display: block;
        }

        .drop-zone {
            border: 2px dashed #334155;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-size: 11px;
            margin-bottom: 14px;
            background: #111827;
            color: white;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            margin: 10px 0 4px;
        }

        textarea, select, input {
            width: 100%;
            background: var(--input-bg);
            border: none;
            outline: none;
            padding: 10px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 12px;
            margin-bottom: 8px;
        }

        textarea {
            resize: none;
            height: 75px;
        }

        .range-label {
            font-size: 10px;
            margin-top: -4px;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, #38bdf8, #ec4899);
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }

        /* MAIN HUBS CENTER */
        .main {
            background: var(--panel-bg);
            border-radius: 22px;
            padding: 14px;
            overflow-y: auto;
            border: 1px solid var(--border-rgba);
        }

        .top-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .tabs-wrapper {
            display: flex;
            gap: 8px;
        }

        .top-tab {
            padding: 8px 12px;
            border-radius: 8px;
            background: #1e3a8a;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            color: white;
        }

        .top-tab.active {
            background: linear-gradient(to right, #38bdf8, #ec4899);
        }

        .theme-toggle {
            padding: 8px 12px;
            border-radius: 8px;
            background: #334155;
            color: white;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .workspace {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px;
            color: var(--card-text);
        }

        .title {
            font-size: 20px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 14px;
        }

        .dual {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        .editor {
            background: var(--editor-bg);
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px;
            min-height: 180px;
        }

        .editor h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #475569;
        }

        .output {
            line-height: 1.8;
            font-size: 14px;
            white-space: pre-wrap;
            color: #0f172a;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .info {
            background: var(--editor-bg);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            font-size: 12px;
        }

        .bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, #38bdf8, #ec4899);
            color: white;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ANALYTICS RIGHT */
        .analytics {
            background: var(--panel-bg);
            border-radius: 22px;
            padding: 18px;
            overflow-y: auto;
            border: 1px solid var(--border-rgba);
        }

        .metric {
            background: #1e2b7a;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .metric h4 {
            font-size: 10px;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 800;
            color: #4ade80;
            margin-bottom: 6px;
        }

        .bar {
            height: 6px;
            border-radius: 10px;
            background: #111827;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            background: linear-gradient(to right, #38bdf8, #ec4899);
        }

        .languages-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 10px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .lang-node {
            background: #27348b;
            padding: 6px;
            border-radius: 6px;
            font-size: 10px;
            text-align: center;
            color: white;
        }

        .status-live {
            background: #dcfce7;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            color: #166534;
            float: right;
        }

        @media(max-width:1200px){
            .app { grid-template-columns: 1fr; overflow: auto; height: auto; }
            body { overflow: auto; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- LEFT PANEL SIDEBAR -->
    <div class="sidebar">
        <div class="logo">Global AI<br>Translation<br>Engine</div>
        <div class="desc">Enterprise-grade multilingual AI translation ecosystem with custom glossary maps and metrics dashboard telemetry tracking.</div>
        
        <div class="badges">
            <div class="badge">50+ Active Languages</div>
            <div class="badge">Enterprise Pro v2</div>
        </div>
