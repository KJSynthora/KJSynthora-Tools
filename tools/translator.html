<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Translator Tool</title>

<style>

body{
margin:0;
padding:0;
background:#020617;
font-family:Arial,sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:#0f172a;
padding:40px;
border-radius:20px;
width:420px;
box-shadow:0 0 30px rgba(59,130,246,0.3);
}

h1{
text-align:center;
margin-bottom:25px;
color:#38bdf8;
}

textarea{
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:12px;
background:#111827;
color:white;
font-size:16px;
resize:none;
margin-bottom:20px;
}

select{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#111827;
color:white;
margin-bottom:20px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.9;
}

.result{
margin-top:25px;
background:#111827;
padding:20px;
border-radius:12px;
}

.result h3{
margin-top:0;
color:#38bdf8;
}

.back-home{
text-align:center;
margin-top:20px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🌍 Translator Tool</h1>

<textarea id="inputText" placeholder="Enter text..."></textarea>

<select id="language">

<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="zh-CN">Chinese</option>
<option value="en">English</option>

</select>

<button onclick="translateText()">Translate</button>

<button onclick="speakTranslation()">🔊 Listen</button>

<div class="result">

<h3>Translated Text</h3>

<p id="outputText">Your translation will appear here...</p>

</div>

<div class="back-home">

<a href="../index.html">⬅ Back to Home</a>

</div>

</div>

<script>

async function translateText() {

const text = document.getElementById("inputText").value;
const language = document.getElementById("language").value;

if(text.trim()===""){
document.getElementById("result").innerHTML="Please enter text";
return;
}

const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${language}&dt=t&q=${encodeURIComponent(text)}`;

try{

const response = await fetch(url);
const data = await response.json();

const translated = data[0][0][0];

document.getElementById("result").innerHTML = translated;

window.translatedVoice = translated;
window.selectedLanguage = language;

}
catch(error){

document.getElementById("result").innerHTML="Translation failed";

}

}

function speakTranslation(){

if(!window.translatedVoice){
alert("Translate text first");
return;
}

const speech = new SpeechSynthesisUtterance(window.translatedVoice);

speech.lang = window.selectedLanguage;

speech.rate = 1;

window.speechSynthesis.speak(speech);

}

</script>

</body>

</html>
