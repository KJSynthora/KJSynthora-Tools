<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart AI Translator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
padding:20px;
min-height:100vh;
}

.container{
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:400px 1fr;
gap:20px;
}

.left-panel,
.right-panel{
background:#0f172a;
padding:25px;
border-radius:20px;
box-shadow:0 0 25px rgba(59,130,246,0.25);
}

h1{
margin-bottom:20px;
font-size:34px;
background:linear-gradient(to right,#38bdf8,#9333ea);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

label{
display:block;
margin-top:14px;
margin-bottom:6px;
font-size:14px;
color:#cbd5e1;
}

textarea,
select{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:10px;
background:#1e293b;
color:white;
margin-bottom:10px;
}

textarea{
height:140px;
resize:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(to right,#0ea5e9,#9333ea);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:12px;
}

button:hover{
opacity:0.9;
}

.translation-box{
background:white;
color:black;
padding:30px;
border-radius:16px;
min-height:700px;
}

.section-title{
margin-top:25px;
margin-bottom:12px;
font-size:20px;
color:#2563eb;
border-bottom:2px solid #e2e8f0;
padding-bottom:5px;
}

.copy-btn{
background:#2563eb;
margin-top:20px;
}

.home{
text-align:center;
margin-top:20px;
}

.home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div class="left-panel">

<h1>Smart AI Translator</h1>

<label>Enter Text</label>

<textarea id="inputText"
placeholder="Type anything... Example: nenu office ki velthunnanu"></textarea>

<label>From Language</label>

<select id="fromLanguage">

<option>Auto Detect</option>
<option>English</option>
<option>Telugu</option>
<option>Hindi</option>
<option>Tamil</option>
<option>Kannada</option>
<option>Malayalam</option>

</select>

<label>Translate To</label>

<select id="toLanguage">

<option>English</option>
<option>Telugu</option>
<option>Hindi</option>
<option>Tamil</option>
<option>Kannada</option>
<option>Malayalam</option>
<option>French</option>
<option>Spanish</option>

</select>

<label>Translation Style</label>

<select id="style">

<option>Professional</option>
<option>Casual</option>
<option>Formal</option>
<option>Friendly</option>

</select>

<button onclick="translateText()">
Translate Text
</button>

<button onclick="speakTranslation()">
🔊 Listen Translation
</button>

<button class="copy-btn" onclick="copyTranslation()">
📋 Copy Translation
</button>

<div class="home">
<a href="../index.html">
⬅ Return To Home
</a>
</div>

</div>

<div class="right-panel">

<div id="translationOutput" class="translation-box">

<h2>Translation Result</h2>

<p style="margin-top:20px;">
Your translated content will appear here...
</p>

</div>

</div>

</div>

<script>

let translatedContent = "";

function translateText(){

const input =
document.getElementById("inputText").value;

const fromLang =
document.getElementById("fromLanguage").value;

const toLang =
document.getElementById("toLanguage").value;

const style =
document.getElementById("style").value;

const output =
document.getElementById("translationOutput");

if(input===""){

alert("Please enter text");

return;

}

let detectedMeaning = "";
let translated = "";
let explanation = "";

const lowerInput = input.toLowerCase();

if(lowerInput.includes("office")){

detectedMeaning =
"User is talking about going to office.";

if(toLang==="English"){
translated = "I am going to office.";
}

else if(toLang==="Hindi"){
translated = "मैं ऑफिस जा रहा हूँ।";
}

else if(toLang==="Telugu"){
translated = "నేను ఆఫీస్ కి వెళ్తున్నాను";
}

else if(toLang==="Tamil"){
translated = "நான் அலுவலகத்திற்கு செல்கிறேன்";
}

else{
translated = "Translated office sentence";
}

}

else if(lowerInput.includes("movie")){

detectedMeaning =
"User is talking about movie plan.";

if(toLang==="English"){
translated = "I am going to movie.";
}

else if(toLang==="Hindi"){
translated = "मैं फिल्म देखने जा रहा हूँ।";
}

else if(toLang==="Telugu"){
translated = "నేను సినిమా కి వెళ్తున్నాను";
}

else{
translated = "Movie related translation";
}

}

else{

detectedMeaning =
"General sentence detected.";

translated =
`Translated (${toLang}) version of: ${input}`;

}

if(style==="Professional"){

explanation =
"Professional communication style applied.";

}

else if(style==="Casual"){

explanation =
"Casual conversational tone applied.";

}

else if(style==="Formal"){

explanation =
"Formal translation style applied.";

}

else{

explanation =
"Friendly tone translation applied.";

}

translatedContent = translated;

output.innerHTML = `

<h1 style="
color:#2563eb;
font-size:34px;
">
🌍 Translation Result
</h1>

<div class="section-title">
Detected Meaning
</div>

<p>
${detectedMeaning}
</p>

<div class="section-title">
Translated Text
</div>

<p style="
font-size:20px;
line-height:1.8;
">
${translated}
</p>

<div class="section-title">
Translation Style
</div>

<p>
${explanation}
</p>

<div class="section-title">
Language Details
</div>

<p>
From: ${fromLang}<br>
To: ${toLang}
</p>

<div class="section-title">
AI Suggestions
</div>

<ul>
<li>Use professional tone for office communication</li>
<li>Use formal language for emails</li>
<li>Use casual tone for chats</li>
<li>Translation optimized for readability</li>
</ul>

`;

}

function speakTranslation(){

if(translatedContent===""){

alert("Please translate first");

return;

}

const speech =
new SpeechSynthesisUtterance(translatedContent);

speech.rate = 1;

window.speechSynthesis.speak(speech);

}

function copyTranslation(){

if(translatedContent===""){

alert("Nothing to copy");

return;

}

navigator.clipboard.writeText(translatedContent);

alert("Translation copied");

}

</script>

</body>
</html>
