<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator Tool</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
width:420px;
background:#0f172a;
padding:30px;
border-radius:20px;
box-shadow:0 0 25px rgba(59,130,246,0.3);
}

h1{
text-align:center;
margin-bottom:25px;
color:#38bdf8;
}

textarea{
width:100%;
height:120px;
padding:15px;
border:none;
outline:none;
border-radius:12px;
background:#111827;
color:white;
font-size:16px;
resize:none;
margin-bottom:20px;
}

select{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#111827;
color:white;
font-size:16px;
margin-bottom:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
cursor:pointer;
margin-bottom:15px;
}

.result-box{
background:#111827;
padding:15px;
border-radius:12px;
margin-top:20px;
min-height:100px;
}

.result-box h3{
margin-top:0;
color:#38bdf8;
}

.back-home{
text-align:center;
margin-top:20px;
}

.back-home a{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
}

label{
font-size:14px;
color:#94a3b8;
display:block;
margin-bottom:5px;
}

</style>
</head>

<body>

<div class="container">

<h1>🌍 Translator Tool</h1>

<textarea id="inputText"
placeholder="Enter any sentence..."></textarea>

<label>From Language</label>

<select id="fromLanguage">

<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="zh">Chinese</option>

</select>

<label>To Language</label>

<select id="toLanguage">

<option value="te">Telugu</option>
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="zh">Chinese</option>

</select>

<button onclick="translateText()">
Translate
</button>

<button onclick="speakTranslation()">
🔊 Listen
</button>

<div class="result-box">

<h3>Translated Text</h3>

<p id="result">
Your translation will appear here...
</p>

</div>

<div class="back-home">

<a href="../index.html">
⬅ Back to Home
</a>

</div>

</div>

<script>

let translatedText = "";
let selectedLang = "te";

async function translateText(){

const input =
document.getElementById("inputText").value;

const fromLang =
document.getElementById("fromLanguage").value;

const toLang =
document.getElementById("toLanguage").value;

selectedLang = toLang;

if(input.trim()===""){

alert("Please enter text");

return;

}

if(fromLang===toLang){

document.getElementById("result").innerHTML =
"Please select different languages";

return;

}

const url =
`https://api.mymemory.translated.net/get?q=${encodeURIComponent(input)}&langpair=${fromLang}|${toLang}`;

try{

const response = await fetch(url);

const data = await response.json();

translatedText =
data.responseData.translatedText;

document.getElementById("result").innerHTML =
translatedText;

}
catch(error){

document.getElementById("result").innerHTML =
"Translation failed";

}

}

function speakTranslation(){

if(translatedText===""){

alert("Translate text first");

return;

}

const speech =
new SpeechSynthesisUtterance(translatedText);

speech.lang = selectedLang;

speech.rate = 1;

window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
