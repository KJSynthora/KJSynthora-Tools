<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF to Excel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:700px;
background:#0f172a;
padding:50px;
border-radius:25px;
text-align:center;
box-shadow:0 0 40px rgba(56,189,248,0.2);
}

h1{
font-size:42px;
margin-bottom:20px;
background:linear-gradient(90deg,#60a5fa,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

input{
margin-top:20px;
margin-bottom:30px;
}

button{
padding:14px 28px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#0ea5e9,#7c3aed);
color:white;
font-size:16px;
cursor:pointer;
}

a{
display:inline-block;
margin-top:30px;
color:#38bdf8;
text-decoration:none;
}

#status{
margin-top:25px;
color:#cbd5e1;
}

</style>
</head>

<body>

<div class="container">

<h1>PDF to Excel 🚀</h1>

<input type="file" id="pdfFile" accept=".pdf">

<br>

<button onclick="convertPDFtoExcel()">
Convert PDF to Excel
</button>

<div id="status"></div>

<a href="../index.html">Return Home</a>

</div>

<script>

async function convertPDFtoExcel(){

const fileInput = document.getElementById('pdfFile');
const status = document.getElementById('status');

if(fileInput.files.length === 0){
status.innerHTML = "Please select a PDF file.";
return;
}

status.innerHTML = "Reading PDF...";

const file = fileInput.files[0];
const reader = new FileReader();

reader.onload = async function(){

const typedArray = new Uint8Array(this.result);

const pdf = await pdfjsLib.getDocument(typedArray).promise;

let data = [];

for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){

const page = await pdf.getPage(pageNum);

const textContent = await page.getTextContent();

const pageText = textContent.items.map(item => item.str);

pageText.forEach(line=>{
data.push([line]);
});

}

const worksheet = XLSX.utils.aoa_to_sheet(data);

const workbook = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(workbook, worksheet, "PDF Data");

XLSX.writeFile(workbook,"converted.xlsx");

status.innerHTML = "Excel downloaded successfully ✅";

};

reader.readAsArrayBuffer(file);

}

</script>

</body>
</html>
