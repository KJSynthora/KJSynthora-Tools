<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator Free Online — Generate Strong Passwords | KJSynthora</title>
<meta name="description" content="Generate strong secure passwords online for free. Customize length, characters, symbols. Cryptographically secure password generator. No signup needed by KJSynthora.">
<meta name="keywords" content="password generator, strong password generator, secure password maker, random password generator free, complex password creator, password strength generator">
<meta property="og:title" content="Password Generator Free — KJSynthora">
<meta property="og:description" content="Generate strong, secure passwords instantly. Free cryptographic password generator.">
<meta property="og:url" content="https://kjsynthora.com/tools/password-generator.html">
<meta property="og:type" content="website">
<meta property="og:image" content="https://kjsynthora.com/logo.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://kjsynthora.com/tools/password-generator.html">
<meta name="robots" content="index,follow">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04040a;--surface:#0d0d1a;--s2:#111827;--s3:#1a1f30;
  --border:rgba(99,102,241,0.2);--accent:#818cf8;--accent2:#7c5cfc;
  --cyan:#38bdf8;--green:#22c55e;--yellow:#fbbf24;--danger:#f87171;
  --text:#e2e8f0;--muted:#4a5568;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;position:relative;overflow-x:hidden;
}
/* Animated BG */
body::before{
  content:'';position:fixed;width:700px;height:700px;
  background:radial-gradient(circle,rgba(99,102,241,0.12) 0%,rgba(124,92,252,0.06) 50%,transparent 70%);
  top:-200px;left:-200px;filter:blur(70px);z-index:0;pointer-events:none;
  animation:gb1 12s infinite alternate;
}
body::after{
  content:'';position:fixed;width:500px;height:500px;
  background:radial-gradient(circle,rgba(56,189,248,0.08) 0%,transparent 70%);
  bottom:-150px;right:-100px;filter:blur(60px);z-index:0;pointer-events:none;
  animation:gb2 9s infinite alternate;
}
@keyframes gb1{from{transform:translate(0,0);}to{transform:translate(80px,60px);}}
@keyframes gb2{from{transform:translate(0,0);}to{transform:translate(-60px,-50px);}}

/* CARD */
.card{
  position:relative;z-index:1;width:100%;max-width:520px;
  background:var(--surface);border:1px solid var(--border);border-radius:28px;
  padding:40px 36px 32px;
  box-shadow:0 0 0 1px rgba(99,102,241,0.06),0 40px 100px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

/* HEADER */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.28);
  border-radius:999px;padding:5px 14px;font-size:11px;font-weight:600;
  color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:18px;
}
.badge .dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
h1{
  font-family:'Syne',sans-serif;font-size:34px;font-weight:800;
  background:linear-gradient(135deg,#a78bff 0%,#38d9ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;
}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:28px;}

/* PASSWORD BOX */
.pw-box{
  background:var(--s2);border:1px solid var(--border);border-radius:16px;
  padding:16px 14px;margin-bottom:6px;position:relative;
  transition:border-color 0.2s;
}
.pw-box:focus-within{border-color:var(--accent);}
#password{
  width:calc(100% - 90px);background:none;border:none;outline:none;
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:17px;
  letter-spacing:1px;caret-color:var(--accent);
}
.pw-actions{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  display:flex;gap:6px;
}
.icon-btn{
  width:34px;height:34px;border:1px solid var(--border);border-radius:8px;
  background:var(--s3);color:var(--muted);font-size:14px;cursor:pointer;
  transition:all 0.2s;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(129,140,248,0.1);}

/* STRENGTH BAR */
.strength-wrap{margin-bottom:24px;}
.strength-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.strength-label{font-size:12px;color:var(--muted);}
.strength-value{font-size:12px;font-weight:700;transition:color 0.3s;}
.bar-track{height:6px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;width:0%;transition:width 0.5s ease,background 0.4s;}
.entropy-row{display:flex;justify-content:space-between;margin-top:6px;}
.entropy-text{font-size:11px;color:var(--muted);}
.crack-time{font-size:11px;color:var(--muted);}

/* SLIDER */
.slider-section{margin-bottom:20px;}
.slider-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.slider-label{font-size:13px;color:var(--muted);}
.slider-val{
  background:rgba(129,140,248,0.12);border:1px solid rgba(129,140,248,0.25);
  color:var(--accent);font-size:13px;font-weight:700;
  padding:3px 12px;border-radius:999px;min-width:38px;text-align:center;
}
input[type=range]{
  width:100%;cursor:pointer;accent-color:var(--accent);
  height:4px;border-radius:999px;
}

/* OPTIONS */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.option{
  display:flex;align-items:center;gap:10px;
  background:var(--s2);border:1px solid var(--border);border-radius:12px;
  padding:11px 14px;cursor:pointer;transition:all 0.2s;
  font-size:13px;font-weight:500;user-select:none;
}
.option:hover{border-color:var(--accent);background:rgba(129,140,248,0.06);}
.option.active{
  border-color:var(--accent2);background:rgba(124,92,252,0.1);color:var(--text);
}
.option input[type=checkbox]{display:none;}
.check-icon{
  width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:10px;transition:all 0.2s;
}
.option.active .check-icon{
  border-color:var(--accent2);background:var(--accent2);color:white;
}

/* EXTRA OPTIONS ROW */
.extra-row{display:flex;gap:10px;margin-bottom:20px;}
.extra-opt{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--s2);border:1px solid var(--border);border-radius:10px;
  padding:9px 12px;cursor:pointer;transition:all 0.2s;
  font-size:12px;font-weight:500;user-select:none;
}
.extra-opt:hover{border-color:var(--cyan);}
.extra-opt.active{border-color:var(--cyan);background:rgba(56,189,248,0.08);color:var(--cyan);}
.extra-opt input{display:none;}
.extra-check{
  width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:9px;
  flex-shrink:0;transition:all 0.2s;
}
.extra-opt.active .extra-check{border-color:var(--cyan);background:var(--cyan);color:white;}

/* CUSTOM EXCLUDE */
.custom-exclude{
  margin-bottom:20px;display:none;
}
.custom-exclude.show{display:block;}
.custom-exclude input{
  width:100%;background:var(--s2);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;color:var(--text);font-size:13px;
  outline:none;font-family:'JetBrains Mono',monospace;transition:border-color 0.2s;
}
.custom-exclude input:focus{border-color:var(--accent);}
.custom-exclude label{font-size:11px;color:var(--muted);display:block;margin-bottom:6px;}

/* GENERATE BTN */
.gen-btn{
  width:100%;padding:15px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--accent2) 0%,#4f46e5 100%);
  color:white;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;
  cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden;
  letter-spacing:0.03em;margin-bottom:14px;
}
.gen-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,transparent 60%);
  opacity:0;transition:0.2s;
}
.gen-btn:hover::before{opacity:1;}
.gen-btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(124,92,252,0.45);}
.gen-btn:active{transform:translateY(0);}

/* COPY TOAST inside card */
.copy-flash{
  text-align:center;font-size:13px;color:var(--green);font-weight:600;
  height:18px;margin-bottom:12px;opacity:0;transition:opacity 0.3s;
}
.copy-flash.show{opacity:1;}

/* HISTORY */
.history-wrap{
  background:var(--s2);border:1px solid var(--border);border-radius:16px;
  padding:16px;margin-bottom:20px;
}
.history-title{
  font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;
  font-weight:600;margin-bottom:12px;
}
.history-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);
}
.history-item:last-child{border-bottom:none;}
.history-pw{
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%;
}
.history-copy{
  font-size:10px;color:var(--accent);cursor:pointer;padding:3px 8px;
  border:1px solid rgba(129,140,248,0.25);border-radius:6px;
  transition:all 0.2s;white-space:nowrap;
}
.history-copy:hover{background:rgba(129,140,248,0.1);}
.history-empty{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;}

/* BACK LINK */
.back{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--muted);font-size:13px;text-decoration:none;transition:color 0.2s;
  margin-top:4px;
}
.back:hover{color:var(--accent);}

/* TOAST (global) */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--s2);border:1px solid var(--green);color:var(--green);
  padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;
  z-index:999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:480px){
  .card{padding:28px 20px 24px;}
  h1{font-size:28px;}
  .options-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="card">
  <div class="badge"><span class="dot"></span> Cryptographically Secure</div>
  <h1>Password Generator</h1>
  <p class="subtitle">Generate unbreakable passwords with real-time strength analysis.</p>

  <!-- PASSWORD DISPLAY -->
  <div class="pw-box">
    <input type="password" id="password" readonly placeholder="Click Generate...">
    <div class="pw-actions">
      <button class="icon-btn" onclick="toggleVisibility()" title="Show/Hide">👁</button>
      <button class="icon-btn" onclick="copyPassword()" title="Copy">⎘</button>
    </div>
  </div>

  <!-- STRENGTH -->
  <div class="strength-wrap">
    <div class="strength-row">
      <span class="strength-label">Strength</span>
      <span class="strength-value" id="strengthValue">—</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <div class="entropy-row">
      <span class="entropy-text" id="entropyText">Entropy: — bits</span>
      <span class="crack-time" id="crackTime">Crack time: —</span>
    </div>
  </div>

  <!-- LENGTH -->
  <div class="slider-section">
    <div class="slider-header">
      <span class="slider-label">Password Length</span>
      <span class="slider-val" id="lengthVal">16</span>
    </div>
    <input type="range" min="4" max="128" value="16" id="lengthSlider">
  </div>

  <!-- CHAR OPTIONS -->
  <div class="options-grid">
    <label class="option active" id="optUpper" onclick="toggleOpt(this)">
      <input type="checkbox" id="uppercase" checked>
      <span class="check-icon">✓</span>
      <span>Uppercase A–Z</span>
    </label>
    <label class="option active" id="optLower" onclick="toggleOpt(this)">
      <input type="checkbox" id="lowercase" checked>
      <span class="check-icon">✓</span>
      <span>Lowercase a–z</span>
    </label>
    <label class="option active" id="optNumbers" onclick="toggleOpt(this)">
      <input type="checkbox" id="numbers" checked>
      <span class="check-icon">✓</span>
      <span>Numbers 0–9</span>
    </label>
    <label class="option active" id="optSymbols" onclick="toggleOpt(this)">
      <input type="checkbox" id="symbols" checked>
      <span class="check-icon">✓</span>
      <span>Symbols !@#$</span>
    </label>
  </div>

  <!-- EXTRA OPTIONS -->
  <div class="extra-row">
    <label class="extra-opt" id="optExclude" onclick="toggleExtra(this,'customExclude')">
      <input type="checkbox" id="exclude">
      <span class="extra-check">✓</span>
      <span>Exclude Similar (0O1lI)</span>
    </label>
    <label class="extra-opt" id="optAutocopy" onclick="toggleExtra(this)">
      <input type="checkbox" id="autocopy">
      <span class="extra-check">✓</span>
      <span>Auto Copy</span>
    </label>
  </div>

  <!-- CUSTOM EXCLUDE -->
  <div class="custom-exclude" id="customExclude">
    <label>Custom characters to exclude:</label>
    <input type="text" id="customExcludeInput" placeholder="e.g.  @ # $ % & ( )" maxlength="40">
  </div>

  <!-- GENERATE -->
  <button class="gen-btn" onclick="generatePassword()">⚡ Generate Password</button>
  <div class="copy-flash" id="copyFlash">✅ Password copied to clipboard!</div>

  <!-- HISTORY -->
  <div class="history-wrap">
    <div class="history-title">Recent Passwords (Session)</div>
    <div id="historyList"><div class="history-empty">No passwords generated yet</div></div>
  </div>

  <a class="back" href="../index.html">← Return Home</a>
</div>

<div class="toast" id="toast"></div>

<script>
const UPPER='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWER='abcdefghijklmnopqrstuvwxyz';
const NUMS='0123456789';
const SYMS='!@#$%^&*()_+-=[]{}|;:,.<>?/~`';
const SIMILAR=/[O0l1I|]/g;

let history=[];
let isVisible=false;

// Slider
const slider=document.getElementById('lengthSlider');
slider.addEventListener('input',function(){
  document.getElementById('lengthVal').textContent=this.value;
  savePrefs();
});

function toggleOpt(label){
  event.preventDefault();
  const cb=label.querySelector('input[type=checkbox]');
  cb.checked=!cb.checked;
  label.classList.toggle('active',cb.checked);
  savePrefs();
}

function toggleExtra(label,showId){
  event.preventDefault();
  const cb=label.querySelector('input[type=checkbox]');
  cb.checked=!cb.checked;
  label.classList.toggle('active',cb.checked);
  if(showId){
    document.getElementById(showId).classList.toggle('show',cb.checked);
  }
  savePrefs();
}

function getCharset(){
  let chars='';
  if(document.getElementById('uppercase').checked) chars+=UPPER;
  if(document.getElementById('lowercase').checked) chars+=LOWER;
  if(document.getElementById('numbers').checked) chars+=NUMS;
  if(document.getElementById('symbols').checked) chars+=SYMS;

  // Exclude similar
  if(document.getElementById('exclude').checked){
    chars=chars.replace(SIMILAR,'');
  }

  // Custom exclude
  const custom=document.getElementById('customExcludeInput').value;
  if(custom){
    const escCustom=custom.replace(/[-[\]{}()*+?.,\\^$|#\s]/g,'\\$&');
    chars=chars.replace(new RegExp('['+escCustom+']','g'),'');
  }

  return chars;
}

function generatePassword(){
  const chars=getCharset();
  if(!chars){showToast('⚠️ Select at least one character type!');return;}

  const length=parseInt(slider.value);

  // Use crypto.getRandomValues for true randomness
  const arr=new Uint32Array(length);
  crypto.getRandomValues(arr);
  let pw='';
  for(let i=0;i<length;i++){
    pw+=chars[arr[i]%chars.length];
  }

  document.getElementById('password').value=pw;
  updateStrength(pw,chars.length);
  addHistory(pw);

  if(document.getElementById('autocopy').checked) copyPassword(true);
  savePrefs();
}

function updateStrength(pw,charsetSize){
  const entropy=Math.log2(Math.pow(charsetSize,pw.length));
  const entropyRound=Math.round(entropy);
  document.getElementById('entropyText').textContent=`Entropy: ${entropyRound} bits`;

  // Crack time estimate (assume 1 billion attempts/sec)
  const attempts=Math.pow(charsetSize,pw.length);
  const seconds=attempts/1e9;
  document.getElementById('crackTime').textContent='Crack time: '+formatTime(seconds);

  // Strength
  let pct,label,color;
  if(entropy<28){pct=15;label='Very Weak';color='#f87171';}
  else if(entropy<40){pct=30;label='Weak';color='#fb923c';}
  else if(entropy<60){pct=55;label='Fair';color='#fbbf24';}
  else if(entropy<80){pct=75;label='Strong';color='#34d399';}
  else{pct=100;label='Very Strong';color='#22c55e';}

  const fill=document.getElementById('barFill');
  fill.style.width=pct+'%';
  fill.style.background=`linear-gradient(90deg,${color},${color}cc)`;
  const sv=document.getElementById('strengthValue');
  sv.textContent=label;
  sv.style.color=color;
}

function formatTime(seconds){
  if(seconds<60) return '<1 minute';
  if(seconds<3600) return Math.round(seconds/60)+' minutes';
  if(seconds<86400) return Math.round(seconds/3600)+' hours';
  if(seconds<2592000) return Math.round(seconds/86400)+' days';
  if(seconds<31536000) return Math.round(seconds/2592000)+' months';
  if(seconds<1e12) return Math.round(seconds/31536000).toLocaleString()+' years';
  if(seconds<1e21) return (seconds/31536000).toExponential(1)+' years';
  return 'Centuries 🔒';
}

function copyPassword(silent){
  const val=document.getElementById('password').value;
  if(!val){showToast('⚠️ Generate a password first');return;}
  navigator.clipboard.writeText(val).then(()=>{
    if(!silent){
      const f=document.getElementById('copyFlash');
      f.classList.add('show');
      setTimeout(()=>f.classList.remove('show'),2200);
    }
  });
}

function toggleVisibility(){
  isVisible=!isVisible;
  document.getElementById('password').type=isVisible?'text':'password';
}

function addHistory(pw){
  history.unshift({pw,time:new Date().toLocaleTimeString()});
  if(history.length>8) history.pop();
  renderHistory();
}

function renderHistory(){
  const list=document.getElementById('historyList');
  if(!history.length){
    list.innerHTML='<div class="history-empty">No passwords generated yet</div>';
    return;
  }
  list.innerHTML=history.map((item,i)=>`
    <div class="history-item">
      <span class="history-pw">${item.pw}</span>
      <span class="history-copy" onclick="copyHistoryItem(${i})">⎘ Copy</span>
    </div>`).join('');
}

function copyHistoryItem(i){
  navigator.clipboard.writeText(history[i].pw).then(()=>showToast('⎘ Copied!'));
}

// PREFERENCES
function savePrefs(){
  localStorage.setItem('pgPrefs',JSON.stringify({
    length:slider.value,
    upper:document.getElementById('uppercase').checked,
    lower:document.getElementById('lowercase').checked,
    numbers:document.getElementById('numbers').checked,
    symbols:document.getElementById('symbols').checked,
    exclude:document.getElementById('exclude').checked,
    autocopy:document.getElementById('autocopy').checked,
  }));
}

function loadPrefs(){
  const p=JSON.parse(localStorage.getItem('pgPrefs')||'null');
  if(!p) return;
  slider.value=p.length||16;
  document.getElementById('lengthVal').textContent=p.length||16;
  setOpt('uppercase','optUpper',p.upper!==false);
  setOpt('lowercase','optLower',p.lower!==false);
  setOpt('numbers','optNumbers',p.numbers!==false);
  setOpt('symbols','optSymbols',p.symbols!==false);
  if(p.exclude){
    document.getElementById('exclude').checked=true;
    document.getElementById('optExclude').classList.add('active');
    document.getElementById('customExclude').classList.add('show');
  }
  if(p.autocopy){
    document.getElementById('autocopy').checked=true;
    document.getElementById('optAutocopy').classList.add('active');
  }
}

function setOpt(cbId,labelId,val){
  document.getElementById(cbId).checked=val;
  document.getElementById(labelId).classList.toggle('active',val);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

loadPrefs();
generatePassword();
</script>
</body>
</html>
