<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Generator</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#020b2c;
      overflow:hidden;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:500px;
      background:#07133d;
      padding:35px;
      border-radius:25px;
      box-shadow:
      0 0 20px rgba(0,140,255,0.25),
      0 0 60px rgba(140,0,255,0.15);
      animation:fadeIn 0.5s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      text-align:center;
      color:white;
      margin-bottom:30px;
      font-size:38px;
    }

    .password-box{
      position:relative;
      margin-bottom:20px;
    }

    #password{
      width:100%;
      padding:16px 120px 16px 15px;
      border:none;
      outline:none;
      border-radius:12px;
      background:#0b1b52;
      color:white;
      font-size:18px;
      letter-spacing:1px;
    }

    .actions{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      gap:10px;
    }

    .icon-btn{
      background:none;
      border:none;
      color:white;
      cursor:pointer;
      font-size:18px;
      transition:0.3s;
    }

    .icon-btn:hover{
      color:#4da3ff;
      transform:scale(1.15);
    }

    .length-container{
      margin:20px 0;
    }

    .length-header{
      display:flex;
      justify-content:space-between;
      margin-bottom:10px;
      color:white;
      font-size:16px;
    }

    input[type="range"]{
      width:100%;
      cursor:pointer;
    }

    .options{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin:25px 0;
    }

    .option{
      color:white;
      display:flex;
      align-items:center;
      gap:10px;
      font-size:15px;
    }

    .option input{
      transform:scale(1.2);
      cursor:pointer;
    }

    .strength{
      margin:20px 0;
    }

    .strength-text{
      display:flex;
      justify-content:space-between;
      color:white;
      margin-bottom:10px;
    }

    .bar{
      width:100%;
      height:12px;
      background:#0b1b52;
      border-radius:50px;
      overflow:hidden;
    }

    .bar div{
      height:100%;
      width:0%;
      transition:0.4s;
      border-radius:50px;
    }

    .entropy{
      color:#9db8ff;
      margin-top:10px;
      font-size:14px;
    }

    .btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:linear-gradient(90deg,#19a7ff,#8d2fff);
      color:white;
      font-size:17px;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
      font-weight:bold;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 0 20px rgba(61,140,255,0.4);
    }

    .copy-msg{
      text-align:center;
      color:#4dff91;
      margin-top:12px;
      font-size:14px;
      display:none;
    }

    .history{
      margin-top:25px;
      background:#0b1b52;
      padding:15px;
      border-radius:12px;
    }

    .history h3{
      color:white;
      margin-bottom:10px;
      font-size:18px;
    }

    .history-item{
      color:#9db8ff;
      margin-bottom:8px;
      word-break:break-all;
      font-size:14px;
    }

    .home-btn{
      margin-top:25px;
      text-align:center;
    }

    .home-btn a{
      text-decoration:none;
      color:#4da3ff;
      border:1px solid #4da3ff;
      padding:12px 20px;
      border-radius:10px;
      transition:0.3s;
      display:inline-block;
    }

    .home-btn a:hover{
      background:#4da3ff;
      color:white;
    }

    @media(max-width:550px){

      .container{
        padding:25px;
      }

      h1{
        font-size:30px;
      }

      .options{
        grid-template-columns:1fr;
      }

      #password{
        font-size:15px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Password Generator</h1>

    <div class="password-box">

      <input type="password" id="password" readonly>

      <div class="actions">
        <button class="icon-btn" onclick="togglePassword()">👁</button>
        <button class="icon-btn" onclick="copyPassword()">📋</button>
      </div>

    </div>

    <div class="length-container">

      <div class="length-header">
        <span>Password Length</span>
        <span id="lengthValue">16</span>
      </div>

      <input type="range" min="8" max="64" value="16" id="lengthSlider">

    </div>

    <div class="options">

      <label class="option">
        <input type="checkbox" id="uppercase" checked>
        Uppercase
      </label>

      <label class="option">
        <input type="checkbox" id="lowercase" checked>
        Lowercase
      </label>

      <label class="option">
        <input type="checkbox" id="numbers" checked>
        Numbers
      </label>

      <label class="option">
        <input type="checkbox" id="symbols" checked>
        Symbols
      </label>

      <label class="option">
        <input type="checkbox" id="exclude">
        Exclude Similar
      </label>

      <label class="option">
        <input type="checkbox" id="autocopy">
        Auto Copy
      </label>

    </div>

    <div class="strength">

      <div class="strength-text">
        <span>Strength</span>
        <span id="strengthLabel">Strong</span>
      </div>

      <div class="bar">
        <div id="strengthBar"></div>
      </div>

      <div class="entropy" id="entropyText">
        Entropy: 0 bits
      </div>

    </div>

    <button class="btn" onclick="generatePassword()">
      Generate Password
    </button>

    <div class="copy-msg" id="copyMsg">
      Password Copied ✓
    </div>

    <div class="history">

      <h3>Recent Passwords</h3>

      <div id="historyList"></div>

    </div>

    <div class="home-btn">
      <a href="../index.html">⬅ Back to Home</a>
    </div>

  </div>

  <script>

    const passwordEl = document.getElementById("password");
    const lengthSlider = document.getElementById("lengthSlider");
    const lengthValue = document.getElementById("lengthValue");
    const strengthBar = document.getElementById("strengthBar");
    const strengthLabel = document.getElementById("strengthLabel");
    const entropyText = document.getElementById("entropyText");
    const historyList = document.getElementById("historyList");

    const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lowerChars = "abcdefghijklmnopqrstuvwxyz";
    const numberChars = "0123456789";
    const symbolChars = "!@#$%^&*()_+{}[]<>?/";

    let historyPasswords = [];

    lengthSlider.addEventListener("input", () => {
      lengthValue.innerText = lengthSlider.value;
      savePreferences();
    });

    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("change", savePreferences);
    });

    function generatePassword(){

      let chars = "";

      if(document.getElementById("uppercase").checked){
        chars += upperChars;
      }

      if(document.getElementById("lowercase").checked){
        chars += lowerChars;
      }

      if(document.getElementById("numbers").checked){
        chars += numberChars;
      }

      if(document.getElementById("symbols").checked){
        chars += symbolChars;
      }

      if(chars.length === 0){
        alert("Select at least one option.");
        return;
      }

      if(document.getElementById("exclude").checked){
        chars = chars.replace(/[O0l1I]/g, '');
      }

      let password = "";
      const length = parseInt(lengthSlider.value);

      for(let i=0; i<length; i++){
        password += chars.charAt(
          Math.floor(Math.random() * chars.length)
        );
      }

      passwordEl.value = password;

      updateStrength(password, chars.length);

      addHistory(password);

      if(document.getElementById("autocopy").checked){
        copyPassword();
      }

    }

    function updateStrength(password, charsetSize){

      const entropy = Math.round(
        password.length * Math.log2(charsetSize)
      );

      entropyText.innerText =
        "Entropy: " + entropy + " bits";

      let width = 0;
      let label = "";
      let color = "";

      if(entropy < 40){
        width = 30;
        label = "Weak";
        color = "#ff4d4d";
      }
      else if(entropy < 70){
        width = 65;
        label = "Medium";
        color = "#ffb84d";
      }
      else{
        width = 100;
        label = "Strong";
        color = "#32ff7e";
      }

      strengthBar.style.width = width + "%";
      strengthBar.style.background = color;
      strengthLabel.innerText = label;

    }

    function copyPassword(){

      if(passwordEl.value === ""){
        return;
      }

      navigator.clipboard.writeText(passwordEl.value);

      const msg = document.getElementById("copyMsg");

      msg.style.display = "block";

      setTimeout(() => {
        msg.style.display = "none";
      }, 2000);

    }

    function togglePassword(){

      if(passwordEl.type === "password"){
        passwordEl.type = "text";
      }
      else{
        passwordEl.type = "password";
      }

    }

    function addHistory(password){

      historyPasswords.unshift(password);

      if(historyPasswords.length > 5){
        historyPasswords.pop();
      }

      historyList.innerHTML = "";

      historyPasswords.forEach(pass => {

        const div = document.createElement("div");

        div.className = "history-item";

        div.innerText = pass;

        historyList.appendChild(div);

      });

    }

    function savePreferences(){

      const settings = {
        length:lengthSlider.value,
        upper:document.getElementById("uppercase").checked,
        lower:document.getElementById("lowercase").checked,
        numbers:document.getElementById("numbers").checked,
        symbols:document.getElementById("symbols").checked,
        exclude:document.getElementById("exclude").checked,
        autocopy:document.getElementById("autocopy").checked
      };

      localStorage.setItem(
        "passwordGeneratorSettings",
        JSON.stringify(settings)
      );

    }

    function loadPreferences(){

      const settings = JSON.parse(
        localStorage.getItem("passwordGeneratorSettings")
      );

      if(!settings) return;

      lengthSlider.value = settings.length;
      lengthValue.innerText = settings.length;

      document.getElementById("uppercase").checked = settings.upper;
      document.getElementById("lowercase").checked = settings.lower;
      document.getElementById("numbers").checked = settings.numbers;
      document.getElementById("symbols").checked = settings.symbols;
      document.getElementById("exclude").checked = settings.exclude;
      document.getElementById("autocopy").checked = settings.autocopy;

    }

    loadPreferences();

    generatePassword();

  </script>

</body>
</html>
