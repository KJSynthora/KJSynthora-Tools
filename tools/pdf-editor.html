<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KJSynthora PDF Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
overflow:hidden;
}

.main{
display:flex;
height:100vh;
}

.sidebar{
width:260px;
background:#081028;
padding:20px;
overflow-y:auto;
}

.sidebar h2{
font-size:34px;
margin-bottom:25px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sidebar h3{
margin:20px 0 10px;
font-size:14px;
color:#94a3b8;
}

input,
button{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
margin-bottom:10px;
}

input{
background:#0f172a;
color:white;
}

button{
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-weight:600;
cursor:pointer;
}

.workspace{
flex:1;
display:flex;
flex-direction:column;
}

.topbar{
height:80px;
background:#081028;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

.topbar h1{
font-size:42px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.actions{
display:flex;
gap:10px;
}

.canvas-area{
flex:1;
overflow:auto;
padding:30px;
background:#000814;
}

.canvas-wrapper{
width:max-content;
margin:auto;
}

canvas{
background:white;
border-radius:10px;
}

</style>

</head>

<body>

<div class="main">

<div class="sidebar">

<h2>PDF Tools</h2>

<a href="../index.html">
<button>← Return Home</button>
</a>

<h3>Upload PDF</h3>

<input type="file" id="pdfUpload" accept=".pdf">

<h3>Add Text</h3>

<input type="text" id="textInput" placeholder="Enter text">

<input type="number" id="fontSize" value="20">

<input type="color" id="textColor" value="#ff0000">

<button onclick="addText()">
Add Text
</button>

<h3>Hide Existing Text</h3>

<button onclick="addWhiteBox()">
White Cover
</button>

<h3>Shapes</h3>

<button onclick="addRectangle()">
Rectangle
</button>

<button onclick="addCircle()">
Circle
</button>

<h3>Drawing</h3>

<button onclick="enableDraw()">
Enable Draw
</button>

<button onclick="disableDraw()">
Disable Draw
</button>

<h3>Add Image</h3>

<input type="file" id="imageUpload">

<button onclick="addImage()">
Add Image
</button>

<h3>Actions</h3>

<button onclick="deleteSelected()">
Delete Selected
</button>

<button onclick="clearCanvas()">
Clear Canvas
</button>

</div>

<div class="workspace">

<div class="topbar">

<h1>KJSynthora PDF Editor</h1>

<div class="actions">

<button onclick="zoomIn()">Zoom +</button>

<button onclick="zoomOut()">Zoom -</button>

<button onclick="downloadPDF()">
Download PDF
</button>

</div>

</div>

<div class="canvas-area">

<div class="canvas-wrapper">

<canvas id="pdfCanvas"></canvas>

</div>

</div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

const canvas =
new fabric.Canvas('pdfCanvas');

let currentZoom = 1;

document.getElementById('pdfUpload')
.addEventListener('change',loadPDF);

async function loadPDF(e){

const file = e.target.files[0];

if(!file){
return;
}

const fileReader =
new FileReader();

fileReader.onload =
async function(){

const typedarray =
new Uint8Array(this.result);

const pdf =
await pdfjsLib
.getDocument(typedarray)
.promise;

const page =
await pdf.getPage(1);

const viewport =
page.getViewport({
scale:1.5
});

const tempCanvas =
document.createElement('canvas');

const context =
tempCanvas.getContext('2d');

tempCanvas.width =
viewport.width;

tempCanvas.height =
viewport.height;

await page.render({

canvasContext:context,

viewport:viewport

}).promise;

const imageURL =
tempCanvas.toDataURL("image/png");

canvas.setWidth(viewport.width);

canvas.setHeight(viewport.height);

fabric.Image.fromURL(
imageURL,
function(img){

canvas.clear();

canvas.setWidth(viewport.width);

canvas.setHeight(viewport.height);

img.set({

left:0,

top:0,

selectable:false,

evented:false,

scaleX:
viewport.width / img.width,

scaleY:
viewport.height / img.height

});

canvas.add(img);

img.sendToBack();

canvas.renderAll();

}
);

};

fileReader.readAsArrayBuffer(file);

}

function addText(){

const text =
document.getElementById("textInput")
.value;

if(text.trim()===""){
return;
}

const size =
parseInt(
document.getElementById("fontSize")
.value
);

const color =
document.getElementById("textColor")
.value;

const textbox =
new fabric.IText(
text,
{

left:200,

top:200,

fontSize:size,

fill:color

}
);

canvas.add(textbox);

canvas.setActiveObject(textbox);

}

function addWhiteBox(){

const rect =
new fabric.Rect({

left:200,

top:200,

width:200,

height:60,

fill:'white'

});

canvas.add(rect);

}

function addRectangle(){

const rect =
new fabric.Rect({

left:200,

top:200,

width:150,

height:100,

fill:'transparent',

stroke:'red',

strokeWidth:2

});

canvas.add(rect);

}

function addCircle(){

const circle =
new fabric.Circle({

left:250,

top:250,

radius:50,

fill:'transparent',

stroke:'blue',

strokeWidth:2

});

canvas.add(circle);

}

function enableDraw(){

canvas.isDrawingMode = true;

canvas.freeDrawingBrush.width = 3;

canvas.freeDrawingBrush.color = "red";

}

function disableDraw(){

canvas.isDrawingMode = false;

}

function addImage(){

const file =
document.getElementById("imageUpload")
.files[0];

if(!file){
return;
}

const reader =
new FileReader();

reader.onload =
function(f){

fabric.Image.fromURL(
f.target.result,
function(img){

img.scaleToWidth(200);

img.set({

left:200,

top:200

});

canvas.add(img);

}
);

};

reader.readAsDataURL(file);

}

function deleteSelected(){

const active =
canvas.getActiveObject();

if(active){

canvas.remove(active);

}

}

function clearCanvas(){

canvas.getObjects().forEach(obj=>{

if(obj !== canvas.backgroundImage){

canvas.remove(obj);

}

});

}

function zoomIn(){

currentZoom += 0.1;

canvas.setZoom(currentZoom);

}

function zoomOut(){

currentZoom -= 0.1;

canvas.setZoom(currentZoom);

}

async function downloadPDF(){

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF({

orientation:'portrait',

unit:'px',

format:[
canvas.width,
canvas.height
]

});

const imgData =
canvas.toDataURL({

format:'png',

quality:1
});

pdf.addImage(
imgData,
'PNG',
0,
0,
canvas.width,
canvas.height
);

pdf.save(
'KJSynthora-Edited.pdf'
);

}

document.addEventListener(
'keydown',
function(e){

if(e.key === "Delete"){

deleteSelected();

}

}
);

</script>

</body>

</html>
