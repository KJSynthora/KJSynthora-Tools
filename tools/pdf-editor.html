<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KJSynthora PDF Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
overflow:hidden;
}

.main{
display:flex;
height:100vh;
}

.sidebar{
width:260px;
background:#081028;
padding:20px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,0.08);
}

.sidebar h2{
margin-bottom:25px;
font-size:28px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tool-group{
margin-bottom:25px;
}

.tool-group h3{
margin-bottom:10px;
font-size:16px;
color:#94a3b8;
}

input,
select,
button{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
outline:none;
border-radius:12px;
background:#0f172a;
color:white;
}

button{
background:linear-gradient(90deg,#0ea5e9,#9333ea);
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.workspace{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.topbar{
height:80px;
background:#081028;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.topbar h1{
font-size:40px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.actions{
display:flex;
gap:10px;
}

.canvas-wrapper{
flex:1;
overflow:auto;
padding:30px;
}

.canvas-box{
background:#000814;
padding:20px;
border-radius:20px;
display:flex;
justify-content:center;
align-items:flex-start;
min-height:100%;
}

canvas{
background:white;
border-radius:10px;
box-shadow:0 0 25px rgba(0,0,0,0.5);
}

#loading{
position:fixed;
top:20px;
right:20px;
background:#0f172a;
padding:14px 20px;
border-radius:12px;
display:none;
z-index:9999;
}

</style>

</head>

<body>

<div id="loading">
Loading...
</div>

<div class="main">

<div class="sidebar">

<h2>PDF Tools</h2>

<div class="tool-group">

<h3>Navigation</h3>

<a href="../index.html" style="text-decoration:none;">

<button>
← Return Home
</button>

</a>

</div>

<div class="tool-group">

<h3>Upload PDF</h3>

<input type="file" id="pdfUpload" accept=".pdf">

</div>

<div class="tool-group">

<h3>Add Text</h3>

<input type="text" id="textInput" placeholder="Enter text">

<input type="number" id="fontSize" value="20" min="8" max="120">

<input type="color" id="textColor" value="#ff0000">

<button onclick="addText()">
Add Text
</button>

</div>

<div class="tool-group">

<h3>White Cover</h3>

<button onclick="addWhiteBox()">
Add White Box
</button>

</div>

<div class="tool-group">

<h3>Shapes</h3>

<button onclick="addRectangle()">
Rectangle
</button>

<button onclick="addCircle()">
Circle
</button>

</div>

<div class="tool-group">

<h3>Drawing</h3>

<input type="range" id="brushSize" min="1" max="30" value="3">

<button onclick="enableDraw()">
Enable Draw
</button>

<button onclick="disableDraw()">
Disable Draw
</button>

</div>

<div class="tool-group">

<h3>Add Image</h3>

<input type="file" id="imageUpload">

<button onclick="addImage()">
Add Image
</button>

</div>

<div class="tool-group">

<h3>Actions</h3>

<button onclick="deleteSelected()">
Delete Selected
</button>

<button onclick="clearCanvas()">
Clear All
</button>

</div>

</div>

<div class="workspace">

<div class="topbar">

<h1>KJSynthora PDF Editor</h1>

<div class="actions">

<button onclick="undo()">
Undo
</button>

<button onclick="redo()">
Redo
</button>

<button onclick="zoomIn()">
Zoom +
</button>

<button onclick="zoomOut()">
Zoom -
</button>

<button onclick="downloadPDF()">
Download PDF
</button>

</div>

</div>

<div class="canvas-wrapper">

<div class="canvas-box">

<canvas id="pdfCanvas"></canvas>

</div>

</div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

const canvas =
new fabric.Canvas('pdfCanvas');

canvas.setWidth(900);

canvas.setHeight(1200);

let history = [];
let redoHistory = [];

function saveHistory(){

redoHistory = [];

history.push(
JSON.stringify(canvas)
);

}

canvas.on('object:added', saveHistory);

canvas.on('object:modified', saveHistory);

canvas.on('object:removed', saveHistory);

document.getElementById('pdfUpload')
.addEventListener('change', async function(e){

const file = e.target.files[0];

if(!file){
return;
}

document.getElementById("loading")
.style.display = "block";

const fileReader =
new FileReader();

fileReader.onload =
async function(){

const typedarray =
new Uint8Array(this.result);

const pdf =
await pdfjsLib
.getDocument(typedarray)
.promise;

const page =
await pdf.getPage(1);

const viewport =
page.getViewport({scale:1.5});

const tempCanvas =
document.createElement('canvas');

const tempContext =
tempCanvas.getContext('2d');

tempCanvas.height =
viewport.height;

tempCanvas.width =
viewport.width;

await page.render({

canvasContext:tempContext,

viewport:viewport

}).promise;

const imageData =
tempCanvas.toDataURL("image/png");

fabric.Image.fromURL(
imageData,
async function(img){

canvas.setWidth(viewport.width);

canvas.setHeight(viewport.height);

canvas.setBackgroundImage(
img,
canvas.renderAll.bind(canvas),
{
scaleX:
canvas.width / img.width,

scaleY:
canvas.height / img.height
}
);

canvas.renderAll();

await detectText(
imageData
);

document.getElementById("loading")
.style.display = "none";

}
);

};

fileReader.readAsArrayBuffer(file);

});

async function detectText(imageData){

const result =
await Tesseract.recognize(
imageData,
'eng'
);

result.data.words.forEach(word=>{

if(word.text.trim() !== ""){

const text =
new fabric.IText(word.text,{

left:word.bbox.x0,

top:word.bbox.y0,

fontSize:
Math.max(
14,
word.bbox.y1 - word.bbox.y0
),

fill:'transparent',

editable:true,

backgroundColor:'transparent',

borderColor:'#38bdf8',

cornerColor:'#38bdf8'

});

canvas.add(text);

}

});

canvas.renderAll();

}

function addText(){

const value =
document.getElementById("textInput")
.value;

if(value.trim() === ""){
return;
}

const size =
parseInt(
document.getElementById("fontSize")
.value
);

const color =
document.getElementById("textColor")
.value;

const text =
new fabric.IText(value,{

left:150,

top:150,

fontSize:size,

fill:color

});

canvas.add(text);

canvas.setActiveObject(text);

}

function addWhiteBox(){

const rect =
new fabric.Rect({

left:200,

top:200,

width:180,

height:60,

fill:'white'

});

canvas.add(rect);

}

function addRectangle(){

const rect =
new fabric.Rect({

left:200,

top:200,

width:160,

height:80,

fill:'transparent',

stroke:'red',

strokeWidth:2

});

canvas.add(rect);

}

function addCircle(){

const circle =
new fabric.Circle({

left:200,

top:200,

radius:50,

fill:'transparent',

stroke:'blue',

strokeWidth:2

});

canvas.add(circle);

}

function enableDraw(){

canvas.isDrawingMode = true;

canvas.freeDrawingBrush.width =
parseInt(
document.getElementById("brushSize")
.value
);

canvas.freeDrawingBrush.color =
"red";

}

function disableDraw(){

canvas.isDrawingMode = false;

}

function addImage(){

const file =
document.getElementById("imageUpload")
.files[0];

if(!file){
return;
}

const reader =
new FileReader();

reader.onload =
function(f){

fabric.Image.fromURL(
f.target.result,
function(img){

img.set({

left:200,

top:200,

scaleX:0.4,

scaleY:0.4

});

canvas.add(img);

}
);

};

reader.readAsDataURL(file);

}

function deleteSelected(){

const active =
canvas.getActiveObject();

if(active){

canvas.remove(active);

}

}

function clearCanvas(){

canvas.clear();

}

function undo(){

if(history.length > 0){

redoHistory.push(
history.pop()
);

const state =
history[history.length - 1];

if(state){

canvas.loadFromJSON(
state,
canvas.renderAll.bind(canvas)
);

}

}

}

function redo(){

if(redoHistory.length > 0){

const state =
redoHistory.pop();

history.push(state);

canvas.loadFromJSON(
state,
canvas.renderAll.bind(canvas)
);

}

}

function zoomIn(){

canvas.setZoom(
canvas.getZoom() + 0.1
);

}

function zoomOut(){

canvas.setZoom(
canvas.getZoom() - 0.1
);

}

async function downloadPDF(){

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF({

orientation:'portrait',

unit:'px',

format:[
canvas.width,
canvas.height
]

});

const image =
canvas.toDataURL({

format:'png',

quality:1
});

pdf.addImage(
image,
'PNG',
0,
0,
canvas.width,
canvas.height
);

pdf.save(
'KJSynthora-Edited.pdf'
);

}

document.addEventListener(
'keydown',
function(e){

if(e.key === "Delete"){

deleteSelected();

}

});

</script>

</body>
</html>
