<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pro PDF Editor V2 | KJSynthora</title>

<link rel="icon"
type="image/png"
href="../logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
overflow:hidden;
}

.main-layout{
display:flex;
height:100vh;
}

.sidebar{

width:260px;

background:#081028;

padding:20px;

overflow-y:auto;

border-right:1px solid rgba(255,255,255,0.08);

}

.sidebar h2{

font-size:22px;

margin-bottom:20px;

background:linear-gradient(90deg,#38bdf8,#8b5cf6);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.tool-group{

margin-bottom:25px;

}

.tool-group h3{

font-size:15px;

margin-bottom:12px;

color:#94a3b8;

}

.tool-group button,
.tool-group input,
.tool-group select{

width:100%;

margin-bottom:10px;

padding:13px;

border:none;

border-radius:12px;

background:#111827;

color:white;

}

.tool-group button{

background:
linear-gradient(
90deg,
#0ea5e9,
#9333ea
);

font-weight:600;

cursor:pointer;

}

.editor-area{

flex:1;

display:flex;

flex-direction:column;

}

.topbar{

height:80px;

background:#081028;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

border-bottom:1px solid rgba(255,255,255,0.08);

}

.logo{

font-size:28px;

font-weight:700;

background:linear-gradient(90deg,#38bdf8,#8b5cf6);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.top-controls{

display:flex;

gap:10px;

align-items:center;

}

.top-controls button{

padding:12px 18px;

border:none;

border-radius:12px;

background:
linear-gradient(
90deg,
#0ea5e9,
#9333ea
);

color:white;

font-weight:600;

cursor:pointer;

}

.editor-wrapper{

flex:1;

overflow:auto;

padding:25px;

background:#020617;

position:relative;

}

.canvas-container{

margin:auto;

margin-bottom:30px;

box-shadow:0 0 20px rgba(0,0,0,0.4);

}

.page-box{

margin-bottom:40px;

position:relative;

}

.page-label{

margin-bottom:10px;

color:#94a3b8;

font-size:14px;

}

.loading{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

font-size:26px;

color:#64748b;

}

</style>

</head>

<body>

<div class="main-layout">

<!-- SIDEBAR -->

<div class="sidebar">

<h2>PDF Tools</h2>

<div class="tool-group">

<h3>Navigation</h3>

<a href="../index.html">

<button>
← Return Home
</button>

</a>

</div>

<div class="tool-group">

<h3>Upload</h3>

<input type="file"
id="pdfUpload"
accept=".pdf">

</div>

<div class="tool-group">

<h3>Text</h3>

<input type="text"
id="textInput"
placeholder="Enter text">

<input type="number"
id="fontSize"
value="20"
min="1"
max="500">

<input type="color"
id="textColor"
value="#ff0000">

<button onclick="addText()">
Add Text
</button>

</div>

<div class="tool-group">

<h3>Shapes</h3>

<button onclick="addWhiteCover()">
White Cover
</button>

<button onclick="addRectangle()">
Rectangle
</button>

<button onclick="addCircle()">
Circle
</button>

</div>

<div class="tool-group">

<h3>Drawing</h3>

<input type="range"
id="brushSize"
min="1"
max="50"
value="5">

<button onclick="enableDraw()">
Enable Draw
</button>

<button onclick="disableDraw()">
Disable Draw
</button>

</div>

<div class="tool-group">

<h3>Image</h3>

<input type="file"
id="imageUpload"
accept="image/*">

<button onclick="uploadImage()">
Add Image
</button>

</div>

<div class="tool-group">

<h3>Actions</h3>

<button onclick="deleteSelected()">
Delete Selected
</button>

<button onclick="duplicateSelected()">
Duplicate
</button>

<button onclick="bringFront()">
Bring Front
</button>

<button onclick="sendBack()">
Send Back
</button>

</div>

</div>

<!-- EDITOR -->

<div class="editor-area">

<div class="topbar">

<div class="logo">
KJSynthora PDF Editor
</div>

<div class="top-controls">

<button onclick="undoAction()">
Undo
</button>

<button onclick="redoAction()">
Redo
</button>

<button onclick="zoomIn()">
Zoom +
</button>

<button onclick="zoomOut()">
Zoom -
</button>

<button onclick="downloadPDF()">
Download PDF
</button>

</div>

</div>

<div class="editor-wrapper"
id="editorWrapper">

<div class="loading"
id="loading">

📄 Upload PDF to Start Editing

</div>

</div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

const pdfUpload =
document.getElementById("pdfUpload");

const editorWrapper =
document.getElementById("editorWrapper");

const loading =
document.getElementById("loading");

let canvases = [];

let history = [];

let redoStack = [];

let zoomLevel = 1;

pdfUpload.addEventListener(
"change",
async function(e){

const file = e.target.files[0];

if(!file) return;

loading.innerHTML = "Loading PDF...";

const reader = new FileReader();

reader.onload = async function(){

editorWrapper.innerHTML = "";

canvases = [];

const typedarray =
new Uint8Array(this.result);

const pdf =
await pdfjsLib
.getDocument(typedarray)
.promise;

for(let pageNum=1;
pageNum<=pdf.numPages;
pageNum++){

const page =
await pdf.getPage(pageNum);

const viewport =
page.getViewport({
scale:1.5
});

const pageBox =
document.createElement("div");

pageBox.className = "page-box";

const label =
document.createElement("div");

label.className = "page-label";

label.innerHTML =
"Page " + pageNum;

const canvasEl =
document.createElement("canvas");

pageBox.appendChild(label);

pageBox.appendChild(canvasEl);

editorWrapper.appendChild(pageBox);

const fabricCanvas =
new fabric.Canvas(canvasEl,{

selection:true

});

fabricCanvas.setWidth(viewport.width);

fabricCanvas.setHeight(viewport.height);

const tempCanvas =
document.createElement("canvas");

const ctx =
tempCanvas.getContext("2d");

tempCanvas.width =
viewport.width;

tempCanvas.height =
viewport.height;

await page.render({

canvasContext:ctx,

viewport:viewport

}).promise;

const imgData =
tempCanvas.toDataURL("image/png");

fabric.Image.fromURL(
imgData,
function(img){

img.set({

left:0,
top:0,
selectable:false,
evented:false

});

img.scaleToWidth(viewport.width);

img.scaleToHeight(viewport.height);

fabricCanvas.add(img);

img.sendToBack();

fabricCanvas.renderAll();

}
);

canvases.push(fabricCanvas);

attachCanvasEvents(fabricCanvas);

}

loading.style.display = "none";

};

reader.readAsArrayBuffer(file);

});

function activeCanvas(){

return canvases[0];

}

function addText(){

const canvas = activeCanvas();

if(!canvas) return;

const text =
document.getElementById("textInput").value;

const size =
parseInt(
document.getElementById("fontSize").value
);

const color =
document.getElementById("textColor").value;

const textbox =
new fabric.IText(text || "Text",{

left:100,

top:100,

fill:color,

fontSize:size

});

canvas.add(textbox);

canvas.setActiveObject(textbox);

saveState();

}

function addWhiteCover(){

const canvas = activeCanvas();

const rect =
new fabric.Rect({

left:150,
top:150,
fill:'white',
width:250,
height:60

});

canvas.add(rect);

saveState();

}

function addRectangle(){

const canvas = activeCanvas();

const rect =
new fabric.Rect({

left:120,
top:120,
fill:'transparent',
stroke:'red',
strokeWidth:3,
width:200,
height:100

});

canvas.add(rect);

saveState();

}

function addCircle(){

const canvas = activeCanvas();

const circle =
new fabric.Circle({

radius:50,
fill:'transparent',
stroke:'blue',
strokeWidth:3,
left:150,
top:150

});

canvas.add(circle);

saveState();

}

function enableDraw(){

const canvas = activeCanvas();

canvas.isDrawingMode = true;

canvas.freeDrawingBrush.width =
parseInt(
document.getElementById("brushSize").value
);

canvas.freeDrawingBrush.color = "red";

}

function disableDraw(){

const canvas = activeCanvas();

canvas.isDrawingMode = false;

}

function deleteSelected(){

const canvas = activeCanvas();

const active =
canvas.getActiveObject();

if(active){

canvas.remove(active);

saveState();

}

}

function duplicateSelected(){

const canvas = activeCanvas();

const active =
canvas.getActiveObject();

if(active){

active.clone(function(cloned){

cloned.set({

left:active.left + 20,
top:active.top + 20

});

canvas.add(cloned);

saveState();

});

}

}

function bringFront(){

const canvas = activeCanvas();

const active =
canvas.getActiveObject();

if(active){

active.bringToFront();

canvas.renderAll();

}

}

function sendBack(){

const canvas = activeCanvas();

const active =
canvas.getActiveObject();

if(active){

active.sendToBack();

canvas.renderAll();

}

}

function uploadImage(){

const file =
document.getElementById("imageUpload")
.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload = function(f){

fabric.Image.fromURL(
f.target.result,
function(img){

img.set({

left:100,
top:100,
scaleX:0.5,
scaleY:0.5

});

activeCanvas().add(img);

saveState();

});

};

reader.readAsDataURL(file);

}

function zoomIn(){

zoomLevel += 0.1;

canvases.forEach(c=>{

c.setZoom(zoomLevel);

});

}

function zoomOut(){

if(zoomLevel > 0.3){

zoomLevel -= 0.1;

canvases.forEach(c=>{

c.setZoom(zoomLevel);

});

}

}

function saveState(){

const canvas = activeCanvas();

history.push(
JSON.stringify(canvas)
);

}

function undoAction(){

const canvas = activeCanvas();

if(history.length > 0){

redoStack.push(
JSON.stringify(canvas)
);

canvas.loadFromJSON(
history.pop(),
canvas.renderAll.bind(canvas)
);

}

}

function redoAction(){

const canvas = activeCanvas();

if(redoStack.length > 0){

history.push(
JSON.stringify(canvas)
);

canvas.loadFromJSON(
redoStack.pop(),
canvas.renderAll.bind(canvas)
);

}

}

function attachCanvasEvents(canvas){

canvas.on(
'object:modified',
saveState
);

canvas.on(
'object:added',
saveState
);

}

async function downloadPDF(){

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF();

for(let i=0;i<canvases.length;i++){

const canvas =
canvases[i];

const img =
canvas.toDataURL("image/png");

const width =
canvas.width;

const height =
canvas.height;

if(i > 0){

pdf.addPage([width,height]);

}

pdf.addImage(
img,
'PNG',
0,
0,
width,
height
);

}

pdf.save(
"KJSynthora-Pro-Editor.pdf"
);

}

document.addEventListener(
'keydown',
function(e){

const canvas =
activeCanvas();

if(!canvas) return;

if(
e.key === "Delete" ||
e.key === "Backspace"
){

const active =
canvas.getActiveObject();

if(active){

canvas.remove(active);

saveState();

}

}

});

</script>

</body>

</html>
