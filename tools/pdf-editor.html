<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Advanced PDF Editor | KJSynthora</title>

<link rel="icon"
type="image/png"
href="../logo.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
padding:30px;
min-height:100vh;
}

.container{
max-width:1200px;
margin:auto;
background:#081028;
padding:40px;
border-radius:25px;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:30px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.upload-box{
background:#0f172a;
padding:30px;
border-radius:20px;
text-align:center;
margin-bottom:30px;
}

input,textarea,select{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
background:#111827;
color:white;
}

button{
margin-top:20px;
padding:15px;
width:100%;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
}

canvas{
width:100%;
margin-top:30px;
border-radius:20px;
background:white;
}

.editor-tools{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;
}

.home-btn{
display:block;
margin-top:40px;
text-align:center;
color:#38bdf8;
text-decoration:none;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>Advanced PDF Editor</h1>

<div class="upload-box">

<input type="file"
id="pdfUpload"
accept=".pdf">

</div>

<div class="editor-tools">

<div>

<label>Add Text</label>

<textarea id="customText"
placeholder="Enter text"></textarea>

</div>

<div>

<label>Font Size</label>

<select id="fontSize">

<option value="14">14</option>
<option value="18">18</option>
<option value="24">24</option>
<option value="30">30</option>

</select>

</div>

<div>

<label>Text Color</label>

<input type="color"
id="textColor"
value="#ff0000">

</div>

</div>

<button onclick="downloadEditedPDF()">
Download Edited PDF
</button>

<canvas id="pdfCanvas"></canvas>

<a href="../index.html"
class="home-btn">

← Return Home

</a>

</div>

<script>

const pdfUpload =
document.getElementById("pdfUpload");

const canvas =
document.getElementById("pdfCanvas");

const ctx =
canvas.getContext("2d");

let uploadedPDF = null;

let uploadedImage = null;

pdfUpload.addEventListener("change",
async function(e){

const file = e.target.files[0];

if(!file) return;

const fileReader =
new FileReader();

fileReader.onload =
async function(){

const typedarray =
new Uint8Array(this.result);

uploadedPDF =
await pdfjsLib
.getDocument(typedarray)
.promise;

renderPDF();

};

fileReader.readAsArrayBuffer(file);

});

async function renderPDF(){

const page =
await uploadedPDF.getPage(1);

const viewport =
page.getViewport({scale:1.5});

canvas.height =
viewport.height;

canvas.width =
viewport.width;

await page.render({
canvasContext:ctx,
viewport:viewport
}).promise;

uploadedImage =
canvas.toDataURL("image/png");

}

async function downloadEditedPDF(){

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF();

const img =
new Image();

img.src = uploadedImage;

img.onload = function(){

pdf.addImage(
img,
'PNG',
0,
0,
210,
297
);

const text =
document.getElementById("customText").value;

const size =
document.getElementById("fontSize").value;

const color =
document.getElementById("textColor").value;

const r =
parseInt(color.substr(1,2),16);

const g =
parseInt(color.substr(3,2),16);

const b =
parseInt(color.substr(5,2),16);

pdf.setFontSize(size);

pdf.setTextColor(r,g,b);

pdf.text(text,20,40);

pdf.save("KJSynthora-Edited.pdf");

};

}

</script>

</body>

</html>
