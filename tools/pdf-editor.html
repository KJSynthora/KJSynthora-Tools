<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KJSynthora Pro PDF Editor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
overflow:hidden;
}

.main{
display:flex;
height:100vh;
}

.sidebar{
width:270px;
background:#081028;
padding:20px;
overflow-y:auto;
border-right:1px solid rgba(255,255,255,0.08);
}

.sidebar h2{
font-size:32px;
margin-bottom:25px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.group{
margin-bottom:22px;
}

.group h3{
font-size:14px;
margin-bottom:10px;
color:#94a3b8;
}

input,
button{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
margin-bottom:10px;
}

input{
background:#0f172a;
color:white;
}

button{
background:linear-gradient(90deg,#0ea5e9,#9333ea);
color:white;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.workspace{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

.topbar{
height:80px;
background:#081028;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.topbar h1{
font-size:42px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.actions{
display:flex;
gap:10px;
}

.canvas-area{
flex:1;
overflow:auto;
padding:30px;
background:#000814;
}

.canvas-wrapper{
width:max-content;
margin:auto;
background:#111827;
padding:20px;
border-radius:20px;
}

canvas{
background:white;
border-radius:10px;
}

</style>

</head>

<body>

<div class="main">

<div class="sidebar">

<h2>PDF Tools</h2>

<div class="group">

<a href="../index.html">

<button>
← Return Home
</button>

</a>

</div>

<div class="group">

<h3>Upload PDF</h3>

<input type="file" id="pdfUpload" accept=".pdf">

</div>

<div class="group">

<h3>Add Text</h3>

<input type="text" id="textInput" placeholder="Enter text">

<input type="number" id="fontSize" value="24" min="8" max="150">

<input type="color" id="textColor" value="#ff0000">

<button onclick="addText()">
Add Text
</button>

</div>

<div class="group">

<h3>Hide Existing Data</h3>

<button onclick="addWhiteBox()">
White Cover
</button>

</div>

<div class="group">

<h3>Shapes</h3>

<button onclick="addRectangle()">
Rectangle
</button>

<button onclick="addCircle()">
Circle
</button>

</div>

<div class="group">

<h3>Draw</h3>

<button onclick="enableDraw()">
Enable Draw
</button>

<button onclick="disableDraw()">
Disable Draw
</button>

</div>

<div class="group">

<h3>Add Image</h3>

<input type="file" id="imageUpload">

<button onclick="addImage()">
Add Image
</button>

</div>

<div class="group">

<h3>Delete</h3>

<button onclick="deleteSelected()">
Delete Selected
</button>

</div>

</div>

<div class="workspace">

<div class="topbar">

<h1>KJSynthora PDF Editor</h1>

<div class="actions">

<button onclick="zoomIn()">
Zoom +
</button>

<button onclick="zoomOut()">
Zoom -
</button>

<button onclick="downloadPDF()">
Download PDF
</button>

</div>

</div>

<div class="canvas-area">

<div class="canvas-wrapper">

<canvas id="canvas"></canvas>

</div>

</div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

const fabricCanvas =
new fabric.Canvas('canvas');

let currentZoom = 1;

fabricCanvas.setWidth(900);
fabricCanvas.setHeight(1200);

document.getElementById('pdfUpload')
.addEventListener(
'change',
async function(e){

const file = e.target.files[0];

if(!file){
return;
}

const fileReader =
new FileReader();

fileReader.onload =
async function(){

const typedarray =
new Uint8Array(this.result);

const pdf =
await pdfjsLib
.getDocument(typedarray)
.promise;

const page =
await pdf.getPage(1);

const viewport =
page.getViewport({
scale:2
});

const tempCanvas =
document.createElement('canvas');

const context =
tempCanvas.getContext('2d');

tempCanvas.width =
viewport.width;

tempCanvas.height =
viewport.height;

await page.render({

canvasContext:context,

viewport:viewport

}).promise;

const imageURL =
tempCanvas.toDataURL('image/png');

fabric.Image.fromURL(
imageURL,
function(img){

fabricCanvas.clear();

fabricCanvas.setWidth(
viewport.width
);

fabricCanvas.setHeight(
viewport.height
);

img.set({

left:0,

top:0,

selectable:false,

evented:false

});

img.scaleToWidth(
viewport.width
);

img.scaleToHeight(
viewport.height
);

fabricCanvas.add(img);

img.sendToBack();

fabricCanvas.renderAll();

}
);

};

fileReader.readAsArrayBuffer(file);

}
);

function addText(){

const value =
document.getElementById('textInput')
.value;

if(value.trim()===""){
return;
}

const size =
parseInt(
document.getElementById('fontSize')
.value
);

const color =
document.getElementById('textColor')
.value;

const text =
new fabric.IText(
value,
{

left:200,

top:200,

fontSize:size,

fill:color

}
);

fabricCanvas.add(text);

fabricCanvas.setActiveObject(text);

}

function addWhiteBox(){

const rect =
new fabric.Rect({

left:200,

top:200,

width:220,

height:70,

fill:'white'

});

fabricCanvas.add(rect);

}

function addRectangle(){

const rect =
new fabric.Rect({

left:200,

top:200,

width:200,

height:120,

fill:'transparent',

stroke:'red',

strokeWidth:3

});

fabricCanvas.add(rect);

}

function addCircle(){

const circle =
new fabric.Circle({

left:250,

top:250,

radius:60,

fill:'transparent',

stroke:'blue',

strokeWidth:3

});

fabricCanvas.add(circle);

}

function enableDraw(){

fabricCanvas.isDrawingMode = true;

fabricCanvas.freeDrawingBrush.width = 3;

fabricCanvas.freeDrawingBrush.color = "red";

}

function disableDraw(){

fabricCanvas.isDrawingMode = false;

}

function addImage(){

const file =
document.getElementById('imageUpload')
.files[0];

if(!file){
return;
}

const reader =
new FileReader();

reader.onload =
function(f){

fabric.Image.fromURL(
f.target.result,
function(img){

img.set({

left:200,

top:200,

scaleX:0.5,

scaleY:0.5

});

fabricCanvas.add(img);

}
);

};

reader.readAsDataURL(file);

}

function deleteSelected(){

const active =
fabricCanvas.getActiveObject();

if(active){

fabricCanvas.remove(active);

}

}

function zoomIn(){

currentZoom += 0.1;

fabricCanvas.setZoom(currentZoom);

}

function zoomOut(){

currentZoom -= 0.1;

fabricCanvas.setZoom(currentZoom);

}

async function downloadPDF(){

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF({

orientation:'portrait',

unit:'px',

format:[
fabricCanvas.width,
fabricCanvas.height
]

});

const img =
fabricCanvas.toDataURL({

format:'png',

quality:1
});

pdf.addImage(
img,
'PNG',
0,
0,
fabricCanvas.width,
fabricCanvas.height
);

pdf.save(
'KJSynthora-Edited.pdf'
);

}

document.addEventListener(
'keydown',
function(e){

if(e.key === "Delete"){

deleteSelected();

}

}
);

</script>

</body>

</html>
