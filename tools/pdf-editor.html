<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pro PDF Editor | KJSynthora</title>

<link rel="icon"
type="image/png"
href="../logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#020617;

color:white;

padding:20px;

min-height:100vh;

}

.container{

max-width:1600px;

margin:auto;

background:#081028;

padding:25px;

border-radius:25px;

}

h1{

text-align:center;

font-size:42px;

margin-bottom:25px;

background:linear-gradient(90deg,#38bdf8,#8b5cf6);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.toolbar{

display:flex;

flex-wrap:wrap;

gap:12px;

margin-bottom:20px;

align-items:center;

background:#0f172a;

padding:18px;

border-radius:18px;

position:sticky;

top:10px;

z-index:999;

}

.toolbar-group{

display:flex;

gap:10px;

align-items:center;

flex-wrap:wrap;

}

.upload-btn,
.toolbar button{

padding:13px 20px;

border:none;

border-radius:12px;

background:
linear-gradient(
90deg,
#0ea5e9,
#9333ea
);

color:white;

font-weight:600;

cursor:pointer;

font-size:14px;

}

.toolbar button:disabled{

opacity:0.4;

cursor:not-allowed;

}

.toolbar input,
.toolbar select{

padding:12px;

border:none;

border-radius:12px;

background:#111827;

color:white;

font-size:14px;

}

.editor-wrapper{

background:#111827;

border-radius:20px;

padding:20px;

overflow:auto;

height:900px;

position:relative;

}

#emptyState{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

font-size:26px;

color:#64748b;

pointer-events:none;

text-align:center;

}

canvas{

background:white;

border-radius:12px;

box-shadow:0 0 20px rgba(0,0,0,0.4);

}

.home-btn{

display:block;

text-align:center;

margin-top:25px;

text-decoration:none;

color:#38bdf8;

font-weight:600;

}

input[type=file]{

display:none;

}

</style>

</head>

<body>

<div class="container">

<h1>Pro PDF Editor</h1>

<div class="toolbar">

<div class="toolbar-group">

<label class="upload-btn">

Upload PDF

<input type="file"
id="pdfUpload"
accept=".pdf">

</label>

<button
id="downloadBtn"
onclick="downloadPDF()"
disabled>

Download PDF

</button>

</div>

<div class="toolbar-group">

<input type="text"
id="textInput"
placeholder="Enter text">

<input type="number"
id="fontSize"
min="1"
max="500"
value="16"
placeholder="Size">

<input type="color"
id="textColor"
value="#ff0000">

<button
onclick="addText()"
id="addTextBtn"
disabled>

Add Text

</button>

</div>

<div class="toolbar-group">

<button
onclick="addRectangle()"
id="coverBtn"
disabled>

White Cover

</button>

<button
onclick="enableDrawing()"
id="drawBtn"
disabled>

Draw

</button>

<button
onclick="disableDrawing()">

Stop Draw

</button>

<button
onclick="deleteSelected()"
id="deleteBtn"
disabled>

Delete

</button>

</div>

<div class="toolbar-group">

<button
onclick="zoomIn()"
id="zoomInBtn"
disabled>

Zoom +

</button>

<button
onclick="zoomOut()"
id="zoomOutBtn"
disabled>

Zoom -

</button>

<input type="range"
id="brushSize"
min="1"
max="50"
value="5">

</div>

</div>

<div class="editor-wrapper">

<div id="emptyState">

📄 Upload PDF to Start Editing

</div>

<canvas id="pdfCanvas"></canvas>

</div>

<a href="../index.html"
class="home-btn">

← Return Home

</a>

</div>

<script>

const canvas =
new fabric.Canvas('pdfCanvas');

let currentZoom = 1;

let pdfLoaded = false;

const emptyState =
document.getElementById("emptyState");

const pdfUpload =
document.getElementById("pdfUpload");

pdfUpload.addEventListener(
"change",
async function(e){

const file = e.target.files[0];

if(!file){

return;

}

emptyState.style.display = "none";

const reader =
new FileReader();

reader.onload =
async function(){

const typedarray =
new Uint8Array(this.result);

const pdf =
await pdfjsLib
.getDocument(typedarray)
.promise;

const page =
await pdf.getPage(1);

const viewport =
page.getViewport({
scale:1.8
});

const tempCanvas =
document.createElement("canvas");

const tempCtx =
tempCanvas.getContext("2d");

tempCanvas.width =
viewport.width;

tempCanvas.height =
viewport.height;

await page.render({

canvasContext:tempCtx,

viewport:viewport

}).promise;

const bg =
tempCanvas.toDataURL("image/png");

canvas.setWidth(viewport.width);

canvas.setHeight(viewport.height);

fabric.Image.fromURL(
bg,
function(img){

canvas.setBackgroundImage(
img,
canvas.renderAll.bind(canvas),
{
scaleX:
canvas.width / img.width,

scaleY:
canvas.height / img.height
}
);

});

pdfLoaded = true;

enableButtons();

};

reader.readAsArrayBuffer(file);

});

function enableButtons(){

document
.querySelectorAll("button")
.forEach(btn=>{

btn.disabled = false;

});

}

function addText(){

if(!pdfLoaded){

alert("Upload PDF First");

return;

}

const text =
document.getElementById("textInput").value;

if(text.trim() === ""){

alert("Enter Text");

return;

}

const size =
parseInt(
document.getElementById("fontSize").value
);

const color =
document.getElementById("textColor").value;

const textbox =
new fabric.IText(text,{

left:100,

top:100,

fill:color,

fontSize:size,

editable:true

});

canvas.add(textbox);

canvas.setActiveObject(textbox);

}

function addRectangle(){

const rect =
new fabric.Rect({

left:150,

top:150,

fill:'white',

width:220,

height:50

});

canvas.add(rect);

canvas.setActiveObject(rect);

}

function enableDrawing(){

canvas.isDrawingMode = true;

const brushSize =
document.getElementById("brushSize").value;

canvas.freeDrawingBrush.width =
parseInt(brushSize);

canvas.freeDrawingBrush.color =
"red";

}

function disableDrawing(){

canvas.isDrawingMode = false;

}

function deleteSelected(){

const active =
canvas.getActiveObject();

if(active){

canvas.remove(active);

}

}

function zoomIn(){

currentZoom += 0.1;

canvas.setZoom(currentZoom);

}

function zoomOut(){

if(currentZoom > 0.2){

currentZoom -= 0.1;

canvas.setZoom(currentZoom);

}

}

async function downloadPDF(){

if(!pdfLoaded){

alert("Upload PDF First");

return;

}

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF(
'p',
'pt',
[
canvas.width,
canvas.height
]
);

const img =
canvas.toDataURL("image/png");

pdf.addImage(
img,
'PNG',
0,
0,
canvas.width,
canvas.height
);

pdf.save(
"KJSynthora-Pro-Edited.pdf"
);

}

document.addEventListener(
'keydown',
function(e){

if(
e.key === "Delete" ||
e.key === "Backspace"
){

const active =
canvas.getActiveObject();

if(active){

canvas.remove(active);

}

}

});

canvas.on(
'selection:created',
function(){

document
.getElementById("deleteBtn")
.disabled = false;

});

canvas.on(
'selection:cleared',
function(){

document
.getElementById("deleteBtn")
.disabled = true;

});

</script>

</body>

</html>
