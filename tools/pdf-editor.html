<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Visual PDF Editor | KJSynthora</title>

<link rel="icon"
type="image/png"
href="../logo.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
padding:30px;
min-height:100vh;
}

.container{
max-width:1300px;
margin:auto;
background:#081028;
padding:40px;
border-radius:25px;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:30px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.toolbar{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:25px;
}

input,select,button{
padding:14px;
border:none;
border-radius:12px;
background:#111827;
color:white;
}

button{
cursor:pointer;
background:linear-gradient(90deg,#0ea5e9,#9333ea);
font-weight:600;
}

.editor-container{
position:relative;
overflow:auto;
border-radius:20px;
background:white;
padding:20px;
}

canvas{
display:block;
max-width:100%;
margin:auto;
}

.text-layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.draggable{
position:absolute;
min-width:100px;
padding:5px 10px;
border:1px dashed #38bdf8;
cursor:move;
pointer-events:auto;
background:rgba(255,255,255,0.2);
}

.white-box{
position:absolute;
background:white;
border:2px dashed red;
cursor:move;
pointer-events:auto;
}

.home-btn{
display:block;
margin-top:40px;
text-align:center;
color:#38bdf8;
text-decoration:none;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>Visual PDF Editor</h1>

<div class="toolbar">

<input type="file"
id="pdfUpload"
accept=".pdf">

<input type="text"
id="textInput"
placeholder="Enter text">

<select id="fontSize">

<option value="14">14</option>
<option value="18">18</option>
<option value="24">24</option>
<option value="30">30</option>

</select>

<input type="color"
id="textColor"
value="#ff0000">

<button onclick="enableTextMode()">
Add Text
</button>

<button onclick="enableWhiteBoxMode()">
White Cover
</button>

<button onclick="downloadPDF()">
Download PDF
</button>

</div>

<div class="editor-container"
id="editorContainer">

<canvas id="pdfCanvas"></canvas>

<div class="text-layer"
id="textLayer"></div>

</div>

<a href="../index.html"
class="home-btn">

← Return Home

</a>

</div>

<script>

const pdfUpload =
document.getElementById("pdfUpload");

const canvas =
document.getElementById("pdfCanvas");

const ctx =
canvas.getContext("2d");

const textLayer =
document.getElementById("textLayer");

let uploadedPDF = null;

let pdfImage = null;

let currentMode = "";

let elements = [];

pdfUpload.addEventListener(
"change",
async function(e){

const file = e.target.files[0];

const reader =
new FileReader();

reader.onload =
async function(){

const typedarray =
new Uint8Array(this.result);

uploadedPDF =
await pdfjsLib
.getDocument(typedarray)
.promise;

renderPDF();

};

reader.readAsArrayBuffer(file);

});

async function renderPDF(){

const page =
await uploadedPDF.getPage(1);

const viewport =
page.getViewport({scale:1.5});

canvas.width =
viewport.width;

canvas.height =
viewport.height;

textLayer.style.width =
viewport.width + "px";

textLayer.style.height =
viewport.height + "px";

await page.render({
canvasContext:ctx,
viewport:viewport
}).promise;

pdfImage =
canvas.toDataURL("image/png");

}

function enableTextMode(){

currentMode = "text";

}

function enableWhiteBoxMode(){

currentMode = "whitebox";

}

document.getElementById("editorContainer")
.addEventListener("click",
function(e){

const rect =
canvas.getBoundingClientRect();

const x =
e.clientX - rect.left;

const y =
e.clientY - rect.top;

if(currentMode === "text"){

addText(x,y);

}

if(currentMode === "whitebox"){

addWhiteBox(x,y);

}

});

function addText(x,y){

const text =
document.getElementById("textInput").value;

const size =
document.getElementById("fontSize").value;

const color =
document.getElementById("textColor").value;

const div =
document.createElement("div");

div.className = "draggable";

div.contentEditable = true;

div.innerText = text;

div.style.left = x + "px";

div.style.top = y + "px";

div.style.fontSize = size + "px";

div.style.color = color;

makeDraggable(div);

textLayer.appendChild(div);

elements.push(div);

}

function addWhiteBox(x,y){

const box =
document.createElement("div");

box.className = "white-box";

box.style.left = x + "px";

box.style.top = y + "px";

box.style.width = "150px";

box.style.height = "40px";

makeDraggable(box);

textLayer.appendChild(box);

elements.push(box);

}

function makeDraggable(el){

let offsetX,offsetY,isDown=false;

el.addEventListener("mousedown",
function(e){

isDown = true;

offsetX =
e.offsetX;

offsetY =
e.offsetY;

});

document.addEventListener("mouseup",
()=> isDown=false);

document.addEventListener("mousemove",
function(e){

if(!isDown) return;

const rect =
canvas.getBoundingClientRect();

el.style.left =
(e.clientX - rect.left - offsetX)
+ "px";

el.style.top =
(e.clientY - rect.top - offsetY)
+ "px";

});

}

async function downloadPDF(){

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF();

const img =
new Image();

img.src = pdfImage;

img.onload = function(){

pdf.addImage(
img,
'PNG',
0,
0,
210,
297
);

elements.forEach(el=>{

const left =
parseInt(el.style.left);

const top =
parseInt(el.style.top);

if(el.className === "draggable"){

pdf.setFontSize(
parseInt(el.style.fontSize)
);

pdf.setTextColor(
el.style.color
);

pdf.text(
el.innerText,
left/3,
top/3
);

}

if(el.className === "white-box"){

pdf.setFillColor(255,255,255);

pdf.rect(
left/3,
top/3,
50,
12,
'F'
);

}

});

pdf.save(
"KJSynthora-Edited.pdf"
);

};

}

</script>

</body>

</html>
