<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pro PDF Editor | KJSynthora</title>

<link rel="icon"
type="image/png"
href="../logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
min-height:100vh;
padding:20px;
}

.container{
max-width:1500px;
margin:auto;
background:#081028;
padding:25px;
border-radius:25px;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:25px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.toolbar{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(150px,1fr));

gap:15px;

margin-bottom:25px;

}

.toolbar button,
.toolbar input,
.toolbar select{

padding:14px;

border:none;

border-radius:12px;

background:#111827;

color:white;

font-size:15px;

}

.toolbar button{

cursor:pointer;

background:
linear-gradient(
90deg,
#0ea5e9,
#9333ea
);

font-weight:600;

}

.editor-wrapper{

background:#111827;

padding:20px;

border-radius:20px;

overflow:auto;

height:900px;

}

canvas{

border-radius:12px;

background:white;

}

.home-btn{

display:block;

text-align:center;

margin-top:25px;

color:#38bdf8;

text-decoration:none;

font-weight:600;

}

</style>

</head>

<body>

<div class="container">

<h1>Pro PDF Editor</h1>

<div class="toolbar">

<input type="file"
id="pdfUpload"
accept=".pdf">

<input type="text"
id="textInput"
placeholder="Enter text">

<select id="fontSize">

<option value="16">16</option>
<option value="22">22</option>
<option value="28">28</option>
<option value="36">36</option>

</select>

<input type="color"
id="textColor"
value="#ff0000">

<button onclick="addText()">
Add Text
</button>

<button onclick="addRectangle()">
White Cover
</button>

<button onclick="enableDrawing()">
Draw
</button>

<button onclick="disableDrawing()">
Stop Draw
</button>

<button onclick="deleteSelected()">
Delete
</button>

<button onclick="zoomIn()">
Zoom +
</button>

<button onclick="zoomOut()">
Zoom -
</button>

<button onclick="downloadPDF()">
Download
</button>

</div>

<div class="editor-wrapper">

<canvas id="pdfCanvas"></canvas>

</div>

<a href="../index.html"
class="home-btn">

← Return Home

</a>

</div>

<script>

const canvas =
new fabric.Canvas(
'pdfCanvas'
);

let currentZoom = 1;

const pdfUpload =
document.getElementById("pdfUpload");

pdfUpload.addEventListener(
"change",
async function(e){

const file = e.target.files[0];

const reader =
new FileReader();

reader.onload =
async function(){

const typedarray =
new Uint8Array(this.result);

const pdf =
await pdfjsLib
.getDocument(typedarray)
.promise;

const page =
await pdf.getPage(1);

const viewport =
page.getViewport({
scale:2
});

const tempCanvas =
document.createElement("canvas");

const tempCtx =
tempCanvas.getContext("2d");

tempCanvas.width =
viewport.width;

tempCanvas.height =
viewport.height;

await page.render({

canvasContext:tempCtx,

viewport:viewport

}).promise;

const bg =
tempCanvas.toDataURL("image/png");

canvas.setWidth(
viewport.width
);

canvas.setHeight(
viewport.height
);

fabric.Image.fromURL(
bg,
function(img){

canvas.setBackgroundImage(
img,
canvas.renderAll.bind(canvas),
{
scaleX:
canvas.width / img.width,

scaleY:
canvas.height / img.height
}
);

}
);

};

reader.readAsArrayBuffer(file);

});

function addText(){

const text =
document.getElementById("textInput").value;

const size =
parseInt(
document.getElementById("fontSize").value
);

const color =
document.getElementById("textColor").value;

const textbox =
new fabric.IText(text,{

left:100,
top:100,
fill:color,
fontSize:size

});

canvas.add(textbox);

canvas.setActiveObject(textbox);

}

function addRectangle(){

const rect =
new fabric.Rect({

left:150,
top:150,

fill:'white',

width:180,

height:40

});

canvas.add(rect);

canvas.setActiveObject(rect);

}

function enableDrawing(){

canvas.isDrawingMode = true;

canvas.freeDrawingBrush.width = 5;

canvas.freeDrawingBrush.color = "red";

}

function disableDrawing(){

canvas.isDrawingMode = false;

}

function deleteSelected(){

const active =
canvas.getActiveObject();

if(active){

canvas.remove(active);

}

}

function zoomIn(){

currentZoom += 0.1;

canvas.setZoom(currentZoom);

}

function zoomOut(){

currentZoom -= 0.1;

canvas.setZoom(currentZoom);

}

async function downloadPDF(){

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF('p','pt',[
canvas.width,
canvas.height
]);

const img =
canvas.toDataURL("image/png");

pdf.addImage(
img,
'PNG',
0,
0,
canvas.width,
canvas.height
);

pdf.save(
"KJSynthora-Pro-Edited.pdf"
);

}

document.addEventListener(
'keydown',
function(e){

if(
e.key === "Delete" ||
e.key === "Backspace"
){

const active =
canvas.getActiveObject();

if(active){

canvas.remove(active);

}

}

});

</script>

</body>

</html>
