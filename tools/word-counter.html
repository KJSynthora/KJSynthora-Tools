<!DOCTYPE html>
<html>
<head>
<title>Word Counter</title>
<style>
body{
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}
.container{
background:#111827;
padding:40px;
border-radius:20px;
width:400px;
text-align:center;
}
textarea{
width:90%;
height:120px;
padding:12px;
border:none;
border-radius:10px;
}
button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#06b6d4,#7c3aed);
color:white;
cursor:pointer;
}
#count{
margin-top:20px;
color:#38bdf8;
}
</style>
</head>
<body>

<div class="container">

<h1>Word Counter</h1>

<textarea id="words"></textarea>

<br>

<button onclick="countWords()">
Count Words
</button>

<p id="count"></p>

</div>

<script>

function countWords(){

const text=document.getElementById("words").value;

const count=text.trim().split(/\s+/).length;

document.getElementById("count").innerHTML=
"📝 Word Count: "+count;

}

</script>

</body>
</html>
